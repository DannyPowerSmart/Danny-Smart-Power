<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>My Orders | Danny Smart Power</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}


/* =====================================================
   VARIABLES
===================================================== */

:root{

  --bg:#0f172a;
  --header:#020617;
  --card:#111e30;
  --card2:#17253a;
  --input:#0b1525;

  --border:rgba(148,163,184,.15);

  --blue:#38bdf8;
  --blue2:#0284c7;

  --green:#22c55e;
  --yellow:#facc15;
  --red:#ef4444;

  --text:#f8fafc;
  --muted:#94a3b8;
}


/* =====================================================
   BODY
===================================================== */

body{

  min-height:100vh;

  font-family:
    'Poppins',
    sans-serif;

  color:var(--text);

  background:

    radial-gradient(
      circle at top left,
      rgba(56,189,248,.08),
      transparent 35%
    ),

    var(--bg);
}


/* =====================================================
   HEADER
===================================================== */

header{

  position:sticky;

  top:0;

  z-index:50;

  min-height:76px;

  padding:12px 7%;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  background:
    rgba(2,6,23,.97);

  border-bottom:
    1px solid var(--border);

  backdrop-filter:blur(14px);
}


.logo{

  display:flex;

  align-items:center;

  gap:10px;

  color:var(--blue);

  font-size:20px;

  font-weight:700;
}


.logo-icon{

  width:40px;

  height:40px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--blue2)
    );

  color:#00111c;

  font-size:20px;
}


.back-link{

  color:white;

  text-decoration:none;

  font-size:13px;

  white-space:nowrap;

  transition:.2s;
}


.back-link:hover{

  color:var(--blue);
}


/* =====================================================
   NOTIFICATIONS
===================================================== */

.notification-wrapper{

  position:relative;
}


.notification-button{

  width:40px;

  height:40px;

  display:flex;

  align-items:center;

  justify-content:center;

  position:relative;

  border:none;

  border-radius:12px;

  background:var(--card2);

  color:white;

  border:
    1px solid var(--border);

  cursor:pointer;

  font-size:18px;

  transition:.2s;
}


.notification-button:hover{

  color:var(--blue);

  border-color:
    rgba(56,189,248,.3);

  transform:
    translateY(-1px);
}


.notification-button:active{

  transform:
    scale(.96);
}


.notification-count{

  position:absolute;

  top:-5px;

  right:-5px;

  min-width:18px;

  height:18px;

  padding:0 4px;

  display:none;

  align-items:center;

  justify-content:center;

  border-radius:999px;

  background:var(--red);

  color:white;

  border:
    2px solid var(--header);

  font-size:8px;

  font-weight:800;
}


.notification-count.show{

  display:flex;
}


.notification-panel{

  position:absolute;

  top:52px;

  right:0;

  width:350px;

  max-width:
    calc(100vw - 24px);

  background:#020617;

  border:
    1px solid var(--border);

  border-radius:17px;

  box-shadow:
    0 20px 50px
    rgba(0,0,0,.45);

  overflow:hidden;

  display:none;

  z-index:100;
}


.notification-panel.show{

  display:block;
}


.notification-panel-header{

  padding:14px 15px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  border-bottom:
    1px solid var(--border);
}


.notification-panel-title{

  font-size:13px;

  font-weight:700;
}


.notification-header-actions{

  display:flex;

  align-items:center;

  gap:9px;
}


.mark-all{

  border:none;

  background:transparent;

  color:var(--blue);

  font-family:inherit;

  font-size:9px;

  font-weight:600;

  cursor:pointer;
}


.mark-all:hover{

  text-decoration:underline;
}


.notification-close{

  width:25px;

  height:25px;

  border:none;

  border-radius:7px;

  background:var(--card2);

  color:#94a3b8;

  cursor:pointer;

  font-size:12px;
}


.notification-close:hover{

  color:white;
}


.notification-list{

  max-height:390px;

  overflow-y:auto;
}


.notification-list::-webkit-scrollbar{

  width:5px;
}


.notification-list::-webkit-scrollbar-track{

  background:#020617;
}


.notification-list::-webkit-scrollbar-thumb{

  background:#1e293b;

  border-radius:999px;
}


.notification-item{

  padding:13px 15px;

  display:flex;

  gap:11px;

  cursor:pointer;

  border-bottom:
    1px solid
    rgba(148,163,184,.08);

  transition:.2s;
}


.notification-item:hover{

  background:
    rgba(255,255,255,.035);
}


.notification-item.unread{

  background:
    rgba(56,189,248,.045);
}


.notification-icon{

  width:34px;

  height:34px;

  flex-shrink:0;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:10px;

  background:
    rgba(56,189,248,.10);

  font-size:15px;
}


.notification-content{

  flex:1;

  min-width:0;
}


.notification-title{

  color:#f8fafc;

  font-size:10px;

  font-weight:700;

  line-height:1.4;
}


.notification-message{

  color:#94a3b8;

  font-size:9px;

  line-height:1.5;

  margin-top:3px;
}


.notification-time{

  color:#475569;

  font-size:8px;

  margin-top:5px;
}


.notification-dot{

  width:7px;

  height:7px;

  flex-shrink:0;

  margin-top:5px;

  border-radius:50%;

  background:var(--blue);
}


.notification-empty{

  padding:35px 20px;

  text-align:center;

  color:#64748b;

  font-size:10px;
}


.notification-empty-icon{

  font-size:30px;

  margin-bottom:9px;
}


/* =====================================================
   MAIN
===================================================== */

main{

  width:100%;

  max-width:1100px;

  margin:auto;

  padding:30px 7% 70px;
}


/* =====================================================
   HEADING
===================================================== */

.page-heading{

  margin-bottom:25px;
}


.page-heading h1{

  font-size:30px;

  margin-bottom:6px;
}


.page-heading p{

  color:var(--muted);

  font-size:13px;
}


.account-line{

  margin-top:10px;

  display:flex;

  align-items:center;

  gap:7px;

  color:#86efac;

  font-size:11px;
}


/* =====================================================
   TOP STATS
===================================================== */

.stats{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:13px;

  margin-bottom:25px;
}


.stat{

  padding:17px;

  border-radius:16px;

  background:
    linear-gradient(
      145deg,
      var(--card),
      #0d1828
    );

  border:
    1px solid var(--border);
}


.stat-icon{

  font-size:21px;

  margin-bottom:7px;
}


.stat-number{

  font-size:20px;

  font-weight:700;

  color:white;
}


.stat-label{

  color:var(--muted);

  font-size:10px;

  margin-top:2px;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  margin-bottom:15px;

  flex-wrap:wrap;
}


.toolbar-title{

  font-size:17px;

  font-weight:700;
}


.filter{

  padding:10px 12px;

  border-radius:10px;

  border:
    1px solid var(--border);

  outline:none;

  background:var(--input);

  color:white;

  font-family:inherit;

  font-size:11px;
}


.filter option{

  background:#020617;

  color:white;
}


/* =====================================================
   ORDERS
===================================================== */

.orders{

  display:flex;

  flex-direction:column;

  gap:15px;
}


.order-card{

  background:
    linear-gradient(
      145deg,
      var(--card),
      #0d1828
    );

  border:
    1px solid var(--border);

  border-radius:19px;

  overflow:hidden;

  transition:.2s;
}


.order-card:hover{

  border-color:
    rgba(56,189,248,.25);

  transform:
    translateY(-1px);
}


/* =====================================================
   ORDER HEADER
===================================================== */

.order-header{

  padding:17px 19px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  border-bottom:
    1px solid var(--border);

  background:
    rgba(255,255,255,.015);
}


.order-id{

  font-size:12px;

  font-weight:700;

  word-break:break-all;
}


.order-date{

  color:var(--muted);

  font-size:10px;

  margin-top:4px;
}


/* =====================================================
   STATUS BADGES
===================================================== */

.badge{

  display:inline-flex;

  align-items:center;

  gap:6px;

  padding:7px 10px;

  border-radius:999px;

  font-size:9px;

  font-weight:700;

  white-space:nowrap;
}


.badge.pending{

  color:#fde68a;

  background:
    rgba(250,204,21,.10);

  border:
    1px solid
    rgba(250,204,21,.20);
}


.badge.processing{

  color:#bae6fd;

  background:
    rgba(56,189,248,.10);

  border:
    1px solid
    rgba(56,189,248,.20);
}


.badge.shipping{

  color:#c4b5fd;

  background:
    rgba(139,92,246,.10);

  border:
    1px solid
    rgba(139,92,246,.20);
}


.badge.delivered{

  color:#86efac;

  background:
    rgba(34,197,94,.10);

  border:
    1px solid
    rgba(34,197,94,.20);
}


.badge.cancelled{

  color:#fca5a5;

  background:
    rgba(239,68,68,.10);

  border:
    1px solid
    rgba(239,68,68,.20);
}


/* =====================================================
   ORDER BODY
===================================================== */

.order-body{

  padding:17px 19px;
}


.order-summary{

  display:grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap:12px;

  margin-bottom:16px;
}


.info-box{

  padding:12px;

  border-radius:12px;

  background:#0b1525;

  border:
    1px solid var(--border);
}


.info-label{

  color:#64748b;

  font-size:9px;

  margin-bottom:4px;
}


.info-value{

  color:#e2e8f0;

  font-size:11px;

  font-weight:600;

  word-break:break-word;
}


/* =====================================================
   PRODUCTS
===================================================== */

.products{

  display:flex;

  flex-direction:column;

  gap:9px;

  margin-bottom:16px;
}


.product{

  display:flex;

  align-items:center;

  gap:11px;

  padding:10px;

  border-radius:12px;

  background:#0b1525;

  border:
    1px solid var(--border);
}


.product-image{

  width:55px;

  height:55px;

  flex-shrink:0;

  object-fit:cover;

  border-radius:9px;

  background:var(--card2);
}


.product-info{

  flex:1;

  min-width:0;
}


.product-name{

  font-size:11px;

  font-weight:600;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


.product-meta{

  color:var(--muted);

  font-size:9px;

  margin-top:3px;
}


.product-price{

  color:var(--blue);

  font-size:11px;

  font-weight:700;

  white-space:nowrap;
}


/* =====================================================
   TOTAL
===================================================== */

.order-total{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  padding-top:14px;

  border-top:
    1px solid var(--border);
}


.total-label{

  color:var(--muted);

  font-size:11px;
}


.total-value{

  color:var(--blue);

  font-size:19px;

  font-weight:800;
}


/* =====================================================
   PAYMENT
===================================================== */

.payment-row{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-top:12px;

  flex-wrap:wrap;
}


.payment-method{

  color:#cbd5e1;

  font-size:10px;
}


.payment-status{

  font-size:9px;

  padding:6px 9px;

  border-radius:8px;

  font-weight:600;
}


.payment-status.paid{

  color:#86efac;

  background:
    rgba(34,197,94,.08);
}


.payment-status.unpaid{

  color:#fde68a;

  background:
    rgba(250,204,21,.08);
}


.payment-status.pending{

  color:#bae6fd;

  background:
    rgba(56,189,248,.08);
}


/* =====================================================
   ADDRESS
===================================================== */

.address-box{

  margin-top:12px;

  padding:12px;

  border-radius:11px;

  background:
    rgba(56,189,248,.035);

  border:
    1px solid
    rgba(56,189,248,.10);
}


.address-title{

  color:#64748b;

  font-size:9px;

  margin-bottom:4px;
}


.address-text{

  color:#cbd5e1;

  font-size:10px;

  line-height:1.5;
}


/* =====================================================
   TRACKING
===================================================== */

.tracking{

  margin-top:18px;

  padding:15px;

  border-radius:13px;

  background:#0b1525;

  border:
    1px solid var(--border);
}


.tracking-title{

  font-size:11px;

  font-weight:700;

  margin-bottom:15px;
}


.timeline{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  position:relative;
}


.timeline::before{

  content:"";

  position:absolute;

  left:10%;

  right:10%;

  top:13px;

  height:2px;

  background:#1e293b;

  z-index:0;
}


.step{

  position:relative;

  z-index:1;

  text-align:center;
}


.step-dot{

  width:27px;

  height:27px;

  margin:auto;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:#1e293b;

  border:
    2px solid #334155;

  font-size:10px;

  color:#64748b;
}


.step.active .step-dot{

  background:
    rgba(56,189,248,.15);

  border-color:var(--blue);

  color:var(--blue);
}


.step.done .step-dot{

  background:
    rgba(34,197,94,.15);

  border-color:var(--green);

  color:#86efac;
}


.step-label{

  margin-top:7px;

  color:#64748b;

  font-size:8px;
}


.step.active .step-label,
.step.done .step-label{

  color:#cbd5e1;
}


/* =====================================================
   ACTIONS
===================================================== */

.order-actions{

  display:flex;

  justify-content:flex-end;

  gap:9px;

  margin-top:15px;

  flex-wrap:wrap;
}


.action-button{

  border:none;

  padding:10px 14px;

  border-radius:10px;

  font-family:inherit;

  font-size:10px;

  font-weight:600;

  cursor:pointer;

  text-decoration:none;

  transition:.2s;
}


.action-button.primary{

  background:var(--blue);

  color:#00111c;
}


.action-button.secondary{

  background:var(--card2);

  color:white;

  border:
    1px solid var(--border);
}


.action-button:hover{

  transform:
    translateY(-1px);
}


/* =====================================================
   EMPTY
===================================================== */

.empty{

  margin:50px auto;

  max-width:600px;

  padding:45px 25px;

  text-align:center;

  border-radius:22px;

  background:var(--card);

  border:
    1px solid var(--border);
}


.empty-icon{

  font-size:55px;

  margin-bottom:15px;
}


.empty h2{

  font-size:21px;

  margin-bottom:8px;
}


.empty p{

  color:var(--muted);

  font-size:12px;

  line-height:1.6;
}


.empty-button{

  display:inline-block;

  margin-top:18px;

  padding:12px 20px;

  border-radius:11px;

  background:var(--blue);

  color:#00111c;

  text-decoration:none;

  font-size:11px;

  font-weight:700;
}


/* =====================================================
   LOADING
===================================================== */

.loading{

  padding:45px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
}


.spinner{

  width:34px;

  height:34px;

  margin:0 auto 13px;

  border:
    3px solid #1e293b;

  border-top-color:var(--blue);

  border-radius:50%;

  animation:
    spin .8s linear infinite;
}


@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =====================================================
   TOAST
===================================================== */

.toast{

  position:fixed;

  left:50%;

  bottom:25px;

  z-index:200;

  max-width:90%;

  padding:12px 17px;

  border-radius:11px;

  background:#020617;

  border:
    1px solid
    rgba(56,189,248,.35);

  color:white;

  font-size:11px;

  text-align:center;

  transform:
    translate(-50%,120px);

  opacity:0;

  transition:.3s;
}


.toast.show{

  transform:
    translate(-50%,0);

  opacity:1;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  header{

    padding:11px 15px;

  }


  .logo{

    font-size:15px;

  }


  .logo-icon{

    width:35px;

    height:35px;

    font-size:17px;

  }


  .back-link{

    font-size:11px;

  }


  main{

    padding:
      22px 12px 50px;

  }


  .page-heading h1{

    font-size:24px;

  }


  .stats{

    grid-template-columns:
      1fr 1fr;

  }


  .stats .stat:last-child{

    grid-column:1/-1;

  }


  .order-summary{

    grid-template-columns:1fr;

  }


  .order-header{

    align-items:flex-start;

    flex-direction:column;

  }


  .timeline{

    grid-template-columns:
      repeat(4,1fr);

  }


  .step-label{

    font-size:7px;

  }


  .product-price{

    font-size:10px;

  }


  .notification-panel{

    position:fixed;

    top:67px;

    right:12px;

    width:
      calc(100vw - 24px);

    max-width:none;

  }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:400px){

  .logo{

    font-size:13px;

  }


  .logo-icon{

    width:32px;

    height:32px;

    font-size:15px;

  }


  .back-link{

    font-size:10px;

  }


  .notification-button{

    width:36px;

    height:36px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>


  <div class="logo">

    <div class="logo-icon">
      ⚡
    </div>

    Danny Smart Power

  </div>


  <div style="
    display:flex;
    align-items:center;
    gap:10px;
  ">


    <!-- =================================================
         NOTIFICATION BUTTON
    ================================================== -->

    <div class="notification-wrapper">


      <button
        id="notificationButton"
        class="notification-button"
        aria-label="Notifications"
        aria-expanded="false"
        type="button"
      >

        🔔


        <span
          id="notificationCount"
          class="notification-count"
        >
          0
        </span>

      </button>


      <!-- =================================================
           NOTIFICATION PANEL
      ================================================== -->

      <div
        id="notificationPanel"
        class="notification-panel"
      >


        <div class="notification-panel-header">


          <div class="notification-panel-title">

            Notifications

          </div>


          <div class="notification-header-actions">


            <button
              id="markAllRead"
              class="mark-all"
              type="button"
            >

              Mark all as read

            </button>


            <button
              id="notificationClose"
              class="notification-close"
              type="button"
              aria-label="Close notifications"
            >

              ✕

            </button>


          </div>

        </div>


        <div
          id="notificationList"
          class="notification-list"
        >


          <div class="notification-empty">

            <div class="notification-empty-icon">
              🔔
            </div>

            No notifications yet.

          </div>


        </div>


      </div>


    </div>


    <!-- =================================================
         SHOP LINK
    ================================================== -->

    <a
      href="shop.html"
      class="back-link"
    >

      ← Continue Shopping

    </a>


  </div>


</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main>


  <!-- =================================================
       PAGE HEADING
  ================================================== -->

  <section class="page-heading">


    <h1>
      My Orders 📦
    </h1>


    <p>
      Track and manage your Danny Smart Power orders.
    </p>


    <div class="account-line">

      🔒 Orders are shown only for your account.

    </div>


  </section>


  <!-- =================================================
       STATS
  ================================================== -->

  <section class="stats">


    <div class="stat">

      <div class="stat-icon">
        📦
      </div>


      <div
        class="stat-number"
        id="totalOrders"
      >
        0
      </div>


      <div class="stat-label">
        Total Orders

/* =====================================================

function listenToOrders(){

  if(!currentUser){

  /*
    We filter only by customerId.

    We intentionally do NOT use:

      orderBy("createdAt")

    here so this page can work without
    requiring a composite Firestore index.

    function(a,b){

      const dateA =
        getTimestampMillis(
          a.createdAt
        );


      const dateB =
        getTimestampMillis(
          b.createdAt
        );


      return dateB - dateA;

    }
  );

}


/* =====================================================

  const delivered =
    allOrders.filter(

          order.status
        ) === "delivered";

      }
    ).length;


  const active =
    allOrders.filter(
      function(order){

        const status =
          normalizeStatus(
            order.status
          );


        return (

          status !== "delivered" &&

          status !== "cancelled"

        );

      }
    ).length;


  totalOrders.textContent =
    total;


  activeOrders.textContent =
    active;


  deliveredOrders.textContent =
    delivered;

}

/* =====================================================
   TRACKING
===================================================== */

function renderTracking(
  status
){

  if(
    status === "cancelled"
  ){

    return `

      <div class="tracking">


        <div class="tracking-title">

          ❌ Order Cancelled

        </div>


        <div
          style="
            color:#94a3b8;
            font-size:10px;
            line-height:1.6;
          "
        >

          This order has been cancelled.
          Please contact DSP support if you
          believe this is incorrect.

        </div>


      </div>

    `;

  }


  const steps = [

    {
      key:"pending",
      icon:"✓",
      label:"Order Placed"
    },

    {
      key:"processing",
      icon:"⚙",
      label:"Processing"
    },

    {
      key:"shipped",
      icon:"🚚",
      label:"Shipped"
    },

    {
      key:"delivered",
      icon:"✓",
      label:"Delivered"
    }

  ];


  const currentIndex =
    getTrackingIndex(
      status
    );


  return `

    <div class="tracking">


      <div class="tracking-title">

        📍 Order Tracking

      </div>


      <div class="timeline">


        ${
          steps
            .map(
              function(step,index){

                let className = "";


                if(
                  index <
                  currentIndex
                ){

                  className =
                    "done";

                }


                else if(
                  index ===
                  currentIndex
                ){

                  className =
                    "active";

                }


                return `

                  <div
                    class="step ${className}"
                  >

                    <div class="step-dot">

                      ${step.icon}

                    </div>


                    <div class="step-label">

                      ${step.label}

                    </div>

                  </div>

                `;

              }
            )
            .join("")
        }


      </div>

    </div>

  `;

}


/* =====================================================
   TRACKING INDEX
===================================================== */

function getTrackingIndex(
  status
){

  switch(status){

    case "pending":
      return 0;

    case "processing":
      return 1;

    case "shipped":
      return 2;

    case "out for delivery":
      return 2;

    case "delivered":
      return 3;

    default:
      return 0;

  }

}


/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(
  status
){

  if(
    status === "delivered"
  ){

    return "delivered";

  }


  if(
    status === "cancelled"
  ){

    return "cancelled";

  }


  if(
    status === "shipped" ||
    status === "out for delivery"
  ){

    return "shipping";

  }


  if(
    status === "processing"
  ){

    return "processing";

  }


  return "pending";

}


/* =====================================================
   STATUS ICON
===================================================== */

function getStatusIcon(
  status
){

  if(
    status === "delivered"
  ){

    return "✓";

  }


  if(
    status === "cancelled"
  ){

    return "✕";

  }


  if(
    status === "processing"
  ){

    return "⚙";

  }


  if(
    status === "shipped" ||
    status === "out for delivery"
  ){

    return "🚚";

  }


  return "⏳";

}


/* =====================================================
   PAYMENT CLASS
===================================================== */

function getPaymentClass(
  status
){

  const value =
    String(
      status || ""
    )
    .toLowerCase();


  if(
    value === "paid" ||
    value === "successful" ||
    value === "completed"
  ){

    return "paid";

  }


  if(
    value === "unpaid"
  ){

    return "unpaid";

  }


  return "pending";

}


/* =====================================================
   PAYMENT ICON
===================================================== */

function getPaymentIcon(
  status
){

  const value =
    String(
      status || ""
    )
    .toLowerCase();


  if(
    value === "paid" ||
    value === "successful" ||
    value === "completed"
  ){

    return "✓";

  }


  if(
    value === "unpaid"
  ){

    return "○";

  }


  return "◷";

}


/* =====================================================
   NORMALIZE STATUS
===================================================== */

function normalizeStatus(
  value
){

  return String(
    value || "pending"
  )
  .trim()
  .toLowerCase()
  .replace(
    /\s+/g,
    " "
  );

}


/* =====================================================
   ITEM COUNT
===================================================== */

function getItemCount(
  items
){

  return items.reduce(
    function(total,item){

      return total +

        Math.max(
          1,
          Number(
            item.qty
          ) || 1
        );

    },
    0
  );

}


/* =====================================================
   DATE
===================================================== */

function getTimestampMillis(
  timestamp
){

  if(
    timestamp &&
    typeof timestamp.toMillis ===
      "function"
  ){

    return timestamp.toMillis();

  }


  if(
    timestamp instanceof Date
  ){

    return timestamp.getTime();

  }


  if(
    typeof timestamp === "number"
  ){

    return timestamp;

  }


  if(
    typeof timestamp === "string"
  ){

    const date =
      new Date(timestamp);


    return Number.isNaN(
      date.getTime()
    )
      ? 0
      : date.getTime();

  }


  return 0;

}


function formatDate(
  timestamp
){

  const millis =
    getTimestampMillis(
      timestamp
    );


  if(!millis){

    return "Date unavailable";

  }


  return new Intl.DateTimeFormat(
    "en-NG",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  ).format(
    new Date(millis)
  );

}


/* =====================================================
   SHORT ORDER ID
===================================================== */

function shortOrderId(
  id
){

  const value =
    String(
      id || ""
    );


  if(
    value.length <= 12
  ){

    return value;

  }


  return (

    value.slice(0,6) +

    "..." +

    value.slice(-5)

  );

}


/* =====================================================
   COPY ORDER ID
===================================================== */

async function copyOrderId(
  id
){

  try{

    await navigator.clipboard.writeText(
      id
    );


    showToast(
      "Order ID copied."
    );

  }

  catch(error){

    console.error(
      error
    );


    showToast(
      "Could not copy Order ID."
    );

  }

}


/* =====================================================
   PRICE
===================================================== */

function formatPrice(
  price
){

  const number =
    Number(price);


  if(
    !Number.isFinite(number)
  ){

    return "0";

  }


  return number.toLocaleString(
    "en-NG"
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(
      value ?? ""
    );


  return div.innerHTML;

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  );

}

    );

}


/* =====================================================
   SORT NOTIFICATIONS
===================================================== */

function sortNotifications(){

  notifications.sort(
    function(a,b){

      return (

        getTimestampMillis(
          b.createdAt
        )

        -

        getTimestampMillis(
          a.createdAt
        )

      );

    }
  );

}


/* =====================================================
   RENDER NOTIFICATIONS
===================================================== */

function renderNotifications(){

  if(!notifications.length){

    notificationList.innerHTML = `

      <div class="notification-empty">

        <div class="notification-empty-icon">
          🔔
        </div>

        No notifications yet.

      </div>

    `;

    return;

  }


  notificationList.innerHTML =

    notifications
      .map(
        renderNotification
      )
      .join("");

}


/* =====================================================
   RENDER SINGLE NOTIFICATION
===================================================== */

function renderNotification(
  notification
){

  const read =
    notification.read === true;


  const icon =
    notification.icon ||
    getNotificationIcon(
      notification.type
    );


  const title =
    notification.title ||
    "Order Update";


  const message =
    notification.message ||
    "Your order has been updated.";


  const time =
    formatNotificationTime(
      notification.createdAt
    );


  return `

    <div
      class="
        notification-item
        ${read ? "" : "unread"}
      "
      data-notification-id="${escapeAttribute(notification.id)}"
      onclick="
        markNotificationRead(
          '${escapeAttribute(notification.id)}'
        )
      "
    >


      <div class="notification-icon">

        ${escapeHtml(icon)}

      </div>


      <div class="notification-content">


        <div class="notification-title">

          ${escapeHtml(title)}

        </div>


        <div class="notification-message">

          ${escapeHtml(message)}

        </div>


        <div class="notification-time">

          ${escapeHtml(time)}

        </div>


      </div>


      ${
        !read
          ? `

            <div
              class="notification-dot"
            ></div>

          `
          : ""
      }


    </div>

  `;

}


/* =====================================================
   NOTIFICATION ICON
===================================================== */

function getNotificationIcon(
  type
){

  const value =
    String(
      type || ""
    )
    .toLowerCase();


  if(
    value.includes("delivered")
  ){

    return "✅";

  }


  if(
    value.includes("cancel")
  ){

    return "❌";

  }


  if(
    value.includes("shipping") ||
    value.includes("shipped")
  ){

    return "🚚";

  }


  if(
    value.includes("delivery")
  ){

    return "🛵";

  }


  if(
    value.includes("processing")
  ){

    return "⚙️";

  }


  if(
    value.includes("payment")
  ){

    return "💳";

  }


  if(
    value.includes("placed") ||
    value.includes("order")
  ){

    return "📦";

  }


  return "🔔";

}


/* =====================================================
   UNREAD COUNT
===================================================== */

function updateNotificationCount(){

  const unread =
    notifications.filter(
      function(notification){

        return notification.read !== true;

      }
    ).length;


  if(unread > 0){

    notificationCount.textContent =
      unread > 99
        ? "99+"
        : unread;


    notificationCount.classList.add(
      "show"
    );

  }

  else{

    notificationCount.textContent =
      "0";


    notificationCount.classList.remove(
      "show"
    );

  }

}


/* =====================================================
   MARK ONE NOTIFICATION AS READ
===================================================== */

async function markNotificationRead(
  notificationId
){

  if(!currentUser){

    return;

  }


  try{

    const notificationRef =

      db
      .collection("notifications")
      .doc(notificationId);


    const notificationDoc =
      await notificationRef.get();


    if(
      !notificationDoc.exists
    ){

      return;

    }


    const data =
      notificationDoc.data();


    /*
      Security check:
      A customer can only mark
      their own notification as read.
    */

    if(
      data.userId !==
      currentUser.uid
    ){

      console.warn(
        "Notification does not belong to current user."
      );

      return;

    }


    if(
      data.read === true
    ){

      return;

    }


    await notificationRef.update({

      read:true,

      readAt:
        firebase.firestore
          .FieldValue
          .serverTimestamp()

    });

  }

  catch(error){

    console.error(
      "Mark notification error:",
      error
    );


    showToast(
      "Could not update notification."
    );

  }

}


/* =====================================================
   MARK ALL AS READ
===================================================== */

markAllRead.addEventListener(
  "click",
  async function(event){

    event.stopPropagation();


    if(!currentUser){

      return;

    }


    const unread =
      notifications.filter(
        function(notification){

          return notification.read !== true;

        }
      );


    if(!unread.length){

      showToast(
        "All notifications are already read."
      );

      return;

    }


    try{

      const batch =
        db.batch();


      unread.forEach(
        function(notification){

          /*
            Extra protection:
            Only update notifications
            belonging to this customer.
          */

          if(
            notification.userId !==
            currentUser.uid
          ){

            return;

          }


          const ref =

            db
            .collection("notifications")
            .doc(
              notification.id
            );


          batch.update(
            ref,
            {

              read:true,

              readAt:
                firebase.firestore
                  .FieldValue
                  .serverTimestamp()

            }
          );

        }
      );


      await batch.commit();


      showToast(
        "All notifications marked as read."
      );

    }

    catch(error){

      console.error(
        "Mark all notifications error:",
        error
      );


      showToast(
        "Could not update notifications."
      );

    }

  }
);


/* =====================================================
   RESET NOTIFICATIONS
===================================================== */

function resetNotifications(){

  notifications = [];


  notificationCount.textContent =
    "0";


  notificationCount.classList.remove(
    "show"
  );


  closeNotificationPanel();


  notificationList.innerHTML = `

    <div class="notification-empty">

      <div class="notification-empty-icon">
        🔐
      </div>

      Sign in to view notifications.

    </div>

  `;

}


/* =====================================================
   NOTIFICATION TIME
===================================================== */

function formatNotificationTime(
  timestamp
){

  const millis =
    getTimestampMillis(
      timestamp
    );


  if(!millis){

    return "Just now";

  }


  const difference =
    Math.max(
      0,
      Date.now() - millis
    );


  const seconds =
    Math.floor(
      difference / 1000
    );


  if(seconds < 60){

    return "Just now";

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes < 60){

    return (

      minutes +

      (
        minutes === 1
          ? " minute ago"
          : " minutes ago"
      )

    );

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){

    return (

      hours +

      (
        hours === 1
          ? " hour ago"
          : " hours ago"
      )

    );

  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){

    return (

      days +

      (
        days === 1
          ? " day ago"
          : " days ago"
      )

    );

  }


  return formatDate(
    timestamp
  );

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;


function showToast(
  message
){

  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function(){

        toast.classList.remove(
          "show"
        );

      },
      2500
    );

}

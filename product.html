<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product | Danny Smart Power</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
rel="stylesheet"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#0f172a;
  --header:#020617;
  --card:#111e30;
  --card2:#17253a;
  --border:rgba(148,163,184,.15);
  --blue:#38bdf8;
  --green:#22c55e;
  --red:#ef4444;
  --text:#f8fafc;
  --muted:#94a3b8;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at top left,
      rgba(56,189,248,.08),
      transparent 35%
    ),
    var(--bg);
  color:var(--text);
  font-family:'Poppins',sans-serif;
}


/* =====================================================
   HEADER
===================================================== */

header{
  height:76px;
  background:rgba(2,6,23,.97);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 7%;

  position:sticky;
  top:0;
  z-index:20;
}

.back-button{
  color:white;
  text-decoration:none;
  font-size:15px;
  display:flex;
  align-items:center;
  gap:7px;
}

.back-button:hover{
  color:var(--blue);
}

.logo{
  font-size:22px;
  font-weight:700;
  color:var(--blue);
  letter-spacing:1px;
}

.logo span{
  color:white;
}

.header-right{
  display:flex;
  align-items:center;
  gap:20px;
}

.home-link{
  color:white;
  text-decoration:none;
  font-size:14px;
}

.home-link:hover{
  color:var(--blue);
}

.cart-button{
  position:relative;
  color:white;
  text-decoration:none;
  font-size:22px;
}

.cart-count{
  position:absolute;
  top:-10px;
  right:-12px;

  min-width:20px;
  height:20px;
  padding:0 5px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--blue);
  color:#00111c;

  border-radius:20px;

  font-size:11px;
  font-weight:bold;
}


/* =====================================================
   PAGE
===================================================== */

.page{
  max-width:1150px;
  margin:auto;
  padding:28px 7% 70px;
}


/* =====================================================
   BREADCRUMB
===================================================== */

.breadcrumb{
  color:var(--muted);
  font-size:13px;
  margin-bottom:22px;
}

.breadcrumb span{
  color:var(--blue);
}


/* =====================================================
   PRODUCT
===================================================== */

.product-layout{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:45px;
  align-items:start;
}


/* =====================================================
   IMAGE
===================================================== */

.product-image-box{
  width:100%;
  aspect-ratio:1/1;
  max-height:600px;

  background:#0b1220;

  border:1px solid var(--border);
  border-radius:25px;

  overflow:hidden;

  position:relative;
}

.product-image{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.image-badge{
  position:absolute;
  top:15px;
  left:15px;

  padding:7px 12px;

  border-radius:10px;

  background:rgba(2,6,23,.88);

  color:#86efac;

  font-size:11px;
  font-weight:600;

  border:1px solid rgba(34,197,94,.2);
}

.image-badge.unavailable{
  color:#fca5a5;
  border-color:rgba(239,68,68,.2);
}


/* =====================================================
   PRODUCT INFO
===================================================== */

.product-info{
  padding-top:5px;
}

.product-category{
  display:inline-block;

  padding:8px 14px;

  border:1px solid rgba(56,189,248,.2);

  border-radius:30px;

  color:var(--blue);

  font-size:11px;
  font-weight:600;

  text-transform:uppercase;

  margin-bottom:16px;
}

.product-title{
  font-size:36px;
  line-height:1.2;

  margin-bottom:15px;
}

.product-price{
  color:var(--blue);
  font-size:29px;
  font-weight:700;

  margin-bottom:20px;
}

.product-description{
  color:#cbd5e1;

  font-size:14px;
  line-height:1.8;

  margin-bottom:25px;
}


/* =====================================================
   STOCK
===================================================== */

.stock-info{
  display:flex;
  align-items:center;
  gap:8px;

  color:var(--muted);

  font-size:13px;

  margin-bottom:20px;
}

.stock-dot{
  width:9px;
  height:9px;

  border-radius:50%;

  background:var(--green);
}

.stock-dot.red{
  background:var(--red);
}


/* =====================================================
   QUANTITY
===================================================== */

.quantity-section{
  margin-bottom:20px;
}

.quantity-label{
  display:block;

  color:#cbd5e1;

  font-size:13px;

  margin-bottom:9px;
}

.quantity-control{
  width:155px;
  height:48px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:var(--card);

  border:1px solid var(--border);

  border-radius:13px;

  overflow:hidden;
}

.quantity-control button{
  width:48px;
  height:100%;

  border:none;

  background:transparent;

  color:white;

  font-size:21px;

  cursor:pointer;
}

.quantity-control button:hover{
  background:var(--card2);
  color:var(--blue);
}

.quantity-control button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.quantity-value{
  min-width:45px;

  text-align:center;

  font-size:15px;
  font-weight:600;
}


/* =====================================================
   ACTIONS
===================================================== */

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;

  margin-bottom:25px;
}

.add-button,
.buy-button{
  border:none;

  min-height:50px;

  padding:0 22px;

  border-radius:13px;

  font-family:inherit;

  font-size:13px;
  font-weight:600;

  cursor:pointer;

  transition:.2s;
}

.add-button{
  background:var(--blue);
  color:#00111c;
}

.add-button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(56,189,248,.15);
}

.buy-button{
  background:#1e293b;
  color:white;

  border:1px solid var(--border);
}

.buy-button:hover{
  background:var(--card2);
}

.add-button:disabled,
.buy-button:disabled{
  background:#334155;
  color:#94a3b8;
  cursor:not-allowed;
  transform:none;
}


/* =====================================================
   INFO BOX
===================================================== */

.info-box{
  background:var(--card);

  border:1px solid var(--border);

  border-radius:16px;

  padding:17px;
}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:20px;

  padding:10px 0;

  border-bottom:1px solid var(--border);

  font-size:12px;
}

.info-row:last-child{
  border-bottom:none;
}

.info-row span:first-child{
  color:var(--muted);
}

.info-row span:last-child{
  color:white;
  text-align:right;
}


/* =====================================================
   SIMILAR PRODUCTS
===================================================== */

.similar-section{
  margin-top:70px;
}

.section-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:20px;
}

.section-heading h2{
  font-size:22px;
}

.section-heading span{
  color:var(--muted);
  font-size:12px;
}

.similar-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.similar-card{
  background:var(--card);

  border:1px solid var(--border);

  border-radius:17px;

  overflow:hidden;

  cursor:pointer;

  transition:.25s;
}

.similar-card:hover{
  transform:translateY(-4px);
  border-color:rgba(56,189,248,.4);
}

.similar-image{
  width:100%;
  height:170px;

  object-fit:cover;

  background:#0b1220;
}

.similar-content{
  padding:13px;
}

.similar-category{
  color:var(--blue);

  font-size:10px;

  text-transform:uppercase;
}

.similar-name{
  font-size:14px;

  margin:4px 0 7px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.similar-price{
  color:var(--blue);

  font-size:14px;

  font-weight:700;
}


/* =====================================================
   LOADING
===================================================== */

.loading{
  min-height:400px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  color:var(--muted);
}

.spinner{
  width:38px;
  height:38px;

  margin-bottom:15px;

  border:3px solid #1e293b;
  border-top-color:var(--blue);

  border-radius:50%;

  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =====================================================
   ERROR
===================================================== */

.error-state{
  text-align:center;

  padding:80px 20px;

  color:var(--muted);
}

.error-state-icon{
  font-size:45px;
  margin-bottom:12px;
}

.error-state h2{
  color:white;
  margin-bottom:7px;
}

.error-button{
  display:inline-block;

  margin-top:20px;

  padding:11px 20px;

  background:var(--blue);

  color:#00111c;

  text-decoration:none;

  border-radius:10px;

  font-size:13px;

  font-weight:600;
}


/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;

  left:50%;
  bottom:25px;

  transform:translate(-50%,120px);

  background:#020617;

  border:1px solid rgba(56,189,248,.35);

  color:white;

  padding:13px 18px;

  border-radius:12px;

  box-shadow:0 15px 40px rgba(0,0,0,.4);

  font-size:13px;

  z-index:100;

  opacity:0;

  transition:.3s;
}

.toast.show{
  opacity:1;

  transform:translate(-50%,0);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:850px){

  .product-layout{
    grid-template-columns:1fr;
    gap:28px;
  }

  .product-image-box{
    max-height:none;
  }

  .product-title{
    font-size:30px;
  }

  .similar-grid{
    grid-template-columns:repeat(3,1fr);
  }

}


@media(max-width:650px){

  header{
    padding:0 15px;
  }

  .page{
    padding-left:14px;
    padding-right:14px;
  }

  .home-link{
    display:none;
  }

  .product-title{
    font-size:27px;
  }

  .product-price{
    font-size:25px;
  }

  .similar-grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .similar-image{
    height:140px;
  }

}


@media(max-width:400px){

  .actions{
    display:grid;
    grid-template-columns:1fr;
  }

  .add-button,
  .buy-button{
    width:100%;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <a href="shop.html" class="back-button">
    ← Shop
  </a>

  <div class="logo">
    D<span>SP</span>
  </div>

  <div class="header-right">

    <a href="index.html" class="home-link">
      Home
    </a>

    <a href="cart.html" class="cart-button">

      🛒

      <span
        class="cart-count"
        id="cartCount">
        0
      </span>

    </a>

  </div>

</header>


<!-- =====================================================
     PAGE
===================================================== -->

<main class="page">


  <div class="breadcrumb">

    <span>Danny Smart Power</span>

    &nbsp;›&nbsp;

    <span id="breadcrumbCategory">
      Product
    </span>

    &nbsp;›&nbsp;

    <span id="breadcrumbName">
      Loading...
    </span>

  </div>


  <!-- ===================================================
       PRODUCT AREA
  =================================================== -->

  <section
    class="product-layout"
    id="productArea"
  >

    <div class="loading">

      <div class="spinner"></div>

  <!-- ===================================================

  =================================================== -->

  <section
    class="similar-section"
    id="similarSection"
    style="display:none;"
  >

    <div class="section-heading">

      <h2>
        Similar Products
      </h2>

      <span>
        You may also like
      </span>

    </div>

    <div
      class="similar-grid"
      id="similarProducts"
    ></div>

  </section>


</main>


<!-- TOAST -->

<div
  class="toast"
  id="toast">
</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGb44",

  authDomain:
    "danny-smart-power.firebaseapp.com",

  databaseURL:
    "https://danny-smart-power-default-rtdb.firebaseio.com",

  projectId:
    "danny-smart-power",

  storageBucket:
    "danny-smart-power.firebasestorage.app",

  messagingSenderId:
    "649735645158",

  appId:
    "1:649735645158:web:cff518b89721a163679827",

  measurementId:
    "G-258YKLP5ZS"

};


firebase.initializeApp(firebaseConfig);


const auth =
  firebase.auth();


const db =
  firebase.firestore();


/* =====================================================
   ELEMENTS
===================================================== */

const productArea =
  document.getElementById(
    "productArea"
  );

const similarSection =
  document.getElementById(
    "similarSection"
  );

const similarProducts =
  document.getElementById(
    "similarProducts"
  );

const cartCount =
  document.getElementById(
    "cartCount"
  );

const breadcrumbCategory =
  document.getElementById(
    "breadcrumbCategory"
  );

const breadcrumbName =
  document.getElementById(
    "breadcrumbName"
  );

const toast =
  document.getElementById(
    "toast"
  );


/* =====================================================
   STATE
===================================================== */

let currentProduct = null;

let allProducts = [];

let cartItems = [];

let cartUnsubscribe = null;

let selectedQuantity = 1;


/* =====================================================
   GET PRODUCT ID
===================================================== */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const productId =
  urlParams.get("id");


/* =====================================================
   START
===================================================== */

auth.onAuthStateChanged(
  async (user) => {

    if(!user){

      showLoginRequired();

      return;
    }


    /*
      IMPORTANT:

      The Shop uses:

      carts/{uid}

      NOT:

      cart/{uid}

      The items are an ARRAY inside
      the cart document.
    */

    listenToCart(user.uid);


    /*
      Load the actual product directly
      from products/{productId}.
    */

    await loadProduct();

  }
);


/* =====================================================
   LOGIN REQUIRED
===================================================== */

function showLoginRequired(){

  productArea.innerHTML = `

    <div class="error-state">

      <div class="error-state-icon">
        🔐
      </div>

      <h2>
        Please sign in
      </h2>

      <p>
        You need to sign in before viewing
        and purchasing products.
      </p>

      <a
        href="login.html"
        class="error-button"
      >
        Sign In
      </a>

    </div>

  `;

}


/* =====================================================
   LOAD PRODUCT
===================================================== */

async function loadProduct(){

  if(!productId){

    showProductError(
      "No product was selected."
    );

    return;
  }


  try{

    /*
      THIS IS THE IMPORTANT PART.

      We read:

      products/{productId}

      every time the product page opens.

      Therefore price, category, name,
      image and stock come directly
      from the same Firestore product
      that Shop uses.
    */

    const productDoc =
      await db
      .collection("products")
      .doc(productId)
      .get();


    if(!productDoc.exists){

      showProductError(
        "This product no longer exists."
      );

      return;
    }


    const data =
      productDoc.data();


    currentProduct = {

      id:
        productDoc.id,

      name:
        data.name || "",

      description:
        data.description || "",

      price:
        Number(data.price) || 0,

      category:
        data.category || "",

      image:
        data.image || "",

      stock:
        Number(data.stock) || 0,

      available:
        data.available === true,

      featured:
        data.featured === true

    };


    console.log(
      "PRODUCT PAGE PRODUCT:",
      currentProduct
    );


    /*
      Display exactly what Firestore
      currently contains.
    */

    displayProduct();


    /*
      Load similar products from the
      SAME products collection.
    */

    loadSimilarProducts();

  }

  catch(error){

    console.error(
      "PRODUCT LOAD ERROR:",
      error
    );

    showProductError(
      error.message
    );

  }

}


/* =====================================================
   DISPLAY PRODUCT
===================================================== */

function displayProduct(){

  const product =
    currentProduct;


  const image =
    product.image ||
    "https://via.placeholder.com/700x700?text=DSP+Product";


  const isAvailable =
    product.available === true &&
    product.stock > 0;


  breadcrumbCategory.textContent =
    product.category ||
    "Electrical";


  breadcrumbName.textContent =
    product.name ||
    "Product";


  document.title =
    `${product.name || "Product"} | Danny Smart Power`;


  productArea.innerHTML = `

    <!-- IMAGE -->

    <div class="product-image-box">

      <img
        src="${escapeAttribute(image)}"
        class="product-image"
        alt="${escapeAttribute(product.name)}"
      >

      <span
        class="image-badge ${isAvailable ? "" : "unavailable"}"
        id="availabilityBadge"
      >

        ${isAvailable
          ? "✓ Available"
          : "✕ Unavailable"}

      </span>

    </div>


    <!-- INFORMATION -->

    <div class="product-info">

      <div class="product-category">

        ${escapeHtml(
          product.category ||
          "Electrical"
        )}

      </div>


      <h1 class="product-title">

        ${escapeHtml(
          product.name ||
          "Unnamed Product"
        )}

      </h1>


      <div class="product-price">

        ₦${formatPrice(product.price)}

      </div>


      <p class="product-description">

        ${escapeHtml(
          product.description ||
          "Quality product from Danny Smart Power."
        )}

      </p>


      <div class="stock-info">

        <span
          class="stock-dot ${isAvailable ? "" : "red"}"
        ></span>

        <span id="stockText">

          ${isAvailable
            ? `${product.stock} in stock`
            : "Currently unavailable"}

        </span>

      </div>


      <!-- QUANTITY -->

      <div class="quantity-section">

        <span class="quantity-label">
          Quantity
        </span>


        <div class="quantity-control">

          <button
            id="minusButton"
            type="button"
          >
            −
          </button>


          <span
            class="quantity-value"
            id="quantityValue"
          >
            1
          </span>


          <button
            id="plusButton"
            type="button"
          >
            +
          </button>

        </div>

      </div>


      <!-- ACTIONS -->

      <div class="actions">

        <button
          class="add-button"
          id="addButton"
          ${isAvailable ? "" : "disabled"}
        >

          🛒 Add to Cart

        </button>


        <button
          class="buy-button"
          id="buyButton"
          ${isAvailable ? "" : "disabled"}
        >

          Buy Now

        </button>

      </div>


      <!-- PRODUCT DETAILS -->

      <div class="info-box">

        <div class="info-row">

          <span>
            Product
          </span>

          <span>
            ${escapeHtml(product.name)}
          </span>

        </div>


        <div class="info-row">

          <span>
            Category
          </span>

          <span>
            ${escapeHtml(
              product.category ||
              "Electrical"
            )}
          </span>

        </div>


        <div class="info-row">

          <span>
            Availability
          </span>

          <span id="detailAvailability">

            ${isAvailable
              ? "Available"
              : "Unavailable"}

          </span>

        </div>


        <div class="info-row">

          <span>
            Stock
          </span>

          <span id="detailStock">

            ${product.stock}

          </span>

        </div>

      </div>

    </div>

  `;


  setupQuantityControls();

}


/* =====================================================
   QUANTITY CONTROLS
===================================================== */

function setupQuantityControls(){

  const minusButton =
    document.getElementById(
      "minusButton"
    );

  const plusButton =
    document.getElementById(
      "plusButton"
    );


  const quantityValue =
    document.getElementById(
      "quantityValue"
    );


  if(!minusButton ||
     !plusButton ||
     !quantityValue){

    return;
  }


  selectedQuantity = 1;


  function updateQuantity(){

    quantityValue.textContent =
      selectedQuantity;


    minusButton.disabled =
      selectedQuantity <= 1;


    if(currentProduct){

      plusButton.disabled =
        selectedQuantity >=
        currentProduct.stock;

    }

  }


  minusButton.addEventListener(
    "click",
    () => {

      if(selectedQuantity > 1){

        selectedQuantity--;

        updateQuantity();

      }

    }
  );


  plusButton.addEventListener(
    "click",
    () => {

      if(
        currentProduct &&
        selectedQuantity <
        currentProduct.stock
      ){

        selectedQuantity++;

        updateQuantity();

      }

    }
  );


  document
  .getElementById("addButton")
  .addEventListener(
    "click",
    () => {

      addToCart(
        selectedQuantity
      );

    }
  );


  document
  .getElementById("buyButton")
  .addEventListener(
    "click",
    async () => {

      await addToCart(
        selectedQuantity,
        true
      );

    }
  );


  updateQuantity();

}


/* =====================================================
   LIVE CART LISTENER
===================================================== */

function listenToCart(uid){

  if(cartUnsubscribe){

    cartUnsubscribe();

  }


  /*
    EXACT SAME PATH AS SHOP.HTML:

    carts/{uid}

  */

  cartUnsubscribe =
    db
    .collection("carts")
    .doc(uid)
    .onSnapshot(

      doc => {

        if(!doc.exists){

          cartItems = [];

          updateCartCount(0);

          return;

        }


        const data =
          doc.data();


        /*
          EXACT SAME FIELD AS SHOP:

          data.items
        */

        cartItems =
          Array.isArray(data.items)
            ? data.items
            : [];


        /*
          EXACT SAME COUNT LOGIC AS SHOP:

          SUM qty
        */

        let total = 0;


        cartItems.forEach(
          item => {

            total +=
              Number(item.qty) || 0;

          }
        );


        updateCartCount(
          total
        );


        /*
          If this product is already
          in the cart, keep the page
          quantity controls synchronized.
        */

        syncProductQuantity();

      },

      error => {

        console.error(
          "LIVE CART ERROR:",
          error
        );

        updateCartCount(0);

      }

    );

}


/* =====================================================
   LIVE CART BADGE
===================================================== */

function updateCartCount(count){

  cartCount.textContent =
    count;

}


/* =====================================================
   SYNC CURRENT PRODUCT QUANTITY
===================================================== */

function syncProductQuantity(){

  if(!currentProduct){

    return;
  }


  const item =
    cartItems.find(
      item =>
        item.productId ===
        currentProduct.id
    );


  /*
    We do NOT force the page quantity
    to the cart quantity.

    The cart quantity is used for
    the actual stored cart.

    The page starts at 1 when the
    customer chooses a new quantity.
  */

  if(item){

    console.log(
      "CURRENT PRODUCT IN CART:",
      item
    );

  }

}


/* =====================================================
   ADD TO CART
===================================================== */

async function addToCart(
  quantity,
  goToCart = false
){

  const user =
    auth.currentUser;


  if(!user){

    showToast(
      "Please sign in first."
    );

    return false;

  }


  if(!currentProduct){

    showToast(
      "Product is not loaded yet."
    );

    return false;

  }


  if(
    currentProduct.available !== true ||
    currentProduct.stock <= 0
  ){

    showToast(
      "This product is unavailable."
    );

    return false;

  }


  quantity =
    Number(quantity);


  if(!Number.isFinite(quantity) ||
     quantity < 1){

    quantity = 1;

  }


  if(quantity >
     currentProduct.stock){

    quantity =
      currentProduct.stock;

  }


  try{

    /*
      EXACT SAME CART PATH AS SHOP:

      carts/{uid}
    */

    const cartRef =
      db
      .collection("carts")
      .doc(user.uid);


    const cartDoc =
      await cartRef.get();


    let items = [];


    if(cartDoc.exists){

      const data =
        cartDoc.data();


      if(Array.isArray(data.items)){

        items =
          data.items.map(
            item => ({
              ...item
            })
          );

      }

    }


    /*
      Find using the EXACT SAME
      productId field as Shop.
    */

    const index =
      items.findIndex(
        item =>
          item.productId ===
          currentProduct.id
      );


    if(index >= 0){

      /*
        Product already exists.

        Increase the existing qty.
      */

      const oldQty =
        Number(
          items[index].qty
        ) || 0;


      let newQty =
        oldQty + quantity;


      /*
        Never allow cart quantity
        to exceed current stock.
      */

      if(
        newQty >
        currentProduct.stock
      ){

        newQty =
          currentProduct.stock;

      }


      items[index].qty =
        newQty;


      /*
        Refresh product information
        from the current product document.

        This prevents stale price/name/image
        from remaining in the cart.
      */

      items[index].productId =
        currentProduct.id;

      items[index].name =
        currentProduct.name;

      items[index].price =
        currentProduct.price;

      items[index].image =
        currentProduct.image;

      items[index].category =
        currentProduct.category;

    }

    else{

      /*
        New cart item.

        EXACT SAME fields as Shop.
      */

      items.push({

        productId:
          currentProduct.id,

        name:
          currentProduct.name,

        price:
          currentProduct.price,

        image:
          currentProduct.image,

        category:
          currentProduct.category,

        qty:
          quantity

      });

    }


    /*
      EXACT SAME WRITE STRUCTURE
      AS SHOP.HTML.
    */

    await cartRef.set({

      userId:
        user.uid,

      items:
        items,

      updatedAt:
        firebase.firestore
        .FieldValue
        .serverTimestamp()

    },{

      merge:true

    });


    showToast(
      `${currentProduct.name} added to cart ✓`
    );


    if(goToCart){

      setTimeout(
        () => {

          window.location.href =
            "cart.html";

        },
        400
      );

    }


    return true;

  }

  catch(error){

    console.error(
      "PRODUCT ADD TO CART ERROR:",
      error
    );


    showToast(
      "Could not add product to cart."
    );


    return false;

  }

}


/* =====================================================
   SIMILAR PRODUCTS
===================================================== */

async function loadSimilarProducts(){

  if(!currentProduct){

    return;

  }


  try{

    const snapshot =
      await db
      .collection("products")
      .get();


    allProducts = [];


    snapshot.forEach(
      doc => {

        if(
          doc.id ===
          currentProduct.id
        ){

          return;

        }


        const data =
          doc.data();


        allProducts.push({

          id:
            doc.id,

          name:
            data.name || "",

          description:
            data.description || "",

          price:
            Number(data.price) || 0,

          category:
            data.category || "",

          image:
            data.image || "",

          stock:
            Number(data.stock) || 0,

          available:
            data.available === true

        });

      }
    );


    /*
      Prefer products from the
      same category.
    */

    const sameCategory =
      allProducts.filter(
        product =>

          normalize(
            product.category
          ) ===
          normalize(
            currentProduct.category
          )
      );


    const otherProducts =
      allProducts.filter(
        product =>

          normalize(
            product.category
          ) !==
          normalize(
            currentProduct.category
          )
      );


    const selected =
      [
        ...sameCategory,
        ...otherProducts
      ]
      .slice(0,4);


    if(!selected.length){

      similarSection.style.display =
        "none";

      return;

    }


    similarSection.style.display =
      "block";


    similarProducts.innerHTML =
      "";


    selected.forEach(
      product => {

        createSimilarCard(
          product
        );

      }
    );

  }

  catch(error){

    console.error(
      "SIMILAR PRODUCTS ERROR:",
      error
    );

    similarSection.style.display =
      "none";

  }

}


/* =====================================================
   SIMILAR PRODUCT CARD
===================================================== */

function createSimilarCard(
  product
){

  const card =
    document.createElement(
      "article"
    );


  card.className =
    "similar-card";


  const image =
    product.image ||
    "https://via.placeholder.com/600x400?text=DSP+Product";


  card.innerHTML = `

    <img
      class="similar-image"
      src="${escapeAttribute(image)}"
      alt="${escapeAttribute(product.name)}"
      loading="lazy"
    >


    <div class="similar-content">

      <div class="similar-category">

        ${escapeHtml(
          product.category ||
          "Electrical"
        )}

      </div>


      <h3 class="similar-name">

        ${escapeHtml(
          product.name ||
          "Unnamed Product"
        )}

      </h3>


      <div class="similar-price">

        ₦${formatPrice(
          product.price
        )}

      </div>

    </div>

  `;


  card.addEventListener(
    "click",
    () => {

      window.location.href =
        "product.html?id=" +
        encodeURIComponent(
          product.id
        );

    }
  );


  similarProducts.appendChild(
    card
  );

}


/* =====================================================
   PRODUCT ERROR
===================================================== */

function showProductError(
  message
){

  productArea.innerHTML = `

    <div class="error-state">

      <div class="error-state-icon">
        ⚠️
      </div>

      <h2>
        Product unavailable
      </h2>

      <p>
        ${escapeHtml(message)}
      </p>

      <a
        href="shop.html"
        class="error-button"
      >
        Back to Shop
      </a>

    </div>

  `;


  similarSection.style.display =
    "none";

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(
  message
){

  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2500
    );

}


/* =====================================================
   HELPERS
===================================================== */

function normalize(
  value
){

  return String(
    value || ""
  )
  .toLowerCase()
  .trim()
  .replace(
    /\s+/g,
    " "
  );

}


function formatPrice(
  value
){

  const number =
    Number(value);


  if(
    !Number.isFinite(number)
  ){

    return "0";

  }


  return number.toLocaleString(
    "en-NG"
  );

}


function escapeHtml(
  value
){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(
      value ?? ""
    );


  return div.innerHTML;

}


function escapeAttribute(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  );

}

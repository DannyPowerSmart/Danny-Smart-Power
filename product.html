<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product | Danny Smart Power</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--header:#020617;--card:#111e30;--card2:#17253a;--border:rgba(148,163,184,.15);--blue:#38bdf8;--blueSoft:rgba(56,189,248,.1);--green:#22c55e;--red:#ef4444;--text:#f8fafc;--muted:#94a3b8}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Poppins,sans-serif}
a{text-decoration:none;color:inherit}
header{height:76px;background:rgba(2,6,23,.98);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 7%;position:sticky;top:0;z-index:50}
.back{font-size:15px;display:flex;gap:7px;align-items:center}.back:hover{color:var(--blue)}
.logo{font-size:22px;font-weight:700;letter-spacing:1px;color:var(--blue)}.logo span{color:#fff}
.headerRight{display:flex;align-items:center;gap:20px}.home{font-size:14px}.home:hover{color:var(--blue)}
.headerIcon{position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:23px;border-radius:12px}.headerIcon:hover{background:var(--blueSoft)}
.badge{position:absolute;top:-5px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:var(--blue);color:#00111c;font-size:10px;font-weight:700;border:2px solid var(--header)}
.notificationBadge{background:#ef4444;color:#fff}.badge.hidden{display:none}
.page{max-width:1120px;margin:auto;padding:28px 7% 80px}.breadcrumb{font-size:13px;color:var(--muted);margin-bottom:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.breadcrumb span{color:var(--blue)}
.productLayout{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:40px;align-items:start}
.mediaArea{min-width:0}.mediaBox{background:#0b1220;border:1px solid var(--border);border-radius:22px;overflow:hidden;padding:12px;position:relative}.mediaItem{width:100%;max-height:560px;display:block;border-radius:15px;object-fit:contain;background:#07101d}.mediaVideo{aspect-ratio:16/9;max-height:none;object-fit:contain}.mediaEmpty{min-height:300px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;border-radius:15px;background:#07101d}.availability{position:absolute;top:24px;left:24px;padding:8px 13px;border-radius:12px;background:rgba(2,6,23,.9);font-size:12px;font-weight:600;color:#86efac;border:1px solid rgba(34,197,94,.2);z-index:2}.availability.off{color:#fca5a5;border-color:rgba(239,68,68,.2)}
.mediaStack{display:grid;gap:12px}.mediaLabel{font-size:11px;color:var(--muted);margin:2px 4px 0;text-transform:uppercase;letter-spacing:.5px}
.mediaActions{display:flex;gap:10px;margin-top:12px}.actionBtn{flex:1;min-height:46px;border:1px solid var(--border);background:transparent;color:#fff;border-radius:13px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}.actionBtn:hover{background:var(--blueSoft);border-color:rgba(56,189,248,.4);color:var(--blue)}.wishlist.active{background:var(--blueSoft);color:var(--blue);border-color:rgba(56,189,248,.5)}
.info{padding-top:4px}.category{display:inline-block;padding:8px 14px;border:1px solid rgba(56,189,248,.25);border-radius:30px;color:var(--blue);font-size:11px;font-weight:600;text-transform:uppercase;margin-bottom:14px}.title{font-size:34px;line-height:1.2;margin-bottom:15px}.description{color:#cbd5e1;font-size:14px;line-height:1.8;margin-bottom:23px}.stock{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:22px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green)}.dot.off{background:var(--red)}
.quantity{margin-bottom:20px}.quantityLabel{display:block;color:#cbd5e1;font-size:13px;margin-bottom:9px}.quantityControl{width:155px;height:48px;display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:13px;overflow:hidden}.quantityControl button{width:48px;height:100%;border:0;background:transparent;color:#fff;font-size:21px;cursor:pointer}.quantityControl button:hover{background:var(--card2);color:var(--blue)}.quantityControl button:disabled{opacity:.35;cursor:not-allowed}.quantityValue{min-width:45px;text-align:center;font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}.addBtn,.buyBtn{min-height:52px;padding:0 22px;border-radius:13px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}.addBtn{border:0;background:var(--blue);color:#00111c}.buyBtn{background:#1e293b;color:#fff;border:1px solid var(--border)}.addBtn:hover,.buyBtn:hover{transform:translateY(-1px)}.addBtn:disabled,.buyBtn:disabled{background:#334155;color:#94a3b8;cursor:not-allowed;transform:none}
.features{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}.feature{padding:15px;background:rgba(17,30,48,.65);border:1px solid var(--border);border-radius:16px;display:flex;gap:11px}.featureIcon{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:var(--blueSoft);display:flex;align-items:center;justify-content:center;font-size:19px}.feature h3{font-size:13px;margin-bottom:4px}.feature p{font-size:10px;line-height:1.5;color:var(--muted)}
.details{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:7px 16px}.row{display:flex;justify-content:space-between;gap:20px;padding:11px 0;border-bottom:1px solid var(--border);font-size:12px}.row:last-child{border-bottom:0}.row span:first-child{color:var(--muted)}.row span:last-child{text-align:right}
.similar{margin-top:65px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.heading h2{font-size:22px}.heading span{font-size:12px;color:var(--muted)}.similarGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.similarCard{background:var(--card);border:1px solid var(--border);border-radius:17px;overflow:hidden;cursor:pointer;transition:.2s}.similarCard:hover{transform:translateY(-3px);border-color:rgba(56,189,248,.4)}.similarMedia{width:100%;height:160px;object-fit:cover;background:#0b1220;display:block}.similarBody{padding:13px}.similarCategory{color:var(--blue);font-size:10px;text-transform:uppercase}.similarName{font-size:14px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.similarAction{display:inline-block;margin-top:10px;color:var(--blue);font-size:11px;font-weight:600}
.loading{min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted)}.spinner{width:38px;height:38px;margin-bottom:15px;border:3px solid #1e293b;border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:80px 20px;color:var(--muted)}.errorIcon{font-size:45px;margin-bottom:12px}.error h2{color:#fff;margin-bottom:7px}.errorBtn{display:inline-block;margin-top:20px;padding:11px 20px;background:var(--blue);color:#00111c;border-radius:10px;font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,120px);background:#020617;border:1px solid rgba(56,189,248,.35);color:#fff;padding:13px 18px;border-radius:12px;box-shadow:0 15px 40px rgba(0,0,0,.4);font-size:13px;z-index:100;opacity:0;transition:.3s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){.productLayout{grid-template-columns:1fr;gap:28px}.title{font-size:30px}.similarGrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){header{padding:0 14px}.page{padding:24px 14px 70px}.home{display:none}.headerRight{gap:6px}.title{font-size:27px}.mediaItem{max-height:430px}.similarGrid{grid-template-columns:repeat(2,1fr);gap:12px}.similarMedia{height:135px}.features{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr}.addBtn,.buyBtn{width:100%}}
</style>
</head>
<body>
<header>
  <a href="shop.html" class="back">← Shop</a>
  <div class="logo">D<span>SP</span></div>
  <div class="headerRight">
    <a href="index.html" class="home">Home</a>
    <a href="notification.html" class="headerIcon" aria-label="Notifications">🔔<span id="notificationCount" class="badge notificationBadge hidden">0</span></a>
    <a href="cart.html" class="headerIcon" aria-label="Cart">🛒<span id="cartCount" class="badge">0</span></a>
  </div>
</header>
<main class="page">
  <div class="breadcrumb"><span>Danny Smart Power</span> › <span id="breadcrumbCategory">Product</span> › <span id="breadcrumbName">Loading...</span></div>
  <section class="productLayout" id="productArea"><div class="loading"><div class="spinner"></div>Loading product...</div></section>
  <section class="similar" id="similarSection" style="display:none"><div class="heading"><h2>Similar Products</h2><span>You may also like</span></div><div class="similarGrid" id="similarProducts"></div></section>
</main>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGb44",authDomain:"danny-smart-power.firebaseapp.com",databaseURL:"https://danny-smart-power-default-rtdb.firebaseio.com",projectId:"danny-smart-power",storageBucket:"danny-smart-power.firebasestorage.app",messagingSenderId:"649735645158",appId:"1:649735645158:web:cff518b89721a163679827",measurementId:"G-258YKLP5ZS"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
const productArea=document.getElementById("productArea"),similarSection=document.getElementById("similarSection"),similarProducts=document.getElementById("similarProducts"),cartCount=document.getElementById("cartCount"),notificationCount=document.getElementById("notificationCount"),breadcrumbCategory=document.getElementById("breadcrumbCategory"),breadcrumbName=document.getElementById("breadcrumbName"),toast=document.getElementById("toast");
const productId=new URLSearchParams(location.search).get("id");
let currentProduct=null,cartItems=[],selectedQuantity=1,wishlistSaved=false,cartUnsubscribe=null,wishlistUnsubscribe=null,notificationUnsubs=[],notificationDocs=new Map(),toastTimer;

auth.onAuthStateChanged(async user=>{if(!user){showLoginRequired();return}listenToCart(user.uid);listenToWishlist(user.uid);listenToNotifications(user);await loadProduct();});
function showLoginRequired(){productArea.innerHTML='<div class="error"><div class="errorIcon">🔐</div><h2>Please sign in</h2><p>You need to sign in before viewing and purchasing products.</p><a class="errorBtn" href="login.html">Sign In</a></div>'}
async function loadProduct(){if(!productId){showProductError("No product was selected.");return}try{const doc=await db.collection("products").doc(productId).get();if(!doc.exists){showProductError("This product no longer exists.");return}const d=doc.data();currentProduct={id:doc.id,name:d.name||"",description:d.description||"",price:Number(d.price)||0,category:d.category||"",image:d.image||d.imageUrl||d.photoURL||"",video:d.video||d.videoUrl||d.videoURL||"",mediaUrl:d.mediaUrl||"",mediaType:d.mediaType||"",stock:Number(d.stock)||0,available:d.available===true};displayProduct();loadSimilarProducts()}catch(e){console.error(e);showProductError("Unable to load this product right now.")}}
function mediaIsVideo(url){return /\.(mp4|webm|ogg|mov)(\?|#|$)/i.test(url||"")||/res\.cloudinary\.com\/.*\/video\/upload/i.test(url||"")}
function getVideoUrl(p){if(p.video)return p.video;if(p.mediaType&&String(p.mediaType).toLowerCase()==="video"&&p.mediaUrl)return p.mediaUrl;if(!p.image&&mediaIsVideo(p.mediaUrl))return p.mediaUrl;return ""}
function displayProduct(){const p=currentProduct,isAvailable=p.available&&p.stock>0;breadcrumbCategory.textContent=p.category||"Electrical";breadcrumbName.textContent=p.name||"Product";document.title=(p.name||"Product")+" | Danny Smart Power";const image=p.image&&!mediaIsVideo(p.image)?p.image:"";const video=getVideoUrl(p);let media="";if(image)media+='<img class="mediaItem" src="'+escapeAttribute(image)+'" alt="'+escapeAttribute(p.name)+'" loading="eager">';if(video)media+='<video class="mediaItem mediaVideo" controls playsinline preload="metadata"><source src="'+escapeAttribute(video)+'">Your browser does not support video.</video>';if(!media)media='<div class="mediaEmpty">No product media available.</div>';productArea.innerHTML='<div class="mediaArea"><div class="mediaBox"><span class="availability '+(isAvailable?"":"off")+'">'+(isAvailable?"✓ Available":"✕ Unavailable")+'</span><div class="mediaStack">'+media+'</div></div><div class="mediaActions"><button class="actionBtn wishlist" id="wishlistButton">♡ <span id="wishlistText">Add to Wishlist</span></button><button class="actionBtn" id="shareButton">🔗 Share</button></div></div><div class="info"><div class="category">'+escapeHtml(p.category||"Electrical")+'</div><h1 class="title">'+escapeHtml(p.name||"Unnamed Product")+'</h1><p class="description">'+escapeHtml(p.description||"Quality product from Danny Smart Power.")+'</p><div class="stock"><span class="dot '+(isAvailable?"":"off")+'"></span><span>'+(isAvailable?p.stock+" in stock":"Currently unavailable")+'</span></div><div class="features"><div class="feature"><div class="featureIcon">⚡</div><div><h3>Fast Delivery</h3><p>Delivery fee depends on your delivery address.</p></div></div><div class="feature"><div class="featureIcon">🛠️</div><div><h3>24/7 Support</h3><p>Need help? Our support team is available to assist.</p></div></div></div><div class="quantity"><span class="quantityLabel">Quantity</span><div class="quantityControl"><button id="minusButton">−</button><span class="quantityValue" id="quantityValue">1</span><button id="plusButton">+</button></div></div><div class="actions"><button class="addBtn" id="addButton" '+(isAvailable?"":"disabled")+'>🛒 Add to Cart</button><button class="buyBtn" id="buyButton" '+(isAvailable?"":"disabled")+'>Buy Now</button></div><div class="details"><div class="row"><span>Product</span><span>'+escapeHtml(p.name)+'</span></div><div class="row"><span>Category</span><span>'+escapeHtml(p.category||"Electrical")+'</span></div><div class="row"><span>Availability</span><span>'+(isAvailable?"Available":"Unavailable")+'</span></div><div class="row"><span>Stock</span><span>'+p.stock+'</span></div><div class="row"><span>Delivery</span><span>Fast Delivery</span></div><div class="row"><span>Customer Support</span><span>24/7 Support</span></div></div></div>';setupQuantity();setupActions();updateWishlistButton()}
function setupActions(){document.getElementById("wishlistButton")?.addEventListener("click",toggleWishlist);document.getElementById("shareButton")?.addEventListener("click",shareProduct)}
function setupQuantity(){const minus=document.getElementById("minusButton"),plus=document.getElementById("plusButton"),value=document.getElementById("quantityValue");selectedQuantity=1;const update=()=>{value.textContent=selectedQuantity;minus.disabled=selectedQuantity<=1;plus.disabled=!currentProduct||selectedQuantity>=currentProduct.stock};minus.addEventListener("click",()=>{if(selectedQuantity>1){selectedQuantity--;update()}});plus.addEventListener("click",()=>{if(currentProduct&&selectedQuantity<currentProduct.stock){selectedQuantity++;update()}});document.getElementById("addButton")?.addEventListener("click",()=>addToCart(selectedQuantity));document.getElementById("buyButton")?.addEventListener("click",()=>addToCart(selectedQuantity,true));update()}
function listenToCart(uid){if(cartUnsubscribe)cartUnsubscribe();cartUnsubscribe=db.collection("carts").doc(uid).onSnapshot(doc=>{cartItems=doc.exists&&Array.isArray(doc.data().items)?doc.data().items:[];cartCount.textContent=cartItems.reduce((n,i)=>n+(Number(i.qty)||0),0)},()=>cartCount.textContent="0")}
async function addToCart(qty,go=false){const user=auth.currentUser;if(!user){showToast("Please sign in first.");return}if(!currentProduct||!currentProduct.available||currentProduct.stock<=0){showToast("This product is unavailable.");return}qty=Math.max(1,Math.min(Number(qty)||1,currentProduct.stock));try{const ref=db.collection("carts").doc(user.uid),snap=await ref.get();let items=snap.exists&&Array.isArray(snap.data().items)?snap.data().items.map(x=>({...x})):[];const i=items.findIndex(x=>x.productId===currentProduct.id);if(i>=0){items[i].qty=Math.min((Number(items[i].qty)||0)+qty,currentProduct.stock);items[i].name=currentProduct.name;items[i].price=currentProduct.price;items[i].image=currentProduct.image;items[i].category=currentProduct.category}else items.push({productId:currentProduct.id,name:currentProduct.name,price:currentProduct.price,image:currentProduct.image,category:currentProduct.category,qty});await ref.set({userId:user.uid,items,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});showToast(currentProduct.name+" added to cart ✓");if(go)setTimeout(()=>location.href="cart.html",400)}catch(e){console.error(e);showToast("Could not add product to cart.")}}
function listenToWishlist(uid){if(wishlistUnsubscribe)wishlistUnsubscribe();if(!productId)return;const id=uid+"_"+productId;wishlistUnsubscribe=db.collection("wishlists").doc(id).onSnapshot(doc=>{wishlistSaved=doc.exists;updateWishlistButton()},e=>console.error(e))}
function updateWishlistButton(){const b=document.getElementById("wishlistButton"),t=document.getElementById("wishlistText");if(!b||!t)return;b.classList.toggle("active",wishlistSaved);b.firstChild.textContent=wishlistSaved?"♥ ":"♡ ";t.textContent=wishlistSaved?"Saved to Wishlist":"Add to Wishlist"}
async function toggleWishlist(){const u=auth.currentUser;if(!u||!currentProduct)return;const ref=db.collection("wishlists").doc(u.uid+"_"+currentProduct.id);try{if(wishlistSaved){await ref.delete();showToast("Removed from wishlist.")}else{await ref.set({customerId:u.uid,productId:currentProduct.id,name:currentProduct.name,createdAt:firebase.firestore.FieldValue.serverTimestamp(),addedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});showToast("Added to wishlist 💙")}}catch(e){console.error(e);showToast("Could not update wishlist.")}}
async function shareProduct(){if(!currentProduct)return;try{if(navigator.share){await navigator.share({title:currentProduct.name,text:"Check out "+currentProduct.name+" on Danny Smart Power.",url:location.href})}else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);showToast("Product link copied ✓")}else showToast("Copy this page link to share.")}catch(e){}}
async function loadSimilarProducts(){try{const snap=await db.collection("products").get(),arr=[];snap.forEach(doc=>{if(doc.id===currentProduct.id)return;const d=doc.data();arr.push({id:doc.id,name:d.name||"",category:d.category||"",image:d.image||d.imageUrl||d.photoURL||"",video:d.video||d.videoUrl||"",available:d.available===true})});const same=arr.filter(x=>normalize(x.category)===normalize(currentProduct.category));const other=arr.filter(x=>normalize(x.category)!==normalize(currentProduct.category));const selected=[...same,...other].slice(0,4);if(!selected.length){similarSection.style.display="none";return}similarSection.style.display="block";similarProducts.innerHTML="";selected.forEach(createSimilarCard)}catch(e){console.error(e);similarSection.style.display="none"}}
function createSimilarCard(p){const card=document.createElement("article");card.className="similarCard";const media=p.image&&!mediaIsVideo(p.image)?'<img class="similarMedia" src="'+escapeAttribute(p.image)+'" alt="'+escapeAttribute(p.name)+'" loading="lazy">':p.video?'<video class="similarMedia" muted playsinline preload="metadata"><source src="'+escapeAttribute(p.video)+'"></video>':'<div class="similarMedia"></div>';card.innerHTML=media+'<div class="similarBody"><div class="similarCategory">'+escapeHtml(p.category||"Electrical")+'</div><h3 class="similarName">'+escapeHtml(p.name||"Unnamed Product")+'</h3><span class="similarAction">View Product →</span></div>';card.onclick=()=>location.href="product.html?id="+encodeURIComponent(p.id);similarProducts.appendChild(card)}
function showProductError(msg){productArea.innerHTML='<div class="error"><div class="errorIcon">⚠️</div><h2>Product unavailable</h2><p>'+escapeHtml(msg)+'</p><a class="errorBtn" href="shop.html">Back to Shop</a></div>';similarSection.style.display="none"}
function showToast(msg){toast.textContent=msg;toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("show"),2500)}
function normalize(v){return String(v||"").toLowerCase().trim().replace(/\s+/g," ")}
function escapeHtml(v){const d=document.createElement("div");d.textContent=String(v??"");return d.innerHTML}
function escapeAttribute(v){return String(v??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

/* Notification counter: separate permitted queries so Firestore rules are respected. */
function listenToNotifications(user){notificationUnsubs.forEach(fn=>{try{fn()}catch(e){}});notificationUnsubs=[];notificationDocs.clear();const email=(user.email||"").toLowerCase();const queries=[db.collection("notifications").where("target","==","all"),db.collection("notifications").where("target","==","everyone"),db.collection("notifications").where("target","==","customers"),db.collection("notifications").where("recipientId","==",user.uid),db.collection("notifications").where("userId","==",user.uid),db.collection("notifications").where("customerId","==",user.uid)];if(email){queries.push(db.collection("notifications").where("recipientEmail","==",email),db.collection("notifications").where("email","==",email))}queries.forEach(q=>{const unsub=q.onSnapshot(snap=>{snap.docChanges().forEach(change=>{if(change.type==="removed")notificationDocs.delete(change.doc.id);else notificationDocs.set(change.doc.id,{id:change.doc.id,...change.doc.data()})});renderNotificationCount(user.uid)},err=>console.warn("Notification counter query failed:",err.code||err.message));notificationUnsubs.push(unsub)})}
function renderNotificationCount(uid){let unread=0;notificationDocs.forEach(n=>{const readBy=Array.isArray(n.readBy)?n.readBy:[];const unreadForUser=readBy.length? !readBy.includes(uid) : n.read!==true;if(unreadForUser)unread++});notificationCount.textContent=unread>99?"99+":String(unread);notificationCount.classList.toggle("hidden",unread===0)}
</script>
</body>
</html>

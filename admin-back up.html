<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | Danny Smart Power</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
  min-height:100vh;
}

button,
input,
select,
textarea{
  font:inherit;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:390px;
  background:#0d1b2a;
  border:1px solid rgba(255,255,255,.1);
  border-radius:22px;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.logo{
  width:68px;
  height:68px;
  margin:0 auto 18px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#38bdf8;
  color:#00111c;
  font-size:32px;
}

.login-box h1{
  text-align:center;
  font-size:24px;
}

.login-box p{
  text-align:center;
  color:#94a3b8;
  margin-top:8px;
  font-size:14px;
}

label{
  display:block;
  margin-top:20px;
  margin-bottom:7px;
  font-size:13px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #24364a;
  background:#102234;
  color:white;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#38bdf8;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.primary{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#38bdf8;
  color:#00111c;
  font-weight:bold;
  cursor:pointer;
}

.primary:disabled{
  opacity:.6;
}

.error{
  color:#f87171!important;
  margin-top:15px!important;
}

.success{
  color:#4ade80!important;
}

/* DASHBOARD */

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#020617;
  border-bottom:1px solid #172337;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  font-size:19px;
  font-weight:bold;
}

.brand span{
  color:#38bdf8;
}

.logout{
  border:1px solid #334155;
  background:transparent;
  color:white;
  padding:9px 14px;
  border-radius:9px;
  cursor:pointer;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px 18px 50px;
}

.welcome{
  margin-bottom:25px;
}

.welcome h1{
  font-size:27px;
}

.welcome p{
  color:#94a3b8;
  margin-top:6px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:#0d1b2a;
  border:1px solid #172337;
  border-radius:16px;
  padding:20px;
}

.stat small{
  color:#94a3b8;
}

.stat strong{
  display:block;
  font-size:27px;
  margin-top:8px;
}

/* FORM */

.panel{
  background:#0d1b2a;
  border:1px solid #172337;
  border-radius:18px;
  padding:20px;
  margin-bottom:25px;
}

.panel h2{
  font-size:19px;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.full{
  grid-column:1/-1;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.actions button{
  flex:1;
}

.secondary{
  background:#172337;
  color:white;
  border:0;
  border-radius:10px;
  padding:13px;
  cursor:pointer;
}

/* PRODUCTS */

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.toolbar input{
  flex:1;
}

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.product{
  background:#102234;
  border:1px solid #1e3349;
  border-radius:15px;
  overflow:hidden;
}

.product img{
  width:100%;
  height:170px;
  object-fit:cover;
  background:#07111f;
}

.product-body{
  padding:14px;
}

.product-name{
  font-weight:bold;
  margin-bottom:7px;
}

.product-category{
  color:#94a3b8;
  font-size:12px;
}

.price{
  color:#38bdf8;
  font-weight:bold;
  margin-top:10px;
}

.product-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.product-actions button{
  flex:1;
  padding:9px;
  border-radius:8px;
  cursor:pointer;
}

.edit{
  border:1px solid #38bdf8;
  background:transparent;
  color:#38bdf8;
}

.delete{
  border:1px solid #ef4444;
  background:transparent;
  color:#f87171;
}

.empty{
  text-align:center;
  padding:30px;
  color:#94a3b8;
}

/* MOBILE */

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .products{
    grid-template-columns:1fr;
  }

  .toolbar{
    flex-direction:column;
  }

  header{
    padding:13px 15px;
  }

  .container{
    padding:20px 13px 40px;
  }
}
</style>
</head>

<body>

<!-- LOGIN SCREEN -->

<section id="loginScreen">

  <div class="login-box">

    <div class="logo">⚡</div>

    <h1>Admin Access</h1>

    <p>Danny Smart Power</p>

    <label>Email</label>

    <input
      type="email"
      id="adminEmail"
      placeholder="Admin email"
      autocomplete="email"
    >

    <label>Password</label>

    <input
      type="password"
      id="adminPassword"
      placeholder="Admin password"
      autocomplete="current-password"
    >

    <button
      class="primary"
      id="loginButton"
      onclick="adminLogin()"
    >
      Login to Dashboard
    </button>

    <p id="loginMessage"></p>

  </div>

</section>


<!-- ADMIN DASHBOARD -->

<section id="dashboard" class="hidden">

<header>

  <div class="brand">
    ⚡ <span>Danny Smart Power</span> Admin
  </div>

  <button
    class="logout"
    onclick="logout()"
  >
    Logout
  </button>

</header>


<div class="container">

  <div class="welcome">

    <h1>Admin Dashboard</h1>

    <p>Manage your Danny Smart Power products.</p>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">

      <small>Total Products</small>

      <strong id="productCount">
        0
      </strong>

    </div>

    <div class="stat">

      <small>Category</small>

      <strong id="categoryCount">
        0
      </strong>

    </div>

    <div class="stat">

      <small>Admin Status</small>

      <strong>✓ Active</strong>

    </div>

  </div>


  <!-- ADD / EDIT -->

  <div class="panel">

    <h2 id="formTitle">
      Add New Product
    </h2>

    <div class="grid">

      <div>

        <label>Product Name</label>

        <input
          id="productName"
          placeholder="e.g. Solar Panel 200W"
        >

      </div>


      <div>

        <label>Price</label>

        <input
          id="productPrice"
          type="number"
          placeholder="e.g. 85000"
        >

      </div>


      <div>

        <label>Category</label>

        <select id="productCategory">

          <option value="Solar">
            Solar
          </option>

          <option value="Electrical">
            Electrical
          </option>

          <option value="Lighting">
            Lighting
          </option>

          <option value="Accessories">
            Accessories
          </option>

        </select>

      </div>


      <div>

        <label>Image URL</label>

        <input
          id="productImage"
          placeholder="https://..."
        >

      </div>


      <div class="full">

        <label>Description</label>

        <textarea
          id="productDescription"
          placeholder="Describe the product..."
        ></textarea>

      </div>

    </div>


    <div class="actions">

      <button
        class="primary"
        id="saveButton"
        onclick="saveProduct()"
      >
        Add Product
      </button>

      <button
        class="secondary hidden"
        id="cancelButton"
        onclick="cancelEdit()"
      >
        Cancel
      </button>

    </div>

    <p id="formMessage"></p>

  </div>


  <!-- PRODUCTS -->

  <div class="panel">

    <h2>Your Products</h2>

    <div class="toolbar">

      <input
        id="search"
        placeholder="Search products..."
        oninput="renderProducts()"
      >

    </div>

    <div
      id="products"
      class="products"
    ></div>

  </div>

</div>

</section>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGb44",
  authDomain: "danny-smart-power.firebaseapp.com",
  databaseURL: "https://danny-smart-power-default-rtdb.firebaseio.com",
  projectId: "danny-smart-power",
  storageBucket: "danny-smart-power.firebasestorage.app",
  messagingSenderId: "649735645158",
  appId: "1:649735645158:web:cff518b89721a163679827",
  measurementId: "G-258YKLP5ZS"
};


firebase.initializeApp(firebaseConfig);


const auth =
  firebase.auth();

const db =
  firebase.firestore();


/*
  THIS IS YOUR ADMIN UID
*/

const ADMIN_UID =
  "mJn7uuuqW8RYwILcLtjPrYFvf4P2";


let products = [];

let editingId = null;


/* =========================
   AUTHENTICATION
========================= */

async function adminLogin(){

  const email =
    document
      .getElementById("adminEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("adminPassword")
      .value;

  const message =
    document.getElementById(
      "loginMessage"
    );

  const button =
    document.getElementById(
      "loginButton"
    );


  if(!email || !password){

    message.textContent =
      "Please enter your email and password.";

    message.className = "error";

    return;

  }


  button.disabled = true;

  button.textContent =
    "Checking...";


  try{

    const result =
      await auth.signInWithEmailAndPassword(
        email,
        password
      );

    const user =
      result.user;


    /*
      FIRST SECURITY CHECK:
      UID MUST MATCH YOUR ADMIN UID.
    */

    if(user.uid !== ADMIN_UID){

      await auth.signOut();

      throw new Error(
        "This account is not authorized as an administrator."
      );

    }


    /*
      SECOND CHECK:
      CONFIRM THE ADMIN DOCUMENT EXISTS.
    */

    const adminDoc =
      await db
        .collection("admins")
        .doc(user.uid)
        .get();


    if(!adminDoc.exists){

      await auth.signOut();

      throw new Error(
        "Admin account is not configured in Firestore."
      );

    }


    showDashboard();


  }catch(error){

    console.error(error);

    message.textContent =
      error.message;

    message.className =
      "error";

    button.disabled = false;

    button.textContent =
      "Login to Dashboard";

  }

}


/* =========================
   AUTH STATE
========================= */

auth.onAuthStateChanged(async user => {

  if(!user){

    showLogin();

    return;

  }


  if(user.uid !== ADMIN_UID){

    await auth.signOut();

    showLogin();

    return;

  }


  try{

    const adminDoc =
      await db
        .collection("admins")
        .doc(user.uid)
        .get();


    if(adminDoc.exists){

      showDashboard();

    }else{

      await auth.signOut();

      showLogin();

    }

  }catch(error){

    console.error(error);

  }

});


function showLogin(){

  document
    .getElementById("loginScreen")
    .classList
    .remove("hidden");

  document
    .getElementById("dashboard")
    .classList
    .add("hidden");

}


function showDashboard(){

  document
    .getElementById("loginScreen")
    .classList
    .add("hidden");

  document
    .getElementById("dashboard")
    .classList
    .remove("hidden");

  loadProducts();

}


async function logout(){

  await auth.signOut();

}


/* =========================
   PRODUCTS
========================= */

async function loadProducts(){

  const container =
    document.getElementById(
      "products"
    );

  container.innerHTML =
    '<div class="empty">Loading products...</div>';


  try{

    const snapshot =
      await db
        .collection("products")
        .orderBy("createdAt","desc")
        .get();


    products =
      snapshot.docs.map(doc =>({

        id: doc.id,

        ...doc.data()

      }));


    updateStats();

    renderProducts();


  }catch(error){

    console.error(error);

    /*
      If older products don't have createdAt,
      retry without orderBy.
    */

    try{

      const snapshot =
        await db
          .collection("products")
          .get();


      products =
        snapshot.docs.map(doc =>({

          id: doc.id,

          ...doc.data()

        }));


      updateStats();

      renderProducts();


    }catch(secondError){

      container.innerHTML =
        `<div class="empty">
          Could not load products.<br><br>
          ${secondError.message}
        </div>`;

    }

  }

}


function updateStats(){

  document.getElementById(
    "productCount"
  ).textContent =
    products.length;


  const categories =
    new Set(
      products
        .map(p => p.category)
        .filter(Boolean)
    );


  document.getElementById(
    "categoryCount"
  ).textContent =
    categories.size;

}


function renderProducts(){

  const container =
    document.getElementById(
      "products"
    );

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    products.filter(product => {

      const name =
        String(product.name || "")
          .toLowerCase();

      const category =
        String(product.category || "")
          .toLowerCase();

      return(
        name.includes(search) ||
        category.includes(search)
      );

    });


  if(filtered.length === 0){

    container.innerHTML =
      '<div class="empty">No products found.</div>';

    return;

  }


  container.innerHTML =
    filtered.map(product => {

      const image =
        product.image ||
        product.imageUrl ||
        "https://via.placeholder.com/600x400?text=Danny+Smart+Power";


      const price =
        Number(product.price || 0)
          .toLocaleString();


      return `

        <div class="product">

          <img
            src="${escapeHtml(image)}"
            alt="${escapeHtml(product.name || "Product")}"
            onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'"
          >

          <div class="product-body">

            <div class="product-name">
              ${escapeHtml(product.name || "Unnamed product")}
            </div>

            <div class="product-category">
              ${escapeHtml(product.category || "Uncategorized")}
            </div>

            <div class="price">
              ₦${price}
            </div>

            <div class="product-actions">

              <button
                class="edit"
                onclick="editProduct('${product.id}')"
              >
                Edit
              </button>

              <button
                class="delete"
                onclick="deleteProduct('${product.id}')"
              >
                Delete
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   ADD PRODUCT
========================= */

async function saveProduct(){

  const name =
    document
      .getElementById("productName")
      .value
      .trim();

  const price =
    Number(
      document
        .getElementById("productPrice")
        .value
    );

  const category =
    document
      .getElementById("productCategory")
      .value;

  const image =
    document
      .getElementById("productImage")
      .value
      .trim();

  const description =
    document
      .getElementById("productDescription")
      .value
      .trim();

  const message =
    document.getElementById(
      "formMessage"
    );


  if(!name || !price){

    message.textContent =
      "Product name and price are required.";

    message.className =
      "error";

    return;

  }


  const data = {

    name,

    price,

    category,

    image,

    description,

    updatedAt:
      firebase.firestore.FieldValue.serverTimestamp()

  };


  try{

    if(editingId){

      await db
        .collection("products")
        .doc(editingId)
        .update(data);

      message.textContent =
        "Product updated successfully.";

    }else{

      await db
        .collection("products")
        .add({

          ...data,

          createdAt:
            firebase.firestore.FieldValue.serverTimestamp()

        });

      message.textContent =
        "Product added successfully.";

    }


    message.className =
      "success";


    clearForm();

    await loadProducts();


  }catch(error){

    console.error(error);

    message.textContent =
      error.message;

    message.className =
      "error";

  }

}


/* =========================
   EDIT PRODUCT
========================= */

function editProduct(id){

  const product =
    products.find(
      p => p.id === id
    );


  if(!product) return;


  editingId = id;


  document.getElementById(
    "productName"
  ).value =
    product.name || "";


  document.getElementById(
    "productPrice"
  ).value =
    product.price || "";


  document.getElementById(
    "productCategory"
  ).value =
    product.category || "Solar";


  document.getElementById(
    "productImage"
  ).value =
    product.image ||
    product.imageUrl ||
    "";


  document.getElementById(
    "productDescription"
  ).value =
    product.description || "";


  document.getElementById(
    "formTitle"
  ).textContent =
    "Edit Product";


  document.getElementById(
    "saveButton"
  ).textContent =
    "Save Changes";


  document.getElementById(
    "cancelButton"
  ).classList
    .remove("hidden");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function cancelEdit(){

  editingId = null;

  clearForm();

}


function clearForm(){

  document.getElementById(
    "productName"
  ).value = "";

  document.getElementById(
    "productPrice"
  ).value = "";

  document.getElementById(
    "productImage"
  ).value = "";

  document.getElementById(
    "productDescription"
  ).value = "";


  document.getElementById(
    "formTitle"
  ).textContent =
    "Add New Product";


  document.getElementById(
    "saveButton"
  ).textContent =
    "Add Product";


  document.getElementById(
    "cancelButton"
  ).classList
    .add("hidden");


  editingId = null;

}


/* =========================
   DELETE
========================= */

async function deleteProduct(id){

  const product =
    products.find(
      p => p.id === id
    );


  if(!product) return;


  const confirmed =
    confirm(
      `Delete "${product.name}"?`
    );


  if(!confirmed) return;


  try{

    await db
      .collection("products")
      .doc(id)
      .delete();


    await loadProducts();


  }catch(error){

    alert(
      "Could not delete product: " +
      error.message
    );

  }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}

</script>

</body>
</html>

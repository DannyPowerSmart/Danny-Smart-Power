<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications | Danny Smart Power</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Poppins,sans-serif;
    background:#0f172a;
    color:#e5e7eb;
    min-height:100vh;
}

/* HEADER */

header{
    height:68px;
    background:#020617;
    border-bottom:1px solid rgba(255,255,255,.08);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 16px;

    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    color:#fff;
    font-size:17px;
    font-weight:700;
}

.logo span{
    color:#38bdf8;
}

.header-actions{
    display:flex;
    gap:8px;
}

.header-btn{
    border:1px solid rgba(255,255,255,.10);
    background:#111827;
    color:#e5e7eb;

    padding:8px 11px;
    border-radius:9px;

    font-family:Poppins,sans-serif;
    font-size:11px;
    font-weight:600;

    cursor:pointer;
}

.header-btn:hover{
    border-color:#38bdf8;
    color:#38bdf8;
}

/* MAIN */

main{
    width:100%;
    max-width:850px;

    margin:auto;

    padding:28px 16px 60px;
}

/* TOP */

.page-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    gap:18px;

    margin-bottom:20px;
}

.page-title{
    color:#fff;
    font-size:25px;
    font-weight:700;
}

.page-subtitle{
    color:#94a3b8;
    font-size:13px;

    margin-top:5px;

    line-height:1.6;
}

.mark-all-btn{
    border:none;
    background:#38bdf8;
    color:#02111d;

    padding:10px 14px;

    border-radius:10px;

    font-family:Poppins,sans-serif;
    font-size:12px;
    font-weight:700;

    cursor:pointer;

    white-space:nowrap;
}

.mark-all-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* STATUS */

.status{
    color:#94a3b8;
    font-size:12px;
    margin-bottom:12px;
}

/* LIST */

.notifications-list{
    display:flex;
    flex-direction:column;
    gap:11px;
}

/* NOTIFICATION */

.notification-card{
    width:100%;

    display:flex;
    gap:13px;

    padding:15px;

    background:#111827;

    border:1px solid rgba(255,255,255,.08);

    border-radius:15px;

    cursor:pointer;

    transition:.2s;
}

.notification-card:hover{
    border-color:rgba(56,189,248,.45);
}

.notification-card.unread{
    border-left:3px solid #38bdf8;
    background:#132033;
}

/* ICON */

.notification-icon{
    width:44px;
    height:44px;

    min-width:44px;

    border-radius:12px;

    background:#172033;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:21px;
}

/* CONTENT */

.notification-content{
    min-width:0;
    flex:1;
}

.notification-title-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.notification-title{
    color:#fff;
    font-size:14px;
    font-weight:600;
}

.notification-time{
    color:#64748b;
    font-size:10px;
    white-space:nowrap;
}

.notification-body{
    color:#cbd5e1;

    font-size:12px;

    line-height:1.65;

    margin-top:5px;

    white-space:pre-wrap;
}

.notification-type{
    display:inline-block;

    margin-top:8px;

    padding:3px 8px;

    border-radius:20px;

    background:rgba(56,189,248,.10);

    color:#38bdf8;

    font-size:9px;

    font-weight:600;

    text-transform:capitalize;
}

/* EMPTY */

.empty-state{
    background:#111827;

    border:1px dashed rgba(255,255,255,.12);

    border-radius:15px;

    padding:45px 20px;

    text-align:center;

    color:#94a3b8;

    font-size:13px;

    line-height:1.7;
}

.empty-icon{
    font-size:34px;
    margin-bottom:10px;
}

/* LOGIN MESSAGE */

.login-box{
    background:#111827;

    border:1px solid rgba(56,189,248,.18);

    border-radius:16px;

    padding:35px 20px;

    text-align:center;
}

.login-icon{
    font-size:38px;
    margin-bottom:12px;
}

.login-box h2{
    color:#fff;
    font-size:18px;
    margin-bottom:7px;
}

.login-box p{
    color:#94a3b8;
    font-size:12px;
    line-height:1.6;
    margin-bottom:18px;
}

.login-btn{
    border:none;

    background:#38bdf8;
    color:#02111d;

    padding:10px 18px;

    border-radius:10px;

    font-family:Poppins,sans-serif;

    font-size:12px;
    font-weight:700;

    cursor:pointer;
}

/* LOADING */

.loading{
    width:25px;
    height:25px;

    border:2px solid #334155;
    border-top-color:#38bdf8;

    border-radius:50%;

    animation:spin .8s linear infinite;

    margin:30px auto;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

/* ERROR */

.error-box{
    background:#1e1720;

    border:1px solid rgba(248,113,113,.25);

    color:#fca5a5;

    border-radius:12px;

    padding:16px;

    font-size:12px;

    line-height:1.6;
}

/* MOBILE */

@media(max-width:600px){

    header{
        height:62px;
        padding:0 12px;
    }

    .logo{
        font-size:15px;
    }

    .header-btn{
        padding:8px 9px;
        font-size:10px;
    }

    main{
        padding:22px 12px 45px;
    }

    .page-top{
        flex-direction:column;
    }

    .page-title{
        font-size:22px;
    }

    .mark-all-btn{
        width:100%;
    }

    .notification-card{
        padding:13px;
    }

    .notification-title-row{
        display:block;
    }

    .notification-time{
        display:block;
        margin-top:3px;
    }

}

</style>
</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">
        Danny <span>Smart Power</span>
    </div>

    <div class="header-actions">

        <button
            class="header-btn"
            onclick="location.href='home.html'">
            Home
        </button>

        <button
            class="header-btn"
            onclick="location.href='profile.html'">
            Profile
        </button>

    </div>

</header>


<!-- MAIN -->

<main>

    <div class="page-top">

        <div>

            <h1 class="page-title">
                Notifications
            </h1>

            <p class="page-subtitle">
                Stay updated with your orders, services and important messages.
            </p>

        </div>


        <button
            class="mark-all-btn"
            id="markAllBtn"
            type="button">

            ✓ Mark all as read

        </button>

    </div>


    <div
        class="status"
        id="status">

        Checking your account...

    </div>


    <div
        class="notifications-list"
        id="notificationsList">

        <div class="loading"></div>

    </div>

</main>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>


<script>

/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:"AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGB44",

    authDomain:"danny-smart-power.firebaseapp.com",

    projectId:"danny-smart-power",

    storageBucket:"danny-smart-power.firebasestorage.app",

    messagingSenderId:"649735645158",

    appId:"1:649735645158:web:cff518b89721a163679827",

    measurementId:"G-258YKLP5ZS"

};


if(!firebase.apps.length){

    firebase.initializeApp(firebaseConfig);

}


const auth = firebase.auth();

const db = firebase.firestore();


/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;

let notifications = [];

let unsubscribeFunctions = [];


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHTML(value){

    return String(value ?? "").replace(
        /[&<>"']/g,

        function(char){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        }

    );

}


/* =========================================================
   TIMESTAMP
========================================================= */

function timestampValue(timestamp){

    if(!timestamp){

        return 0;

    }


    if(typeof timestamp.toMillis === "function"){

        return timestamp.toMillis();

    }


    if(timestamp.seconds){

        return timestamp.seconds * 1000;

    }


    const date = new Date(timestamp);

    return isNaN(date.getTime())
        ? 0
        : date.getTime();

}


/* =========================================================
   DATE
========================================================= */

function formatDate(timestamp){

    const value =
        timestampValue(timestamp);


    if(!value){

        return "Just now";

    }


    return new Intl.DateTimeFormat(
        "en-NG",
        {
            dateStyle:"medium",
            timeStyle:"short"
        }
    ).format(
        new Date(value)
    );

}


/* =========================================================
   IS NOTIFICATION FOR CUSTOMER?
========================================================= */

function belongsToCustomer(notification){

    if(!currentUser){

        return false;

    }


    const target =
        String(
            notification.target || ""
        ).toLowerCase();


    /* Never display admin-only notifications */

    if(target === "admin"){

        return false;

    }


    /* Notifications sent to everybody */

    if(
        target === "all" ||
        target === "everyone" ||
        target === "customers"
    ){

        return true;

    }


    /* Direct notification */

    if(target === "user"){

        if(
            notification.recipientId ===
            currentUser.uid
        ){

            return true;

        }


        if(
            currentUser.email &&
            notification.recipientEmail ===
            currentUser.email
        ){

            return true;

        }


        return false;

    }


    /*
       Also support a notification that
       has a direct recipient without
       specifying target=user.
    */

    return (

        notification.recipientId ===
        currentUser.uid

    ) || (

        currentUser.email &&
        notification.recipientEmail ===
        currentUser.email

    );

}


/* =========================================================
   READ STATUS
========================================================= */

function isRead(notification){

    /*
       NEW SYSTEM:
       readBy contains customer UIDs.
    */

    if(
        Array.isArray(notification.readBy) &&
        currentUser
    ){

        return notification.readBy.includes(
            currentUser.uid
        );

    }


    /*
       Fallback.
    */

    return notification.read === true;

}


/* =========================================================
   SHOW LOGIN MESSAGE
========================================================= */

function showLoginMessage(){

    document.getElementById(
        "status"
    ).textContent =
        "You are not currently signed in.";


    document.getElementById(
        "notificationsList"
    ).innerHTML = `

        <div class="login-box">

            <div class="login-icon">
                🔐
            </div>

            <h2>
                Sign in to view your notifications
            </h2>

            <p>
                Your notifications are connected
                to your Danny Smart Power account.
            </p>

            <button
                class="login-btn"
                onclick="location.href='login.html'">

                Sign In

            </button>

        </div>

    `;


    document.getElementById(
        "markAllBtn"
    ).disabled = true;

}


/* =========================================================
   RENDER
========================================================= */

function renderNotifications(){

    const list =
        document.getElementById(
            "notificationsList"
        );


    const status =
        document.getElementById(
            "status"
        );


    if(!notifications.length){

        status.textContent =
            "You're all caught up.";


        list.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    🔔
                </div>

                <div>
                    No notifications yet.
                </div>

                <div>
                    New messages from Danny Smart Power
                    will appear here.
                </div>

            </div>

        `;

        return;

    }


    const unread =
        notifications.filter(
            function(item){

                return !isRead(item);

            }
        ).length;


    status.textContent =
        unread > 0

        ? unread +
          " unread notification" +
          (unread === 1 ? "" : "s")

        : "You're all caught up.";


    document.getElementById(
        "markAllBtn"
    ).disabled = unread === 0;


    list.innerHTML =
        notifications.map(
            function(notification){

                const unreadClass =
                    isRead(notification)
                    ? ""
                    : "unread";


                return `

                    <article
                        class="notification-card ${unreadClass}"
                        data-id="${escapeHTML(notification.id)}"
                    >

                        <div class="notification-icon">
                            ${escapeHTML(
                                notification.icon ||
                                "🔔"
                            )}
                        </div>


                        <div class="notification-content">

                            <div class="notification-title-row">

                                <div class="notification-title">
                                    ${escapeHTML(
                                        notification.title ||
                                        "Danny Smart Power"
                                    )}
                                </div>

                                <div class="notification-time">
                                    ${escapeHTML(
                                        formatDate(
                                            notification.createdAt
                                        )
                                    )}
                                </div>

                            </div>


                            <div class="notification-body">
                                ${escapeHTML(
                                    notification.body ||
                                    "You have a new notification."
                                )}
                            </div>


                            <span class="notification-type">
                                ${escapeHTML(
                                    notification.type ||
                                    "notification"
                                )}
                            </span>

                        </div>

                    </article>

                `;

            }
        ).join("");


    list
        .querySelectorAll(
            ".notification-card"
        )
        .forEach(
            function(card){

                card.addEventListener(
                    "click",
                    function(){

                        markAsRead(
                            card.dataset.id
                        );

                    }
                );

            }
        );

}


/* =========================================================
   COMBINE FIRESTORE RESULTS
========================================================= */

function combineResults(resultSets){

    const map =
        new Map();


    resultSets.forEach(
        function(rows){

            if(!rows){

                return;

            }


            rows.forEach(
                function(item){

                    if(
                        item &&
                        item.id &&
                        item.data &&
                        belongsToCustomer(
                            item.data
                        )
                    ){

                        map.set(
                            item.id,
                            {
                                id:item.id,
                                ...item.data
                            }
                        );

                    }

                }
            );

        }
    );


    notifications =
        Array.from(
            map.values()
        );


    notifications.sort(
        function(a,b){

            return (
                timestampValue(
                    b.createdAt
                ) -
                timestampValue(
                    a.createdAt
                )
            );

        }
    );


    renderNotifications();

}


/* =========================================================
   LOAD NOTIFICATIONS
========================================================= */

function startNotificationListeners(){

    /*
       Clear any previous listeners.
    */

    unsubscribeFunctions.forEach(
        function(unsubscribe){

            try{

                unsubscribe();

            }catch(error){}

        }
    );


    unsubscribeFunctions = [];


    const queries = [

        db
        .collection("notifications")
        .where(
            "target",
            "==",
            "all"
        ),

        db
        .collection("notifications")
        .where(
            "target",
            "==",
            "everyone"
        ),

        db
        .collection("notifications")
        .where(
            "target",
            "==",
            "customers"
        ),

        db
        .collection("notifications")
        .where(
            "recipientId",
            "==",
            currentUser.uid
        )

    ];


    if(currentUser.email){

        queries.push(

            db
            .collection("notifications")
            .where(
                "recipientEmail",
                "==",
                currentUser.email
            )

        );

    }


    const results =
        new Array(
            queries.length
        );


    queries.forEach(
        function(query,index){

            const unsubscribe =
                query.onSnapshot(

                    function(snapshot){

                        results[index] =
                            snapshot.docs.map(
                                function(doc){

                                    return {

                                        id:doc.id,

                                        data:doc.data()

                                    };

                                }
                            );


                        combineResults(
                            results
                        );

                    },

                    function(error){

                        console.error(
                            "Notification error:",
                            error
                        );


                        document.getElementById(
                            "status"
                        ).textContent =
                            "Could not load notifications.";


                        document.getElementById(
                            "notificationsList"
                        ).innerHTML = `

                            <div class="error-box">

                                We couldn't load your
                                notifications.

                                <br><br>

                                Please check your
                                internet connection
                                and refresh the page.

                            </div>

                        `;

                    }

                );


            unsubscribeFunctions.push(
                unsubscribe
            );

        }
    );

}


/* =========================================================
   MARK ONE AS READ
========================================================= */

async function markAsRead(notificationId){

    if(!currentUser){

        return;

    }


    const notification =
        notifications.find(
            function(item){

                return item.id ===
                    notificationId;

            }
        );


    if(!notification){

        return;

    }


    if(isRead(notification)){

        return;

    }


    try{

        await db
        .collection("notifications")
        .doc(notificationId)
        .update({

            readBy:
                firebase.firestore
                .FieldValue
                .arrayUnion(
                    currentUser.uid
                ),

            readAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp()

        });

    }catch(error){

        console.error(
            "Unable to mark notification:",
            error
        );

    }

}


/* =========================================================
   MARK ALL AS READ
========================================================= */

async function markAllAsRead(){

    if(!currentUser){

        return;

    }


    const unread =
        notifications.filter(
            function(item){

                return !isRead(item);

            }
        );


    if(!unread.length){

        return;

    }


    const button =
        document.getElementById(
            "markAllBtn"
        );


    button.disabled = true;

    button.textContent =
        "Updating...";


    try{

        let batch =
            db.batch();

        let count = 0;


        for(
            const notification of unread
        ){

            batch.update(

                db
                .collection("notifications")
                .doc(notification.id),

                {

                    readBy:
                        firebase.firestore
                        .FieldValue
                        .arrayUnion(
                            currentUser.uid
                        ),

                    readAt:
                        firebase.firestore
                        .FieldValue
                        .serverTimestamp()

                }

            );


            count++;


            if(count === 450){

                await batch.commit();

                batch =
                    db.batch();

                count = 0;

            }

        }


        if(count > 0){

            await batch.commit();

        }

    }catch(error){

        console.error(
            "Mark all error:",
            error
        );


        document.getElementById(
            "status"
        ).textContent =
            "Some notifications could not be marked as read.";

    }


    button.disabled = false;

    button.textContent =
        "✓ Mark all as read";

}


/* =========================================================
   BUTTON
========================================================= */

document
.getElementById("markAllBtn")
.addEventListener(
    "click",
    markAllAsRead
);


/* =========================================================
   AUTH
========================================================= */

/*
   IMPORTANT:

   There is NO automatic redirect here.

   Firebase first checks whether the customer
   already has a valid session.
*/

auth.onAuthStateChanged(
    function(user){

        if(user){

            currentUser = user;

            document.getElementById(
                "status"
            ).textContent =
                "Loading your notifications...";


            document.getElementById(
                "markAllBtn"
            ).disabled = false;


            startNotificationListeners();

        }else{

            currentUser = null;

            showLoginMessage();

        }

    }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications | Danny Smart Power</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Poppins,sans-serif;
    background:#0f172a;
    color:#fff;
    min-height:100vh;
}

header{
    height:70px;
    background:#020617;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid rgba(255,255,255,.08);
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    color:#38bdf8;
    font-size:20px;
    font-weight:700;
}

.header-actions{
    display:flex;
    gap:10px;
}

.header-btn{
    border:1px solid rgba(255,255,255,.12);
    background:#111827;
    color:#fff;
    text-decoration:none;
    padding:9px 13px;
    border-radius:10px;
    font-size:13px;
}

.header-btn:hover{
    background:#1e293b;
}

.container{
    width:min(900px,94%);
    margin:25px auto 50px;
}

.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.title-area h1{
    font-size:25px;
}

.title-area p{
    color:#94a3b8;
    font-size:13px;
    margin-top:4px;
}

.mark-btn{
    background:#38bdf8;
    color:#020617;
    border:0;
    padding:10px 15px;
    border-radius:10px;
    font-family:inherit;
    font-weight:600;
    cursor:pointer;
}

.mark-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.status{
    text-align:center;
    color:#94a3b8;
    padding:30px 10px;
    font-size:14px;
}

.notification-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.notification{
    background:#111827;
    border:1px solid rgba(255,255,255,.08);
    border-radius:15px;
    padding:16px;
    display:flex;
    gap:14px;
    position:relative;
    transition:.2s;
}

.notification.unread{
    border-color:rgba(56,189,248,.45);
    background:#111c2d;
}

.notification:hover{
    transform:translateY(-1px);
}

.icon{
    width:46px;
    height:46px;
    min-width:46px;
    border-radius:12px;
    background:#0b2535;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.content{
    flex:1;
    min-width:0;
}

.notification-title{
    font-size:15px;
    font-weight:600;
    margin-bottom:5px;
    padding-right:20px;
}

.notification-body{
    color:#cbd5e1;
    font-size:13px;
    line-height:1.6;
}

.date{
    color:#64748b;
    font-size:11px;
    margin-top:8px;
}

.unread-dot{
    width:9px;
    height:9px;
    background:#38bdf8;
    border-radius:50%;
    position:absolute;
    right:15px;
    top:18px;
}

.read-btn{
    margin-top:9px;
    background:transparent;
    border:0;
    color:#38bdf8;
    font-family:inherit;
    font-size:11px;
    cursor:pointer;
    padding:0;
}

.empty{
    text-align:center;
    background:#111827;
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:45px 20px;
}

.empty-icon{
    font-size:45px;
    margin-bottom:12px;
}

.empty h2{
    font-size:18px;
}

.empty p{
    color:#94a3b8;
    font-size:13px;
    margin-top:6px;
}

.error{
    text-align:center;
    background:#1e293b;
    border:1px solid rgba(239,68,68,.35);
    color:#fca5a5;
    border-radius:12px;
    padding:18px;
    font-size:13px;
}

.no-session{
    text-align:center;
    background:#111827;
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:40px 20px;
}

.no-session-icon{
    font-size:42px;
    margin-bottom:12px;
}

.no-session h2{
    font-size:18px;
    margin-bottom:7px;
}

.no-session p{
    color:#94a3b8;
    font-size:13px;
    line-height:1.6;
}

@media(max-width:600px){

    header{
        padding:0 14px;
    }

    .logo{
        font-size:17px;
    }

    .header-btn{
        padding:8px 10px;
        font-size:12px;
    }

    .top{
        align-items:flex-start;
    }

    .title-area h1{
        font-size:22px;
    }

    .mark-btn{
        font-size:11px;
        padding:9px 10px;
    }

    .notification{
        padding:14px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        Danny Smart Power
    </div>

    <div class="header-actions">
        <a href="home.html" class="header-btn">Home</a>
        <a href="profile.html" class="header-btn">Profile</a>
    </div>

</header>


<main class="container">

    <div class="top">

        <div class="title-area">
            <h1>Notifications</h1>
            <p id="status">Checking your account...</p>
        </div>

        <button
            id="markAllBtn"
            class="mark-btn"
            type="button"
            disabled
        >
            Mark all read
        </button>

    </div>


    <div id="notificationArea">

        <div class="status">
            Loading notifications...
        </div>

    </div>

</main>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {
    apiKey: "AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGB44",
    authDomain: "danny-smart-power.firebaseapp.com",
    databaseURL: "https://danny-smart-power-default-rtdb.firebaseio.com",
    projectId: "danny-smart-power",
    storageBucket: "danny-smart-power.firebasestorage.app",
    messagingSenderId: "649735645158",
    appId: "1:649735645158:web:cff518b89721a163679827",
    measurementId: "G-258YKLP5ZS"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let notifications = [];

const area = document.getElementById("notificationArea");
const statusText = document.getElementById("status");
const markAllBtn = document.getElementById("markAllBtn");


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(timestamp){

    if(!timestamp){
        return "Just now";
    }

    try{

        const date = timestamp.toDate
            ? timestamp.toDate()
            : new Date(timestamp);

        return date.toLocaleString("en-NG",{
            day:"numeric",
            month:"short",
            year:"numeric",
            hour:"numeric",
            minute:"2-digit"
        });

    }catch(error){

        return "Recently";

    }
}


/* =========================================================
   ICON
========================================================= */

function getIcon(notification){

    if(notification.icon){
        return notification.icon;
    }

    switch(notification.type){

        case "order":
            return "📦";

        case "payment":
            return "💳";

        case "service":
            return "🔧";

        case "chat":
            return "💬";

        case "promotion":
            return "🎁";

        case "system":
            return "🔔";

        default:
            return "🔔";
    }
}


/* =========================================================
   READ CHECK
========================================================= */

function isRead(notification){

    if(
        Array.isArray(notification.readBy) &&
        currentUser &&
        notification.readBy.includes(currentUser.uid)
    ){
        return true;
    }

    return notification.read === true;
}


/* =========================================================
   LOAD NOTIFICATIONS
========================================================= */

async function loadNotifications(){

    if(!currentUser){
        return;
    }

    statusText.textContent = "Loading your notifications...";

    area.innerHTML = `
        <div class="status">
            Loading notifications...
        </div>
    `;

    try{

        const uid = currentUser.uid;
        const email = (currentUser.email || "").toLowerCase();

        /*
         IMPORTANT:

         We use the SAME Firebase Auth user that logged
         into the website.

         No second login.
        */

        const results = [];

        /* USER UID NOTIFICATIONS */

        const uidSnapshot = await db
            .collection("notifications")
            .where("recipientId","==",uid)
            .get();

        uidSnapshot.forEach(doc => {

            results.push({
                id:doc.id,
                ...doc.data()
            });

        });


        /* EMAIL NOTIFICATIONS */

        if(email){

            const emailSnapshot = await db
                .collection("notifications")
                .where("recipientEmail","==",email)
                .get();

            emailSnapshot.forEach(doc => {

                if(!results.some(item => item.id === doc.id)){

                    results.push({
                        id:doc.id,
                        ...doc.data()
                    });

                }

            });

        }


        /* ALL CUSTOMER NOTIFICATIONS */

        const targets = [
            "all",
            "everyone",
            "customers"
        ];

        for(const target of targets){

            const targetSnapshot = await db
                .collection("notifications")
                .where("target","==",target)
                .get();

            targetSnapshot.forEach(doc => {

                if(!results.some(item => item.id === doc.id)){

                    results.push({
                        id:doc.id,
                        ...doc.data()
                    });

                }

            });

        }


        /*
         Never show admin-only notifications
         to customers.
        */

        notifications = results.filter(item => {

            return item.target !== "admin";

        });


        /*
         Sort newest first.
        */

        notifications.sort((a,b) => {

            const aTime =
                a.createdAt && a.createdAt.toMillis
                    ? a.createdAt.toMillis()
                    : 0;

            const bTime =
                b.createdAt && b.createdAt.toMillis
                    ? b.createdAt.toMillis()
                    : 0;

            return bTime - aTime;

        });


        statusText.textContent =
            notifications.length
                ? `${notifications.length} notification${notifications.length === 1 ? "" : "s"}`
                : "You're all caught up";


        markAllBtn.disabled =
            !notifications.some(item => !isRead(item));


        renderNotifications();


    }catch(error){

        console.error("Notification error:",error);

        statusText.textContent = "Unable to load notifications.";

        area.innerHTML = `
            <div class="error">
                We couldn't load your notifications right now.
                Please try again.
            </div>
        `;

    }

}


/* =========================================================
   RENDER
========================================================= */

function renderNotifications(){

    if(!notifications.length){

        area.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    🔔
                </div>

                <h2>No notifications yet</h2>

                <p>
                    New updates from Danny Smart Power
                    will appear here.
                </p>

            </div>
        `;

        return;
    }


    area.innerHTML = `

        <div class="notification-list">

            ${notifications.map(notification => {

                const read = isRead(notification);

                return `

                    <div
                        class="notification ${read ? "" : "unread"}"
                        data-id="${notification.id}"
                    >

                        ${
                            read
                            ? ""
                            : `<div class="unread-dot"></div>`
                        }


                        <div class="icon">
                            ${getIcon(notification)}
                        </div>


                        <div class="content">

                            <div class="notification-title">
                                ${escapeHTML(notification.title || "Danny Smart Power")}
                            </div>


                            <div class="notification-body">
                                ${escapeHTML(notification.body || "")}
                            </div>


                            <div class="date">
                                ${formatDate(notification.createdAt)}
                            </div>


                            ${
                                read
                                ? ""
                                : `
                                    <button
                                        class="read-btn"
                                        type="button"
                                        onclick="markAsRead('${notification.id}')"
                                    >
                                        Mark as read
                                    </button>
                                `
                            }

                        </div>

                    </div>

                `;

            }).join("")}

        </div>

    `;

}


/* =========================================================
   MARK ONE READ
========================================================= */

async function markAsRead(id){

    if(!currentUser){
        return;
    }

    try{

        await db
            .collection("notifications")
            .doc(id)
            .update({

                readBy:
                    firebase.firestore.FieldValue.arrayUnion(
                        currentUser.uid
                    ),

                readAt:
                    firebase.firestore.FieldValue.serverTimestamp()

            });


        const item = notifications.find(
            notification => notification.id === id
        );

        if(item){

            item.read = true;

            item.readBy = Array.isArray(item.readBy)
                ? item.readBy
                : [];

            if(!item.readBy.includes(currentUser.uid)){
                item.readBy.push(currentUser.uid);
            }

        }


        renderNotifications();

        markAllBtn.disabled =
            !notifications.some(item => !isRead(item));


    }catch(error){

        console.error("Mark read error:",error);

    }

}


/* =========================================================
   MARK ALL READ
========================================================= */

markAllBtn.addEventListener("click", async function(){

    if(!currentUser){
        return;
    }

    const unread = notifications.filter(
        notification => !isRead(notification)
    );

    if(!unread.length){
        return;
    }

    markAllBtn.disabled = true;

    try{

        /*
         Firestore batch keeps this clean and fast.
        */

        const batch = db.batch();

        unread.forEach(notification => {

            const ref = db
                .collection("notifications")
                .doc(notification.id);

            batch.update(ref,{

                readBy:
                    firebase.firestore.FieldValue.arrayUnion(
                        currentUser.uid
                    ),

                readAt:
                    firebase.firestore.FieldValue.serverTimestamp()

            });

        });

        await batch.commit();


        notifications.forEach(notification => {

            notification.read = true;

            notification.readBy =
                Array.isArray(notification.readBy)
                    ? notification.readBy
                    : [];

            if(!notification.readBy.includes(currentUser.uid)){

                notification.readBy.push(
                    currentUser.uid
                );

            }

        });


        statusText.textContent = "You're all caught up";

        renderNotifications();

        markAllBtn.disabled = true;


    }catch(error){

        console.error("Mark all error:",error);

        markAllBtn.disabled = false;

    }

});


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    const div = document.createElement("div");

    div.textContent = value == null
        ? ""
        : String(value);

    return div.innerHTML;

}


/* =========================================================
   FIREBASE AUTH SESSION
========================================================= */

/*
   THIS IS THE IMPORTANT PART.

   Firebase automatically remembers the user who already
   logged into Danny Smart Power.

   We do NOT create another login.
   We do NOT redirect to login.html.
*/

auth.onAuthStateChanged(function(user){

    if(user){

        currentUser = user;

        console.log(
            "Notification session:",
            user.uid,
            user.email
        );

        loadNotifications();

    }else{

        currentUser = null;

        statusText.textContent =
            "Your account session is not available.";

        area.innerHTML = `
            <div class="no-session">

                <div class="no-session-icon">
                    🔐
                </div>

                <h2>Account session unavailable</h2>

                <p>
                    Danny Smart Power could not access
                    your existing account session on this page.
                    Please return to the Home page and open
                    Notifications again.
                </p>

            </div>
        `;

        markAllBtn.disabled = true;

    }

});

</script>

</body>
</html>

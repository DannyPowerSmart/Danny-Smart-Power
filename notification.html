<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications — Danny Smart Power</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Poppins,sans-serif;
    background:#0f172a;
    color:#f8fafc;
    min-height:100vh;
}

button{
    font-family:inherit;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    height:70px;
    background:#020617;
    border-bottom:1px solid rgba(148,163,184,.12);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:18px;
    font-weight:700;
}

.logo{
    width:38px;
    height:38px;
    border-radius:12px;
    background:#38bdf8;
    color:#020617;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:19px;
    box-shadow:0 0 20px rgba(56,189,248,.2);
}

.headerRight{
    display:flex;
    align-items:center;
    gap:10px;
}

.iconBtn{
    position:relative;
    width:42px;
    height:42px;
    border:1px solid rgba(148,163,184,.16);
    border-radius:12px;
    background:#0f172a;
    color:#f8fafc;
    cursor:pointer;
    font-size:19px;
}

.iconBtn:hover{
    border-color:#38bdf8;
}

.badge{
    position:absolute;
    top:-5px;
    right:-5px;
    min-width:19px;
    height:19px;
    padding:0 5px;
    border-radius:50px;
    background:#ef4444;
    color:white;
    font-size:10px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid #020617;
}

.hidden{
    display:none!important;
}

.backBtn{
    background:transparent;
    border:0;
    color:#94a3b8;
    font-size:20px;
    cursor:pointer;
    margin-right:4px;
}

.backBtn:hover{
    color:#38bdf8;
}

.container{
    width:100%;
    max-width:850px;
    margin:0 auto;
    padding:24px 16px 50px;
}

.pageTitle{
    margin-bottom:20px;
}

.pageTitle h1{
    font-size:25px;
    margin-bottom:5px;
}

.pageTitle p{
    color:#94a3b8;
    font-size:13px;
}

.actions{
    display:flex;
    gap:10px;
    margin-bottom:18px;
}

.actionBtn{
    border:1px solid rgba(148,163,184,.15);
    background:#111c32;
    color:#cbd5e1;
    border-radius:10px;
    padding:9px 13px;
    cursor:pointer;
    font-size:12px;
}

.actionBtn:hover{
    border-color:#38bdf8;
    color:#38bdf8;
}

.notificationList{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.notification{
    position:relative;
    background:#111c32;
    border:1px solid rgba(148,163,184,.12);
    border-radius:17px;
    padding:15px;
    display:flex;
    gap:13px;
    cursor:pointer;
    transition:.2s;
}

.notification:hover{
    transform:translateY(-1px);
    border-color:rgba(56,189,248,.4);
}

.notification.unread{
    border-color:rgba(56,189,248,.4);
    background:#12213a;
}

.notificationIcon{
    width:45px;
    height:45px;
    flex-shrink:0;
    border-radius:13px;
    background:#0f172a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.notificationBody{
    flex:1;
    min-width:0;
}

.notificationTop{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
}

.notificationTitle{
    font-weight:700;
    font-size:14px;
    color:#f8fafc;
}

.notificationTime{
    color:#64748b;
    font-size:10px;
    white-space:nowrap;
}

.notificationMessage{
    margin-top:5px;
    color:#cbd5e1;
    font-size:12px;
    line-height:1.65;
    white-space:pre-wrap;
    word-break:break-word;
}

.unreadDot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#38bdf8;
    margin-top:7px;
    flex-shrink:0;
}

.readLabel{
    margin-top:7px;
    color:#64748b;
    font-size:9px;
}

.empty{
    padding:50px 20px;
    text-align:center;
    background:#111c32;
    border:1px solid rgba(148,163,184,.12);
    border-radius:17px;
    color:#64748b;
}

.emptyIcon{
    font-size:38px;
    margin-bottom:10px;
}

.loading{
    text-align:center;
    padding:50px;
    color:#64748b;
    font-size:13px;
}

.error{
    background:#3f1515;
    border:1px solid #7f1d1d;
    color:#fecaca;
    padding:14px;
    border-radius:12px;
    font-size:12px;
    display:none;
    margin-bottom:15px;
}

/* DETAIL MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(2,6,23,.82);
    backdrop-filter:blur(7px);
    display:none;
    align-items:flex-end;
    justify-content:center;
}

.modal.show{
    display:flex;
}

.modalBox{
    width:100%;
    max-width:650px;
    max-height:90vh;
    overflow-y:auto;
    background:#0f172a;
    border:1px solid rgba(148,163,184,.15);
    border-radius:24px 24px 0 0;
    padding:20px;
}

.modalHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.modalHeader h2{
    font-size:18px;
}

.closeBtn{
    width:36px;
    height:36px;
    border:0;
    border-radius:10px;
    background:#1e293b;
    color:#f8fafc;
    cursor:pointer;
    font-size:18px;
}

.detailIcon{
    width:58px;
    height:58px;
    border-radius:17px;
    background:#111c32;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    margin-bottom:14px;
}

.detailTitle{
    font-size:20px;
    font-weight:700;
    margin-bottom:7px;
}

.detailDate{
    color:#64748b;
    font-size:11px;
    margin-bottom:18px;
}

.detailMessage{
    background:#111c32;
    border:1px solid rgba(148,163,184,.12);
    border-radius:15px;
    padding:15px;
    color:#cbd5e1;
    line-height:1.8;
    font-size:13px;
    white-space:pre-wrap;
    word-break:break-word;
}

.detailButtons{
    display:flex;
    gap:10px;
    margin-top:16px;
}

.primaryBtn{
    flex:1;
    border:0;
    border-radius:12px;
    padding:12px;
    background:#38bdf8;
    color:#020617;
    font-weight:700;
    cursor:pointer;
}

.secondaryBtn{
    flex:1;
    border:1px solid rgba(148,163,184,.15);
    border-radius:12px;
    padding:12px;
    background:#111c32;
    color:#cbd5e1;
    font-weight:600;
    cursor:pointer;
}

.primaryBtn:hover{
    opacity:.9;
}

.secondaryBtn:hover{
    border-color:#38bdf8;
}

/* DESKTOP */

@media(min-width:700px){
    .modal{
        align-items:center;
        padding:20px;
    }

    .modalBox{
        border-radius:22px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="brand">
        <button class="backBtn" id="backBtn">‹</button>

        <div class="logo">⚡</div>

        <div>
            <div>Danny Smart Power</div>
        </div>
    </div>

    <div class="headerRight">

        <button class="iconBtn" id="refreshBtn" title="Refresh">
            ↻
        </button>

        <button class="iconBtn" title="Notifications">
            🔔
            <span id="headerBadge" class="badge hidden">0</span>
        </button>

    </div>

</header>


<main class="container">

    <div class="pageTitle">
        <h1>Notifications</h1>
        <p>Messages, order updates, service updates and announcements.</p>
    </div>

    <div id="errorBox" class="error"></div>

    <div class="actions">
        <button class="actionBtn" id="markAllBtn">
            ✓ Mark all as read
        </button>

        <button class="actionBtn" id="refreshListBtn">
            ↻ Refresh
        </button>
    </div>

    <div id="notificationList" class="notificationList">
        <div class="loading">
            Loading notifications...
        </div>
    </div>

</main>


<!-- DETAIL MODAL -->

<div id="modal" class="modal">

    <div class="modalBox">

        <div class="modalHeader">

            <h2>Notification</h2>

            <button class="closeBtn" id="closeModal">
                ×
            </button>

        </div>

        <div id="detailIcon" class="detailIcon">🔔</div>

        <div id="detailTitle" class="detailTitle">
            Notification
        </div>

        <div id="detailDate" class="detailDate">
            —
        </div>

        <div id="detailMessage" class="detailMessage">
            —
        </div>

        <div class="detailButtons">

            <button
                id="chatBtn"
                class="primaryBtn"
                style="display:none;"
            >
                💬 Open Chat
            </button>

            <button
                id="doneBtn"
                class="secondaryBtn"
            >
                Done
            </button>

        </div>

    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
    apiKey: "AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGb44",
    authDomain: "danny-smart-power.firebaseapp.com",
    databaseURL: "https://danny-smart-power-default-rtdb.firebaseio.com",
    projectId: "danny-smart-power",
    storageBucket: "danny-smart-power.firebasestorage.app",
    messagingSenderId: "649735645158",
    appId: "1:649735645158:web:cff518b89721a163679827",
    measurementId: "G-258YKLP5ZS"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let notifications = [];
let unsubscribeNotifications = null;


/* =========================================================
   HELPERS
========================================================= */

function $(id){
    return document.getElementById(id);
}

function escapeHTML(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function getDate(value){

    if(!value){
        return "Just now";
    }

    try{

        let date;

        if(value.toDate){
            date = value.toDate();
        }else{
            date = new Date(value);
        }

        if(isNaN(date.getTime())){
            return "Just now";
        }

        return date.toLocaleString([],{
            day:"numeric",
            month:"short",
            year:"numeric",
            hour:"numeric",
            minute:"2-digit"
        });

    }catch(error){
        return "Just now";
    }
}

function getTimestamp(value){

    if(!value){
        return 0;
    }

    try{

        if(value.toMillis){
            return value.toMillis();
        }

        if(value.seconds){
            return value.seconds * 1000;
        }

        const date = new Date(value);

        if(!isNaN(date.getTime())){
            return date.getTime();
        }

    }catch(error){}

    return 0;
}


/* =========================================================
   AUTH
========================================================= */

auth.onAuthStateChanged(async user=>{

    if(!user){

        currentUser = null;

        window.location.href = "login.html";

        return;
    }

    currentUser = user;

    await loadNotifications();

    listenNotifications();

});


/* =========================================================
   LOAD NOTIFICATIONS
========================================================= */

async function loadNotifications(){

    if(!currentUser){
        return;
    }

    try{

        const snapshot = await db
            .collection("notifications")
            .orderBy("createdAt","desc")
            .limit(100)
            .get();

        notifications = snapshot.docs
            .map(doc=>({
                id:doc.id,
                ...doc.data()
            }))
            .filter(notification=>{

                /*
                   CUSTOMER SHOULD SEE:

                   1. target = all
                   2. target = user AND recipientId = current UID
                   3. Old notifications with no target that were
                      intentionally created for the customer.
                */

                if(notification.target === "all"){
                    return true;
                }

                if(
                    notification.target === "user" &&
                    notification.recipientId === currentUser.uid
                ){
                    return true;
                }

                /*
                   Keep old notification format compatible.
                   We only accept old notifications if they have
                   a recipientId matching this user.
                */

                if(
                    !notification.target &&
                    notification.recipientId === currentUser.uid
                ){
                    return true;
                }

                return false;

            });

        renderNotifications();

    }catch(error){

        console.error("Notification loading error:",error);

        notifications = [];

        showError(
            "Unable to load notifications. Please check your internet connection."
        );

        renderNotifications();

    }

}


/* =========================================================
   REALTIME NOTIFICATIONS
========================================================= */

function listenNotifications(){

    if(unsubscribeNotifications){
        unsubscribeNotifications();
    }

    if(!currentUser){
        return;
    }

    unsubscribeNotifications = db
        .collection("notifications")
        .orderBy("createdAt","desc")
        .limit(100)
        .onSnapshot(snapshot=>{

            notifications = snapshot.docs
                .map(doc=>({
                    id:doc.id,
                    ...doc.data()
                }))
                .filter(notification=>{

                    if(notification.target === "all"){
                        return true;
                    }

                    if(
                        notification.target === "user" &&
                        notification.recipientId === currentUser.uid
                    ){
                        return true;
                    }

                    if(
                        !notification.target &&
                        notification.recipientId === currentUser.uid
                    ){
                        return true;
                    }

                    return false;

                });

            renderNotifications();

        },error=>{

            console.error("Realtime notification error:",error);

        });

}


/* =========================================================
   CHECK READ STATUS
========================================================= */

function isRead(notification){

    /*
       New customer notification system:
       readBy = [uid1,uid2,...]
    */

    if(
        Array.isArray(notification.readBy) &&
        currentUser
    ){
        return notification.readBy.includes(currentUser.uid);
    }

    /*
       Older notification system:
       read = true/false
    */

    if(notification.read === true){
        return true;
    }

    return false;
}


/* =========================================================
   RENDER
========================================================= */

function renderNotifications(){

    const list = $("notificationList");

    if(!list){
        return;
    }

    const unreadCount = notifications.filter(
        notification=>!isRead(notification)
    ).length;

    updateBadge(unreadCount);

    if(!notifications.length){

        list.innerHTML = `
            <div class="empty">
                <div class="emptyIcon">🔔</div>
                <div>No notifications yet.</div>
            </div>
        `;

        return;
    }

    /*
       Newest first.
    */

    notifications.sort(
        (a,b)=>
            getTimestamp(b.createdAt) -
            getTimestamp(a.createdAt)
    );

    list.innerHTML = notifications.map(notification=>{

        const unread = !isRead(notification);

        const icon =
            notification.icon ||
            getNotificationIcon(notification);

        return `
            <div
                class="notification ${unread ? "unread" : ""}"
                data-id="${escapeHTML(notification.id)}"
            >

                <div class="notificationIcon">
                    ${escapeHTML(icon)}
                </div>

                <div class="notificationBody">

                    <div class="notificationTop">

                        <div class="notificationTitle">
                            ${escapeHTML(
                                notification.title ||
                                "Notification"
                            )}
                        </div>

                        <div class="notificationTime">
                            ${escapeHTML(
                                getDate(notification.createdAt)
                            )}
                        </div>

                    </div>

                    <div class="notificationMessage">
                        ${escapeHTML(
                            notification.message || ""
                        )}
                    </div>

                    ${
                        unread
                        ?
                        `<div class="unreadDot"></div>`
                        :
                        `<div class="readLabel">Read</div>`
                    }

                </div>

            </div>
        `;

    }).join("");

    document.querySelectorAll(".notification").forEach(item=>{

        item.addEventListener("click",()=>{

            const id = item.dataset.id;

            openNotification(id);

        });

    });

}


/* =========================================================
   ICONS
========================================================= */

function getNotificationIcon(notification){

    const source = String(
        notification.source ||
        notification.type ||
        notification.title ||
        ""
    ).toLowerCase();

    if(
        source.includes("chat") ||
        source.includes("message") ||
        source.includes("reply")
    ){
        return "💬";
    }

    if(
        source.includes("order") ||
        source.includes("payment")
    ){
        return "🛒";
    }

    if(
        source.includes("service") ||
        source.includes("electrical")
    ){
        return "🔧";
    }

    if(
        source.includes("project")
    ){
        return "⚡";
    }

    return "🔔";
}


/* =========================================================
   BADGE
========================================================= */

function updateBadge(count){

    const badge = $("headerBadge");

    if(!badge){
        return;
    }

    if(count <= 0){

        badge.textContent = "0";

        badge.classList.add("hidden");

    }else{

        badge.textContent =
            count > 99
            ? "99+"
            : count;

        badge.classList.remove("hidden");

    }

}


/* =========================================================
   OPEN NOTIFICATION
========================================================= */

async function openNotification(id){

    const notification =
        notifications.find(item=>item.id === id);

    if(!notification){
        return;
    }

    $("detailIcon").textContent =
        notification.icon ||
        getNotificationIcon(notification);

    $("detailTitle").textContent =
        notification.title ||
        "Notification";

    $("detailDate").textContent =
        getDate(notification.createdAt);

    $("detailMessage").textContent =
        notification.message ||
        "";

    /*
       Show Open Chat if notification contains chatId.
    */

    const chatBtn = $("chatBtn");

    if(notification.chatId){

        chatBtn.style.display = "block";

        chatBtn.onclick = ()=>{

            window.location.href =
                "chat.html?chatId=" +
                encodeURIComponent(notification.chatId);

        };

    }else{

        chatBtn.style.display = "none";

    }

    $("modal").classList.add("show");

    /*
       Mark this notification as read.
    */

    await markNotificationRead(notification);

}


/* =========================================================
   MARK ONE READ
========================================================= */

async function markNotificationRead(notification){

    if(!currentUser){
        return;
    }

    if(isRead(notification)){
        return;
    }

    try{

        /*
           NEW SYSTEM
           readBy array for customer.
        */

        if(
            notification.target === "all" ||
            notification.target === "user"
        ){

            const oldReadBy =
                Array.isArray(notification.readBy)
                ? notification.readBy
                : [];

            if(!oldReadBy.includes(currentUser.uid)){

                await db
                    .collection("notifications")
                    .doc(notification.id)
                    .update({

                        readBy:
                            firebase.firestore.FieldValue
                                .arrayUnion(currentUser.uid)

                    });

            }

            return;
        }

        /*
           OLD SYSTEM
        */

        await db
            .collection("notifications")
            .doc(notification.id)
            .update({
                read:true
            });

    }catch(error){

        console.warn(
            "Could not mark notification read:",
            error.message
        );

    }

}


/* =========================================================
   MARK ALL READ
========================================================= */

async function markAllRead(){

    if(!currentUser){
        return;
    }

    const unread =
        notifications.filter(
            notification=>!isRead(notification)
        );

    if(!unread.length){
        return;
    }

    try{

        const batch = db.batch();

        unread.forEach(notification=>{

            const ref =
                db
                .collection("notifications")
                .doc(notification.id);

            /*
               New notification system.
            */

            if(
                notification.target === "all" ||
                notification.target === "user"
            ){

                batch.update(ref,{

                    readBy:
                        firebase.firestore.FieldValue
                            .arrayUnion(currentUser.uid)

                });

            }else{

                /*
                   Old system.
                */

                batch.update(ref,{
                    read:true
                });

            }

        });

        await batch.commit();

        await loadNotifications();

    }catch(error){

        console.error(
            "Mark all read error:",
            error
        );

        showError(
            "Some notifications could not be marked as read."
        );

    }

}


/* =========================================================
   CLOSE MODAL
========================================================= */

$("closeModal").addEventListener("click",()=>{

    $("modal").classList.remove("show");

});

$("doneBtn").addEventListener("click",()=>{

    $("modal").classList.remove("show");

});

$("modal").addEventListener("click",event=>{

    if(event.target === $("modal")){

        $("modal").classList.remove("show");

    }

});


/* =========================================================
   BUTTONS
========================================================= */

$("markAllBtn").addEventListener(
    "click",
    markAllRead
);

$("refreshBtn").addEventListener(
    "click",
    loadNotifications
);

$("refreshListBtn").addEventListener(
    "click",
    loadNotifications
);

$("backBtn").addEventListener("click",()=>{

    if(history.length > 1){

        history.back();

    }else{

        window.location.href = "index.html";

    }

});


/* =========================================================
   ERROR
========================================================= */

function showError(message){

    const box = $("errorBox");

    if(!box){
        return;
    }

    box.textContent = message;

    box.style.display = "block";

    setTimeout(()=>{

        box.style.display = "none";

    },5000);

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener("beforeunload",()=>{

    if(unsubscribeNotifications){

        unsubscribeNotifications();

    }

});

</script>

</body>
</html>

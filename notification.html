<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications | Danny Smart Power</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#0f172a;
    color:#e5e7eb;
    min-height:100vh;
}

/* ================= HEADER ================= */

header{
    height:70px;
    background:#020617;
    border-bottom:1px solid rgba(255,255,255,.08);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    color:#fff;
    font-size:18px;
    font-weight:700;
}

.logo span{
    color:#38bdf8;
}

.header-actions{
    display:flex;
    gap:9px;
}

.header-btn{
    border:1px solid rgba(255,255,255,.10);
    background:#111827;
    color:#e5e7eb;

    border-radius:10px;

    padding:9px 12px;

    font-family:'Poppins',sans-serif;
    font-size:12px;
    font-weight:600;

    cursor:pointer;

    transition:.2s;
}

.header-btn:hover{
    border-color:#38bdf8;
    color:#38bdf8;
}

/* ================= MAIN ================= */

main{
    width:100%;
    max-width:850px;

    margin:auto;

    padding:28px 16px 60px;
}

/* ================= TOP ================= */

.page-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    gap:20px;

    margin-bottom:20px;
}

.page-title{
    color:#fff;
    font-size:25px;
    font-weight:700;
}

.page-subtitle{
    color:#94a3b8;
    font-size:13px;

    margin-top:5px;

    line-height:1.6;
}

.mark-all-btn{
    border:none;

    background:#38bdf8;
    color:#02111d;

    border-radius:10px;

    padding:10px 14px;

    font-family:'Poppins',sans-serif;
    font-size:12px;
    font-weight:700;

    cursor:pointer;

    white-space:nowrap;

    transition:.2s;
}

.mark-all-btn:hover{
    transform:translateY(-1px);
}

.mark-all-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* ================= STATUS ================= */

.status{
    color:#94a3b8;
    font-size:12px;

    margin-bottom:12px;
}

/* ================= NOTIFICATION LIST ================= */

.notifications-list{
    display:flex;
    flex-direction:column;

    gap:11px;
}

/* ================= CARD ================= */

.notification-card{
    width:100%;

    display:flex;

    gap:13px;

    padding:15px;

    background:#111827;

    border:1px solid rgba(255,255,255,.08);

    border-radius:15px;

    cursor:pointer;

    transition:.2s;
}

.notification-card:hover{
    border-color:rgba(56,189,248,.45);
    transform:translateY(-1px);
}

/* UNREAD */

.notification-card.unread{
    border-left:3px solid #38bdf8;

    background:#132033;
}

/* ================= ICON ================= */

.notification-icon{
    width:44px;
    height:44px;

    min-width:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:#172033;

    font-size:21px;
}

/* ================= CONTENT ================= */

.notification-content{
    min-width:0;
    flex:1;
}

.notification-title-row{
    display:flex;

    justify-content:space-between;

    gap:12px;
}

.notification-title{
    color:#fff;

    font-size:14px;
    font-weight:600;

    line-height:1.4;
}

.notification-time{
    color:#64748b;

    font-size:10px;

    white-space:nowrap;
}

.notification-body{
    color:#cbd5e1;

    font-size:12px;

    line-height:1.65;

    margin-top:5px;

    white-space:pre-wrap;
}

.notification-type{
    display:inline-block;

    margin-top:8px;

    padding:3px 8px;

    border-radius:20px;

    background:rgba(56,189,248,.10);

    color:#38bdf8;

    font-size:9px;

    font-weight:600;

    text-transform:capitalize;
}

/* ================= EMPTY ================= */

.empty-state{
    background:#111827;

    border:1px dashed rgba(255,255,255,.12);

    border-radius:15px;

    padding:45px 20px;

    text-align:center;

    color:#94a3b8;

    font-size:13px;

    line-height:1.7;
}

.empty-icon{
    font-size:32px;
    margin-bottom:10px;
}

/* ================= LOADING ================= */

.loading{
    width:24px;
    height:24px;

    border:2px solid #334155;
    border-top-color:#38bdf8;

    border-radius:50%;

    animation:spin .8s linear infinite;

    margin:30px auto;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

/* ================= ERROR ================= */

.error-box{
    background:#1f1720;

    border:1px solid rgba(248,113,113,.25);

    color:#fca5a5;

    border-radius:12px;

    padding:15px;

    font-size:12px;

    line-height:1.6;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    header{
        height:62px;
        padding:0 12px;
    }

    .logo{
        font-size:15px;
    }

    .header-btn{
        padding:8px 9px;
        font-size:11px;
    }

    main{
        padding:22px 12px 45px;
    }

    .page-top{
        flex-direction:column;
        gap:13px;
    }

    .page-title{
        font-size:22px;
    }

    .mark-all-btn{
        width:100%;
    }

    .notification-card{
        padding:13px;
    }

    .notification-title-row{
        display:block;
    }

    .notification-time{
        display:block;
        margin-top:3px;
    }

}

</style>
</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        Danny <span>Smart Power</span>
    </div>

    <div class="header-actions">

        <button
            class="header-btn"
            type="button"
            onclick="location.href='home.html'">
            Home
        </button>

        <button
            class="header-btn"
            type="button"
            onclick="location.href='profile.html'">
            Profile
        </button>

    </div>

</header>



<!-- ================= MAIN ================= -->

<main>

    <div class="page-top">

        <div>

            <h1 class="page-title">
                Notifications
            </h1>

            <p class="page-subtitle">
                Stay updated with your orders, services and important messages from Danny Smart Power.
            </p>

        </div>


        <button
            class="mark-all-btn"
            id="markAllBtn"
            type="button">

            ✓ Mark all as read

        </button>

    </div>


    <div
        class="status"
        id="status">

        Checking your notifications...

    </div>


    <div
        class="notifications-list"
        id="notificationsList">

        <div class="loading"></div>

    </div>

</main>



<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>



<script>

/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:"AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGB44",

    authDomain:"danny-smart-power.firebaseapp.com",

    projectId:"danny-smart-power",

    storageBucket:"danny-smart-power.firebasestorage.app",

    messagingSenderId:"649735645158",

    appId:"1:649735645158:web:cff518b89721a163679827",

    measurementId:"G-258YKLP5ZS"

};


firebase.initializeApp(firebaseConfig);


const auth = firebase.auth();

const db = firebase.firestore();



/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;

let allNotifications = [];

let notificationListeners = [];



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "").replace(
        /[&<>"']/g,

        function(character){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[character];

        }
    );

}



/* =========================================================
   GET TIMESTAMP VALUE
========================================================= */

function getDateValue(timestamp){

    if(!timestamp){

        return 0;

    }


    if(typeof timestamp.toMillis === "function"){

        return timestamp.toMillis();

    }


    if(timestamp.seconds){

        return timestamp.seconds * 1000;

    }


    const date = new Date(timestamp);

    if(isNaN(date.getTime())){

        return 0;

    }


    return date.getTime();

}



/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(timestamp){

    const milliseconds = getDateValue(timestamp);


    if(!milliseconds){

        return "Just now";

    }


    return new Intl.DateTimeFormat(
        "en-NG",
        {
            dateStyle:"medium",
            timeStyle:"short"
        }
    ).format(
        new Date(milliseconds)
    );

}



/* =========================================================
   CHECK IF NOTIFICATION BELONGS TO CUSTOMER
========================================================= */

function isForCurrentUser(notification){

    if(!currentUser){

        return false;

    }


    const target =
        String(notification.target || "").toLowerCase();


    /* Never show admin-only notifications */

    if(target === "admin"){

        return false;

    }


    /* Notifications for everybody */

    if(
        target === "all" ||
        target === "everyone" ||
        target === "customers"
    ){

        return true;

    }


    /* Notification for one specific customer */

    if(target === "user"){

        return (

            notification.recipientId === currentUser.uid

        ) || (

            currentUser.email &&
            notification.recipientEmail === currentUser.email

        );

    }


    /*
       Fallback for a notification that has a
       matching customer ID or email.
    */

    return (

        notification.recipientId === currentUser.uid

    ) || (

        currentUser.email &&
        notification.recipientEmail === currentUser.email

    );

}



/* =========================================================
   CHECK READ STATUS
========================================================= */

function isNotificationRead(notification){

    /*
       New system uses readBy.

       This is important because a notification
       sent to "all" customers cannot use one
       global read=true value.
    */

    if(
        Array.isArray(notification.readBy) &&
        currentUser
    ){

        return notification.readBy.includes(
            currentUser.uid
        );

    }


    /*
       Fallback for old/simple documents.
       This does NOT use the old notification
       message system.
    */

    return notification.read === true;

}



/* =========================================================
   MERGE NOTIFICATIONS
========================================================= */

function mergeNotifications(rows){

    const notificationMap = new Map();


    rows.forEach(function(item){

        if(
            item &&
            item.id &&
            item.data &&
            isForCurrentUser(item.data)
        ){

            notificationMap.set(
                item.id,
                {
                    id:item.id,
                    ...item.data
                }
            );

        }

    });


    allNotifications =
        Array.from(
            notificationMap.values()
        );


    /*
       Sort on the client.

       This avoids requiring a Firestore
       composite index.
    */

    allNotifications.sort(function(a,b){

        return (
            getDateValue(b.createdAt) -
            getDateValue(a.createdAt)
        );

    });


    renderNotifications();

}



/* =========================================================
   RENDER NOTIFICATIONS
========================================================= */

function renderNotifications(){

    const list =
        document.getElementById(
            "notificationsList"
        );


    const status =
        document.getElementById(
            "status"
        );


    if(!allNotifications.length){

        status.textContent =
            "You're all caught up.";


        list.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    🔔
                </div>

                <div>
                    No notifications yet.
                </div>

                <div>
                    New messages from Danny Smart Power
                    will appear here.
                </div>

            </div>

        `;

        return;

    }


    const unreadCount =
        allNotifications.filter(
            function(notification){

                return !isNotificationRead(
                    notification
                );

            }
        ).length;


    if(unreadCount > 0){

        status.textContent =
            unreadCount +
            " unread notification" +
            (unreadCount === 1 ? "" : "s");

    }else{

        status.textContent =
            "You're all caught up.";

    }


    list.innerHTML =
        allNotifications.map(function(notification){

            const unread =
                !isNotificationRead(
                    notification
                );


            const icon =
                escapeHTML(
                    notification.icon || "🔔"
                );


            const title =
                escapeHTML(
                    notification.title ||
                    "Danny Smart Power"
                );


            const body =
                escapeHTML(
                    notification.body ||
                    "You have a new notification."
                );


            const type =
                escapeHTML(
                    notification.type ||
                    "notification"
                );


            const time =
                escapeHTML(
                    formatDate(
                        notification.createdAt
                    )
                );


            return `

                <article
                    class="notification-card ${unread ? "unread" : ""}"
                    data-id="${escapeHTML(notification.id)}"
                >

                    <div class="notification-icon">
                        ${icon}
                    </div>


                    <div class="notification-content">

                        <div class="notification-title-row">

                            <div class="notification-title">
                                ${title}
                            </div>

                            <div class="notification-time">
                                ${time}
                            </div>

                        </div>


                        <div class="notification-body">
                            ${body}
                        </div>


                        <span class="notification-type">
                            ${type}
                        </span>

                    </div>

                </article>

            `;

        }).join("");


    /*
       Clicking a notification marks it as read.
    */

    list
        .querySelectorAll(".notification-card")
        .forEach(function(card){

            card.addEventListener(
                "click",
                function(){

                    markNotificationAsRead(
                        card.dataset.id
                    );

                }
            );

        });

}



/* =========================================================
   LISTEN TO NOTIFICATIONS
========================================================= */

function listenToNotifications(){

    /*
       Remove previous listeners first.
    */

    notificationListeners.forEach(
        function(unsubscribe){

            unsubscribe();

        }
    );


    notificationListeners = [];


    const queries = [

        /*
           Sent to everybody.
        */

        db
            .collection("notifications")
            .where("target","==","all"),


        /*
           Alternative general customer targets.
        */

        db
            .collection("notifications")
            .where("target","==","everyone"),


        db
            .collection("notifications")
            .where("target","==","customers"),


        /*
           Sent directly to this customer.
        */

        db
            .collection("notifications")
            .where(
                "recipientId",
                "==",
                currentUser.uid
            )

    ];


    /*
       Also listen for notifications
       addressed using the customer's email.
    */

    if(currentUser.email){

        queries.push(

            db
                .collection("notifications")
                .where(
                    "recipientEmail",
                    "==",
                    currentUser.email
                )

        );

    }


    const snapshots =
        new Array(
            queries.length
        );


    queries.forEach(
        function(query,index){

            const unsubscribe =
                query.onSnapshot(

                    function(snapshot){

                        snapshots[index] =
                            snapshot.docs.map(
                                function(doc){

                                    return {

                                        id:doc.id,

                                        data:doc.data()

                                    };

                                }
                            );


                        const merged = [];


                        snapshots.forEach(
                            function(rows){

                                if(rows){

                                    merged.push(
                                        ...rows
                                    );

                                }

                            }
                        );


                        mergeNotifications(
                            merged
                        );

                    },


                    function(error){

                        console.error(
                            "Notification listener error:",
                            error
                        );


                        document.getElementById(
                            "status"
                        ).textContent =
                            "Unable to load notifications. Please refresh and try again.";


                        document.getElementById(
                            "notificationsList"
                        ).innerHTML = `

                            <div class="error-box">

                                We could not load your
                                notifications right now.

                                <br><br>

                                Please refresh the page
                                and try again.

                            </div>

                        `;

                    }

                );


            notificationListeners.push(
                unsubscribe
            );

        }
    );

}



/* =========================================================
   MARK ONE NOTIFICATION AS READ
========================================================= */

async function markNotificationAsRead(
    notificationId
){

    if(!currentUser){

        return;

    }


    const notification =
        allNotifications.find(
            function(item){

                return item.id === notificationId;

            }
        );


    if(!notification){

        return;

    }


    if(
        isNotificationRead(
            notification
        )
    ){

        return;

    }


    try{

        await db
            .collection("notifications")
            .doc(notificationId)
            .update({

                /*
                   Each customer gets their own
                   read status.
                */

                readBy:
                    firebase.firestore
                    .FieldValue
                    .arrayUnion(
                        currentUser.uid
                    ),


                readAt:
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp()

            });

    }catch(error){

        console.error(
            "Mark notification as read error:",
            error
        );

    }

}



/* =========================================================
   MARK ALL AS READ
========================================================= */

async function markAllAsRead(){

    if(!currentUser){

        return;

    }


    const unread =
        allNotifications.filter(
            function(notification){

                return !isNotificationRead(
                    notification
                );

            }
        );


    if(!unread.length){

        return;

    }


    const button =
        document.getElementById(
            "markAllBtn"
        );


    button.disabled = true;

    button.textContent =
        "Updating...";


    try{

        let batch =
            db.batch();


        let count = 0;


        for(
            const notification of unread
        ){

            batch.update(

                db
                    .collection("notifications")
                    .doc(notification.id),

                {

                    readBy:
                        firebase.firestore
                        .FieldValue
                        .arrayUnion(
                            currentUser.uid
                        ),


                    readAt:
                        firebase.firestore
                        .FieldValue
                        .serverTimestamp()

                }

            );


            count++;


            /*
               Firestore batch maximum is 500.
               Keep a safe limit.
            */

            if(count === 450){

                await batch.commit();

                batch =
                    db.batch();

                count = 0;

            }

        }


        if(count > 0){

            await batch.commit();

        }

    }catch(error){

        console.error(
            "Mark all notifications error:",
            error
        );


        document.getElementById(
            "status"
        ).textContent =
            "Some notifications could not be marked as read.";

    }finally{

        button.disabled = false;

        button.textContent =
            "✓ Mark all as read";

    }

}



/* =========================================================
   MARK ALL BUTTON
========================================================= */

document
    .getElementById("markAllBtn")
    .addEventListener(
        "click",
        markAllAsRead
    );



/* =========================================================
   AUTH STATE
========================================================= */

auth.onAuthStateChanged(
    function(user){

        if(!user){

            /*
               Customer must be logged in.
            */

            window.location.href =
                "login.html";

            return;

        }


        currentUser = user;


        /*
           Start the notification listeners.
        */

        listenToNotifications();

    }
);

</script>

</body>
</html>

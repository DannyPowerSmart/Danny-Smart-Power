<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications | Danny Smart Power</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    font-family:"Inter",sans-serif;

    color:#f8fafc;

    background:

    radial-gradient(
        circle at top left,
        rgba(56,189,248,.10),
        transparent 35%
    ),

    #020617;
}


/* =========================
   HEADER
========================= */

header{

    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:#020617;

    border-bottom:1px solid
    rgba(148,163,184,.10);

    position:sticky;
    top:0;

    z-index:100;
}

.logo{

    color:#38bdf8;

    font-size:19px;

    font-weight:800;
}

.header-actions{

    display:flex;

    gap:9px;
}

.header-btn{

    color:#cbd5e1;

    text-decoration:none;

    padding:9px 12px;

    border-radius:10px;

    background:#0f172a;

    border:1px solid
    rgba(148,163,184,.12);

    font-size:12px;

    font-weight:600;
}

.header-btn:hover{

    color:#38bdf8;
}


/* =========================
   CONTAINER
========================= */

.container{

    width:100%;

    max-width:850px;

    margin:0 auto;

    padding:28px 18px 50px;
}


/* =========================
   PAGE HEADER
========================= */

.page-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:22px;
}

.page-title h1{

    font-size:27px;

    font-weight:800;

    letter-spacing:-.7px;
}

.page-title p{

    margin-top:6px;

    color:#64748b;

    font-size:13px;
}


/* =========================
   MARK ALL
========================= */

.mark-all{

    border:none;

    padding:10px 14px;

    border-radius:10px;

    background:#38bdf8;

    color:#020617;

    font-family:inherit;

    font-size:12px;

    font-weight:800;

    cursor:pointer;
}

.mark-all:disabled{

    opacity:.45;

    cursor:not-allowed;
}


/* =========================
   NOTIFICATION LIST
========================= */

.notifications{

    display:flex;

    flex-direction:column;

    gap:12px;
}


/* =========================
   NOTIFICATION
========================= */

.notification{

    position:relative;

    display:flex;

    gap:14px;

    padding:17px;

    background:#0f172a;

    border:1px solid
    rgba(148,163,184,.10);

    border-radius:16px;

    transition:.2s ease;
}

.notification:hover{

    border-color:
    rgba(56,189,248,.25);
}

.notification.unread{

    background:#101f30;

    border-color:
    rgba(56,189,248,.30);
}


/* =========================
   ICON
========================= */

.notification-icon{

    width:46px;

    height:46px;

    min-width:46px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:13px;

    background:#082338;

    font-size:21px;
}


/* =========================
   CONTENT
========================= */

.notification-content{

    flex:1;

    min-width:0;
}

.notification-title{

    font-size:15px;

    font-weight:700;

    padding-right:20px;

    line-height:1.4;
}

.notification-body{

    margin-top:6px;

    color:#cbd5e1;

    font-size:13px;

    line-height:1.6;

    white-space:pre-wrap;
}

.notification-date{

    margin-top:9px;

    color:#64748b;

    font-size:11px;
}


/* =========================
   UNREAD DOT
========================= */

.unread-dot{

    position:absolute;

    top:17px;

    right:17px;

    width:8px;

    height:8px;

    border-radius:50%;

    background:#38bdf8;
}


/* =========================
   READ BUTTON
========================= */

.read-button{

    margin-top:8px;

    padding:0;

    border:none;

    background:none;

    color:#38bdf8;

    font-family:inherit;

    font-size:11px;

    font-weight:600;

    cursor:pointer;
}


/* =========================
   EMPTY
========================= */

.empty{

    text-align:center;

    padding:65px 20px;

    background:#0f172a;

    border:1px solid
    rgba(148,163,184,.10);

    border-radius:18px;
}

.empty-icon{

    font-size:42px;

    margin-bottom:12px;
}

.empty h2{

    font-size:18px;
}

.empty p{

    margin-top:7px;

    color:#64748b;

    font-size:13px;
}


/* =========================
   LOADING
========================= */

.loading{

    text-align:center;

    padding:45px 10px;

    color:#64748b;

    font-size:13px;
}


/* =========================
   ERROR
========================= */

.error{

    padding:18px;

    border-radius:14px;

    color:#fecaca;

    background:rgba(239,68,68,.08);

    border:1px solid
    rgba(239,68,68,.18);

    font-size:13px;

    line-height:1.6;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header{

        padding:0 14px;
    }

    .logo{

        font-size:16px;
    }

    .header-btn{

        padding:8px 10px;
    }

    .container{

        padding:22px 14px 40px;
    }

    .page-header{

        align-items:flex-start;
    }

    .page-title h1{

        font-size:23px;
    }

    .mark-all{

        padding:9px 10px;

        font-size:11px;
    }

    .notification{

        padding:14px;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        Danny Smart Power
    </div>

    <div class="header-actions">

        <a
        href="home.html"
        class="header-btn"
        >
        Home
        </a>

        <a
        href="profile.html"
        class="header-btn"
        >
        Profile
        </a>

    </div>

</header>



<main class="container">


    <div class="page-header">

        <div class="page-title">

            <h1>
                Notifications
            </h1>

            <p id="notificationCount">
                Loading notifications...
            </p>

        </div>


        <button
        class="mark-all"
        id="markAllButton"
        disabled
        >
            Mark all read
        </button>

    </div>



    <div id="notificationArea">

        <div class="loading">
            Loading notifications...
        </div>

    </div>


</main>



<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGB44",

    authDomain:
    "danny-smart-power.firebaseapp.com",

    databaseURL:
    "https://danny-smart-power-default-rtdb.firebaseio.com",

    projectId:
    "danny-smart-power",

    storageBucket:
    "danny-smart-power.firebasestorage.app",

    messagingSenderId:
    "649735645158",

    appId:
    "1:649735645158:web:cff518b89721a163679827",

    measurementId:
    "G-258YKLP5ZS"

};


firebase.initializeApp(firebaseConfig);


const auth =
firebase.auth();

const db =
firebase.firestore();


/* =========================
   VARIABLES
========================= */

let currentUser = null;

let notificationList = [];


/* =========================
   ELEMENTS
========================= */

const notificationArea =
document.getElementById(
    "notificationArea"
);

const notificationCount =
document.getElementById(
    "notificationCount"
);

const markAllButton =
document.getElementById(
    "markAllButton"
);


/* =========================
   DATE
========================= */

function formatDate(timestamp){

    if(!timestamp){

        return "Just now";

    }

    try{

        const date =
        timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

        return date.toLocaleString(
            "en-NG",
            {
                day:"numeric",
                month:"short",
                year:"numeric",
                hour:"numeric",
                minute:"2-digit"
            }
        );

    }catch(error){

        return "Recently";

    }

}


/* =========================
   ESCAPE TEXT
========================= */

function escapeHTML(value){

    const div =
    document.createElement("div");

    div.textContent =
    value == null
    ? ""
    : String(value);

    return div.innerHTML;

}


/* =========================
   ICON
========================= */

function getNotificationIcon(item){

    if(item.icon){

        return item.icon;

    }

    return "🔔";

}


/* =========================
   CHECK READ
========================= */

function notificationIsRead(item){

    if(
        currentUser &&
        Array.isArray(item.readBy)
    ){

        return item.readBy.includes(
            currentUser.uid
        );

    }

    return item.read === true;

}


/* =========================
   LOAD CUSTOMER
   NOTIFICATIONS
========================= */

async function loadNotifications(){

    if(!currentUser){

        return;

    }


    notificationArea.innerHTML = `

        <div class="loading">
            Loading notifications...
        </div>

    `;


    try{


        /*
        CUSTOMER-SPECIFIC
        NOTIFICATIONS

        target = "user"
        recipientId = customer's UID
        */

        const userSnapshot =

        await db
        .collection("notifications")
        .where(
            "recipientId",
            "==",
            currentUser.uid
        )
        .get();


        /*
        NOTIFICATIONS SENT
        TO ALL CUSTOMERS
        */

        const allSnapshot =

        await db
        .collection("notifications")
        .where(
            "target",
            "==",
            "all"
        )
        .get();


        const notifications = [];


        /*
        ADD USER NOTIFICATIONS
        */

        userSnapshot.forEach(function(doc){

            notifications.push({

                id:doc.id,

                ...doc.data()

            });

        });


        /*
        ADD ALL-CUSTOMER
        NOTIFICATIONS

        Avoid duplicates.
        */

        allSnapshot.forEach(function(doc){

            if(
                !notifications.some(
                    item =>
                    item.id === doc.id
                )
            ){

                notifications.push({

                    id:doc.id,

                    ...doc.data()

                });

            }

        });


        /*
        Only customer notifications.

        Never display notifications
        specifically targeted at admin.
        */

        notificationList =
        notifications.filter(function(item){

            return item.target !== "admin";

        });


        /*
        NEWEST FIRST
        */

        notificationList.sort(
            function(a,b){

                const aTime =
                a.createdAt &&
                a.createdAt.toMillis
                ? a.createdAt.toMillis()
                : 0;

                const bTime =
                b.createdAt &&
                b.createdAt.toMillis
                ? b.createdAt.toMillis()
                : 0;

                return bTime - aTime;

            }
        );


        renderNotifications();


    }catch(error){

        console.error(
            "Notification loading error:",
            error
        );


        notificationCount.textContent =
        "Unable to load notifications";


        notificationArea.innerHTML = `

            <div class="error">

                We couldn't load your notifications.

            </div>

        `;

    }

}


/* =========================
   RENDER
========================= */

function renderNotifications(){


    if(notificationList.length === 0){

        notificationCount.textContent =
        "No new notifications";

        markAllButton.disabled = true;


        notificationArea.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔔
                </div>

                <h2>
                    No notifications yet
                </h2>

                <p>
                    Notifications from Danny Smart Power
                    will appear here.
                </p>

            </div>

        `;

        return;

    }


    const unreadCount =
    notificationList.filter(
        item =>
        !notificationIsRead(item)
    ).length;


    notificationCount.textContent =

    unreadCount > 0

    ? `${unreadCount} unread notification${unreadCount === 1 ? "" : "s"}`

    : "You're all caught up";


    markAllButton.disabled =
    unreadCount === 0;


    notificationArea.innerHTML = `

        <div class="notifications">

            ${
                notificationList
                .map(function(item){

                    const read =
                    notificationIsRead(item);

                    return `

                        <div
                        class="notification ${read ? "" : "unread"}"
                        >

                            ${
                                read
                                ? ""
                                :
                                `<div class="unread-dot"></div>`
                            }


                            <div class="notification-icon">

                                ${escapeHTML(
                                    getNotificationIcon(item)
                                )}

                            </div>


                            <div class="notification-content">

                                <div class="notification-title">

                                    ${escapeHTML(
                                        item.title ||
                                        "Danny Smart Power"
                                    )}

                                </div>


                                <div class="notification-body">

                                    ${escapeHTML(
                                        item.body ||
                                        ""
                                    )}

                                </div>


                                <div class="notification-date">

                                    ${formatDate(
                                        item.createdAt
                                    )}

                                </div>


                                ${
                                    read
                                    ? ""
                                    :
                                    `
                                    <button
                                    class="read-button"
                                    onclick="markAsRead('${item.id}')"
                                    >

                                        Mark as read

                                    </button>
                                    `
                                }

                            </div>

                        </div>

                    `;

                })
                .join("")
            }

        </div>

    `;

}


/* =========================
   MARK ONE READ
========================= */

async function markAsRead(id){

    if(!currentUser){

        return;

    }


    try{

        await db
        .collection("notifications")
        .doc(id)
        .update({

            readBy:
            firebase.firestore.FieldValue.arrayUnion(
                currentUser.uid
            ),

            readAt:
            firebase.firestore.FieldValue.serverTimestamp()

        });


        const item =
        notificationList.find(
            notification =>
            notification.id === id
        );


        if(item){

            item.readBy =
            Array.isArray(item.readBy)
            ? item.readBy
            : [];


            if(
                !item.readBy.includes(
                    currentUser.uid
                )
            ){

                item.readBy.push(
                    currentUser.uid
                );

            }

        }


        renderNotifications();


    }catch(error){

        console.error(
            "Mark notification read error:",
            error
        );

    }

}


/* =========================
   MARK ALL READ
========================= */

markAllButton.addEventListener(
"click",
async function(){

    if(!currentUser){

        return;

    }


    const unread =
    notificationList.filter(
        item =>
        !notificationIsRead(item)
    );


    if(unread.length === 0){

        return;

    }


    markAllButton.disabled = true;


    try{

        const batch =
        db.batch();


        unread.forEach(function(item){

            const ref =
            db
            .collection("notifications")
            .doc(item.id);


            batch.update(
                ref,
                {

                    readBy:
                    firebase.firestore.FieldValue
                    .arrayUnion(
                        currentUser.uid
                    ),

                    readAt:
                    firebase.firestore.FieldValue
                    .serverTimestamp()

                }
            );

        });


        await batch.commit();


        notificationList.forEach(
        function(item){

            item.readBy =
            Array.isArray(item.readBy)
            ? item.readBy
            : [];


            if(
                !item.readBy.includes(
                    currentUser.uid
                )
            ){

                item.readBy.push(
                    currentUser.uid
                );

            }

        });


        renderNotifications();


    }catch(error){

        console.error(
            "Mark all read error:",
            error
        );


        markAllButton.disabled = false;

    }

});


/* =========================
   SAME FIREBASE LOGIN
========================= */

auth.onAuthStateChanged(
function(user){

    /*
    This is the SAME authentication
    session created by login.html.
    */

    if(user){

        currentUser = user;

        console.log(
            "Customer authenticated:",
            user.uid
        );

        loadNotifications();

    }

});


</script>

</body>

</html>

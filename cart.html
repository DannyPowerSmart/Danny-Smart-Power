<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>My Cart | Danny Smart Power</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>


<style>

/* =====================================================
   RESET
===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}


/* =====================================================
   VARIABLES
===================================================== */

:root{

  --bg:#0f172a;

  --header:#020617;

  --card:#111e30;

  --card2:#17253a;

  --border:rgba(148,163,184,.15);

  --blue:#38bdf8;

  --blue2:#0284c7;

  --green:#22c55e;

  --red:#ef4444;

  --text:#f8fafc;

  --muted:#94a3b8;

}


/* =====================================================
   BODY
===================================================== */

body{

  min-height:100vh;

  font-family:'Poppins',sans-serif;

  color:var(--text);

  background:

    radial-gradient(
      circle at top left,
      rgba(56,189,248,.08),
      transparent 35%
    ),

    var(--bg);

}


/* =====================================================
   HEADER
===================================================== */

header{

  position:sticky;

  top:0;

  z-index:20;

  height:76px;

  padding:0 7%;

  display:flex;

  align-items:center;

  justify-content:space-between;

  background:rgba(2,6,23,.96);

  border-bottom:1px solid var(--border);

  backdrop-filter:blur(12px);

}


.logo{

  display:flex;

  align-items:center;

  gap:10px;

  color:var(--blue);

  font-size:20px;

  font-weight:700;

}


.logo-icon{

  width:40px;

  height:40px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:

    linear-gradient(
      135deg,
      var(--blue),
      var(--blue2)
    );

  color:#00111c;

  font-size:20px;

}


.back-link{

  color:var(--blue);

  text-decoration:none;

  font-size:14px;

  font-weight:500;

}


.back-link:hover{

  text-decoration:underline;

}


/* =====================================================
   MAIN
===================================================== */

main{

  width:100%;

  max-width:1200px;

  margin:auto;

  padding:30px 7% 70px;

}


.heading{

  margin-bottom:25px;

}


.heading h1{

  font-size:28px;

  margin-bottom:5px;

}


.heading p{

  color:var(--muted);

  font-size:14px;

}


/* =====================================================
   CART LAYOUT
===================================================== */

.cart-layout{

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    350px;

  gap:25px;

  align-items:start;

}


/* =====================================================
   CART ITEMS
===================================================== */

.cart-list{

  display:flex;

  flex-direction:column;

  gap:15px;

}


/* =====================================================
   CART CARD
===================================================== */

.cart-item{

  display:flex;

  align-items:center;

  gap:16px;

  padding:16px;

  background:

    linear-gradient(
      145deg,
      var(--card),
      #0d1828
    );

  border:1px solid var(--border);

  border-radius:18px;

  transition:.2s;

}


.cart-item:hover{

  border-color:
    rgba(56,189,248,.35);

  transform:translateY(-2px);

}


/* =====================================================
   IMAGE
===================================================== */

.product-image{

  width:105px;

  height:105px;

  flex-shrink:0;

  object-fit:cover;

  border-radius:14px;

  background:var(--card2);

}


/* =====================================================
   ITEM INFO
===================================================== */

.item-info{

  flex:1;

  min-width:0;

}


.item-info h3{

  font-size:16px;

  margin-bottom:5px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


.category{

  color:var(--blue);

  font-size:11px;

  text-transform:uppercase;

  letter-spacing:.5px;

  margin-bottom:5px;

}


.price{

  color:var(--blue);

  font-size:15px;

  font-weight:600;

}


/* =====================================================
   QUANTITY
===================================================== */

.quantity{

  display:flex;

  align-items:center;

  gap:8px;

  margin-top:12px;

}


.quantity button{

  width:32px;

  height:32px;

  border:none;

  border-radius:9px;

  background:var(--card2);

  color:white;

  font-size:18px;

  cursor:pointer;

}


.quantity button:hover{

  background:var(--blue);

  color:#00111c;

}


.quantity span{

  min-width:28px;

  text-align:center;

  font-weight:600;

}


/* =====================================================
   RIGHT SIDE
===================================================== */

.item-right{

  min-width:120px;

  text-align:right;

}


.subtotal{

  font-size:16px;

  font-weight:700;

  margin-bottom:12px;

}


.remove{

  border:none;

  background:rgba(239,68,68,.12);

  color:#fca5a5;

  padding:8px 11px;

  border-radius:8px;

  font-family:inherit;

  font-size:12px;

  cursor:pointer;

}


.remove:hover{

  background:var(--red);

  color:white;

}


/* =====================================================
   SUMMARY
===================================================== */

.summary{

  position:sticky;

  top:100px;

  padding:22px;

  background:

    linear-gradient(
      145deg,
      var(--card),
      #0d1828
    );

  border:1px solid var(--border);

  border-radius:20px;

}


.summary h2{

  font-size:19px;

  margin-bottom:20px;

}


.summary-row{

  display:flex;

  justify-content:space-between;

  margin-bottom:13px;

  color:var(--muted);

  font-size:14px;

}


.summary-row.total{

  padding-top:15px;

  margin-top:8px;

  border-top:1px solid var(--border);

  color:white;

  font-size:19px;

  font-weight:700;

}


.total-price{

  color:var(--blue);

}


/* =====================================================
   BUTTONS
===================================================== */

.action-button{

  width:100%;

  border:none;

  padding:14px;

  border-radius:11px;

  font-family:inherit;

  font-weight:600;

  cursor:pointer;

  margin-top:14px;

  transition:.2s;

}


.checkout{

  background:var(--blue);

  color:#00111c;

}


.checkout:hover{

  background:#7dd3fc;

}


.shopping{

  background:var(--card2);

  color:white;

  border:1px solid var(--border);

}


.shopping:hover{

  background:#22334b;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

  min-height:420px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:30px;

  background:var(--card);

  border:1px solid var(--border);

  border-radius:22px;

}


.empty-icon{

  width:82px;

  height:82px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:var(--card2);

  font-size:40px;

  margin-bottom:18px;

}


.empty h2{

  margin-bottom:8px;

}


.empty p{

  color:var(--muted);

  font-size:14px;

  margin-bottom:20px;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

  min-height:300px;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  color:var(--muted);

}


.spinner{

  width:38px;

  height:38px;

  border:3px solid #1e293b;

  border-top-color:var(--blue);

  border-radius:50%;

  animation:spin 1s linear infinite;

  margin-bottom:15px;

}


@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =====================================================
   LOGIN MESSAGE
===================================================== */

.login-box{

  max-width:550px;

  margin:70px auto;

  padding:35px;

  text-align:center;

  background:var(--card);

  border:1px solid var(--border);

  border-radius:22px;

}


.login-box .icon{

  font-size:45px;

  margin-bottom:15px;

}


.login-box h2{

  margin-bottom:8px;

}


.login-box p{

  color:var(--muted);

  font-size:14px;

}


.login-button{

  display:inline-block;

  margin-top:20px;

  padding:12px 22px;

  border-radius:10px;

  background:var(--blue);

  color:#00111c;

  text-decoration:none;

  font-weight:600;

}


/* =====================================================
   TOAST
===================================================== */

.toast{

  position:fixed;

  left:50%;

  bottom:25px;

  transform:
    translate(-50%,20px);

  opacity:0;

  pointer-events:none;

  background:#020617;

  border:1px solid var(--border);

  color:white;

  padding:13px 18px;

  border-radius:12px;

  font-size:13px;

  z-index:100;

  transition:.25s;

}


.toast.show{

  transform:
    translate(-50%,0);

  opacity:1;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:850px){

  .cart-layout{

    grid-template-columns:1fr;

  }


  .summary{

    position:static;

  }

}


@media(max-width:600px){

  header{

    padding:0 15px;

  }


  .logo{

    font-size:17px;

  }


  .logo-icon{

    width:35px;

    height:35px;

    font-size:17px;

  }


  .back-link{

    font-size:12px;

  }


  main{

    padding:
      22px
      12px
      50px;

  }


  .heading h1{

    font-size:23px;

  }


  .cart-item{

    align-items:flex-start;

    flex-wrap:wrap;

  }


  .product-image{

    width:85px;

    height:85px;

  }


  .item-info{

    width:
      calc(100% - 105px);

  }


  .item-right{

    width:100%;

    min-width:0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    text-align:left;

    padding-top:12px;

    border-top:
      1px solid var(--border);

  }


  .subtotal{

    margin:0;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <div class="logo">

    <div class="logo-icon">

      ⚡

    </div>

    Danny Smart Power

  </div>


  <a
    href="shop.html"
    class="back-link"
  >

    ← Continue Shopping

  </a>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main>

  <div class="heading">

    <h1>

      My Cart 🛒

      <span id="cartCount">

        (0)

      </span>

    </h1>


    <p>

      Review your selected products before checkout.

    </p>

  </div>


  <div id="mainContent">

    <div class="loading">

      <div class="spinner"></div>

      Loading your cart...

    </div>

  </div>

</main>


<div
  class="toast"
  id="toast"
></div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGb44",

  authDomain:
    "danny-smart-power.firebaseapp.com",

  databaseURL:
    "https://danny-smart-power-default-rtdb.firebaseio.com",

  projectId:
    "danny-smart-power",

  storageBucket:
    "danny-smart-power.firebasestorage.app",

  messagingSenderId:
    "649735645158",

  appId:
    "1:649735645158:web:cff518b89721a163679827",

  measurementId:
    "G-258YKLP5ZS"

};


firebase.initializeApp(
  firebaseConfig
);


const auth =
  firebase.auth();


const db =
  firebase.firestore();


/* =====================================================
   ELEMENTS
===================================================== */

const mainContent =
  document.getElementById(
    "mainContent"
  );


const cartCount =
  document.getElementById(
    "cartCount"
  );


const toast =
  document.getElementById(
    "toast"
  );


/* =====================================================
   CURRENT USER
===================================================== */

let currentUser = null;


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );


  setTimeout(
    function(){

      toast.classList.remove(
        "show"
      );

    },
    2200
  );

}


/* =====================================================
   AUTH STATE
===================================================== */

auth.onAuthStateChanged(

  function(user){

    if(!user){

      currentUser = null;

      cartCount.textContent =
        "(0)";

      showLogin();

      return;

    }


    currentUser = user;

    loadCart();

  }

);


/* =====================================================
   LOGIN SCREEN
===================================================== */

function showLogin(){

  mainContent.innerHTML = `

    <div class="login-box">

      <div class="icon">
        🔐
      </div>

      <h2>
        Sign in to view your cart
      </h2>

      <p>
        Your cart is securely connected
        to your Danny Smart Power account.
      </p>

      <a
        href="login.html"
        class="login-button"
      >
        Sign In
      </a>

    </div>

  `;

}


/* =====================================================
   CART REFERENCE
===================================================== */

function cartItemsRef(){

  return db
    .collection("cart")
    .doc(currentUser.uid)
    .collection("items");

}


/* =====================================================
   LOAD CART
===================================================== */

function loadCart(){

  mainContent.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      Loading your cart...

    </div>

  `;


  cartItemsRef()
    .orderBy(
      "addedAt",
      "desc"
    )
    .onSnapshot(

      function(snapshot){

        const items = [];


        snapshot.forEach(

          function(doc){

            items.push({

              id:doc.id,

              ...doc.data()

            });

          }

        );


        displayCart(
          items
        );

      },

      function(error){

        console.error(
          "Cart error:",
          error
        );


        mainContent.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              ⚠️
            </div>

            <h2>
              Unable to load cart
            </h2>

            <p>
              ${escapeHtml(error.message)}
            </p>

          </div>

        `;

      }

    );

}


/* =====================================================
   DISPLAY CART
===================================================== */

function displayCart(items){

  if(items.length === 0){

    cartCount.textContent =
      "(0)";


    mainContent.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🛒
        </div>

        <h2>
          Your cart is empty
        </h2>

        <p>
          You have not added any products yet.
        </p>

        <button
          class="action-button checkout"
          style="max-width:230px"
          onclick="goShopping()"
        >
          Start Shopping
        </button>

      </div>

    `;

    return;

  }


  let total = 0;

  let totalQuantity = 0;


  items.forEach(

    function(item){

      const price =
        Number(item.price) || 0;


      const qty =
        Math.max(
          1,
          Number(item.qty) || 1
        );


      total +=
        price * qty;


      totalQuantity +=
        qty;

    }

  );


  cartCount.textContent =
    "(" + totalQuantity + ")";


  let html = `

    <div class="cart-layout">

      <div class="cart-list">

  `;


  items.forEach(

    function(item){

      const price =
        Number(item.price) || 0;


      const qty =
        Math.max(
          1,
          Number(item.qty) || 1
        );


      const subtotal =
        price * qty;


      const image =
        item.image ||
        "https://via.placeholder.com/500x400?text=DSP";


      html += `

        <article class="cart-item">

          <img
            class="product-image"
            src="${escapeAttribute(image)}"
            alt="${escapeAttribute(
              item.name || "Product"
            )}"
            onerror="
              this.src='https://via.placeholder.com/500x400?text=DSP'
            "
          >


          <div class="item-info">

            <div class="category">

              ${escapeHtml(
                item.category ||
                "Electrical"
              )}

            </div>


            <h3>

              ${escapeHtml(
                item.name ||
                "Unnamed Product"
              )}

            </h3>


            <div class="price">

              ₦${formatPrice(price)}

            </div>


            <div class="quantity">

              <button
                onclick="changeQuantity(
                  '${escapeJs(item.id)}',
                  -1
                )"
              >
                −
              </button>


              <span>

                ${qty}

              </span>


              <button
                onclick="changeQuantity(
                  '${escapeJs(item.id)}',
                  1
                )"
              >
                +
              </button>

            </div>

          </div>


          <div class="item-right">

            <div class="subtotal">

              ₦${formatPrice(subtotal)}

            </div>


            <button
              class="remove"
              onclick="removeItem(
                '${escapeJs(item.id)}'
              )"
            >

              🗑 Remove

            </button>

          </div>

        </article>

      `;

    }

  );


  html += `

      </div>


      <aside class="summary">

        <h2>
          Order Summary
        </h2>


        <div class="summary-row">

          <span>
            Items
          </span>

          <span>
            ${totalQuantity}
          </span>

        </div>


        <div class="summary-row">

          <span>
            Subtotal
          </span>

          <span>
            ₦${formatPrice(total)}
          </span>

        </div>


        <div class="summary-row">

          <span>
            Delivery
          </span>

          <span>
            Calculated at checkout
          </span>

        </div>


        <div class="summary-row total">

          <span>
            Total
          </span>

          <span class="total-price">

            ₦${formatPrice(total)}

          </span>

        </div>


        <button
          class="action-button checkout"
          onclick="proceedToCheckout()"
        >

          Proceed to Checkout

        </button>


        <button
          class="action-button shopping"
          onclick="goShopping()"
        >

          Continue Shopping

        </button>

      </aside>

    </div>

  `;


  mainContent.innerHTML =
    html;

}


/* =====================================================
   CHANGE QUANTITY
===================================================== */

async function changeQuantity(
  itemId,
  change
){

  if(!currentUser){

    return;

  }


  const ref =
    cartItemsRef()
      .doc(itemId);


  try{

    const snap =
      await ref.get();


    if(!snap.exists){

      return;

    }


    const data =
      snap.data();


    let qty =
      Number(data.qty) || 1;


    qty += change;


    if(qty <= 0){

      await ref.delete();

      showToast(
        "Product removed from cart"
      );

      return;

    }


    await ref.update({

      qty:qty,

      updatedAt:
        firebase.firestore.FieldValue
        .serverTimestamp()

    });

  }

  catch(error){

    console.error(error);

    showToast(
      "Could not update quantity"
    );

  }

}


/* =====================================================
   REMOVE ITEM
===================================================== */

async function removeItem(
  itemId
){

  if(!currentUser){

    return;

  }


  try{

    await cartItemsRef()
      .doc(itemId)
      .delete();


    showToast(
      "Product removed from cart ✓"
    );

  }

  catch(error){

    console.error(error);

    showToast(
      "Could not remove product"
    );

  }

}


/* =====================================================
   CHECKOUT
===================================================== */

function proceedToCheckout(){

  if(!currentUser){

    window.location.href =
      "login.html";

    return;

  }


  window.location.href =
    "checkout.html";

}


/* =====================================================
   SHOPPING
===================================================== */

function goShopping(){

  window.location.href =
    "shop.html";

}


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(
  price
){

  return Number(
    price || 0
  ).toLocaleString(
    "en-NG"
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(value ?? "");


  return div.innerHTML;

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  );

}


/* =====================================================
   ESCAPE JAVASCRIPT VALUE
===================================================== */

function escapeJs(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /\\/g,
    "\\\\"
  )

  .replace(
    /'/g,
    "\\'"
  );

}

</script>

</body>

</html>

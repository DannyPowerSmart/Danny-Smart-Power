<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>My Cart | Danny Smart Power</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}


/* =====================================================
   VARIABLES
===================================================== */

:root{

  --bg:#0f172a;

  --header:#020617;

  --card:#111e30;

  --card2:#17253a;

  --border:rgba(148,163,184,.15);

  --blue:#38bdf8;

  --blue2:#0284c7;

  --green:#22c55e;

  --red:#ef4444;

  --text:#f8fafc;

  --muted:#94a3b8;

}


/* =====================================================
   BODY
===================================================== */

body{

  min-height:100vh;

  font-family:'Poppins',sans-serif;

  color:var(--text);

  background:

    radial-gradient(
      circle at top left,
      rgba(56,189,248,.08),
      transparent 35%
    ),

    var(--bg);

}


/* =====================================================
   HEADER
===================================================== */

header{

  position:sticky;

  top:0;

  z-index:20;

  height:76px;

  padding:0 7%;

  display:flex;

  align-items:center;

  justify-content:space-between;

  background:rgba(2,6,23,.96);

  border-bottom:1px solid var(--border);

  backdrop-filter:blur(12px);

}


.logo{

  display:flex;

  align-items:center;

  gap:10px;

  color:var(--blue);

  font-size:20px;

  font-weight:700;

}


.logo-icon{

  width:40px;

  height:40px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:

    linear-gradient(
      135deg,
      var(--blue),
      var(--blue2)
    );

  color:#00111c;

  font-size:20px;

}


.header-right{

  display:flex;

  align-items:center;

  gap:12px;

}


/* =====================================================
   NOTIFICATION BUTTON
===================================================== */

.notification-button{

  position:relative;

  width:42px;

  height:42px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:transparent;

  color:white;

  text-decoration:none;

  font-size:21px;

  transition:.2s;

}


.notification-button:hover{

  background:var(--card2);

  color:var(--blue);

}


.notification-badge{

  position:absolute;

  top:-2px;

  right:-3px;

  min-width:20px;

  height:20px;

  padding:0 5px;

  display:none;

  align-items:center;

  justify-content:center;

  background:var(--red);

  color:white;

  border:2px solid var(--header);

  border-radius:20px;

  font-size:9px;

  font-weight:700;

  line-height:1;

}


.notification-badge.show{

  display:flex;

}


/* =====================================================
   CART HEADER BUTTON
===================================================== */

.header-cart{

  position:relative;

  width:42px;

  height:42px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  color:white;

  text-decoration:none;

  font-size:21px;

  transition:.2s;

}


.header-cart:hover{

  background:var(--card2);

  color:var(--blue);

}


.header-cart-count{

  position:absolute;

  top:-2px;

  right:-3px;

  min-width:20px;

  height:20px;

  padding:0 5px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:var(--blue);

  color:#00111c;

  border:2px solid var(--header);

  border-radius:20px;

  font-size:9px;

  font-weight:700;

}


/* =====================================================
   BACK
===================================================== */

.back-link{

  color:var(--blue);

  text-decoration:none;

  font-size:14px;

  font-weight:500;

}


.back-link:hover{

  text-decoration:underline;

}


/* =====================================================
   MAIN
===================================================== */

main{

  width:100%;

  max-width:1100px;

  margin:auto;

  padding:30px 7% 70px;

}


.heading{

  margin-bottom:25px;

}


.heading h1{

  font-size:28px;

  margin-bottom:5px;

}


.heading p{

  color:var(--muted);

  font-size:14px;

  line-height:1.6;

}


/* =====================================================
   CART LIST
===================================================== */

.cart-list{

  display:flex;

  flex-direction:column;

  gap:15px;

}


/* =====================================================
   CART ITEM
===================================================== */

.cart-item{

  display:flex;

  align-items:center;

  gap:16px;

  padding:16px;

  background:

    linear-gradient(
      145deg,
      var(--card),
      #0d1828
    );

  border:1px solid var(--border);

  border-radius:18px;

  transition:.2s;

}


.cart-item:hover{

  border-color:
    rgba(56,189,248,.35);

  transform:translateY(-2px);

}


/* =====================================================
   IMAGE
===================================================== */

.product-image{

  width:105px;

  height:105px;

  flex-shrink:0;

  object-fit:cover;

  border-radius:14px;

  background:var(--card2);

}


/* =====================================================
   ITEM INFO
===================================================== */

.item-info{

  flex:1;

  min-width:0;

}


.category{

  color:var(--blue);

  font-size:11px;

  text-transform:uppercase;

  letter-spacing:.6px;

  margin-bottom:5px;

}


.item-info h3{

  font-size:16px;

  margin-bottom:10px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


/* =====================================================
   QUANTITY
===================================================== */

.quantity{

  display:flex;

  align-items:center;

  gap:9px;

}


.quantity-label{

  color:var(--muted);

  font-size:12px;

}


.quantity button{

  width:32px;

  height:32px;

  border:none;

  border-radius:9px;

  background:var(--card2);

  color:white;

  font-size:18px;

  cursor:pointer;

  transition:.2s;

}


.quantity button:hover{

  background:var(--blue);

  color:#00111c;

}


.quantity span{

  min-width:28px;

  text-align:center;

  font-weight:600;

}


/* =====================================================
   REMOVE
===================================================== */

.item-right{

  flex-shrink:0;

}


.remove{

  border:none;

  background:rgba(239,68,68,.12);

  color:#fca5a5;

  padding:9px 12px;

  border-radius:9px;

  font-family:inherit;

  font-size:12px;

  cursor:pointer;

  transition:.2s;

}


.remove:hover{

  background:var(--red);

  color:white;

}


/* =====================================================
   CART ACTION AREA
===================================================== */

.cart-actions{

  margin-top:25px;

  padding:22px;

  background:

    linear-gradient(
      145deg,
      var(--card),
      #0d1828
    );

  border:1px solid var(--border);

  border-radius:20px;

}


.cart-actions h2{

  font-size:19px;

  margin-bottom:8px;

}


.cart-actions p{

  color:var(--muted);

  font-size:13px;

  line-height:1.7;

  margin-bottom:18px;

}


.action-buttons{

  display:flex;

  gap:12px;

}


.action-button{

  flex:1;

  border:none;

  padding:14px;

  border-radius:12px;

  font-family:inherit;

  font-weight:600;

  cursor:pointer;

  transition:.2s;

}


.checkout{

  background:var(--blue);

  color:#00111c;

}


.checkout:hover{

  background:#7dd3fc;

}


.checkout:disabled{

  opacity:.6;

  cursor:not-allowed;

}


.shopping{

  background:var(--card2);

  color:white;

  border:1px solid var(--border);

}


.shopping:hover{

  background:#22334b;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

  min-height:420px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:30px;

  background:var(--card);

  border:1px solid var(--border);

  border-radius:22px;

}


.empty-icon{

  width:82px;

  height:82px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:var(--card2);

  font-size:40px;

  margin-bottom:18px;

}


.empty h2{

  margin-bottom:8px;

}


.empty p{

  color:var(--muted);

  font-size:14px;

  margin-bottom:20px;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

  min-height:300px;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  color:var(--muted);

}


.spinner{

  width:38px;

  height:38px;

  border:3px solid #1e293b;

  border-top-color:var(--blue);

  border-radius:50%;

  animation:spin 1s linear infinite;

  margin-bottom:15px;

}


@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =====================================================
   LOGIN
===================================================== */

.login-box{

  max-width:550px;

  margin:70px auto;

  padding:35px;

  text-align:center;

  background:var(--card);

  border:1px solid var(--border);

  border-radius:22px;

}


.login-box .icon{

  font-size:45px;

  margin-bottom:15px;

}


.login-box h2{

  margin-bottom:8px;

}


.login-box p{

  color:var(--muted);

  font-size:14px;

  line-height:1.7;

}


.login-button{

  display:inline-block;

  margin-top:20px;

  padding:12px 22px;

  border-radius:10px;

  background:var(--blue);

  color:#00111c;

  text-decoration:none;

  font-weight:600;

}


/* =====================================================
   TOAST
===================================================== */

.toast{

  position:fixed;

  left:50%;

  bottom:25px;

  transform:
    translate(-50%,20px);

  opacity:0;

  pointer-events:none;

  background:#020617;

  border:1px solid var(--border);

  color:white;

  padding:13px 18px;

  border-radius:12px;

  font-size:13px;

  z-index:100;

  transition:.25s;

  text-align:center;

  max-width:90%;

}


.toast.show{

  transform:
    translate(-50%,0);

  opacity:1;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  header{

    padding:0 12px;

  }


  .logo{

    font-size:15px;

    gap:7px;

  }


  .logo-icon{

    width:34px;

    height:34px;

    font-size:17px;

  }


  .header-right{

    gap:4px;

  }


  .notification-button,
  .header-cart{

    width:38px;

    height:38px;

    font-size:20px;

  }


  .back-link{

    display:none;

  }


  main{

    padding:
      22px
      12px
      50px;

  }


  .heading h1{

    font-size:23px;

  }


  .cart-item{

    align-items:flex-start;

    flex-wrap:wrap;

  }


  .product-image{

    width:85px;

    height:85px;

  }


  .item-info{

    width:
      calc(100% - 105px);

  }


  .item-right{

    width:100%;

    padding-top:12px;

    border-top:
      1px solid var(--border);

    display:flex;

    justify-content:flex-end;

  }


  .action-buttons{

    flex-direction:column;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <div class="logo">

    <div class="logo-icon">
      ⚡
    </div>

    Danny Smart Power

  </div>


  <div class="header-right">


    <!-- NOTIFICATIONS -->

    <a
      href="notification.html"
      class="notification-button"

      <span
        class="notification-badge"
        id="notificationBadge"

<main>

    <h1>

      <span id="cartCount">

      </span>

    </h1>


    <p>

      Review the products you selected before sending your request to Danny.

    </p>

  </div>


  <div id="mainContent">

    <div class="loading">

      <div class="spinner"></div>

    </div>

  </div>

</main>

<div
  class="toast"
  id="toast"
></div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGb44",

  authDomain:
    "danny-smart-power.firebaseapp.com",

  databaseURL:
    "https://danny-smart-power-default-rtdb.firebaseio.com",

  projectId:
    "danny-smart-power",

  storageBucket:
    "danny-smart-power.firebasestorage.app",

  messagingSenderId:
    "649735645158",

  appId:
    "1:649735645158:web:cff518b89721a163679827",

  measurementId:
    "G-258YKLP5ZS"

};


firebase.initializeApp(firebaseConfig);


const auth =
  firebase.auth();


const db =
  firebase.firestore();


/* =====================================================
   ELEMENTS
===================================================== */

const mainContent =
  document.getElementById(
    "mainContent"
  );


const cartCount =
  document.getElementById(
    "cartCount"
  );


const headerCartCount =
  document.getElementById(
    "headerCartCount"
  );


const notificationBadge =
  document.getElementById(
    "notificationBadge"
  );


const toast =
  document.getElementById(
    "toast"
  );


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let cartUnsubscribe = null;

let notificationUnsubscribes = [];

let notificationData = new Map();

let sendingCartRequest = false;


/* =====================================================
   CART REFERENCE
===================================================== */

function cartRef(){

  if(!currentUser){

    return null;

  }


  return db
    .collection("carts")
    .doc(currentUser.uid);

}


/* =====================================================
   NOTIFICATION QUERIES
===================================================== */

/*
   We use separate one-field queries because
   Firestore security rules are NOT filters.

   Supported notification targets/fields:

   target:
      all
      everyone
      customers

   recipient:
      recipientId
      userId
      customerId

   email:
      recipientEmail
      email
*/

function getNotificationQueries(){

  if(!currentUser){

    return [];

  }


  const queries = [];


  queries.push(

    db.collection("notifications")
      .where(
        "target",
        "==",
        "all"
      )

  );


  queries.push(

    db.collection("notifications")
      .where(
        "target",
        "==",
        "everyone"
      )

  );


  queries.push(

    db.collection("notifications")
      .where(
        "target",
        "==",
        "customers"
      )

  );


  queries.push(

    db.collection("notifications")
      .where(
        "recipientId",
        "==",
        currentUser.uid
      )

  );


  queries.push(

    db.collection("notifications")
      .where(
        "userId",
        "==",
        currentUser.uid
      )

  );


  queries.push(

    db.collection("notifications")
      .where(
        "customerId",
        "==",
        currentUser.uid
      )

  );


  if(currentUser.email){

    queries.push(

      db.collection("notifications")
        .where(
          "recipientEmail",
          "==",
          currentUser.email
        )

    );


    queries.push(

      db.collection("notifications")
        .where(
          "email",
          "==",
          currentUser.email
        )

    );

  }


  return queries;

}


/* =====================================================
   START NOTIFICATION LISTENERS
===================================================== */

function listenToNotifications(){

  stopNotificationListeners();


  if(!currentUser){

    hideNotificationBadge();

    return;

  }


  const queries =
    getNotificationQueries();


  queries.forEach(

    function(query){

      const unsubscribe =
        query.onSnapshot(

          function(snapshot){

            snapshot.forEach(

              function(doc){

                notificationData.set(
                  doc.id,
                  doc.data()
                );

              }

            );


            updateNotificationBadgeFromData();

          },

          function(error){

            console.error(
              "Notification listener error:",
              error
            );

            /*
              Do not hide the badge here.
              Another valid notification query
              may still be working.
            */

          }

        );


      notificationUnsubscribes.push(
        unsubscribe
      );

    }

  );

}


/* =====================================================
   STOP NOTIFICATION LISTENERS
===================================================== */

function stopNotificationListeners(){

  notificationUnsubscribes.forEach(

    function(unsubscribe){

      try{

        unsubscribe();

      }

      catch(error){

        console.error(error);

      }

    }

  );


  notificationUnsubscribes = [];

  notificationData.clear();

}


/* =====================================================
   UPDATE NOTIFICATION BADGE
===================================================== */

function updateNotificationBadgeFromData(){

  if(!currentUser){

    hideNotificationBadge();

    return;

  }


  let unreadCount = 0;


  notificationData.forEach(

    function(data){

      if(isNotificationUnread(data)){

        unreadCount++;

      }

    }

  );


  updateNotificationBadge(
    unreadCount
  );

}


/* =====================================================
   CHECK UNREAD STATUS
===================================================== */

function isNotificationUnread(data){

  if(!data){

    return false;

  }


  /*
     New notification system:

     readBy: [uid1, uid2, ...]
  */

  if(Array.isArray(data.readBy)){

    return !data.readBy.includes(
      currentUser.uid
    );

  }


  /*
     Legacy notification system:

     read: true / false
  */

  return data.read !== true;

}


/* =====================================================
   UPDATE BADGE
===================================================== */

function updateNotificationBadge(count){

  const number =
    Number(count) || 0;


  if(number <= 0){

    hideNotificationBadge();

    return;

  }


  notificationBadge.textContent =
    number > 99
      ? "99+"
      : number;


  notificationBadge.classList.add(
    "show"
  );

}


/* =====================================================
   HIDE BADGE
===================================================== */

function hideNotificationBadge(){

  notificationBadge.textContent =
    "0";

  notificationBadge.classList.remove(
    "show"
  );

}


/* =====================================================
   AUTH STATE
===================================================== */

auth.onAuthStateChanged(

  function(user){

    if(cartUnsubscribe){

      cartUnsubscribe();

      cartUnsubscribe = null;

    }


    stopNotificationListeners();


    if(!user){

      currentUser = null;


      cartCount.textContent =
        "(0)";


      headerCartCount.textContent =
        "0";


      hideNotificationBadge();


      showLogin();

      return;

    }


    currentUser = user;


    listenToNotifications();

    listenToCart();

  }

);


/* =====================================================
   LOGIN SCREEN
===================================================== */

function showLogin(){

  mainContent.innerHTML = `

    <div class="login-box">

      <div class="icon">
        🔐
      </div>


      <h2>
        Sign in to view your cart
      </h2>


      <p>

        Your selected products are securely
        connected to your Danny Smart Power account.

      </p>


      <a
        href="login.html"
        class="login-button"
      >

        Sign In

      </a>

    </div>

  `;

}


/* =====================================================
   LISTEN TO CART
===================================================== */

function listenToCart(){

  if(!currentUser){

    return;

  }


  mainContent.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      Loading your cart...

    </div>

  `;


  cartUnsubscribe =

    cartRef().onSnapshot(

      function(doc){

        if(!doc.exists){

          displayCart([]);

          return;

        }


        const data =
          doc.data();


        const rawItems =
          Array.isArray(data.items)
            ? data.items
            : [];


        const items =
          rawItems.map(

            function(item,index){

              return {

                ...item,

                _index:index

              };

            }

          );


        displayCart(items);

      },

      function(error){

        console.error(
          "Cart listener error:",
          error
        );


        mainContent.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              ⚠️
            </div>


            <h2>
              Unable to load cart
            </h2>


            <p>
              Please try again.
            </p>

          </div>

        `;

      }

    );

}


/* =====================================================
   DISPLAY CART
===================================================== */

function displayCart(items){

  if(!items.length){

    cartCount.textContent =
      "(0)";


    headerCartCount.textContent =
      "0";


    mainContent.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🛒
        </div>


        <h2>
          Your cart is empty
        </h2>


        <p>

          You have not added any products yet.

        </p>


        <button
          class="action-button checkout"
          style="max-width:230px"
          onclick="goShopping()"
        >

          Start Shopping

        </button>

      </div>

    `;


    return;

  }


  let totalQuantity = 0;


  items.forEach(

    function(item){

      const qty =
        Math.max(
          1,
          Number(item.qty) || 1
        );


      totalQuantity += qty;

    }

  );


  cartCount.textContent =
    "(" +
    totalQuantity +
    ")";


  headerCartCount.textContent =
    totalQuantity;


  let html = `

    <div class="cart-list">

  `;


  items.forEach(

    function(item){

      const qty =
        Math.max(
          1,
          Number(item.qty) || 1
        );


      const image =
        item.image ||
        item.imageUrl ||
        "https://via.placeholder.com/500x400?text=DSP";


      html += `

        <article class="cart-item">

          <img
            class="product-image"
            src="${escapeAttribute(image)}"
            alt="${escapeAttribute(
              item.name ||
              "Product"
            )}"
            onerror="
              this.src='https://via.placeholder.com/500x400?text=DSP'
            "
          >


          <div class="item-info">

            <div class="category">

              ${escapeHtml(
                item.category ||
                "Electrical"
              )}

            </div>


            <h3>

              ${escapeHtml(
                item.name ||
                "Unnamed Product"
              )}

            </h3>


            <div class="quantity">

              <span class="quantity-label">
                Quantity
              </span>


              <button
                onclick="changeQuantity(
                  ${item._index},
                  -1
                )"
                aria-label="Decrease quantity"
              >

                −

              </button>


              <span>

                ${qty}

              </span>


              <button
                onclick="changeQuantity(
                  ${item._index},
                  1
                )"
                aria-label="Increase quantity"
              >

                +

              </button>

            </div>

          </div>


          <div class="item-right">

            <button
              class="remove"
              onclick="removeItem(
                ${item._index}
              )"
            >

              🗑 Remove

            </button>

          </div>

        </article>

      `;

    }

  );


  html += `

    </div>


    <section class="cart-actions">

      <h2>
        Ready to ask Danny? 💬
      </h2>


      <p>

        Send your selected products directly
        to Chat with Danny. Danny will check
        the current material prices and reply
        to you.

      </p>


      <div class="action-buttons">

        <button
          class="action-button checkout"
          id="proceedButton"
          onclick="proceedToChat()"
        >

          Proceed to Checkout

        </button>


        <button
          class="action-button shopping"
          onclick="goShopping()"
        >

          Continue Shopping

        </button>

      </div>

    </section>

  `;


  mainContent.innerHTML =
    html;

}


/* =====================================================
   CHANGE QUANTITY
===================================================== */

async function changeQuantity(
  index,
  change
){

  if(!currentUser){

    return;

  }


  try{

    const doc =
      await cartRef().get();


    if(!doc.exists){

      return;

    }


    const data =
      doc.data();


    let items =
      Array.isArray(data.items)
        ? [...data.items]
        : [];


    if(
      index < 0 ||
      index >= items.length
    ){

      return;

    }


    let qty =
      Number(
        items[index].qty
      ) || 1;


    qty += change;


    if(qty <= 0){

      items.splice(
        index,
        1
      );


      await saveCart(
        items
      );


      showToast(
        "Product removed from cart ✓"
      );


      return;

    }


    items[index] = {

      ...items[index],

      qty:qty

    };


    await saveCart(
      items
    );

  }

  catch(error){

    console.error(error);

    showToast(
      "Could not update quantity."
    );

  }

}


/* =====================================================
   REMOVE ITEM
===================================================== */

async function removeItem(
  index
){

  if(!currentUser){

    return;

  }


  try{

    const doc =
      await cartRef().get();


    if(!doc.exists){

      return;

    }


    const data =
      doc.data();


    let items =
      Array.isArray(data.items)
        ? [...data.items]
        : [];


    if(
      index < 0 ||
      index >= items.length
    ){

      return;

    }


    items.splice(
      index,
      1
    );


    await saveCart(
      items
    );


    showToast(
      "Product removed from cart ✓"
    );

  }

  catch(error){

    console.error(error);

    showToast(
      "Could not remove product."
    );

  }

}


/* =====================================================
   SAVE CART
===================================================== */

async function saveCart(
  items
){

  if(!currentUser){

    return;

  }


  await cartRef().set({

    userId:
      currentUser.uid,

    items:
      items,

    updatedAt:
      firebase.firestore
      .FieldValue
      .serverTimestamp()

  },{

    merge:true

  });

}


/* =====================================================
   PROCEED TO CHAT
===================================================== */

async function proceedToChat(){

  if(!currentUser){

    window.location.href =
      "login.html";

    return;

  }


  if(sendingCartRequest){

    return;

  }


  const button =
    document.getElementById(
      "proceedButton"
    );


  try{

    sendingCartRequest = true;


    if(button){

      button.disabled = true;

      button.textContent =
        "Sending to Danny...";

    }


    const cartDocument =
      await cartRef().get();


    if(!cartDocument.exists){

      showToast(
        "Your cart is empty."
      );


      sendingCartRequest = false;

      return;

    }


    const cartData =
      cartDocument.data();


    const items =
      Array.isArray(cartData.items)
        ? cartData.items
        : [];


    if(!items.length){

      showToast(
        "Your cart is empty."
      );


      sendingCartRequest = false;

      return;

    }


    /*
       Build a clean product list.

       IMPORTANT:
       We intentionally DO NOT include
       price information here.
    */

    const productLines =
      items.map(

        function(item,index){

          const name =
            item.name ||
            "Unnamed Product";


          const category =
            item.category ||
            "Electrical";


          const qty =
            Math.max(
              1,
              Number(item.qty) || 1
            );


          return (

            (index + 1) +
            ". " +
            name +
            "\n" +
            "   Category: " +
            category +
            "\n" +
            "   Quantity: " +
            qty

          );

        }

      );


    const productList =
      productLines.join(
        "\n\n"
      );


    /*
       This is the message that Danny
       will receive in Chat with Danny.
    */

    const messageText =

`Hello Danny 👋

I would like to ask about these electrical materials from my cart:

${productList}

Please check the current prices and availability for me.

Thank you.`;


    /*
       Use the customer's UID as the
       chat ID so one customer has
       one conversation.
    */

    const chatId =
      currentUser.uid;


    const customerName =
      currentUser.displayName ||
      currentUser.email?.split("@")[0] ||
      "Customer";


    /*
       Create/update the chat document.
    */

    await db
      .collection("chats")
      .doc(chatId)
      .set({

        customerId:
          currentUser.uid,

        customerName:
          customerName,

        customerEmail:
          currentUser.email || "",

        lastMessage:
          messageText,

        lastMessageAt:
          firebase.firestore
          .FieldValue
          .serverTimestamp(),

        unreadForAdmin:
          firebase.firestore
          .FieldValue
          .increment(1),

        unreadForCustomer:
          0,

        status:
          "open",

        updatedAt:
          firebase.firestore
          .FieldValue
          .serverTimestamp(),

        createdAt:
          firebase.firestore
          .FieldValue
          .serverTimestamp()

      },{

        merge:true

      });


    /*
       Add the actual message.
    */

    await db
      .collection("messages")
      .add({

        chatId:
          chatId,

        senderId:
          currentUser.uid,

        senderName:
          customerName,

        senderRole:
          "customer",

        text:
          messageText,

        imageUrl:
          "",

        createdAt:
          firebase.firestore
          .FieldValue
          .serverTimestamp(),

        read:
          false

      });


    /*
       Optional record on the cart itself.
       The cart remains intact so the customer
       can still see what they selected.
    */

    await cartRef().set({

      lastSentToDannyAt:
        firebase.firestore
        .FieldValue
        .serverTimestamp(),

      lastSentToDannyMessage:
        messageText

    },{

      merge:true

    });


    showToast(
      "Your product list has been sent to Danny ✓"
    );


    /*
       Give Firestore a moment to complete
       before opening the chat.
    */

    setTimeout(

      function(){

        window.location.href =
          "chat.html";

      },

      500

    );

  }

  catch(error){

    console.error(
      "Send cart to Danny error:",
      error
    );


    sendingCartRequest = false;


    if(button){

      button.disabled = false;

      button.textContent =
        "Proceed to Checkout";

    }


    showToast(
      "Could not send your cart. Please try again."
    );

  }

}


/* =====================================================
   SHOPPING
===================================================== */

function goShopping(){

  window.location.href =
    "shop.html";

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;


function showToast(message){

  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(

      function(){

        toast.classList.remove(
          "show"
        );

      },

      2600

    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(
      value ?? ""
    );


  return div.innerHTML;

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  );

}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat with Danny | Danny Smart Power</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0f172a;
  --header:#020617;
  --card:#17253a;
  --blue:#38bdf8;
  --green:#22c55e;
  --text:#f8fafc;
  --muted:#94a3b8;
  --border:rgba(148,163,184,.14);
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Poppins,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.chat-app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

.chat-header{
  height:86px;
  flex-shrink:0;
  background:var(--header);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
}

.header-side{
  width:45px;
}

.header-btn{
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:white;
  font-size:28px;
  cursor:pointer;
}

.profile{
  display:flex;
  align-items:center;
  gap:11px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#38bdf8,#0284c7);
  font-size:24px;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile h2{
  font-size:17px;
}

.status{
  color:var(--green);
  font-size:12px;
}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:18px 12px;
}

.welcome{
  max-width:600px;
  margin:20px auto 28px;
  padding:25px 18px;
  border:1px solid var(--border);
  border-radius:22px;
  background:#111e30;
  text-align:center;
}

.welcome-icon{
  width:65px;
  height:65px;
  margin:auto;
  margin-bottom:12px;
  border-radius:50%;
  background:#12324b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.welcome h1{
  font-size:21px;
  margin-bottom:8px;
}

.welcome p{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}

.message-row{
  display:flex;
  margin:7px 0;
}

.message-row.customer{
  justify-content:flex-end;
}

.message-row.admin{
  justify-content:flex-start;
}

.bubble{
  max-width:min(78%,520px);
  padding:10px 12px 7px;
  border-radius:17px;
  font-size:14px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.customer .bubble{
  background:#0284c7;
  border-bottom-right-radius:5px;
}

.admin .bubble{
  background:#1b293d;
  border-bottom-left-radius:5px;
}

.message-image{
  display:block;
  width:min(280px,100%);
  max-height:350px;
  object-fit:cover;
  border-radius:12px;
  cursor:pointer;
}

.meta{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:5px;
  margin-top:4px;
  font-size:9px;
  opacity:.75;
}

.seen{
  color:#bae6fd;
  font-size:11px;
}

.typing{
  display:none;
  padding:6px 15px;
  color:var(--muted);
  font-size:12px;
}

.typing.active{
  display:block;
}

.input-wrapper{
  flex-shrink:0;
  background:var(--header);
  border-top:1px solid var(--border);
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
}

.input-area{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:7px;
}

.attach,
.send{
  width:47px;
  height:47px;
  min-width:47px;
  border:0;
  border-radius:50%;
  cursor:pointer;
  font-size:23px;
}

.attach{
  background:#17253a;
  color:white;
}

.send{
  background:#38bdf8;
  color:#00111c;
}

.send:disabled{
  opacity:.4;
}

textarea{
  flex:1;
  min-width:0;
  min-height:47px;
  max-height:130px;
  resize:none;
  border:0;
  outline:0;
  border-radius:24px;
  background:#182337;
  color:white;
  padding:13px 16px;
  font-family:inherit;
  font-size:14px;
}

.preview{
  display:none;
  max-width:900px;
  margin:auto;
  padding-bottom:8px;
}

.preview.active{
  display:block;
}

.preview img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:10px;
}

.hidden{
  display:none;
}

.side-menu{
  position:fixed;
  z-index:100;
  top:0;
  right:-320px;
  width:300px;
  max-width:88%;
  height:100dvh;
  background:#020617;
  padding:20px;
  transition:.3s;
}

.side-menu.active{
  right:0;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:90;
  display:none;
}

.overlay.active{
  display:block;
}

.menu-link{
  display:block;
  width:100%;
  padding:14px;
  margin-top:7px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:white;
  text-decoration:none;
  text-align:left;
  font-family:inherit;
}

.menu-link:hover{
  background:#17253a;
}

@media(max-width:600px){
  .bubble{
    max-width:85%;
  }
}
</style>
</head>

<body>

<div class="chat-app">

<header class="chat-header">

  <div class="header-side">
    <button class="header-btn" id="backButton">←</button>
  </div>

  <div class="profile">

    <div class="avatar">
      ⚡
    </div>

    <div>
      <h2>Danny Smart Power</h2>
      <div class="status" id="status">Connecting...</div>
    </div>

  </div>

  <div class="header-side">
    <button class="header-btn" id="menuButton">⋮</button>
  </div>

</header>


<main class="messages" id="messages">

  <div id="loading">
    Connecting to Danny...
  </div>

</main>


<div class="typing" id="typing">
  Danny is typing...
</div>


<div class="input-wrapper">

  <div class="preview" id="preview">
    <img id="previewImage">
  </div>

  <div class="input-area">

    <button class="attach" id="attachButton">+</button>

    <input
      class="hidden"
      type="file"
      id="fileInput"
      accept="image/*"
    >

    <textarea
      id="messageInput"
      rows="1"
      placeholder="Type a message..."
    ></textarea>

    <button
      class="send"
      id="sendButton"
      disabled
    >
      ➤
    </button>

  </div>

</div>

</div>


<div class="overlay" id="overlay"></div>

<aside class="side-menu" id="sideMenu">

  <h3>Danny Chat</h3>

  <br>

  <strong id="customerName">Loading...</strong>

  <small id="customerEmail"></small>

  <hr style="margin:20px 0;border-color:#1e293b">

  <a class="menu-link" href="profile.html">👤 Profile</a>

  <a class="menu-link" href="shop.html">🛍️ Continue Shopping</a>

  <a class="menu-link" href="cart.html">🛒 My Cart</a>

  <a class="menu-link" href="orders.html">📦 My Orders</a>

  <a class="menu-link" href="settings.html">⚙️ Settings</a>

  <a class="menu-link" href="contact.html">📞 Contact</a>

  <button class="menu-link" id="logout">🚪 Sign Out</button>

</aside>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGb44",
  authDomain: "danny-smart-power.firebaseapp.com",
  databaseURL: "https://danny-smart-power-default-rtdb.firebaseio.com",
  projectId: "danny-smart-power",
  storageBucket: "danny-smart-power.firebasestorage.app",
  messagingSenderId: "649735645158",
  appId: "1:649735645158:web:cff518b89721a163679827",
  measurementId: "G-258YKLP5ZS"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

const messagesEl =
  document.getElementById("messages");

const input =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const status =
  document.getElementById("status");

const typing =
  document.getElementById("typing");

const fileInput =
  document.getElementById("fileInput");

const preview =
  document.getElementById("preview");

const previewImage =
  document.getElementById("previewImage");

let user = null;
let chatRef = null;
let messagesRef = null;
let selectedFile = null;
let stopMessages = null;
let stopChat = null;
let typingTimer = null;
let sending = false;


/* ================================
   AUTH
================================ */

auth.onAuthStateChanged(async currentUser => {

  if(!currentUser){

    window.location.href = "login.html";
    return;

  }

  user = currentUser;

  document.getElementById("customerName").textContent =
    user.displayName ||
    user.email.split("@")[0];

  document.getElementById("customerEmail").textContent =
    user.email;


  chatRef =
    db.collection("chats").doc(user.uid);

  messagesRef =
    chatRef.collection("messages");


  await createChat();

  status.textContent = "Online";

  listenToChat();

  listenToMessages();

  sendButton.disabled = false;

});


/* ================================
   CREATE CHAT
================================ */

async function createChat(){

  const ref = await chatRef.get();

  const data = {

    customerId:user.uid,

    customerName:
      user.displayName ||
      user.email.split("@")[0],

    customerEmail:user.email,

    customerPhoto:
      user.photoURL || "",

    status:"open",

    customerTyping:false,

    adminTyping:false,

    unreadForAdmin:0,

    unreadForCustomer:0,

    lastMessage:"",

    lastMessageAt:
      firebase.firestore.FieldValue.serverTimestamp(),

    updatedAt:
      firebase.firestore.FieldValue.serverTimestamp()

  };


  if(!ref.exists){

    await chatRef.set({

      ...data,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

  }else{

    await chatRef.set(data,{merge:true});

  }

}


/* ================================
   CHAT LISTENER
================================ */

function listenToChat(){

  stopChat =
    chatRef.onSnapshot(snapshot => {

      const data = snapshot.data();

      if(!data) return;

      if(data.adminTyping === true){

        typing.classList.add("active");

      }else{

        typing.classList.remove("active");

      }

    });

}


/* ================================
   MESSAGE LISTENER
================================ */

function listenToMessages(){

  if(stopMessages)
    stopMessages();


  stopMessages =
    messagesRef
      .orderBy("createdAt","asc")
      .onSnapshot(snapshot => {

        messagesEl.innerHTML = "";

        addWelcome();


        snapshot.forEach(doc => {

          renderMessage(
            doc.id,
            doc.data()
          );

        });


        markAdminMessagesSeen(snapshot);

        scrollBottom();

      });

}


/* ================================
   WELCOME
================================ */

function addWelcome(){

  const div =
    document.createElement("div");

  div.className = "welcome";

  div.innerHTML = `

    <div class="welcome-icon">⚡</div>

    <h1>Welcome to Danny Smart Power</h1>

    <p>
      Hello 👋. How can we help you today
      with your electrical, solar and power needs?
    </p>

  `;

  messagesEl.appendChild(div);

}


/* ================================
   RENDER MESSAGE
================================ */

function renderMessage(id,data){

  const row =
    document.createElement("div");

  const mine =
    data.senderRole === "customer";

  row.className =
    "message-row " +
    (mine ? "customer" : "admin");


  const bubble =
    document.createElement("div");

  bubble.className = "bubble";


  if(data.image){

    const img =
      document.createElement("img");

    img.src = data.image;

    img.className =
      "message-image";

    img.onclick = () =>
      window.open(data.image,"_blank");

    bubble.appendChild(img);

  }


  if(data.text){

    const text =
      document.createElement("div");

    text.textContent = data.text;

    bubble.appendChild(text);

  }


  const meta =
    document.createElement("div");

  meta.className = "meta";

  meta.appendChild(
    document.createTextNode(
      formatTime(data.createdAt)
    )
  );


  if(mine){

    const seen =
      document.createElement("span");

    seen.className = "seen";

    seen.textContent =
      data.seen ? "✓✓" : "✓";

    meta.appendChild(seen);

  }


  bubble.appendChild(meta);

  row.appendChild(bubble);

  messagesEl.appendChild(row);

}


/* ================================
   SEND MESSAGE
================================ */

async function sendMessage(){

  if(!user || sending)
    return;


  const text =
    input.value.trim();


  if(!text && !selectedFile)
    return;


  sending = true;

  sendButton.disabled = true;


  try{

    let imageUrl = "";


    if(selectedFile){

      const path =
        "chat-images/" +
        user.uid + "/" +
        Date.now() +
        "_" +
        selectedFile.name;


      const upload =
        await storage
          .ref(path)
          .put(selectedFile);


      imageUrl =
        await upload.ref.getDownloadURL();

    }


    const batch =
      db.batch();


    const messageRef =
      messagesRef.doc();


    batch.set(messageRef,{

      text:text,

      image:imageUrl,

      senderId:user.uid,

      senderRole:"customer",

      senderName:
        user.displayName ||
        user.email.split("@")[0],

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp(),

      seen:false,

      seenAt:null

    });


    batch.set(chatRef,{

      lastMessage:
        text || "📷 Image",

      lastMessageAt:
        firebase.firestore.FieldValue.serverTimestamp(),

      updatedAt:
        firebase.firestore.FieldValue.serverTimestamp(),

      unreadForAdmin:
        firebase.firestore.FieldValue.increment(1),

      unreadForCustomer:0,

      customerTyping:false,

      status:"open"

    },{merge:true});


    await batch.commit();


    input.value = "";

    selectedFile = null;

    fileInput.value = "";

    preview.classList.remove("active");

    input.style.height = "47px";

    stopTyping();

    scrollBottom();

  }

  catch(error){

    console.error(error);

    alert(
      "Message could not be sent."
    );

  }


  sending = false;

  sendButton.disabled = false;

  updateSendButton();

}


/* ================================
   MARK ADMIN MESSAGES SEEN
================================ */

async function markAdminMessagesSeen(snapshot){

  const batch =
    db.batch();

  let count = 0;


  snapshot.forEach(doc => {

    const data = doc.data();


    if(
      data.senderRole === "admin" &&
      data.seen === false
    ){

      batch.update(doc.ref,{

        seen:true,

        seenAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });

      count++;

    }

  });


  if(count > 0){

    await batch.commit();

    await chatRef.update({
      unreadForCustomer:0
    });

  }

}


/* ================================
   TYPING
================================ */

input.addEventListener("input",()=>{

  autoResize();

  updateSendButton();

  if(!user) return;


  chatRef.set({

    customerTyping:true

  },{merge:true});


  clearTimeout(typingTimer);


  typingTimer =
    setTimeout(
      stopTyping,
      1200
    );

});


function stopTyping(){

  clearTimeout(typingTimer);


  if(user){

    chatRef.set({

      customerTyping:false

    },{merge:true});

  }

}


/* ================================
   FILE
================================ */

document
  .getElementById("attachButton")
  .onclick = () =>
    fileInput.click();


fileInput.onchange = event => {

  const file =
    event.target.files[0];

  if(!file) return;


  if(!file.type.startsWith("image/")){

    alert("Please select an image.");

    return;

  }


  selectedFile = file;


  const reader =
    new FileReader();


  reader.onload = e => {

    previewImage.src =
      e.target.result;

    preview.classList.add("active");

    updateSendButton();

  };


  reader.readAsDataURL(file);

};


/* ================================
   INPUT
================================ */

sendButton.onclick =
  sendMessage;


input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


function updateSendButton(){

  sendButton.disabled =
    !input.value.trim() &&
    !selectedFile;

}


function autoResize(){

  input.style.height = "47px";

  input.style.height =
    Math.min(
      input.scrollHeight,
      130
    ) + "px";

}


/* ================================
   MENU
================================ */

const sideMenu =
  document.getElementById("sideMenu");

const overlay =
  document.getElementById("overlay");


document
  .getElementById("menuButton")
  .onclick = () => {

    sideMenu.classList.add("active");

    overlay.classList.add("active");

  };


overlay.onclick =
closeMenu;


function closeMenu(){

  sideMenu.classList.remove("active");

  overlay.classList.remove("active");

}


document
  .getElementById("logout")
  .onclick = async () => {

    await auth.signOut();

    location.href =
      "login.html";

  };


document
  .getElementById("backButton")
  .onclick = () =>
    history.back();


/* ================================
   HELPERS
================================ */

function scrollBottom(){

  setTimeout(()=>{

    messagesEl.scrollTop =
      messagesEl.scrollHeight;

  },80);

}


function formatTime(timestamp){

  if(
    !timestamp ||
    !timestamp.toDate
  )
    return "";


  return timestamp
    .toDate()
    .toLocaleTimeString([],{

      hour:"2-digit",
      minute:"2-digit"

    });

}

</script>

</body>
</html>

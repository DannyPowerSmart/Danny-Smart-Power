<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat with Danny | Danny Smart Power</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0f172a;
  --header:#020617;
  --customer:#0284c7;
  --admin:#1e293b;
  --blue:#38bdf8;
  --green:#22c55e;
  --text:#f8fafc;
  --muted:#94a3b8;
  --border:rgba(148,163,184,.14);
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Poppins,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.chat-app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

/* =========================
   HEADER
========================= */

.chat-header{
  height:86px;
  flex-shrink:0;
  background:var(--header);
  border-bottom:1px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;
}

.header-side{
  width:48px;
}

.header-btn{
  width:44px;
  height:44px;

  border:0;
  border-radius:50%;

  background:transparent;
  color:white;

  font-size:28px;
  cursor:pointer;
}

.profile{
  display:flex;
  align-items:center;
  gap:11px;
}

.avatar{
  width:52px;
  height:52px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:linear-gradient(
    135deg,
    #38bdf8,
    #0284c7
  );

  font-size:27px;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile h2{
  font-size:17px;
  font-weight:700;
}

.status{
  color:var(--green);
  font-size:12px;
}

/* =========================
   MESSAGES
========================= */

.messages{
  flex:1;
  min-height:0;

  overflow-y:auto;

  padding:18px 12px 25px;

  scroll-behavior:smooth;
}

.welcome{
  max-width:600px;

  margin:20px auto 28px;

  padding:25px 18px;

  border:1px solid var(--border);
  border-radius:22px;

  background:#111e30;

  text-align:center;
}

.welcome-icon{
  width:65px;
  height:65px;

  margin:0 auto 12px;

  border-radius:50%;

  background:#12324b;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:30px;
}

.welcome h1{
  font-size:21px;
  margin-bottom:8px;
}

.welcome p{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}

/* =========================
   MESSAGE ROWS
========================= */

.message-row{
  display:flex;
  width:100%;

  margin:8px 0;
}

.message-row.customer{
  justify-content:flex-end;
}

.message-row.admin{
  justify-content:flex-start;
}

.bubble{
  max-width:min(78%,520px);

  padding:10px 12px 7px;

  border-radius:18px;

  font-size:14px;
  line-height:1.5;

  overflow-wrap:anywhere;

  box-shadow:0 2px 5px rgba(0,0,0,.12);
}

/* CUSTOMER = RIGHT */

.customer .bubble{
  background:var(--customer);

  border-bottom-right-radius:5px;
}

/* ADMIN = LEFT */

.admin .bubble{
  background:var(--admin);

  border-bottom-left-radius:5px;
}

.message-image{
  display:block;

  width:min(280px,100%);

  max-height:350px;

  object-fit:cover;

  border-radius:12px;

  cursor:pointer;

  margin-bottom:6px;
}

.meta{
  display:flex;

  justify-content:flex-end;
  align-items:center;

  gap:5px;

  margin-top:4px;

  font-size:9px;

  opacity:.75;
}

.read-status{
  color:#bae6fd;
  font-size:11px;
}

/* =========================
   LOADING / ERROR
========================= */

.center-message{
  min-height:300px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  color:var(--muted);

  padding:30px;
}

.center-message .icon{
  font-size:42px;
  margin-bottom:12px;
}

.center-message h3{
  color:white;
  margin-bottom:8px;
}

.center-message p{
  font-size:13px;
  line-height:1.7;
}

/* =========================
   TYPING
========================= */

.typing{
  display:none;

  padding:6px 15px;

  color:var(--muted);

  font-size:12px;
}

.typing.active{
  display:block;
}

/* =========================
   INPUT
========================= */

.input-wrapper{
  flex-shrink:0;

  background:var(--header);

  border-top:1px solid var(--border);

  padding:9px 10px
    calc(9px + env(safe-area-inset-bottom));
}

.input-area{
  max-width:900px;

  margin:auto;

  display:flex;

  align-items:flex-end;

  gap:7px;
}

.attach,
.send{
  width:47px;
  height:47px;

  min-width:47px;

  border:0;
  border-radius:50%;

  cursor:pointer;

  font-size:23px;
}

.attach{
  background:#17253a;
  color:white;
}

.send{
  background:#38bdf8;
  color:#00111c;
}

.send:disabled{
  opacity:.4;
  cursor:not-allowed;
}

textarea{
  flex:1;
  min-width:0;

  min-height:47px;
  max-height:130px;

  resize:none;

  border:0;
  outline:0;

  border-radius:24px;

  background:#182337;
  color:white;

  padding:13px 16px;

  font-family:inherit;
  font-size:14px;
}

textarea::placeholder{
  color:#64748b;
}

/* =========================
   IMAGE PREVIEW
========================= */

.preview{
  display:none;

  max-width:900px;

  margin:auto;

  padding-bottom:8px;
}

.preview.active{
  display:block;
}

.preview-box{
  position:relative;

  display:inline-block;
}

.preview img{
  width:75px;
  height:75px;

  object-fit:cover;

  border-radius:10px;
}

.remove-preview{
  position:absolute;

  top:-7px;
  right:-7px;

  width:23px;
  height:23px;

  border:0;
  border-radius:50%;

  background:#ef4444;
  color:white;

  cursor:pointer;
}

/* =========================
   MENU
========================= */

.side-menu{
  position:fixed;

  z-index:100;

  top:0;
  right:-320px;

  width:300px;
  max-width:88%;

  height:100dvh;

  background:#020617;

  padding:20px;

  transition:.3s;
}

.side-menu.active{
  right:0;
}

.overlay{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,.5);

  z-index:90;

  display:none;
}

.overlay.active{
  display:block;
}

.menu-link{
  display:block;

  width:100%;

  padding:14px;

  margin-top:7px;

  border:0;
  border-radius:12px;

  background:transparent;

  color:white;

  text-decoration:none;

  text-align:left;

  font-family:inherit;

  cursor:pointer;
}

.menu-link:hover{
  background:#17253a;
}

.menu-email{
  display:block;

  margin-top:4px;

  color:#64748b;

  font-size:12px;

  word-break:break-word;
}

hr{
  border:0;
  border-top:1px solid #1e293b;
}

@media(max-width:600px){

  .bubble{
    max-width:85%;
  }

  .profile h2{
    font-size:16px;
  }

}

</style>
</head>

<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGb44",

  authDomain:
    "danny-smart-power.firebaseapp.com",

  databaseURL:
    "https://danny-smart-power-default-rtdb.firebaseio.com",

  projectId:
    "danny-smart-power",

  storageBucket:
    "danny-smart-power.firebasestorage.app",

  messagingSenderId:
    "649735645158",

  appId:
    "1:649735645158:web:cff518b89721a163679827",

  measurementId:
    "G-258YKLP5ZS"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

firebase.initializeApp(firebaseConfig);

const auth =
  firebase.auth();

const db =
  firebase.firestore();

const storage =
  firebase.storage();


/* =====================================================
   ELEMENTS
===================================================== */

const messagesEl =
  document.getElementById("messages");

const input =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const status =
  document.getElementById("status");

const typing =
  document.getElementById("typing");

const fileInput =
  document.getElementById("fileInput");

const preview =
  document.getElementById("preview");

const previewImage =
  document.getElementById("previewImage");

const removePreview =
  document.getElementById("removePreview");

const sideMenu =
  document.getElementById("sideMenu");

const overlay =
  document.getElementById("overlay");


/* =====================================================
   VARIABLES
===================================================== */

let user = null;

let chatId = null;

let selectedFile = null;

let stopMessages = null;

let stopChat = null;

let typingTimer = null;

let sending = false;


/* =====================================================
   AUTH
===================================================== */

auth.onAuthStateChanged(async currentUser => {

  if(!currentUser){

    window.location.href =
      "login.html";

    return;
  }


  user = currentUser;

  /*
   * IMPORTANT:
   * The chat ID is the customer's Firebase UID.
   */

  chatId = user.uid;


  const customerName =
    user.displayName ||
    (
      user.email
        ? user.email.split("@")[0]
        : "Customer"
    );


  document.getElementById(
    "customerName"
  ).textContent =
    customerName;


  document.getElementById(
    "customerEmail"
  ).textContent =
    user.email || "";


  try{

    await createChat();

    status.textContent =
      "Online";


    listenToChat();

    listenToMessages();


  }catch(error){

    console.error(
      "Chat initialization error:",
      error
    );

    showError(
      "Unable to connect to chat.",
      error.message
    );

  }

});


/* =====================================================
   CREATE / UPDATE CHAT
===================================================== */

async function createChat(){

  const chatRef =
    db.collection("chats")
      .doc(chatId);


  const customerName =
    user.displayName ||
    (
      user.email
        ? user.email.split("@")[0]
        : "Customer"
    );


  const data = {

    customerId:
      user.uid,

    customerName:
      customerName,

    customerEmail:
      user.email || "",

    customerPhoto:
      user.photoURL || "",

    status:
      "open",

    customerTyping:
      false,

    adminTyping:
      false,

    unreadForAdmin:
      0,

    unreadForCustomer:
      0,

    lastMessage:
      "",

    lastMessageAt:
      firebase.firestore.FieldValue.serverTimestamp(),

    updatedAt:
      firebase.firestore.FieldValue.serverTimestamp()

  };


  const existing =
    await chatRef.get();


  if(!existing.exists){

    await chatRef.set({

      ...data,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

  }else{

    await chatRef.set(
      data,
      {merge:true}
    );

  }

}


/* =====================================================
   CHAT LISTENER
===================================================== */

function listenToChat(){

  const chatRef =
    db.collection("chats")
      .doc(chatId);


  if(stopChat)
    stopChat();


  stopChat =
    chatRef.onSnapshot(

      snapshot => {

        if(!snapshot.exists)
          return;


        const data =
          snapshot.data();


        if(data.adminTyping === true){

          typing.classList.add(
            "active"
          );

        }else{

          typing.classList.remove(
            "active"
          );

        }

      },

      error => {

        console.error(
          "Chat listener error:",
          error
        );

      }

    );

}


/* =====================================================
   MESSAGE LISTENER
=====================================================

   IMPORTANT:

   We DO NOT use:

   .orderBy("createdAt")

   because that was causing the
   "query requires an index" error.

   We only query by chatId.

   Then JavaScript sorts the messages.
===================================================== */

function listenToMessages(){

  if(stopMessages)
    stopMessages();


  const messagesQuery =
    db.collection("messages")
      .where(
        "chatId",
        "==",
        chatId
      );


  stopMessages =
    messagesQuery.onSnapshot(

      snapshot => {

        const messages = [];


        snapshot.forEach(doc => {

          messages.push({

            id:
              doc.id,

            ...doc.data()

          });

        });


        /*
         * Sort locally.
         * No Firestore composite index required.
         */

        messages.sort(
          (a,b) => {

            const aTime =
              getTimestampValue(
                a.createdAt
              );

            const bTime =
              getTimestampValue(
                b.createdAt
              );

            return aTime - bTime;

          }
        );


        renderMessages(
          messages
        );


        markAdminMessagesRead(
          messages
        );


      },

      error => {

        console.error(
          "Message listener error:",
          error
        );


        showError(
          "Unable to load messages.",
          error.message
        );

      }

    );

}


/* =====================================================
   RENDER ALL MESSAGES
===================================================== */

function renderMessages(messages){

  messagesEl.innerHTML = "";


  addWelcome();


  if(messages.length === 0){

    const empty =
      document.createElement(
        "div"
      );

    empty.style.textAlign =
      "center";

    empty.style.color =
      "#64748b";

    empty.style.fontSize =
      "13px";

    empty.style.padding =
      "15px";


    empty.textContent =
      "Start a conversation with Danny.";


    messagesEl.appendChild(
      empty
    );

    return;

  }


  messages.forEach(message => {

    renderMessage(
      message
    );

  });


  scrollBottom();

}


/* =====================================================
   WELCOME
===================================================== */

function addWelcome(){

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "welcome";


  div.innerHTML = `

    <div class="welcome-icon">
      ⚡
    </div>

    <h1>
      Welcome to Danny Smart Power
    </h1>

    <p>
      Hello 👋, this is Danny. We are here to assist you with your electrical, solar and power needs. Feel free to discuss anything with us. We will reply as soon as possible.
    </p>

  `;


  messagesEl.appendChild(
    div
  );

}


/* =====================================================
   RENDER ONE MESSAGE
=====================================================

   EXACT FIRESTORE STRUCTURE:

   chatId
   createdAt
   imageUrl
   read
   senderId
   senderName
   senderRole
   text
===================================================== */

function renderMessage(data){

  const row =
    document.createElement(
      "div"
    );


  /*
   * CUSTOMER = RIGHT
   * ADMIN = LEFT
   */

  const isCustomer =
    data.senderRole ===
    "customer";


  row.className =
    "message-row " +
    (
      isCustomer
        ? "customer"
        : "admin"
    );


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";


  /* =========================
     IMAGE
  ========================= */

  if(data.imageUrl){

    const img =
      document.createElement(
        "img"
      );


    img.src =
      data.imageUrl;


    img.className =
      "message-image";


    img.alt =
      "Chat image";


    img.onclick = () => {

      window.open(
        data.imageUrl,
        "_blank"
      );

    };


    bubble.appendChild(
      img
    );

  }


  /* =========================
     TEXT
  ========================= */

  if(
    data.text !== undefined &&
    data.text !== null &&
    String(data.text).trim() !== ""
  ){

    const text =
      document.createElement(
        "div"
      );


    text.textContent =
      data.text;


    bubble.appendChild(
      text
    );

  }


  /* =========================
     META
  ========================= */

  const meta =
    document.createElement(
      "div"
    );

  meta.className =
    "meta";


  const time =
    document.createElement(
      "span"
    );


  time.textContent =
    formatTime(
      data.createdAt
    );


  meta.appendChild(
    time
  );


  /*
   * Only customer's own messages
   * show read status.
   */

  if(isCustomer){

    const readStatus =
      document.createElement(
        "span"
      );


    readStatus.className =
      "read-status";


    readStatus.textContent =
      data.read === true
        ? "✓✓"
        : "✓";


    meta.appendChild(
      readStatus
    );

  }


  bubble.appendChild(
    meta
  );


  row.appendChild(
    bubble
  );


  messagesEl.appendChild(
    row
  );

}


/* =====================================================
   MARK ADMIN MESSAGES AS READ
===================================================== */

async function markAdminMessagesRead(
  messages
){

  const unread =
    messages.filter(message =>

      message.senderRole === "admin" &&
      message.read !== true

    );


  if(unread.length === 0)
    return;


  try{

    const batch =
      db.batch();


    unread.forEach(message => {

      const ref =
        db.collection("messages")
          .doc(message.id);


      batch.update(
        ref,
        {
          read:true
        }
      );

    });


    await batch.commit();


    await db.collection("chats")
      .doc(chatId)
      .set({

        unreadForCustomer:0

      },{
        merge:true
      });


  }catch(error){

    console.error(
      "Could not mark messages read:",
      error
    );

  }

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  if(!user)
    return;


  if(sending)
    return;


  const text =
    input.value.trim();


  if(
    !text &&
    !selectedFile
  )
    return;


  sending = true;

  sendButton.disabled =
    true;


  try{

    let imageUrl = "";


    /* =========================
       UPLOAD IMAGE
    ========================= */

    if(selectedFile){

      const path =
        "chat-images/" +
        user.uid +
        "/" +
        Date.now() +
        "_" +
        selectedFile.name;


      const upload =
        await storage
          .ref(path)
          .put(selectedFile);


      imageUrl =
        await upload
          .ref
          .getDownloadURL();

    }


    /* =========================
       MESSAGE
    ========================= */

    const messageRef =
      db.collection("messages")
        .doc();


    await messageRef.set({

      /*
       * EXACT FIELD NAME
       */

      chatId:
        chatId,

      createdAt:
        firebase.firestore.FieldValue
          .serverTimestamp(),

      imageUrl:
        imageUrl,

      read:
        false,

      senderId:
        user.uid,

      senderName:
        user.displayName ||
        (
          user.email
            ? user.email.split("@")[0]
            : "Customer"
        ),

      senderRole:
        "customer",

      text:
        text

    });


    /* =========================
       UPDATE CHAT
    ========================= */

    await db.collection("chats")
      .doc(chatId)
      .set({

        lastMessage:
          text ||
          "📷 Image",

        lastMessageAt:
          firebase.firestore.FieldValue
            .serverTimestamp(),

        updatedAt:
          firebase.firestore.FieldValue
            .serverTimestamp(),

        unreadForAdmin:
          firebase.firestore.FieldValue
            .increment(1),

        unreadForCustomer:
          0,

        customerTyping:
          false,

        status:
          "open"

      },{
        merge:true
      });


    /* =========================
       RESET INPUT
    ========================= */

    input.value = "";

    input.style.height =
      "47px";


    selectedFile =
      null;


    fileInput.value =
      "";


    preview.classList.remove(
      "active"
    );


    stopTyping();

  }catch(error){

    console.error(
      "SEND MESSAGE ERROR:",
      error
    );


    alert(
      "Message could not be sent.\n\n" +
      error.message
    );

  }


  sending =
    false;


  updateSendButton();

}


/* =====================================================
   TYPING
===================================================== */

input.addEventListener(
  "input",
  () => {

    autoResize();

    updateSendButton();


    if(!user)
      return;


    db.collection("chats")
      .doc(chatId)
      .set({

        customerTyping:true

      },{
        merge:true
      })
      .catch(error => {

        console.error(
          "Typing error:",
          error
        );

      });


    clearTimeout(
      typingTimer
    );


    typingTimer =
      setTimeout(
        stopTyping,
        1200
      );

  }
);


function stopTyping(){

  clearTimeout(
    typingTimer
  );


  if(!user)
    return;


  db.collection("chats")
    .doc(chatId)
    .set({

      customerTyping:false

    },{
      merge:true
    })
    .catch(() => {});

}


/* =====================================================
   FILE SELECT
===================================================== */

document
  .getElementById(
    "attachButton"
  )
  .onclick = () => {

    fileInput.click();

  };


fileInput.onchange =
  event => {

    const file =
      event.target.files[0];


    if(!file)
      return;


    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      alert(
        "Please select an image."
      );

      fileInput.value =
        "";

      return;

    }


    selectedFile =
      file;


    const reader =
      new FileReader();


    reader.onload =
      e => {

        previewImage.src =
          e.target.result;


        preview.classList.add(
          "active"
        );


        updateSendButton();

      };


    reader.readAsDataURL(
      file
    );

  };


/* =====================================================
   REMOVE IMAGE
===================================================== */

removePreview.onclick =
  () => {

    selectedFile =
      null;


    fileInput.value =
      "";


    preview.classList.remove(
      "active"
    );


    previewImage.src =
      "";


    updateSendButton();

  };


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.onclick =
  sendMessage;


/* =====================================================
   ENTER TO SEND
===================================================== */

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   SEND BUTTON STATE
===================================================== */

function updateSendButton(){

  sendButton.disabled =
    (
      !input.value.trim() &&
      !selectedFile
    );

}


/* =====================================================
   AUTO RESIZE
===================================================== */

function autoResize(){

  input.style.height =
    "47px";


  input.style.height =
    Math.min(
      input.scrollHeight,
      130
    ) + "px";

}


/* =====================================================
   MENU
===================================================== */

document
  .getElementById(
    "menuButton"
  )
  .onclick = () => {

    sideMenu.classList.add(
      "active"
    );

    overlay.classList.add(
      "active"
    );

  };


overlay.onclick =
  closeMenu;


function closeMenu(){

  sideMenu.classList.remove(
    "active"
  );

  overlay.classList.remove(
    "active"
  );

}


/* =====================================================
   LOGOUT
===================================================== */

document
  .getElementById(

  )

    try{

      await auth.signOut();

      location.href =

    }catch(error){

      );

  };


/* =====================================================
   BACK BUTTON
===================================================== */

document
  .getElementById(
    "backButton"
  )
  .onclick = () => {

    history.back();

  };


/* =====================================================
   SCROLL
===================================================== */

function scrollBottom(){

  setTimeout(
    () => {

      messagesEl.scrollTop =
        messagesEl.scrollHeight;

    },
    100
  );

}


/* =====================================================
   TIMESTAMP
===================================================== */

function getTimestampValue(
  timestamp
){

  if(
    !timestamp
  )
    return 0;


  if(
    typeof timestamp.toMillis ===
    "function"
  ){

    return timestamp.toMillis();

  }


  if(
    timestamp.seconds !== undefined
  ){

    return timestamp.seconds * 1000;

  }


  if(
    timestamp instanceof Date
  ){

    return timestamp.getTime();

  }


  return 0;

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(
  timestamp
){

  if(!timestamp)
    return "";


  let date;


  if(
    typeof timestamp.toDate ===
    "function"
  ){

    date =
      timestamp.toDate();

  }

  else if(
    timestamp.seconds !== undefined
  ){

    date =
      new Date(
        timestamp.seconds * 1000
      );

  }

  else{

    date =
      new Date(timestamp);

  }


  if(
    isNaN(
      date.getTime()
    )
  ){

    return "";

  }


  return date.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =====================================================
   ERROR
===================================================== */

function showError(
  title,
  details
){

  messagesEl.innerHTML = `

    <div class="center-message">

      <div class="icon">
        ⚠️
      </div>

      <h3>
        ${escapeHtml(title)}
      </h3>

      <p>
        ${escapeHtml(details || "")}
      </p>

    </div>

  `;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  text
){

  return String(text || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat with Danny | Danny Smart Power</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0f172a;
  --header:#020617;
  --card:#17253a;
  --blue:#38bdf8;
  --green:#22c55e;
  --text:#f8fafc;
  --muted:#94a3b8;
  --border:rgba(148,163,184,.14);
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Poppins,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.chat-app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

/* ================= HEADER ================= */

.chat-header{
  height:86px;
  flex-shrink:0;
  background:var(--header);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
}

.header-side{
  width:45px;
}

.header-btn{
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:white;
  font-size:28px;
  cursor:pointer;
}

.header-btn:active{
  background:#17253a;
}

.profile{
  display:flex;
  align-items:center;
  gap:11px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#38bdf8,#0284c7);
  font-size:24px;
  overflow:hidden;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile h2{
  font-size:17px;
  font-weight:600;
}

.status{
  color:var(--green);
  font-size:12px;
}

/* ================= MESSAGES ================= */

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:18px 12px 20px;
  scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
  width:5px;
}

.messages::-webkit-scrollbar-thumb{
  background:#334155;
  border-radius:10px;
}

.loading{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  padding:30px;
}

.welcome{
  max-width:600px;
  margin:20px auto 28px;
  padding:25px 18px;
  border:1px solid var(--border);
  border-radius:22px;
  background:#111e30;
  text-align:center;
}

.welcome-icon{
  width:65px;
  height:65px;
  margin:auto;
  margin-bottom:12px;
  border-radius:50%;
  background:#12324b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.welcome h1{
  font-size:21px;
  margin-bottom:8px;
}

.welcome p{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}

.message-row{
  display:flex;
  margin:7px 0;
}

.message-row.customer{
  justify-content:flex-end;
}

.message-row.admin{
  justify-content:flex-start;
}

.bubble{
  max-width:min(78%,520px);
  padding:10px 12px 7px;
  border-radius:17px;
  font-size:14px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.customer .bubble{
  background:#0284c7;
  border-bottom-right-radius:5px;
}

.admin .bubble{
  background:#1b293d;
  border-bottom-left-radius:5px;
}

.message-image{
  display:block;
  width:min(280px,100%);
  max-height:350px;
  object-fit:cover;
  border-radius:12px;
  cursor:pointer;
  margin-bottom:5px;
}

.meta{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:5px;
  margin-top:4px;
  font-size:9px;
  opacity:.75;
}

.seen{
  color:#bae6fd;
  font-size:11px;
}

/* ================= TYPING ================= */

.typing{
  display:none;
  flex-shrink:0;
  padding:6px 15px;
  color:var(--muted);
  font-size:12px;
  background:var(--bg);
}

.typing.active{
  display:block;
}

/* ================= INPUT ================= */

.input-wrapper{
  flex-shrink:0;
  background:var(--header);
  border-top:1px solid var(--border);
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
}

.input-area{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:7px;
}

.attach,
.send{
  width:47px;
  height:47px;
  min-width:47px;
  border:0;
  border-radius:50%;
  cursor:pointer;
  font-size:23px;
}

.attach{
  background:#17253a;
  color:white;
}

.send{
  background:#38bdf8;
  color:#00111c;
}

.send:disabled{
  opacity:.4;
  cursor:not-allowed;
}

textarea{
  flex:1;
  min-width:0;
  min-height:47px;
  max-height:130px;
  resize:none;
  border:0;
  outline:0;
  border-radius:24px;
  background:#182337;
  color:white;
  padding:13px 16px;
  font-family:inherit;
  font-size:14px;
}

textarea::placeholder{
  color:#64748b;
}

.preview{
  display:none;
  max-width:900px;
  margin:auto;
  padding-bottom:8px;
  position:relative;
}

.preview.active{
  display:block;
}

.preview img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid var(--border);
}

.preview-remove{
  position:absolute;
  top:-7px;
  left:62px;
  width:23px;
  height:23px;
  border:0;
  border-radius:50%;
  background:#ef4444;
  color:white;
  cursor:pointer;
  font-size:14px;
}

.hidden{
  display:none;
}

/* ================= SIDE MENU ================= */

.side-menu{
  position:fixed;
  z-index:100;
  top:0;
  right:-320px;
  width:300px;
  max-width:88%;
  height:100dvh;
  background:#020617;
  padding:20px;
  transition:.3s ease;
  overflow-y:auto;
}

.side-menu.active{
  right:0;
}

.side-menu h3{
  font-size:20px;
}

.customer-info{
  margin-top:8px;
}

#customerName{
  display:block;
  font-size:15px;
}

#customerEmail{
  display:block;
  color:var(--muted);
  margin-top:3px;
  font-size:11px;
  word-break:break-all;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:90;
  display:none;
}

.overlay.active{
  display:block;
}

.menu-link{
  display:block;
  width:100%;
  padding:14px;
  margin-top:7px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:white;
  text-decoration:none;
  text-align:left;
  font-family:inherit;
  font-size:14px;
  cursor:pointer;
}

.menu-link:hover{
  background:#17253a;
}

@media(max-width:600px){

  .bubble{
    max-width:85%;
  }

  .profile h2{
    font-size:15px;
  }

  .avatar{
    width:45px;
    height:45px;
  }

  .chat-header{
    height:78px;
  }
}
</style>
</head>

<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>


<script>

const firebaseConfig = {

  apiKey:
    "AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGb44",

  authDomain:
    "danny-smart-power.firebaseapp.com",

  databaseURL:
    "https://danny-smart-power-default-rtdb.firebaseio.com",

  projectId:
    "danny-smart-power",

  storageBucket:
    "danny-smart-power.firebasestorage.app",

  messagingSenderId:
    "649735645158",

  appId:
    "1:649735645158:web:cff518b89721a163679827",

  measurementId:
    "G-258YKLP5ZS"

};

firebase.initializeApp(firebaseConfig);

const auth =
  firebase.auth();

const db =
  firebase.firestore();

const storage =
  firebase.storage();


/* ================= VARIABLES ================= */

const messagesEl =
  document.getElementById("messages");

const loadingEl =
  document.getElementById("loading");

const input =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const status =
  document.getElementById("status");

const typing =
  document.getElementById("typing");

const fileInput =
  document.getElementById("fileInput");

const preview =
  document.getElementById("preview");

const previewImage =
  document.getElementById("previewImage");

const removePreview =
  document.getElementById("removePreview");

const sideMenu =
  document.getElementById("sideMenu");

const overlay =
  document.getElementById("overlay");

let user = null;
let chatRef = null;
let messagesRef = null;
let selectedFile = null;
let stopMessages = null;
let stopChat = null;
let typingTimer = null;
let sending = false;


/* ================= AUTH ================= */

auth.onAuthStateChanged(async currentUser => {

  if(!currentUser){

    window.location.href =
      "login.html";

    return;
  }

  user = currentUser;

  const customerName =
    user.displayName ||
    user.email.split("@")[0];

  document.getElementById(
    "customerName"
  ).textContent =
    customerName;

  document.getElementById(
    "customerEmail"
  ).textContent =
    user.email;


  /*
    IMPORTANT:

    The customer's UID is the chat document ID.

    chats
      └── customer UID
           └── messages
  */

  chatRef =
    db
      .collection("chats")
      .doc(user.uid);

  messagesRef =
    chatRef.collection("messages");


  try{

    await createChat();

    status.textContent =
      "Online";

    if(loadingEl){
      loadingEl.remove();
    }

    listenToChat();

    listenToMessages();

    updateSendButton();

  }

  catch(error){

    console.error(
      "Chat startup error:",
      error
    );

    status.textContent =
      "Connection error";

    if(loadingEl){

      loadingEl.textContent =
        "Unable to connect to chat.";

    }

  }

});


/* ================= CREATE CHAT ================= */

async function createChat(){

  const snapshot =
    await chatRef.get();

  const customerName =
    user.displayName ||
    user.email.split("@")[0];


  const chatData = {

    customerId:
      user.uid,

    customerName:
      customerName,

    customerEmail:
      user.email,

    customerPhoto:
      user.photoURL || "",

    status:
      "open",

    customerTyping:
      false,

    adminTyping:
      false,

    unreadForAdmin:
      0,

    unreadForCustomer:
      0,

    lastMessage:
      "",

    lastMessageAt:
      firebase.firestore.FieldValue.serverTimestamp(),

    updatedAt:
      firebase.firestore.FieldValue.serverTimestamp()

  };


  if(!snapshot.exists){

    await chatRef.set({

      ...chatData,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

  }

  else{

    /*
      Do not reset unread counts or
      lastMessage when the customer
      opens the chat.
    */

    await chatRef.set({

      customerId:
        user.uid,

      customerName:
        customerName,

      customerEmail:
        user.email,

      customerPhoto:
        user.photoURL || "",

      status:
        "open"

    },{
      merge:true
    });

  }

}


/* ================= CHAT LISTENER ================= */

function listenToChat(){

  if(stopChat){
    stopChat();
  }

  stopChat =
    chatRef.onSnapshot(snapshot => {

      const data =
        snapshot.data();

      if(!data){
        return;
      }


      if(data.adminTyping === true){

        typing.classList.add(
          "active"
        );

      }

      else{

        typing.classList.remove(
          "active"
        );

      }

    });

}


/* ================= MESSAGE LISTENER ================= */

function listenToMessages(){

  if(stopMessages){
    stopMessages();
  }


  /*
    Real-time listener.

    Whenever the admin creates a new
    message in this customer's
    messages collection, this function
    runs automatically.
  */

  stopMessages =
    messagesRef
      .orderBy(
        "createdAt",
        "asc"
      )
      .onSnapshot(

        snapshot => {

          messagesEl.innerHTML = "";

          addWelcome();


          snapshot.forEach(doc => {

            renderMessage(
              doc.id,
              doc.data()
            );

          });


          markAdminMessagesRead(
            snapshot
          );


          scrollBottom();

        },

        error => {

          console.error(
            "Message listener error:",
            error
          );

        }

      );

}


/* ================= WELCOME ================= */

function addWelcome(){

  const div =
    document.createElement("div");

  div.className =
    "welcome";

  div.innerHTML = `

    <div class="welcome-icon">
      ⚡
    </div>

    <h1>
      Welcome to Danny Smart Power
    </h1>

    <p>
      Hello 👋. How can we help you today
      with your electrical, solar and power needs?
    </p>

  `;

  messagesEl.appendChild(div);

}


/* ================= RENDER MESSAGE ================= */

function renderMessage(
  id,
  data
){

  const row =
    document.createElement("div");


  /*
    senderRole controls the side.

    customer = right
    admin = left
  */

  const mine =
    data.senderRole ===
    "customer";


  row.className =
    "message-row " +
    (
      mine
        ? "customer"
        : "admin"
    );


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  /*
    IMAGE

    Firestore field:
    imageUrl
  */

  if(data.imageUrl){

    const img =
      document.createElement("img");

    img.src =
      data.imageUrl;

    img.className =
      "message-image";

    img.alt =
      "Chat image";

    img.loading =
      "lazy";

    img.onclick = () => {

      window.open(
        data.imageUrl,
        "_blank"
      );

    };

    bubble.appendChild(img);

  }


  /*
    TEXT

    Firestore field:
    text
  */

  if(data.text){

    const text =
      document.createElement("div");

    text.textContent =
      data.text;

    bubble.appendChild(text);

  }


  /*
    TIME
  */

  const meta =
    document.createElement("div");

  meta.className =
    "meta";


  meta.appendChild(
    document.createTextNode(
      formatTime(
        data.createdAt
      )
    )
  );


  /*
    READ STATUS

    Firestore field:
    read

    Only customer's messages
    show check marks.
  */

  if(mine){

    const read =
      document.createElement("span");

    read.className =
      "seen";

    read.textContent =
      data.read === true
        ? "✓✓"
        : "✓";

    meta.appendChild(
      read
    );

  }


  bubble.appendChild(
    meta
  );

  row.appendChild(
    bubble
  );

  messagesEl.appendChild(
    row
  );

}


/* ================= SEND MESSAGE ================= */

async function sendMessage(){

  if(
    !user ||
    !chatRef ||
    !messagesRef ||
    sending
  ){

    return;
  }


  const text =
    input.value.trim();


  if(
    !text &&
    !selectedFile
  ){

    return;
  }


  sending =
    true;

  updateSendButton();


  try{

    let imageUrl = "";


    /*
      UPLOAD IMAGE
    */

    if(selectedFile){

      const safeName =
        selectedFile.name
          .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


      const storagePath =
        "chat-images/" +
        user.uid +
        "/" +
        Date.now() +
        "_" +
        safeName;


      const upload =
        await storage
          .ref(storagePath)
          .put(selectedFile);


      imageUrl =
        await upload.ref
          .getDownloadURL();

    }


    /*
      CREATE MESSAGE REFERENCE
    */

    const messageRef =
      messagesRef.doc();


    /*
      THIS IS THE EXACT
      FIRESTORE MESSAGE STRUCTURE
    */

    const messageData = {

      chatId:
        user.uid,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp(),

      imageUrl:
        imageUrl,

      read:
        false,

      senderId:
        user.uid,

      senderName:
        user.displayName ||
        user.email.split("@")[0],

      senderRole:
        "customer",

      text:
        text

    };


    /*
      BATCH WRITE
    */

    const batch =
      db.batch();


    batch.set(
      messageRef,
      messageData
    );


    /*
      UPDATE CHAT DOCUMENT
    */

    batch.set(

      chatRef,

      {

        customerId:
          user.uid,

        customerName:
          user.displayName ||
          user.email.split("@")[0],

        customerEmail:
          user.email,

        customerPhoto:
          user.photoURL || "",

        lastMessage:
          text ||
          "📷 Image",

        lastMessageAt:
          firebase.firestore.FieldValue.serverTimestamp(),

        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp(),

        unreadForAdmin:
          firebase.firestore.FieldValue.increment(1),

        unreadForCustomer:
          0,

        customerTyping:
          false,

        status:
          "open"

      },

      {
        merge:true
      }

    );


    await batch.commit();


    /*
      RESET INPUT
    */

    input.value = "";

    input.style.height =
      "47px";


    selectedFile =
      null;

    fileInput.value =
      "";

    previewImage.src =
      "";

    preview.classList.remove(
      "active"
    );


    stopTyping();

    updateSendButton();

    scrollBottom();

  }

  catch(error){

    console.error(
      "Send message error:",
      error
    );

    alert(
      "Message could not be sent. Please try again."
    );

  }

  finally{

    sending =
      false;

    updateSendButton();

  }

}


/* ================= MARK ADMIN READ ================= */

async function markAdminMessagesRead(
  snapshot
){

  const batch =
    db.batch();

  let count =
    0;


  snapshot.forEach(doc => {

    const data =
      doc.data();


    /*
      Only admin messages that
      have not been read yet.
    */

    if(
      data.senderRole === "admin" &&
      data.read === false
    ){

      batch.update(

        doc.ref,

        {

          read:
            true

        }

      );

      count++;

    }

  });


  if(count === 0){
    return;
  }


  try{

    await batch.commit();


    await chatRef.set(

      {

        unreadForCustomer:
          0

      },

      {

        merge:true

      }

    );

  }

  catch(error){

    console.error(
      "Read status error:",
      error
    );

  }

}


/* ================= TYPING ================= */

input.addEventListener(
  "input",
  () => {

    autoResize();

    updateSendButton();


    if(!user || !chatRef){
      return;
    }


    chatRef.set(

      {

        customerTyping:
          true

      },

      {

        merge:true

      }

    );


    clearTimeout(
      typingTimer
    );


    typingTimer =
      setTimeout(
        stopTyping,
        1200
      );

  }
);


function stopTyping(){

  clearTimeout(
    typingTimer
  );


  if(
    user &&
    chatRef
  ){

    chatRef.set(

      {

        customerTyping:
          false

      },

      {

        merge:true

      }

    );

  }

}


/* ================= FILE ================= */

document
  .getElementById("attachButton")
  .onclick =
  () => {

    fileInput.click();

  };


fileInput.onchange =
  event => {

    const file =
      event.target.files[0];


    if(!file){
      return;
    }


    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      alert(
        "Please select an image."
      );

      fileInput.value =
        "";

      return;

    }


    if(
      file.size >
      10 * 1024 * 1024
    ){

      alert(
        "Please choose an image smaller than 10 MB."
      );

      fileInput.value =
        "";

      return;

    }


    selectedFile =
      file;


    const reader =
      new FileReader();


    reader.onload =
      event => {

        previewImage.src =
          event.target.result;

        preview.classList.add(
          "active"
        );

        updateSendButton();

      };


    reader.readAsDataURL(
      file
    );

  };


/* ================= REMOVE IMAGE ================= */

removePreview.onclick =
  () => {

    selectedFile =
      null;

    fileInput.value =
      "";

    previewImage.src =
      "";

    preview.classList.remove(
      "active"
    );

    updateSendButton();

  };


/* ================= INPUT ================= */

sendButton.onclick =
  sendMessage;


input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


function updateSendButton(){

  sendButton.disabled =
    (
      !input.value.trim() &&
      !selectedFile
    ) ||
    sending;

}


function autoResize(){

  input.style.height =
    "47px";

  input.style.height =
    Math.min(
      input.scrollHeight,
      130
    ) + "px";

}


/* ================= MENU ================= */

document
  .getElementById("menuButton")
  .onclick =
  () => {

    sideMenu.classList.add(
      "active"
    );

    overlay.classList.add(
      "active"
    );

  };


overlay.onclick =
  closeMenu;


function closeMenu(){

  sideMenu.classList.remove(
    "active"
  );

  overlay.classList.remove(
    "active"
  );

}


/* ================= LOGOUT ================= */

document
  .getElementById("logout")
  .onclick =
  async () => {

    try{

      await auth.signOut();

      location.href =
        "login.html";

    }

    catch(error){

      console.error(
        "Logout error:",
        error
      );

    }

  };


/* ================= BACK ================= */

document
  .getElementById("backButton")
  .onclick =
  () => {

    history.back();

  };


/* ================= SCROLL ================= */

function scrollBottom(){

  setTimeout(
    () => {

      messagesEl.scrollTop =
        messagesEl.scrollHeight;

    },
    100
  );

}


/* ================= TIME ================= */

function formatTime(
  timestamp
){

  if(
    !timestamp ||
    !timestamp.toDate
  ){

    return "";

  }


  return timestamp
    .toDate()
    .toLocaleTimeString(
      [],
      {

        hour:
          "2-digit",

        minute:
          "2-digit"

      }
    );

}


/* ================= CLEANUP ================= */

window.addEventListener(
  "beforeunload",
  () => {

    if(stopMessages){
      stopMessages();
    }

    if(stopChat){
      stopChat();
    }

  }
);

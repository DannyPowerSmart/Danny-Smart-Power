<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Chat | Danny Smart Power</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  font-family:'Poppins',sans-serif;
  background:#0f172a;
  color:#f8fafc;
  overflow:hidden;
}


/* =====================================================
   VARIABLES
===================================================== */

:root{

  --bg:#0f172a;
  --header:#020617;

  --chat-bg:#0b1322;

  --card:#111e30;
  --card2:#17253a;

  --border:rgba(148,163,184,.15);

  --blue:#38bdf8;
  --blue2:#0284c7;

  --green:#22c55e;
  --red:#ef4444;
  --yellow:#facc15;

  --text:#f8fafc;
  --muted:#94a3b8;

  --customer:#0284c7;
  --admin:#1e293b;

}


/* =====================================================
   LIGHT MODE
===================================================== */

body.light{

  --bg:#f1f5f9;
  --header:#ffffff;

  --chat-bg:#eaf0f6;

  --card:#ffffff;
  --card2:#e2e8f0;

  --border:rgba(15,23,42,.12);

  --text:#0f172a;
  --muted:#64748b;

  --admin:#ffffff;

}


/* =====================================================
   APP
===================================================== */

.chat-app{

  width:100%;
  height:100dvh;

  display:flex;
  flex-direction:column;

  background:var(--chat-bg);

}


/* =====================================================
   HEADER
===================================================== */

.chat-header{

  height:76px;

  flex-shrink:0;

  display:flex;
  align-items:center;

  padding:0 14px;

  background:var(--header);

  border-bottom:1px solid var(--border);

  z-index:20;

}


.back-btn{

  width:42px;
  height:42px;

  border:0;
  border-radius:50%;

  background:transparent;

  color:var(--text);

  font-size:27px;

  cursor:pointer;

}


.back-btn:hover{
  background:var(--card2);
}


.header-avatar{

  position:relative;

  width:46px;
  height:46px;

  margin-left:3px;
  margin-right:11px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--blue2)
    );

  color:#00111c;

  font-size:22px;

  font-weight:700;

}


.online-dot{

  position:absolute;

  right:-1px;
  bottom:1px;

  width:13px;
  height:13px;

  border-radius:50%;

  background:var(--green);

  border:3px solid var(--header);

}


.header-info{

  min-width:0;
  flex:1;

}


.header-info h1{

  font-size:15px;
  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

}


.header-status{

  color:var(--muted);

  font-size:10px;

  margin-top:2px;

}


.header-actions{

  display:flex;
  align-items:center;
  gap:4px;

}


.header-btn{

  width:40px;
  height:40px;

  border:0;
  border-radius:50%;

  background:transparent;

  color:var(--text);

  font-size:20px;

  cursor:pointer;

}


.header-btn:hover{
  background:var(--card2);
}


/* =====================================================
   CHAT AREA
===================================================== */

.messages{

  flex:1;

  overflow-y:auto;

  padding:18px 13px 18px;

  scroll-behavior:smooth;

  background:

    radial-gradient(
      circle at top,
      rgba(56,189,248,.06),
      transparent 35%
    ),

    var(--chat-bg);

}


.messages::-webkit-scrollbar{
  width:5px;
}


.messages::-webkit-scrollbar-thumb{

  background:rgba(148,163,184,.25);

  border-radius:10px;

}


/* =====================================================
   DATE DIVIDER
===================================================== */

.date-divider{

  display:flex;
  align-items:center;
  gap:10px;

  margin:7px auto 17px;

  max-width:350px;

  color:var(--muted);

  font-size:10px;

}


.date-divider::before,
.date-divider::after{

  content:"";

  height:1px;

  flex:1;

  background:var(--border);

}


.date-divider span{

  padding:5px 10px;

  border-radius:20px;

  background:rgba(148,163,184,.08);

}


/* =====================================================
   WELCOME CARD
===================================================== */

.welcome{

  max-width:400px;

  margin:18px auto 20px;

  text-align:center;

}


.welcome-logo{

  width:68px;
  height:68px;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:22px;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--blue2)
    );

  color:#00111c;

  font-size:32px;

  box-shadow:
    0 12px 30px rgba(2,132,199,.22);

}


.welcome h2{

  margin-top:13px;

  font-size:18px;

}


.welcome p{

  margin-top:6px;

  color:var(--muted);

  font-size:11px;

  line-height:1.7;

}


/* =====================================================
   QUICK HELP
===================================================== */

.quick-help{

  display:flex;

  gap:8px;

  overflow-x:auto;

  padding:2px 2px 14px;

  scrollbar-width:none;

}


.quick-help::-webkit-scrollbar{
  display:none;
}


.quick-btn{

  flex-shrink:0;

  border:1px solid var(--border);

  background:var(--card);

  color:var(--text);

  padding:9px 13px;

  border-radius:22px;

  font-family:inherit;

  font-size:10px;

  cursor:pointer;

}


.quick-btn:hover{

  border-color:var(--blue);

  background:var(--card2);

}


/* =====================================================
   MESSAGE ROW
===================================================== */

.message-row{

  display:flex;

  margin:5px 0;

}


.message-row.customer{

  justify-content:flex-end;

}


.message-row.admin{

  justify-content:flex-start;

}


.message{

  max-width:min(78%,430px);

  position:relative;

}


.bubble{

  padding:10px 12px 8px;

  border-radius:17px;

  font-size:13px;

  line-height:1.55;

  word-wrap:break-word;

  white-space:pre-wrap;

  box-shadow:
    0 3px 10px rgba(0,0,0,.06);

}


.customer .bubble{

  background:var(--customer);

  color:white;

  border-bottom-right-radius:5px;

}


.admin .bubble{

  background:var(--admin);

  color:var(--text);

  border:1px solid var(--border);

  border-bottom-left-radius:5px;

}


.message-meta{

  display:flex;

  justify-content:flex-end;

  align-items:center;

  gap:4px;

  margin-top:4px;

  font-size:9px;

  color:var(--muted);

}


.customer .message-meta{
  color:rgba(255,255,255,.68);
}


.read-status{
  font-size:10px;
}


.read-status.read{
  color:#7dd3fc;
}


/* =====================================================
   IMAGE MESSAGE
===================================================== */

.chat-image{

  display:block;

  width:min(260px,100%);

  max-height:300px;

  object-fit:cover;

  border-radius:13px;

  cursor:pointer;

  border:1px solid var(--border);

}


.image-caption{

  margin-top:7px;

}


/* =====================================================
   REPLY PREVIEW
===================================================== */

.reply-preview{

  border-left:3px solid var(--blue);

  padding:6px 8px;

  margin-bottom:7px;

  border-radius:5px;

  background:rgba(56,189,248,.08);

  color:var(--muted);

  font-size:10px;

}


.reply-name{

  color:var(--blue);

  font-weight:600;

  margin-bottom:2px;

}


/* =====================================================
   TYPING
===================================================== */

.typing{

  display:none;

  align-items:center;

  gap:7px;

  margin:8px 0 5px 3px;

}


.typing.show{
  display:flex;
}


.typing-bubble{

  display:flex;
  gap:3px;

  padding:9px 12px;

  background:var(--admin);

  border:1px solid var(--border);

  border-radius:16px;

}


.typing-bubble i{

  width:5px;
  height:5px;

  border-radius:50%;

  background:var(--muted);

  animation:bounce 1.2s infinite;

}


.typing-bubble i:nth-child(2){
  animation-delay:.15s;
}


.typing-bubble i:nth-child(3){
  animation-delay:.3s;
}


@keyframes bounce{

  0%,60%,100%{
    transform:translateY(0);
  }

  30%{
    transform:translateY(-4px);
  }

}


/* =====================================================
   EMPTY / LOADING
===================================================== */

.loading-chat{

  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  gap:10px;

  color:var(--muted);

  font-size:12px;

}


.spinner{

  width:28px;
  height:28px;

  border:3px solid rgba(148,163,184,.2);

  border-top-color:var(--blue);

  border-radius:50%;

  animation:spin .8s linear infinite;

}


@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =====================================================
   COMPOSER
===================================================== */

.composer-area{

  flex-shrink:0;

  padding:8px 10px;

  background:var(--header);

  border-top:1px solid var(--border);

}


/* =====================================================
   REPLY BAR
===================================================== */

.reply-bar{

  display:none;

  align-items:center;

  gap:8px;

  padding:8px 10px;

  margin-bottom:7px;

  border-radius:12px;

  background:var(--card2);

}


.reply-bar.show{
  display:flex;
}


.reply-bar-content{

  flex:1;
  min-width:0;

}


.reply-bar strong{

  display:block;

  color:var(--blue);

  font-size:10px;

}


.reply-bar span{

  display:block;

  color:var(--muted);

  font-size:10px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


.cancel-reply{

  border:0;

  background:transparent;

  color:var(--muted);

  font-size:20px;

  cursor:pointer;

}


/* =====================================================
   ATTACHMENT PREVIEW
===================================================== */

.attachment-preview{

  display:none;

  position:relative;

  width:75px;
  height:75px;

  margin:0 0 8px 5px;

}


.attachment-preview.show{
  display:block;
}


.attachment-preview img{

  width:75px;
  height:75px;

  object-fit:cover;

  border-radius:12px;

  border:2px solid var(--blue);

}


.remove-attachment{

  position:absolute;

  top:-8px;
  right:-8px;

  width:23px;
  height:23px;

  border:2px solid var(--header);

  border-radius:50%;

  background:var(--red);

  color:white;

  cursor:pointer;

  font-size:13px;

}


/* =====================================================
   INPUT ROW
===================================================== */

.input-row{

  display:flex;

  align-items:flex-end;

  gap:6px;

}


.attach-btn,
.emoji-btn,
.send-btn{

  flex-shrink:0;

  width:43px;
  height:43px;

  border:0;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;

  cursor:pointer;

}


.attach-btn,
.emoji-btn{

  background:var(--card2);

  color:var(--text);

}


.attach-btn:hover,
.emoji-btn:hover{

  background:var(--blue2);

  color:white;

}


.send-btn{

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--blue2)
    );

  color:#00111c;

  font-size:19px;

}


.send-btn:disabled{

  opacity:.45;

  cursor:not-allowed;

}


.message-input{

  flex:1;

  min-width:0;

  max-height:120px;

  min-height:43px;

  resize:none;

  border:1px solid var(--border);

  outline:none;

  border-radius:22px;

  padding:11px 14px;

  background:var(--card);

  color:var(--text);

  font-family:inherit;

  font-size:12px;

  line-height:1.5;

}


.message-input:focus{

  border-color:rgba(56,189,248,.55);

}


.message-input::placeholder{

  color:var(--muted);

}


/* =====================================================
   HIDDEN FILE INPUT
===================================================== */

#photoInput{
  display:none;
}


/* =====================================================
   NOTIFICATION TOAST
===================================================== */

.notification-toast{

  position:fixed;

  left:50%;

  top:88px;

  transform:
    translate(-50%,-25px);

  opacity:0;

  pointer-events:none;

  width:min(350px,calc(100% - 25px));

  padding:12px 14px;

  display:flex;

  align-items:center;

  gap:10px;

  background:var(--header);

  border:1px solid var(--border);

  border-radius:15px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.3);

  transition:.25s;

  z-index:100;

}


.notification-toast.show{

  transform:
    translate(-50%,0);

  opacity:1;

}


.notification-toast-icon{

  width:36px;
  height:36px;

  border-radius:11px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(56,189,248,.12);

  font-size:18px;

}


.notification-toast-text{
  min-width:0;
}


.notification-toast-text strong{

  display:block;

  font-size:11px;

}


.notification-toast-text span{

  display:block;

  margin-top:2px;

  color:var(--muted);

  font-size:10px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


/* =====================================================
   IMAGE VIEWER
===================================================== */

.image-viewer{

  position:fixed;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.9);

  z-index:200;

}


.image-viewer.show{
  display:flex;
}


.image-viewer img{

  max-width:100%;
  max-height:90vh;

  object-fit:contain;

  border-radius:12px;

}


.close-viewer{

  position:absolute;

  top:18px;
  right:18px;

  width:43px;
  height:43px;

  border:0;
  border-radius:50%;

  background:rgba(255,255,255,.12);

  color:white;

  font-size:23px;

  cursor:pointer;

}


/* =====================================================
   MESSAGE ACTION MENU
===================================================== */

.message-menu{

  position:fixed;

  display:none;

  width:180px;

  padding:6px;

  background:var(--header);

  border:1px solid var(--border);

  border-radius:14px;

  box-shadow:
    0 15px 40px rgba(0,0,0,.35);

  z-index:150;

}


.message-menu.show{
  display:block;
}


.menu-action{

  width:100%;

  border:0;

  background:transparent;

  color:var(--text);

  text-align:left;

  padding:10px;

  border-radius:9px;

  font-family:inherit;

  font-size:11px;

  cursor:pointer;

}


.menu-action:hover{
  background:var(--card2);
}


.menu-action.danger{
  color:#fca5a5;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .chat-header{
    height:70px;
  }

  .message{
    max-width:85%;
  }

  .messages{
    padding-left:10px;
    padding-right:10px;
  }

  .header-btn{
    width:36px;
    height:36px;
  }

  .attach-btn,
  .emoji-btn,
  .send-btn{
    width:41px;
    height:41px;
  }

}


/* =====================================================
   SAFE AREA
===================================================== */

@supports(padding:env(safe-area-inset-bottom)){

  .composer-area{

    padding-bottom:
      calc(8px + env(safe-area-inset-bottom));

  }

}

</style>

</head>

     HEADER

</div>


<!-- =====================================================

===================================================== -->

<div
class="notification-toast"
id="notificationToast">

    <strong>
      Danny Smart Power
    </strong>

    <span id="notificationText">
      New message
    </span>

  </div>

</div>


<!-- =====================================================
     IMAGE VIEWER
===================================================== -->

<div
class="image-viewer"
id="imageViewer">


  <button
  class="close-viewer"
  id="closeViewer">

    ×

  </button>


  <img
  id="viewerImage"
  alt="Chat image">

</div>


<!-- =====================================================
     MESSAGE MENU
===================================================== -->

<div
class="message-menu"
id="messageMenu">

  <button
  class="menu-action"
  id="replyAction">

    ↩️ Reply

  </button>


  <button
  class="menu-action"
  id="copyAction">

    📋 Copy

  </button>


  <button
  class="menu-action danger"
  id="deleteAction">

    🗑️ Delete

</div>

document.getElementById("imageViewer");

const viewerImage =
document.getElementById("viewerImage");

const messageMenu =
document.getElementById("messageMenu");


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let chatId = null;

let unsubscribeMessages = null;

let unsubscribeChat = null;

let selectedPhoto = null;

let selectedPhotoData = null;

let replyMessage = null;

let menuMessage = null;

let firstMessageLoad = true;

let previousMessageCount = 0;

let typingTimer = null;


/* =====================================================
   AUTH
===================================================== */

auth.onAuthStateChanged(

  async function(user){

    if(!user){

      window.location.href =
        "login.html";

      return;

    }


    currentUser = user;


    chatId =
      user.uid;


    await startChat();

  }

);


/* =====================================================
   START CHAT
===================================================== */

async function startChat(){

  try{

    const name =
      currentUser.displayName ||
      currentUser.email
        .split("@")[0];


    const chatRef =
      db.collection("chats")
        .doc(chatId);


    const existing =
      await chatRef.get();


    if(!existing.exists){

      await chatRef.set({

        customerId:
          currentUser.uid,

        customerName:
          name,

        customerPhoto:
          currentUser.photoURL || "",

        lastMessage:
          "",

        lastMessageAt:
          firebase.firestore.FieldValue.serverTimestamp(),

        unreadForAdmin:
          0,

        unreadForCustomer:
          0,

        status:
          "active",

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });

    }


    subscribeToChat();


    subscribeToMessages();


    loadingChat.style.display =
      "none";


  }

  catch(error){

    console.error(error);

    loadingChat.innerHTML =

      "Unable to load chat.<br>" +
      "Please refresh the page.";

  }

}


/* =====================================================
   CHAT DOCUMENT
===================================================== */

function subscribeToChat(){

  unsubscribeChat =
    db.collection("chats")
      .doc(chatId)
      .onSnapshot(

        function(snapshot){

          if(!snapshot.exists){
            return;
          }


          const data =
            snapshot.data();


          if(data.status === "closed"){

            headerStatus.textContent =
              "Support chat closed";

          }

          else{

            headerStatus.textContent =
              "🟢 Support available";

          }

        }

      );

}


/* =====================================================
   MESSAGES
===================================================== */

function subscribeToMessages(){

  if(unsubscribeMessages){

    unsubscribeMessages();

  }


  unsubscribeMessages =

    db.collection("chats")
      .doc(chatId)
      .collection("messages")
      .orderBy("createdAt","asc")
      .onSnapshot(

        async function(snapshot){

          const messages =
            snapshot.docs;


          renderMessages(messages);


          if(
            !firstMessageLoad &&
            messages.length >
            previousMessageCount
          ){

            const newest =
              messages[messages.length - 1];

            const data =
              newest.data();


            if(
              data.senderId !==
              currentUser.uid
            ){

              showNewMessageNotification(
                data
              );

            }

          }


          previousMessageCount =
            messages.length;


          firstMessageLoad =
            false;


          await markCustomerMessagesRead();

        },

        function(error){

          console.error(
            "Message listener:",
            error
          );

        }

      );

}


/* =====================================================
   RENDER
===================================================== */

function renderMessages(docs){

  messagesEl.innerHTML = "";


  if(!docs.length){

    renderWelcome();

    return;

  }


  const divider =
    document.createElement("div");


  divider.className =
    "date-divider";


  divider.innerHTML =
    "<span>Today</span>";


  messagesEl.appendChild(
    divider
  );


  docs.forEach(

    function(doc){

      const data =
        doc.data();


      renderMessage(
        doc.id,
        data
      );

    }

  );


  scrollToBottom();

}

/* =====================================================
   MESSAGE
===================================================== */

function renderMessage(id,data){

  const isCustomer =
    data.senderId ===
    currentUser.uid;


  const row =
    document.createElement("div");


  row.className =
    "message-row " +
    (
      isCustomer
      ? "customer"
      : "admin"
    );


  const wrapper =
    document.createElement("div");


  wrapper.className =
    "message";


  let html = "";


  /* REPLY */

  if(data.replyText){

    html += `

      <div class="reply-preview">

        <div class="reply-name">
          ${escapeHTML(
            data.replyName || "Message"
          )}
        </div>

        ${escapeHTML(
          data.replyText
        )}

      </div>

    `;

  }


  /* IMAGE */

  if(data.image){

    html += `

      <img
      class="chat-image"
      src="${data.image}"
      alt="Sent photo"
      data-image="${data.image}">

    `;

  }


  /* TEXT */

  if(data.text){

    html += `

      <div
      class="${
        data.image
        ? "image-caption"
        : ""
      }">

        ${escapeHTML(data.text)}

      </div>

    `;

  }


  const time =
    formatTime(
      data.createdAt
    );


  let status = "";


  if(isCustomer){

    status =

      data.read

      ? `<span class="read-status read">✓✓</span>`

      : `<span class="read-status">✓✓</span>`;

  }


  html += `

    <div class="message-meta">

      <span>
        ${time}
      </span>

      ${status}

    </div>

  `;


  wrapper.innerHTML =

    `<div class="bubble">${html}</div>`;


  row.appendChild(
    wrapper
  );


  /* IMAGE VIEWER */

  wrapper
    .querySelectorAll(".chat-image")
    .forEach(

      function(img){

        img.addEventListener(

          "click",

          function(){

            openImage(
              img.dataset.image
            );

          }

        );

      }

    );


  /* CONTEXT MENU */

  wrapper.addEventListener(

    "contextmenu",

    function(event){

      event.preventDefault();

      openMessageMenu(
        event.clientX,
        event.clientY,
        id,
        data
      );

    }

  );


  messagesEl.appendChild(
    row
  );

}


/* =====================================================
   SEND
===================================================== */

sendButton.addEventListener(

  "click",

  sendMessage

);


messageInput.addEventListener(

  "keydown",

  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }

);


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const text =
    messageInput.value.trim();


  if(
    !text &&
    !selectedPhotoData
  ){

    return;

  }


  sendButton.disabled =
    true;


  try{

    const messageData = {

      senderId:
        currentUser.uid,

      senderName:
        currentUser.displayName ||
        currentUser.email
          .split("@")[0],

      senderPhoto:
        currentUser.photoURL || "",

      text:
        text,

      image:
        selectedPhotoData || "",

      read:
        false,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    };


    /* REPLY */

    if(replyMessage){

      messageData.replyText =
        replyMessage.text ||
        "Photo";

      messageData.replyName =
        replyMessage.senderName ||
        "Message";

      messageData.replyTo =
        replyMessage.id;

    }


    await db.collection("chats")
      .doc(chatId)
      .collection("messages")
      .add(messageData);


    let preview =
      text;


    if(!preview && selectedPhotoData){

      preview =
        "📷 Photo";

    }


    await db.collection("chats")
      .doc(chatId)
      .update({

        lastMessage:
          preview,

        lastMessageAt:
          firebase.firestore.FieldValue.serverTimestamp(),

        unreadForAdmin:
          firebase.firestore.FieldValue.increment(1),

        status:
          "active"

      });


    messageInput.value = "";


    clearPhoto();


    cancelReplyMode();


    autoResize();


    scrollToBottom();

  }

  catch(error){

    console.error(error);

    alert(
      "Message could not be sent.\n\n" +
      error.message
    );

  }

  finally{

    sendButton.disabled =
      false;

  }

}


/* =====================================================
   PHOTO PICKER
===================================================== */

photoButton.addEventListener(

  "click",

  function(){

    photoInput.click();

  }

);


photoInput.addEventListener(

  "change",

  async function(){

    const file =
      photoInput.files[0];


    if(!file){
      return;
    }


    if(!file.type.startsWith("image/")){

      alert(
        "Please select an image."
      );

      return;

    }


    try{

      selectedPhotoData =
        await compressImage(file);


      selectedPhoto =
        file;


      attachmentImage.src =
        selectedPhotoData;


      attachmentPreview
        .classList.add("show");

    }

    catch(error){

      console.error(error);

      alert(
        "Could not prepare this photo."
      );

    }

  }

);


/* =====================================================
   COMPRESS IMAGE
===================================================== */

function compressImage(file){

  return new Promise(

    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(event){

          const img =
            new Image();


          img.onload =
            function(){

              const maxSize =
                700;


              let width =
                img.width;

              let height =
                img.height;


              if(width > height){

                if(width > maxSize){

                  height =
                    height *
                    maxSize /
                    width;

                  width =
                    maxSize;

                }

              }

              else{

                if(height > maxSize){

                  width =
                    width *
                    maxSize /
                    height;

                  height =
                    maxSize;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(

                img,

                0,
                0,

                width,
                height

              );


              const result =
                canvas.toDataURL(
                  "image/jpeg",
                  .65
                );


              /*
                Keep photos small because
                they are temporarily stored
                directly in Firestore.
              */

              if(
                result.length >
                180000
              ){

                resolve(
                  canvas.toDataURL(
                    "image/jpeg",
                    .45
                  )
                );

              }

              else{

                resolve(result);

              }

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    }

  );

}


/* =====================================================
   CLEAR PHOTO
===================================================== */

removeAttachment.addEventListener(

  "click",

  clearPhoto

);


function clearPhoto(){

  selectedPhoto =
    null;

  selectedPhotoData =
    null;

  photoInput.value =
    "";

  attachmentImage.src =
    "";

  attachmentPreview
    .classList.remove("show");

}


/* =====================================================
   REPLY
===================================================== */

function startReply(id,data){

  replyMessage = {

    id:
      id,

    text:
      data.text || "",

    senderName:
      data.senderName ||
      "Message"

  };


  replyName.textContent =
    "Replying to " +
    replyMessage.senderName;


  replyText.textContent =
    replyMessage.text ||
    "📷 Photo";


  replyBar
    .classList.add("show");


  messageInput.focus();

}


cancelReply.addEventListener(

  "click",

  cancelReplyMode

);


function cancelReplyMode(){

  replyMessage =
    null;

  replyBar
    .classList.remove("show");

}


/* =====================================================
   MESSAGE MENU
===================================================== */

function openMessageMenu(
  x,
  y,
  id,
  data
){

  menuMessage = {

    id:
      id,

    data:
      data

  };


  messageMenu.style.left =
    Math.min(
      x,
      window.innerWidth - 195
    ) + "px";


  messageMenu.style.top =
    Math.min(
      y,
      window.innerHeight - 170
    ) + "px";


  messageMenu.classList.add(
    "show"
  );

}


document.addEventListener(

  "click",

  function(event){

    if(
      !messageMenu.contains(
        event.target
      )
    ){

      messageMenu
        .classList.remove("show");

    }

  }

);


/* =====================================================
   REPLY ACTION
===================================================== */

document
.getElementById("replyAction")
.addEventListener(

  "click",

  function(){

    if(!menuMessage){
      return;
    }


    startReply(

      menuMessage.id,

      menuMessage.data

    );


    closeMessageMenu();

  }

);


/* =====================================================
   COPY ACTION
===================================================== */

document
.getElementById("copyAction")
.addEventListener(

  "click",

  async function(){

    if(
      !menuMessage ||
      !menuMessage.data.text
    ){

      closeMessageMenu();

      return;

    }


    try{

      await navigator.clipboard.writeText(

        menuMessage.data.text

      );


      showToast(
        "Message copied ✓"
      );

    }

    catch(error){

      alert(
        menuMessage.data.text
      );

    }


    closeMessageMenu();

  }

);


/* =====================================================
   DELETE ACTION
===================================================== */

document
.getElementById("deleteAction")
.addEventListener(

  "click",

  async function(){

    if(!menuMessage){
      return;
    }


    const data =
      menuMessage.data;


    if(
      data.senderId !==
      currentUser.uid
    ){

      alert(
        "You can only delete your own messages."
      );

      closeMessageMenu();

      return;

    }


    const confirmed =
      confirm(
        "Delete this message?"
      );


    if(!confirmed){

      closeMessageMenu();

      return;

    }


    try{

      await db.collection("chats")
        .doc(chatId)
        .collection("messages")
        .doc(menuMessage.id)
        .delete();


      showToast(
        "Message deleted"
      );

    }

    catch(error){

      console.error(error);

      alert(
        "Could not delete message."
      );

    }


    closeMessageMenu();

  }

);


function closeMessageMenu(){

  messageMenu
    .classList.remove("show");

  menuMessage =
    null;

}


/* =====================================================
   MARK READ
===================================================== */

async function markCustomerMessagesRead(){

  if(!currentUser){
    return;
  }


  try{

    await db.collection("chats")
      .doc(chatId)
      .update({

        unreadForCustomer:
          0

      });

  }

  catch(error){

    console.warn(
      "Could not clear unread count:",
      error
    );

  }

}


/* =====================================================
   NOTIFICATION
===================================================== */

function notificationsEnabled(){

  return localStorage.getItem(
    "dspNotifications"
  ) !== "false";

}


function showNewMessageNotification(data){

  if(
    !notificationsEnabled()
  ){

    return;

  }


  const text =
    data.text ||
    "📷 Photo";


  notificationText.textContent =
    text;


  notificationToast
    .classList.add("show");


  setTimeout(

    function(){

      notificationToast
        .classList.remove("show");

    },

    3500

  );


  if(
    "Notification" in window &&
    Notification.permission === "granted"
  ){

    try{

      new Notification(
        "Danny Smart Power",
        {
          body:text,
          icon:""
        }
      );

    }

    catch(error){

      console.log(error);

    }

  }

}


/* =====================================================
   NOTIFICATION BUTTON
===================================================== */

document
.getElementById("notificationBtn")
.addEventListener(

  "click",

  async function(){

    const enabled =
      notificationsEnabled();


    if(!enabled){

      showToast(
        "Notifications are off in Settings"
      );

      return;

    }


    if(
      "Notification" in window &&
      Notification.permission ===
      "default"
    ){

      try{

        await Notification.requestPermission();

      }

      catch(error){

        console.log(error);

      }

    }


    showToast(
      "Chat notifications are enabled 🔔"
    );

  }

);

/* =====================================================
   AUTO RESIZE
===================================================== */

function autoResize(){

  messageInput.style.height =
    "auto";


  messageInput.style.height =
    Math.min(
      messageInput.scrollHeight,
      120
    ) + "px";

}


/* =====================================================
   IMAGE VIEWER
===================================================== */

function openImage(src){

  viewerImage.src =
    src;


  imageViewer
    .classList.add("show");

}


document
.getElementById("closeViewer")
.addEventListener(

  "click",

  function(){

    imageViewer
      .classList.remove("show");

  }

);

  "click",

  function(event){

      event.target ===

    ){

      imageViewer

  }

);


/* =====================================================
   TOAST
===================================================== */

function showToast(text){

  notificationText.textContent =
    text;


  notificationToast
    .classList.add("show");


  setTimeout(

    function(){

      notificationToast
        .classList.remove("show");

    },

    2200

  );

/* =====================================================
   SCROLL
===================================================== */

function scrollToBottom(){

  requestAnimationFrame(

    function(){

      messagesEl.scrollTop =
        messagesEl.scrollHeight;

    }

  );

}


/* =====================================================
   TIME
===================================================== */

function formatTime(timestamp){

  if(!timestamp){
    return "Sending...";
  }


  const date =
    timestamp.toDate
    ? timestamp.toDate()
    : new Date(timestamp);


  return date.toLocaleTimeString(

    [],

    {
      hour:"numeric",
      minute:"2-digit"
    }

  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  if(value === null ||
     value === undefined){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(

  "beforeunload",

  function(){

    if(unsubscribeMessages){

      unsubscribeMessages();

    }


    if(unsubscribeChat){

      unsubscribeChat();

    }

  }

);

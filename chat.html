<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat with Danny | Danny Smart Power</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0b1220;
  --header:#020617;
  --surface:#111c2d;
  --surface2:#172338;
  --surface3:#1e2d44;

  --customer:#0284c7;
  --customer2:#0369a1;

  --admin:#182638;

  --blue:#38bdf8;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#facc15;

  --text:#f8fafc;
  --muted:#94a3b8;
  --border:rgba(148,163,184,.13);

  --shadow:0 10px 35px rgba(0,0,0,.22);
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Poppins,sans-serif;
  background:
    radial-gradient(
      circle at top left,
      rgba(56,189,248,.09),
      transparent 35%
    ),
    var(--bg);
  color:var(--text);
}

/* =========================================================
   APP
========================================================= */

.chat-app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

/* =========================================================
   HEADER
========================================================= */

.chat-header{
  height:78px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 12px;

  background:rgba(2,6,23,.96);
  backdrop-filter:blur(15px);

  border-bottom:1px solid var(--border);

  z-index:20;
}

.header-side{
  width:48px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.header-btn{
  width:43px;
  height:43px;

  border:0;
  border-radius:50%;

  background:transparent;
  color:white;

  font-size:26px;

  cursor:pointer;

  transition:.2s;
}

.header-btn:hover{
  background:var(--surface2);
}

.profile{
  display:flex;
  align-items:center;
  gap:10px;

  min-width:0;
}

.avatar{
  width:48px;
  height:48px;

  flex-shrink:0;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--customer2)
    );

  color:#00111c;

  font-size:24px;

  position:relative;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.online-dot{
  position:absolute;

  width:13px;
  height:13px;

  right:-1px;
  bottom:0;

  border-radius:50%;

  background:var(--green);

  border:2px solid var(--header);
}

.profile-info{
  min-width:0;
}

.profile-info h2{
  font-size:15px;
  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.status{
  margin-top:1px;

  color:var(--green);

  font-size:10px;

  white-space:nowrap;
}

/* =========================================================
   NOTIFICATION BADGE
========================================================= */

.header-notification{
  position:relative;
}

.unread-badge{
  position:absolute;

  top:-2px;
  right:-2px;

  min-width:19px;
  height:19px;

  padding:0 5px;

  border-radius:20px;

  background:var(--red);
  color:white;

  display:none;
  align-items:center;
  justify-content:center;

  font-size:9px;
  font-weight:700;

  border:2px solid var(--header);
}

.unread-badge.show{
  display:flex;
}

/* =========================================================
   MESSAGES
========================================================= */

.messages{
  flex:1;
  min-height:0;

  overflow-y:auto;

  padding:18px 11px 22px;

  scroll-behavior:smooth;

  overscroll-behavior:contain;
}

.messages::-webkit-scrollbar{
  width:5px;
}

.messages::-webkit-scrollbar-thumb{
  background:#26364f;
  border-radius:10px;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome{
  max-width:650px;

  margin:8px auto 24px;

  padding:26px 18px;

  text-align:center;

  background:
    linear-gradient(
      145deg,
      rgba(17,30,48,.96),
      rgba(11,23,38,.96)
    );

  border:1px solid var(--border);

  border-radius:24px;

  box-shadow:var(--shadow);
}

.welcome-icon{
  width:66px;
  height:66px;

  margin:0 auto 13px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      rgba(56,189,248,.18),
      rgba(2,132,199,.18)
    );

  font-size:31px;
}

.welcome h1{
  font-size:19px;
  margin-bottom:8px;
}

.welcome p{
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
}

.quick-actions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  margin-top:15px;
}

.quick-action{
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);

  border-radius:20px;

  padding:7px 11px;

  font-family:inherit;
  font-size:10px;

  cursor:pointer;
}

/* =========================================================
   DATE SEPARATOR
========================================================= */

.date-divider{
  display:flex;
  align-items:center;
  justify-content:center;

  margin:18px 0 12px;
}

.date-divider span{
  padding:5px 12px;

  border-radius:20px;

  background:rgba(30,41,59,.82);

  border:1px solid var(--border);

  color:var(--muted);

  font-size:9px;
}

/* =========================================================
   UNREAD DIVIDER
========================================================= */

.unread-divider{
  display:flex;
  align-items:center;
  gap:10px;

  margin:14px 4px;

  color:#7dd3fc;

  font-size:10px;
}

.unread-divider::before,
.unread-divider::after{
  content:"";

  height:1px;
  flex:1;

  background:rgba(56,189,248,.25);
}

/* =========================================================
   MESSAGE ROW
========================================================= */

.message-row{
  width:100%;

  display:flex;

  margin:4px 0;

  position:relative;
}

.message-row.customer{
  justify-content:flex-end;
}

.message-row.admin{
  justify-content:flex-start;
}

.bubble{
  position:relative;

  max-width:min(80%,560px);

  padding:9px 11px 7px;

  border-radius:18px;

  font-size:13px;

  line-height:1.55;

  overflow-wrap:anywhere;

  box-shadow:
    0 2px 7px rgba(0,0,0,.12);

  user-select:text;
}

.customer .bubble{
  background:
    linear-gradient(
      145deg,
      var(--customer),
      var(--customer2)
    );

  border-bottom-right-radius:5px;
}

.admin .bubble{
  background:var(--admin);

  border-bottom-left-radius:5px;

  border:1px solid rgba(148,163,184,.08);
}

/* =========================================================
   REPLY PREVIEW INSIDE MESSAGE
========================================================= */

.reply-preview{
  border-left:3px solid var(--blue);

  background:rgba(255,255,255,.08);

  border-radius:8px;

  padding:6px 8px;

  margin-bottom:7px;

  font-size:10px;
}

.reply-preview strong{
  display:block;
  color:#bae6fd;
  margin-bottom:2px;
}

.reply-preview span{
  color:rgba(255,255,255,.7);

  display:block;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================================================
   IMAGES
========================================================= */

.message-image{
  display:block;

  width:min(300px,100%);

  max-height:360px;

  object-fit:cover;

  border-radius:13px;

  cursor:pointer;

  margin-bottom:5px;

  background:#020617;
}

.image-loading{
  width:200px;
  height:120px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:#020617;

  color:var(--muted);

  font-size:11px;
}

/* =========================================================
   META
========================================================= */

.meta{
  display:flex;

  align-items:center;
  justify-content:flex-end;

  gap:4px;

  margin-top:3px;

  font-size:8px;

  color:rgba(255,255,255,.62);
}

.read-status{
  font-size:10px;
  letter-spacing:-2px;
}

.read-status.sent{
  color:#cbd5e1;
}

.read-status.delivered{
  color:#bae6fd;
}

.read-status.read{
  color:#7dd3fc;
}

/* =========================================================
   MESSAGE MENU
========================================================= */

.message-actions{
  position:absolute;

  z-index:30;

  display:none;

  min-width:150px;

  padding:5px;

  background:#020617;

  border:1px solid var(--border);

  border-radius:14px;

  box-shadow:var(--shadow);
}

.message-actions.show{
  display:block;
}

.message-actions button{
  display:block;

  width:100%;

  border:0;

  background:transparent;

  color:white;

  padding:10px;

  border-radius:9px;

  text-align:left;

  font-family:inherit;

  font-size:11px;

  cursor:pointer;
}

.message-actions button:hover{
  background:var(--surface2);
}

.message-actions .danger{
  color:#fca5a5;
}

/* =========================================================
   TYPING
========================================================= */

.typing-wrap{
  height:30px;
  flex-shrink:0;

  padding:4px 15px;

  display:none;
  align-items:center;

  color:var(--muted);

  font-size:10px;
}

.typing-wrap.active{
  display:flex;
}

.typing-dots{
  display:flex;
  gap:3px;

  margin-left:6px;
}

.typing-dots i{
  width:4px;
  height:4px;

  border-radius:50%;

  background:var(--blue);

  animation:bounce 1.1s infinite;
}

.typing-dots i:nth-child(2){
  animation-delay:.15s;
}

.typing-dots i:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.4;
  }

  30%{
    transform:translateY(-4px);
    opacity:1;
  }
}

/* =========================================================
   NEW MESSAGE BUTTON
========================================================= */

.new-message-button{
  position:absolute;

  right:15px;
  bottom:92px;

  z-index:15;

  display:none;

  border:1px solid rgba(56,189,248,.25);

  background:#082f49;

  color:#bae6fd;

  padding:8px 13px;

  border-radius:20px;

  font-family:inherit;

  font-size:10px;

  cursor:pointer;

  box-shadow:var(--shadow);
}

.new-message-button.show{
  display:block;
}

/* =========================================================
   COMPOSER
========================================================= */

.input-wrapper{
  flex-shrink:0;

  background:rgba(2,6,23,.98);

  border-top:1px solid var(--border);

  padding:
    7px
    9px
    calc(7px + env(safe-area-inset-bottom));

  z-index:20;
}

.reply-bar{
  display:none;

  max-width:900px;

  margin:0 auto 7px;

  padding:7px 10px;

  background:var(--surface2);

  border-left:3px solid var(--blue);

  border-radius:9px;

  position:relative;
}

.reply-bar.active{
  display:block;
}

.reply-bar strong{
  display:block;
  color:#7dd3fc;
  font-size:10px;
}

.reply-bar span{
  display:block;

  margin-top:2px;

  color:var(--muted);

  font-size:9px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  padding-right:30px;
}

.cancel-reply{
  position:absolute;

  right:7px;
  top:7px;

  width:25px;
  height:25px;

  border:0;
  border-radius:50%;

  background:transparent;

  color:var(--muted);

  cursor:pointer;
}

.input-area{
  max-width:900px;

  margin:auto;

  display:flex;

  align-items:flex-end;

  gap:6px;
}

.composer-btn{
  width:44px;
  height:44px;

  min-width:44px;

  border:0;
  border-radius:50%;

  background:var(--surface2);

  color:white;

  font-size:19px;

  cursor:pointer;
}

.composer-btn:hover{
  background:var(--surface3);
}

.send{
  background:var(--blue);

  color:#00111c;

  font-size:20px;
}

.send:disabled{
  opacity:.35;
  cursor:not-allowed;
}

textarea{
  flex:1;
  min-width:0;

  min-height:44px;
  max-height:130px;

  resize:none;

  border:1px solid transparent;

  outline:0;

  border-radius:23px;

  background:#172337;

  color:white;

  padding:12px 15px;

  font-family:inherit;
  font-size:13px;

  line-height:20px;
}

textarea:focus{
  border-color:rgba(56,189,248,.28);
}

textarea::placeholder{
  color:#64748b;
}

/* =========================================================
   PHOTO PREVIEW
========================================================= */

.preview{
  display:none;

  max-width:900px;

  margin:auto;

  padding:0 0 7px;
}

.preview.active{
  display:block;
}

.preview-box{
  position:relative;

  display:inline-block;

  border-radius:12px;

  overflow:visible;
}

.preview img{
  width:80px;
  height:80px;

  object-fit:cover;

  border-radius:12px;

  border:1px solid var(--border);
}

.remove-preview{
  position:absolute;

  top:-7px;
  right:-7px;

  width:23px;
  height:23px;

  border:2px solid var(--header);

  border-radius:50%;

  background:var(--red);

  color:white;

  cursor:pointer;
}

/* =========================================================
   UPLOAD / SENDING STATUS
========================================================= */

.sending-status{
  display:none;

  max-width:900px;

  margin:0 auto 4px;

  color:var(--muted);

  font-size:9px;
}

.sending-status.active{
  display:block;
}

/* =========================================================
   PHOTO VIEWER
========================================================= */

.photo-viewer{
  position:fixed;

  inset:0;

  z-index:200;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.9);

  backdrop-filter:blur(7px);
}

.photo-viewer.active{
  display:flex;
}

.viewer-image{
  max-width:96vw;
  max-height:88vh;

  object-fit:contain;

  border-radius:12px;
}

.close-viewer{
  position:absolute;

  top:18px;
  right:18px;

  width:42px;
  height:42px;

  border:0;
  border-radius:50%;

  background:rgba(255,255,255,.12);

  color:white;

  font-size:24px;

  cursor:pointer;
}

/* =========================================================
   SIDE MENU
========================================================= */

.overlay{
  position:fixed;

  inset:0;

  z-index:90;

  background:rgba(0,0,0,.55);

  display:none;
}

.overlay.active{
  display:block;
}

.side-menu{
  position:fixed;

  z-index:100;

  top:0;
  right:-330px;

  width:310px;
  max-width:88%;

  height:100dvh;

  padding:20px;

  background:#020617;

  box-shadow:-10px 0 35px rgba(0,0,0,.35);

  transition:.28s;

  overflow-y:auto;
}

.side-menu.active{
  right:0;
}

.menu-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.menu-close{
  width:38px;
  height:38px;

  border:0;
  border-radius:50%;

  background:var(--surface2);

  color:white;

  cursor:pointer;

  font-size:20px;
}

.customer-name{
  display:block;

  margin-top:20px;

  font-size:16px;
}

.menu-email{
  display:block;

  color:#64748b;

  font-size:10px;

  margin-top:3px;

  word-break:break-word;
}

.menu-link{
  display:block;

  width:100%;

  padding:13px;

  margin-top:6px;

  border:0;

  border-radius:12px;

  background:transparent;

  color:white;

  text-decoration:none;

  text-align:left;

  font-family:inherit;

  font-size:12px;

  cursor:pointer;
}

.menu-link:hover{
  background:var(--surface2);
}

.menu-notification{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.menu-badge{
  display:none;

  min-width:19px;
  height:19px;

  align-items:center;
  justify-content:center;

  padding:0 5px;

  border-radius:20px;

  background:var(--red);

  font-size:9px;
}

.menu-badge.show{
  display:flex;
}

hr{
  border:0;
  border-top:1px solid var(--border);

  margin:18px 0;
}

/* =========================================================
   CENTER ERROR
========================================================= */

.center-message{
  min-height:300px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  color:var(--muted);

  padding:30px;
}

.center-message .icon{
  font-size:42px;
  margin-bottom:10px;
}

.center-message h3{
  color:white;
  font-size:16px;
  margin-bottom:6px;
}

.center-message p{
  font-size:11px;
  line-height:1.7;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  left:50%;
  bottom:82px;

  transform:translate(-50%,30px);

  opacity:0;

  z-index:300;

  padding:9px 15px;

  border-radius:20px;

  background:#020617;

  color:white;

  border:1px solid var(--border);

  box-shadow:var(--shadow);

  font-size:10px;

  pointer-events:none;

  transition:.25s;
}

.toast.show{
  transform:translate(-50%,0);
  opacity:1;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  .chat-header{
    height:72px;
  }

  .avatar{
    width:44px;
    height:44px;
  }

  .profile-info h2{
    font-size:14px;
  }

  .bubble{
    max-width:86%;
    font-size:13px;
  }

  .message-image{
    width:min(260px,100%);
  }

  .messages{
    padding-left:8px;
    padding-right:8px;
  }

  .composer-btn{
    width:42px;
    height:42px;
    min-width:42px;
  }

  textarea{
    min-height:42px;
  }

}

</style>
</head>

<body>

<div class="chat-app">

<!-- =====================================================
     HEADER
===================================================== -->

<header class="chat-header">

  <div class="header-side">

    <button
      class="header-btn"
      id="backButton"
      type="button"
      aria-label="Back"
    >
      ←
    </button>

  </div>


  <div class="profile">

    <div class="avatar">

      ⚡

      <span
        class="online-dot"
        id="onlineDot"
      ></span>

    </div>

    <div class="profile-info">

      <h2>
        Danny Smart Power
      </h2>

      <div
        class="status"
        id="status"
      >
        Connecting...
      </div>

    </div>

  </div>


  <div class="header-side header-notification">

    <button
      class="header-btn"
      id="menuButton"
      type="button"
      aria-label="Open menu"
    >
      ⋮
    </button>

    <span
      class="unread-badge"
      id="unreadBadge"
    >
      0
    </span>

  </div>

</header>


<!-- =====================================================
     MESSAGES
===================================================== -->

<main
  class="messages"
  id="messages"
>

  <div class="center-message">

    <div class="icon">
      ⚡
    </div>

    <h3>
      Connecting to Danny...
    </h3>

    <p>
      Please wait while your conversation loads.
    </p>

  </div>

</main>


<!-- =====================================================
     NEW MESSAGE BUTTON
===================================================== -->

<button
  class="new-message-button"
  id="newMessageButton"
  type="button"
>
  ↓ New message
</button>


<!-- =====================================================
     TYPING
===================================================== -->

<div
  class="typing-wrap"
  id="typingWrap"
>

  <span>
    Danny is typing
  </span>

  <span class="typing-dots">
    <i></i>
    <i></i>
    <i></i>
  </span>

</div>


<!-- =====================================================
     COMPOSER
===================================================== -->

<div class="input-wrapper">


  <div
    class="reply-bar"
    id="replyBar"
  >

    <button
      class="cancel-reply"
      id="cancelReply"
      type="button"
    >
      ×
    </button>

    <strong id="replyName">
      Reply
    </strong>

    <span id="replyText">
      Message
    </span>

  </div>


  <div
    class="preview"
    id="preview"
  >

    <div class="preview-box">

      <img
        id="previewImage"
        alt="Selected photo"
      >

      <button
        class="remove-preview"
        id="removePreview"
        type="button"
      >
        ×
      </button>

    </div>

  </div>


  <div
    class="sending-status"
    id="sendingStatus"
  >
    Sending...
  </div>


  <div class="input-area">


    <button
      class="composer-btn"
      id="photoButton"
      type="button"
      title="Photo"
      aria-label="Choose photo"
    >
      📷
    </button>


    <button
      class="composer-btn"
      id="attachButton"
      type="button"
      title="Attach"
      aria-label="Attach file"
    >

/* =========================================================

auth.onAuthStateChanged(

/* =========================================================
   CUSTOMER NAME
========================================================= */

function getCustomerName(){

  return user.displayName ||

    (
      user.email
        ? user.email.split("@")[0]
        : "Customer"
    );

}


/* =========================================================
   CREATE CHAT
========================================================= */

async function createChat(){

  const ref =
    db.collection("chats")
      .doc(chatId);


  const existing =
    await ref.get();


  const baseData = {

    customerId:
      user.uid,

    customerName:
      getCustomerName(),

    customerEmail:
      user.email || "",

    customerPhoto:
      user.photoURL || "",

    status:
      "open",

    customerTyping:
      false,

    adminTyping:
      false,

    adminOnline:
      false,

    unreadForAdmin:
      0,

    unreadForCustomer:
      0,

    lastMessage:
      "",

    lastMessageAt:
      firebase.firestore.FieldValue
        .serverTimestamp(),

    updatedAt:
      firebase.firestore.FieldValue
        .serverTimestamp()

  };


  if(!existing.exists){

    baseData.createdAt =
      firebase.firestore.FieldValue
        .serverTimestamp();


    await ref.set(
      baseData
    );

  }

  else{

    await ref.set(
      {

        customerId:
          user.uid,

        customerName:
          getCustomerName(),

        customerEmail:
          user.email || "",

        customerPhoto:
          user.photoURL || "",

        status:
          "open",

        updatedAt:
          firebase.firestore.FieldValue
            .serverTimestamp()

      },
      {
        merge:true
      }
    );

  }

}


/* =========================================================
   PRESENCE
========================================================= */

function setupPresence(){

  const ref =
    db.collection("chats")
      .doc(chatId);


  ref.set({

    customerOnline:true,

    customerLastSeen:
      firebase.firestore.FieldValue
        .serverTimestamp()

  },{
    merge:true
  });


  document.addEventListener(
    "visibilitychange",
    updatePresence
  );


  window.addEventListener(
    "beforeunload",
    () => {

      ref.set({

        customerOnline:false,

        customerLastSeen:
          firebase.firestore.FieldValue
            .serverTimestamp()

      },{
        merge:true
      });

    }
  );

}


function updatePresence(){

  if(!user)
    return;


  db.collection("chats")
    .doc(chatId)
    .set({

      customerOnline:
        document.visibilityState === "visible",

      customerLastSeen:
        firebase.firestore.FieldValue
          .serverTimestamp()

    },{
      merge:true
    })
    .catch(() => {});

}


/* =========================================================
   CHAT LISTENER
========================================================= */

function listenToChat(){

  const ref =
    db.collection("chats")
      .doc(chatId);


  if(stopChat)
    stopChat();


  stopChat =
    ref.onSnapshot(
      snapshot => {

        if(!snapshot.exists)
          return;


        const data =
          snapshot.data();


        /* -------------------------
           TYPING
        ------------------------- */

        const adminTyping =
          data.adminTyping === true;


        if(adminTyping){

          typingWrap.classList.add(
            "active"
          );

        }

        else{

          typingWrap.classList.remove(
            "active"
          );

        }


        /* -------------------------
           ONLINE
        ------------------------- */

        if(data.adminOnline === true){

          statusEl.textContent =
            "● Online";

          statusEl.style.color =
            "#22c55e";

          document.getElementById(
            "onlineDot"
          ).style.display =
            "block";

        }

        else{

          statusEl.textContent =
            formatLastSeen(
              data.adminLastSeen
            );

          statusEl.style.color =
            "#94a3b8";

          document.getElementById(
            "onlineDot"
          ).style.display =
            "none";

        }


        /* -------------------------
           UNREAD
        ------------------------- */

        const count =
          Number(
            data.unreadForCustomer || 0
          );


        if(count > 0){

          showUnread(
            count
          );

        }

        else{

          hideUnread();

        }


        lastAdminTyping =
          adminTyping;

      },

      error => {

        console.error(
          "Chat listener error:",
          error
        );

      }
    );

}


/* =========================================================
   MESSAGE LISTENER
========================================================= */

function listenToMessages(){

  if(stopMessages)
    stopMessages();


  const query =
    db.collection("messages")
      .where(
        "chatId",
        "==",
        chatId
      );


  stopMessages =
    query.onSnapshot(

      snapshot => {

        const messages = [];


        snapshot.forEach(
          doc => {

            messages.push({

              id:
                doc.id,

              ...doc.data()

            });

          }
        );


        messages.sort(
          (a,b) =>

            getTimestampValue(
              a.createdAt
            ) -

            getTimestampValue(
              b.createdAt
            )
        );


        handleNewMessages(
          messages
        );


        renderMessages(
          messages
        );


        markAdminMessagesRead(
          messages
        );

      },

      error => {

        console.error(
          "Message listener error:",
          error
        );


        showError(
          "Unable to load messages.",
          error.message
        );

      }
    );

}


/* =========================================================
   NEW MESSAGE DETECTION
========================================================= */

function handleNewMessages(messages){

  const newAdminMessages =
    messages.filter(
      message =>

        message.senderRole === "admin" &&

        !previousMessageIds.has(
          message.id
        )
    );


  if(
    !firstMessageLoad &&
    newAdminMessages.length > 0
  ){

    const visible =
      isNearBottom();


    if(!visible){

      showNewMessageButton(
        newAdminMessages.length
      );

    }


    if(
      getNotificationsEnabled()
    ){

      showChatNotification(
        newAdminMessages[
          newAdminMessages.length - 1
        ]
      );

    }

  }


  previousMessageIds =
    new Set(
      messages.map(
        message => message.id
      )
    );


  firstMessageLoad =
    false;

}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(messages){

  messagesEl.innerHTML = "";


  addWelcome();


  if(messages.length === 0){

    const empty =
      document.createElement(
        "div"
      );


    empty.style.textAlign =
      "center";

    empty.style.color =
      "#64748b";

    empty.style.fontSize =
      "11px";

    empty.style.padding =
      "10px";


    empty.textContent =
      "Send a message to start chatting with Danny.";


    messagesEl.appendChild(
      empty
    );

    return;

  }


  let lastDate = "";

  let unreadInserted = false;


  messages.forEach(
    message => {

      const dateLabel =
        getDateLabel(
          message.createdAt
        );


      if(
        dateLabel !== lastDate
      ){

        const divider =
          document.createElement(
            "div"
          );


        divider.className =
          "date-divider";


        divider.innerHTML =
          `<span>${escapeHtml(dateLabel)}</span>`;


        messagesEl.appendChild(
          divider
        );


        lastDate =
          dateLabel;

      }


      if(
        !unreadInserted &&
        message.senderRole === "admin" &&
        message.read !== true
      ){

        const divider =
          document.createElement(
            "div"
          );


        divider.className =
          "unread-divider";


        divider.textContent =
          "New messages";


        messagesEl.appendChild(
          divider
        );


        unreadInserted =
          true;

      }


      renderMessage(
        message
      );

    }
  );


  if(isNearBottom()){

    scrollBottom();

  }

}


/* =========================================================
   WELCOME
========================================================= */

function addWelcome(){

/* =========================================================
   RENDER MESSAGE
========================================================= */

function renderMessage(data){

  const row =
    document.createElement(
      "div"
    );


  const isCustomer =
    data.senderRole === "customer";


  row.className =
    "message-row " +
    (
      isCustomer
        ? "customer"
        : "admin"
    );


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  /* -------------------------
     REPLY
  ------------------------- */

  if(data.replyTo){

    const reply =
      document.createElement(
        "div"
      );


    reply.className =
      "reply-preview";


    const replyAuthor =
      escapeHtml(
        data.replyTo.senderName ||
        "Message"
      );


    const replyContent =
      escapeHtml(
        data.replyTo.text ||
        "📷 Photo"
      );


    reply.innerHTML = `

      <strong>
        ${replyAuthor}
      </strong>

      <span>
        ${replyContent}
      </span>

    `;


    bubble.appendChild(
      reply
    );

  }


  /* -------------------------
     IMAGE
  ------------------------- */

  if(data.imageUrl){

    const img =
      document.createElement(
        "img"
      );


    img.className =
      "message-image";


    img.src =
      data.imageUrl;


    img.alt =
      "Chat photo";


    img.loading =
      "lazy";


    img.onclick =
      () => {

        openPhoto(
          data.imageUrl
        );

      };


    bubble.appendChild(
      img
    );

  }


  /* -------------------------
     TEXT
  ------------------------- */

  if(
    data.text &&
    String(data.text).trim()
  ){

    const text =
      document.createElement(
        "div"
      );


    text.textContent =
      data.text;


    bubble.appendChild(
      text
    );

  }


  /* -------------------------
     META
  ------------------------- */

  const meta =
    document.createElement(
      "div"
    );


  meta.className =
    "meta";


  const time =
    document.createElement(
      "span"
    );


  time.textContent =
    formatTime(
      data.createdAt
    );


  meta.appendChild(
    time
  );


  if(isCustomer){

    const read =
      document.createElement(
        "span"
      );


    read.className =
      "read-status";


    if(data.read === true){

      read.textContent =
        "✓✓";

      read.classList.add(
        "read"
      );

    }

    else if(data.delivered === true){

      read.textContent =
        "✓✓";

      read.classList.add(
        "delivered"
      );

    }

    else{

      read.textContent =
        "✓";

      read.classList.add(
        "sent"
      );

    }


    meta.appendChild(
      read
    );

  }


  bubble.appendChild(
    meta
  );


  row.appendChild(
    bubble
  );


  /* -------------------------
     MESSAGE MENU
  ------------------------- */

  bubble.addEventListener(
    "contextmenu",
    event => {

      event.preventDefault();

      openMessageActions(
        event,
        data,
        bubble
      );

    }
  );


  let longPressTimer;


  bubble.addEventListener(
    "touchstart",
    () => {

      longPressTimer =
        setTimeout(
          () => {

            openMessageActions(
              null,
              data,
              bubble
            );

          },
          600
        );

    },
    {
      passive:true
    }
  );


  bubble.addEventListener(
    "touchend",
    () => {

      clearTimeout(
        longPressTimer
      );

    }
  );


  messagesEl.appendChild(
    row
  );

}


/* =========================================================
   MESSAGE ACTIONS
========================================================= */

function openMessageActions(
  event,
  data,
  bubble
){

  closeMessageMenus();


  const menu =
    document.createElement(
      "div"
    );


  menu.className =
    "message-actions show";


  menu.innerHTML = `

    <button data-action="reply">
      ↩️ Reply
    </button>

    <button data-action="copy">
      📋 Copy
    </button>

    ${
      data.senderId === user.uid
      ? `
        <button
          data-action="delete"
          class="danger"
        >
          🗑️ Delete
        </button>
      `
      : ""
    }

  `;


  document.body.appendChild(
    menu
  );


  const rect =
    bubble.getBoundingClientRect();


  let left =
    rect.left;


  let top =
    rect.bottom + 6;


  if(event){

    left =
      event.clientX;

    top =
      event.clientY;

  }


  menu.style.left =
    Math.min(
      left,
      window.innerWidth - 165
    ) + "px";


  menu.style.top =
    Math.min(
      top,
      window.innerHeight - 170
    ) + "px";


  menu.querySelectorAll(
    "button"
  ).forEach(
    button => {

      button.onclick =
        async () => {

          const action =
            button.dataset.action;


          if(action === "reply"){

            startReply(
              data
            );

          }


          if(action === "copy"){

            await copyMessage(
              data.text || ""
            );

          }


          if(action === "delete"){

            await deleteMessage(
              data
            );

          }


          menu.remove();

        };

    }
  );


  setTimeout(
    () => {

      document.addEventListener(
        "click",
        closeMessageMenus,
        {
          once:true
        }
      );

    },
    10
  );

}


function closeMessageMenus(){

  document
    .querySelectorAll(
      ".message-actions"
    )
    .forEach(
      menu => menu.remove()
    );

}


/* =========================================================
   REPLY
========================================================= */

function startReply(data){

  replyTo = {

    id:
      data.id,

    senderName:
      data.senderName ||
      (
        data.senderRole === "admin"
          ? "Danny"
          : "You"
      ),

    text:
      data.text ||
      "📷 Photo"

  };


  replyName.textContent =
    "Replying to " +
    replyTo.senderName;


  replyText.textContent =
    replyTo.text;


  replyBar.classList.add(
    "active"
  );


  input.focus();

}


document
  .getElementById(
    "cancelReply"
  )
  .onclick =
  clearReply;


function clearReply(){

  replyTo =
    null;

  replyBar.classList.remove(
    "active"
  );

}


/* =========================================================
   COPY
========================================================= */

async function copyMessage(text){

  if(!text){

    showToast(
      "Nothing to copy"
    );

    return;

  }


  try{

    await navigator.clipboard.writeText(
      text
    );


    showToast(
      "Message copied ✓"
    );

  }

  catch{

    showToast(
      "Copy not available"
    );

  }

}


/* =========================================================
   DELETE
========================================================= */

async function deleteMessage(data){

  if(data.senderId !== user.uid)
    return;


  const confirmed =
    confirm(
      "Delete this message?"
    );


  if(!confirmed)
    return;


  try{

    await db.collection("messages")
      .doc(data.id)
      .delete();


    showToast(
      "Message deleted"
    );

  }

  catch(error){

    alert(
      "Could not delete message.\n\n" +
      error.message
    );

  }

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(!user || sending)
    return;


  const text =
    input.value.trim();


  if(
    !text &&
    !selectedImageData
  )
    return;


  sending =
    true;


  sendButton.disabled =
    true;


  sendingStatus.classList.add(
    "active"
  );


  try{

    const message = {

      chatId:
        chatId,

      createdAt:
        firebase.firestore.FieldValue
          .serverTimestamp(),

      imageUrl:
        selectedImageData || "",

      read:
        false,

      delivered:
        true,

      senderId:
        user.uid,

      senderName:
        getCustomerName(),

      senderRole:
        "customer",

      text:
        text

    };


    if(replyTo){

      message.replyTo =
        replyTo;

    }


    const ref =
      await db.collection(
        "messages"
      ).add(
        message
      );


    await db.collection("chats")
      .doc(chatId)
      .set({

        lastMessage:
          text ||
          "📷 Photo",

        lastMessageAt:
          firebase.firestore.FieldValue
            .serverTimestamp(),

        updatedAt:
          firebase.firestore.FieldValue
            .serverTimestamp(),

        unreadForAdmin:
          firebase.firestore.FieldValue
            .increment(1),

        unreadForCustomer:
          0,

        customerTyping:
          false,

        status:
          "open"

      },{
        merge:true
      });


    input.value =
      "";

    input.style.height =
      "44px";


    selectedFile =
      null;

    selectedImageData =
      "";


    fileInput.value =
      "";


    preview.classList.remove(
      "active"
    );


    previewImage.src =
      "";


    clearReply();

    stopTyping();

  async event => {

    const file =

    if(!file)
      return;


    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      alert(
        "Please choose an image."
      );

      fileInput.value =
        "";

      return;

    }


    if(file.size > 10 * 1024 * 1024){

      alert(
        "Please choose a photo smaller than 10MB."
      );

      fileInput.value =
        "";

      return;

    }


    try{

      selectedFile =
        file;


      selectedImageData =
        await compressImage(
          file,
          900,
          0.68
        );


      previewImage.src =
        selectedImageData;


      preview.classList.add(
        "active"
      );

    catch(error){

      );

      selectedFile =
        null;

      selectedImageData =
        "";

    }

  };


/* =========================================================
   IMAGE COMPRESSION
========================================================= */

function compressImage(
  file,
  maxSize,
  quality
){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        event => {

          const img =
            new Image();


          img.onload =
            () => {

              let width =
                img.width;

              let height =
                img.height;


              if(width > height){

                if(width > maxSize){

                  height =
                    Math.round(
                      height *
                      maxSize /
                      width
                    );

                  width =
                    maxSize;

                }

              }

              else{

                if(height > maxSize){

                  width =
                    Math.round(
                      width *
                      maxSize /
                      height
                    );

                  height =
                    maxSize;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

/* =========================================================
   MARK READ
========================================================= */

async function markAdminMessagesRead(messages){

  const unread =
    messages.filter(
      message =>

        message.senderRole === "admin" &&
        message.read !== true

    );


  if(!unread.length)
    return;


  try{

    const batch =
      db.batch();


    unread.forEach(
      message => {

        const ref =
          db.collection(
            "messages"
          )
          .doc(
            message.id
          );


        batch.update(
          ref,
          {
            read:true
          }
        );

      }
    );


    await batch.commit();


    await db.collection("chats")
      .doc(chatId)
      .set({

        unreadForCustomer:0

      },{
        merge:true
      });


    hideUnread();

  }

  catch(error){

    console.error(
      "READ ERROR:",
      error
    );

  }

}

  const notificationText =

    "Notification" in window &&
    Notification.permission === "granted"
  ){

    try{

      new Notification(

        {
          body:
            notificationText.length > 80
              ? notificationText.substring(0,80) + "..."
              : notificationText,

          icon:
            "data:image/svg+xml," +
            encodeURIComponent(`
              <svg xmlns="http://www.w3.org/2000/svg"
                   width="100"
                   height="100">
                <rect width="100%" height="100%"
                      rx="25"
                      fill="#38bdf8"/>
                <text x="50%" y="58%"

/* =========================================================
   DATE
========================================================= */

function getDateLabel(timestamp){

  if(!timestamp)
    return "Today";


  const date =
    timestamp.toDate
      ? timestamp.toDate()
      : new Date(
          getTimestampValue(timestamp)
        );


  const now =
    new Date();


  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  const messageDay =
    new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    );


  const diff =
    Math.round(
      (today - messageDay) /
      86400000
    );


  if(diff === 0)
    return "Today";


  if(diff === 1)
    return "Yesterday";


  return date.toLocaleDateString(
    [],
    {
      day:"numeric",
      month:"short",
      year:
        date.getFullYear() !==
        now.getFullYear()
          ? "numeric"
          : undefined
    }
  );

}


/* =========================================================
   LAST SEEN
========================================================= */

function formatLastSeen(timestamp){

  if(!timestamp)
    return "Offline";


  const value =
    getTimestampValue(
      timestamp
    );


  if(!value)
    return "Offline";


  const seconds =
    Math.floor(
      (Date.now() - value) /
      1000
    );


  if(seconds < 60)
    return "Last seen just now";


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes < 60)
    return `Last seen ${minutes}m ago`;


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24)
    return `Last seen ${hours}h ago`;


  return "Last seen recently";

}


/* =========================================================
   TIMESTAMP
========================================================= */

function getTimestampValue(timestamp){

  if(!timestamp)
    return 0;


  if(
    typeof timestamp.toMillis ===
    "function"
  ){

    return timestamp.toMillis();

  }


  if(
    timestamp.seconds !== undefined
  ){

    return timestamp.seconds * 1000;

  }


  if(timestamp instanceof Date){

    return timestamp.getTime();

  }


  return 0;

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(timestamp){

  const value =
    getTimestampValue(
      timestamp
    );


  if(!value)
    return "";


  return new Date(
    value
  ).toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

========================================================= */

function showError(

  details
){

  messagesEl.innerHTML = `

    <div class="center-message">

      <div class="icon">
        ⚠️
      </div>

      <h3>
        ${escapeHtml(title)}
      </h3>

      <p>
        ${escapeHtml(details || "")}
      </p>

    </div>

  `;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text){

  return String(text || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

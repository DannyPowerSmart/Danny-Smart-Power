<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#020617">

<title>Chat with Danny | Danny Smart Power</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet">


<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{

  --bg:#07111f;
  --header:#020617;

  --customer:#0794d1;
  --customer2:#087db3;

  --admin:#17263a;
  --admin2:#1d3047;

  --blue:#38bdf8;
  --blue2:#0284c7;

  --green:#22c55e;
  --red:#ef4444;
  --yellow:#facc15;

  --text:#f8fafc;
  --muted:#94a3b8;

  --border:rgba(148,163,184,.14);

  --input:#15243a;
}

html,
body{

  width:100%;
  height:100%;

  overflow:hidden;
}

body{

  font-family:'Poppins',sans-serif;

  background:
    radial-gradient(
      circle at top,
      rgba(14,165,233,.08),
      transparent 35%
    ),
    var(--bg);

  color:var(--text);
}


/* =====================================================
   APP
===================================================== */

.chat-app{

  width:100%;
  height:100dvh;

  display:flex;
  flex-direction:column;
}


/* =====================================================
   HEADER
===================================================== */

.chat-header{

  height:82px;

  flex-shrink:0;

  background:rgba(2,6,23,.98);

  border-bottom:1px solid var(--border);

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 10px;

  position:relative;

  z-index:100;
}

.header-side{

  width:48px;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-shrink:0;
}

.header-btn{

  width:44px;
  height:44px;

  border:0;

  border-radius:50%;

  background:transparent;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:25px;

  cursor:pointer;

  transition:.2s;
}

.header-btn:hover{

  background:#17253a;
}

.header-btn:active{

  transform:scale(.92);
}


/* =====================================================
   PROFILE
===================================================== */

.profile{

  display:flex;

  align-items:center;

  gap:11px;

  min-width:0;

  flex:1;

  justify-content:center;
}

.avatar{

  width:52px;
  height:52px;

  flex-shrink:0;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #38bdf8,
      #0284c7
    );

  font-size:27px;

  overflow:hidden;

  border:2px solid rgba(56,189,248,.25);

  box-shadow:
    0 4px 18px rgba(0,0,0,.25);
}

.avatar img{

  width:100%;
  height:100%;

  object-fit:cover;
}

.profile-text{

  min-width:0;

  max-width:220px;
}

.profile h2{

  font-size:16px;

  font-weight:700;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.profile-subtitle{

  color:var(--muted);

  font-size:11px;

  margin-top:2px;
}


/* =====================================================
   NOTIFICATION
===================================================== */

.notification-button{

  position:relative;
}

.notification-badge{

  position:absolute;

  top:1px;
  right:0;

  min-width:18px;
  height:18px;

  padding:0 5px;

  border-radius:20px;

  background:#ef4444;

  color:white;

  font-size:9px;

  font-weight:700;

  display:none;

  align-items:center;

  justify-content:center;

  border:2px solid var(--header);
}

.notification-badge.show{

  display:flex;
}


/* =====================================================
   MESSAGES
===================================================== */

.messages{

  flex:1;

  min-height:0;

  overflow-y:auto;

  overscroll-behavior:contain;

  padding:18px 12px 25px;

  scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{

  width:5px;
}

.messages::-webkit-scrollbar-thumb{

  background:#24364d;

  border-radius:20px;
}


/* =====================================================
   WELCOME
===================================================== */

.welcome{

  max-width:650px;

  margin:4px auto 28px;

  padding:28px 18px 25px;

  border:1px solid var(--border);

  border-radius:0 0 30px 30px;

  background:
    linear-gradient(
      180deg,
      rgba(17,30,48,.95),
      rgba(9,23,39,.95)
    );

  text-align:center;

  box-shadow:
    0 15px 40px rgba(0,0,0,.15);
}

.welcome-icon{

  width:68px;
  height:68px;

  margin:0 auto 13px;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #38bdf8,
      #0284c7
    );

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:31px;
}

.welcome h1{

  font-size:22px;

  margin-bottom:8px;
}

.welcome p{

  color:var(--muted);

  font-size:13px;

  line-height:1.7;
}

.quick-replies{

  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  gap:8px;

  margin-top:18px;
}

.quick-reply{

  border:1px solid rgba(148,163,184,.15);

  background:#14243a;

  color:#e2e8f0;

  border-radius:22px;

  padding:9px 14px;

  font-family:inherit;

  font-size:12px;

  cursor:pointer;
}


/* =====================================================
   DATE
===================================================== */

.date-divider{

  display:flex;

  justify-content:center;

  margin:18px 0;
}

.date-divider span{

  padding:7px 14px;

  border-radius:20px;

  background:#111e30;

  border:1px solid var(--border);

  color:var(--muted);

  font-size:10px;
}


/* =====================================================
   MESSAGE
===================================================== */

.message-row{

  display:flex;

  width:100%;

  margin:7px 0;

  position:relative;
}

.message-row.customer{

  justify-content:flex-end;
}

.message-row.admin{

  justify-content:flex-start;
}


/* =====================================================
   BUBBLE
===================================================== */

.bubble{

  max-width:min(80%,520px);

  padding:10px 12px 7px;

  border-radius:19px;

  font-size:14px;

  line-height:1.5;

  overflow-wrap:anywhere;

  position:relative;

  box-shadow:
    0 3px 8px rgba(0,0,0,.13);
}

.customer .bubble{

  background:
    linear-gradient(
      145deg,
      var(--customer),
      var(--customer2)
    );

  border-bottom-right-radius:5px;
}

.admin .bubble{

  background:
    linear-gradient(
      145deg,
      var(--admin2),
      var(--admin)
    );

  border-bottom-left-radius:5px;
}


/* =====================================================
   REPLY
===================================================== */

.reply-quote{

  border-left:3px solid rgba(255,255,255,.55);

  background:rgba(0,0,0,.12);

  padding:7px 9px;

  border-radius:8px;

  margin-bottom:7px;

  font-size:11px;

  color:#dbeafe;
}

.reply-quote strong{

  display:block;

  font-size:10px;

  margin-bottom:2px;
}


/* =====================================================
   IMAGE
===================================================== */

.message-image{

  display:block;

  width:min(280px,100%);

  max-height:350px;

  object-fit:cover;

  border-radius:13px;

  cursor:pointer;

  margin-bottom:6px;

  background:#081321;
}


/* =====================================================
   VOICE MESSAGE
===================================================== */

.voice-message{

  display:flex;

  align-items:center;

  gap:9px;

  min-width:210px;

  max-width:310px;

  padding:2px 0;
}

.voice-play{

  width:42px;
  height:42px;

  flex-shrink:0;

  border:0;

  border-radius:50%;

  background:rgba(255,255,255,.14);

  color:white;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:18px;

  cursor:pointer;
}

.voice-play:active{

  transform:scale(.94);
}

.voice-content{

  flex:1;

  min-width:0;
}

.voice-bars{

  height:24px;

  display:flex;

  align-items:center;

  gap:3px;

  overflow:hidden;
}

.voice-bars span{

  width:3px;

  border-radius:5px;

  background:rgba(255,255,255,.7);

  flex-shrink:0;
}

.voice-time{

  font-size:10px;

  opacity:.75;

  margin-top:3px;
}

.voice-audio{

  display:none;
}


/* =====================================================
   META
===================================================== */

.meta{

  display:flex;

  justify-content:flex-end;

  align-items:center;

  gap:5px;

  margin-top:4px;

  font-size:9px;

  opacity:.72;
}

.read-status{

  font-size:11px;

  letter-spacing:-2px;
}

.read-status.sent{

  color:#cbd5e1;
}

.read-status.delivered{

  color:#cbd5e1;
}

.read-status.read{

  color:#7dd3fc;
}


/* =====================================================
   DELETED
===================================================== */

.deleted-message{

  font-style:italic;

  color:#cbd5e1;

  font-size:12px;
}

.deleted-message-icon{

  margin-right:4px;
}


/* =====================================================
   MESSAGE ACTIONS
===================================================== */

.message-actions{

  position:absolute;

  display:none;

  bottom:-42px;

  z-index:30;

  padding:5px;

  background:#020617;

  border:1px solid var(--border);

  border-radius:12px;

  box-shadow:0 8px 25px rgba(0,0,0,.3);
}

.customer .message-actions{

  right:5px;
}

.admin .message-actions{

  left:5px;
}

.message-row.show-actions .message-actions{

  display:flex;
}

.message-action{

  border:0;

  background:transparent;

  color:white;

  padding:7px 9px;

  border-radius:8px;

  font-family:inherit;

  font-size:11px;

  cursor:pointer;
}

.message-action:hover{

  background:#17253a;
}

.message-action.delete{

  color:#fca5a5;
}


/* =====================================================
   TYPING
===================================================== */

.typing{

  display:none;

  flex-shrink:0;

  padding:4px 17px 7px;

  color:var(--muted);

  font-size:11px;
}

.typing.active{

  display:block;
}

.typing-dots{

  display:inline-flex;

  gap:3px;

  margin-left:3px;
}

.typing-dots span{

  width:4px;
  height:4px;

  border-radius:50%;

  background:#94a3b8;

  animation:typingDot 1.2s infinite;
}

.typing-dots span:nth-child(2){

  animation-delay:.15s;
}

.typing-dots span:nth-child(3){

  animation-delay:.3s;
}

@keyframes typingDot{

  0%,60%,100%{
    opacity:.3;
    transform:translateY(0);
  }

  30%{
    opacity:1;
    transform:translateY(-2px);
  }
}


/* =====================================================
   NEW MESSAGE
===================================================== */

.new-message-bar{

  position:fixed;

  left:50%;

  bottom:104px;

  transform:translate(-50%,20px);

  opacity:0;

  pointer-events:none;

  z-index:140;

  padding:8px 15px;

  border-radius:22px;

  background:#0284c7;

  color:white;

  font-size:11px;

  box-shadow:0 8px 25px rgba(0,0,0,.3);

  transition:.25s;
}

.new-message-bar.show{

  transform:translate(-50%,0);

  opacity:1;
}


/* =====================================================
   SCROLL DOWN
===================================================== */

.scroll-down{

  position:fixed;

  right:17px;

  bottom:112px;

  width:46px;
  height:46px;

  border:1px solid rgba(148,163,184,.2);

  border-radius:50%;

  background:#16273c;

  color:white;

  font-size:21px;

  display:none;

  align-items:center;
  justify-content:center;

  z-index:135;

  cursor:pointer;
}

.scroll-down.show{

  display:flex;
}


/* =====================================================
   INPUT WRAPPER
===================================================== */

.input-wrapper{

  flex-shrink:0;

  background:rgba(2,6,23,.99);

  border-top:1px solid var(--border);

  padding:8px 10px
    calc(8px + env(safe-area-inset-bottom));

  position:relative;

  z-index:150;
}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

.preview{

  display:none;

  max-width:900px;

  margin:auto;

  padding:0 4px 8px;
}

.preview.active{

  display:block;
}

.preview-box{

  position:relative;

  display:inline-block;
}

.preview img{

  width:80px;
  height:80px;

  object-fit:cover;

  border-radius:12px;

  border:1px solid var(--border);
}

.remove-preview{

  position:absolute;

  top:-8px;
  right:-8px;

  width:24px;
  height:24px;

  border:0;

  border-radius:50%;

  background:#ef4444;

  color:white;

  cursor:pointer;

  font-size:16px;
}


/* =====================================================
   VOICE PREVIEW
===================================================== */

.voice-preview{

  display:none;

  max-width:950px;

  margin:auto;

  margin-bottom:7px;

  padding:8px 10px;

  border:1px solid rgba(56,189,248,.22);

  background:#0d1b2e;

  border-radius:16px;

  align-items:center;

  gap:8px;
}

.voice-preview.active{

  display:flex;
}

.voice-preview audio{

  flex:1;

  min-width:0;

  height:42px;
}

.remove-voice{

  width:38px;
  height:38px;

  flex-shrink:0;

  border:0;

  border-radius:50%;

  background:#3b1820;

  color:#fca5a5;

  font-size:20px;

  cursor:pointer;
}


/* =====================================================
   INPUT AREA
===================================================== */

.input-area{

  max-width:950px;

  margin:auto;

  display:flex;

  align-items:flex-end;

  gap:7px;
}


/* =====================================================
   COMPOSER BUTTONS
===================================================== */

.attach,
.camera-button,
.voice-button,
.send{

  width:48px;
  height:48px;

  min-width:48px;

  border:0;

  border-radius:50%;

  cursor:pointer;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:22px;
}

.camera-button,
.attach{

  background:#17283e;

  color:white;
}

.voice-button{

  background:#17283e;

  color:white;
}

.voice-button.recording{

  background:#ef4444;

  color:white;

  animation:pulseRecord 1s infinite;
}

@keyframes pulseRecord{

  0%{
    box-shadow:0 0 0 0 rgba(239,68,68,.45);
  }

  70%{
    box-shadow:0 0 0 12px rgba(239,68,68,0);
  }

  100%{
    box-shadow:0 0 0 0 rgba(239,68,68,0);
  }
}

.send{

  background:#38bdf8;

  color:#00111c;

  font-size:21px;
}

.send:disabled{

  opacity:.35;

  cursor:not-allowed;
}


/* =====================================================
   TEXTAREA
===================================================== */

textarea{

  flex:1;

  min-width:0;

  min-height:48px;

  max-height:135px;

  resize:none;

  border:0;

  outline:0;

  border-radius:25px;

  background:var(--input);

  color:white;

  padding:13px 16px;

  font-family:inherit;

  font-size:14px;
}

textarea::placeholder{

  color:#64748b;
}


/* =====================================================
   RECORDING PANEL
===================================================== */

.recording-panel{

  display:none;

  max-width:950px;

  margin:0 auto 8px;

  padding:9px 10px;

  border:1px solid rgba(239,68,68,.35);

  background:#101c2d;

  border-radius:18px;

  align-items:center;

  gap:10px;
}

.recording-panel.active{

  display:flex;
}

.recording-dot{

  width:13px;
  height:13px;

  flex-shrink:0;

  border-radius:50%;

  background:#ef4444;

  animation:recordDot 1s infinite;
}

@keyframes recordDot{

  0%,100%{
    opacity:.4;
  }

  50%{
    opacity:1;
  }
}

.recording-info{

  flex:1;

  min-width:0;
}

.recording-title{

  font-size:12px;

  color:#e2e8f0;
}

.recording-time{

  color:#fca5a5;

  font-size:14px;

  font-weight:700;

  margin-top:1px;
}

.cancel-recording{

  border:0;

  background:#17283e;

  color:#fca5a5;

  padding:10px 13px;

  border-radius:12px;

  font-family:inherit;

  cursor:pointer;
}

.stop-recording{

  width:46px;
  height:46px;

  border:0;

  border-radius:50%;

  background:#ef4444;

  color:white;

  font-size:18px;

  cursor:pointer;

  display:flex;

  align-items:center;
  justify-content:center;
}


/* =====================================================
   SIDE MENU
===================================================== */

.side-menu{

  position:fixed;

  z-index:300;

  top:0;

  right:-330px;

  width:310px;

  max-width:88%;

  height:100dvh;

  overflow-y:auto;

  background:#020617;

  padding:22px 18px;

  transition:.3s;

  box-shadow:-10px 0 35px rgba(0,0,0,.3);
}

.side-menu.active{

  right:0;
}

.menu-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:18px;
}

.menu-close{

  width:40px;
  height:40px;

  border:0;

  border-radius:50%;

  background:#17253a;

  color:white;

  font-size:20px;

  cursor:pointer;
}

.menu-link{

  display:block;

  width:100%;

  padding:14px;

  margin-top:7px;

  border:0;

  border-radius:12px;

  background:transparent;

  color:white;

  text-decoration:none;

  text-align:left;

  font-family:inherit;

  cursor:pointer;
}

.menu-link:hover{

  background:#17253a;
}

.menu-email{

  display:block;

  margin-top:4px;

  color:#64748b;

  font-size:12px;

  word-break:break-word;
}

hr{

  border:0;

  border-top:1px solid #1e293b;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.55);

  z-index:290;

  display:none;

  backdrop-filter:blur(2px);
}

.overlay.active{

  display:block;
}


/* =====================================================
   IMAGE VIEWER
===================================================== */

.image-viewer{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.92);

  z-index:500;

  display:none;

  align-items:center;

  justify-content:center;

  padding:25px;
}

.image-viewer.active{

  display:flex;
}

.image-viewer img{

  max-width:100%;

  max-height:85vh;

  object-fit:contain;

  border-radius:12px;
}

.viewer-close{

  position:absolute;

  top:18px;
  right:18px;

  width:45px;
  height:45px;

  border:0;

  border-radius:50%;

  background:rgba(255,255,255,.12);

  color:white;

  font-size:25px;

  cursor:pointer;
}


/* =====================================================
   CENTER
===================================================== */

.center-message{

  min-height:300px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:var(--muted);

  padding:30px;
}

.center-message .icon{

  font-size:42px;

  margin-bottom:12px;
}

.center-message h3{

  color:white;

  margin-bottom:8px;
}

.center-message p{

  font-size:13px;

  line-height:1.7;
}


/* =====================================================
   TOAST
===================================================== */

.toast{

  position:fixed;

  left:50%;

  bottom:90px;

  transform:translate(-50%,30px);

  opacity:0;

  pointer-events:none;

  z-index:550;

  padding:11px 17px;

  border-radius:12px;

  background:#020617;

  color:white;

  font-size:12px;

  box-shadow:0 10px 30px rgba(0,0,0,.35);

  transition:.25s;
}

.toast.show{

  transform:translate(-50%,0);

  opacity:1;
}


/* =====================================================
   LOADING
===================================================== */

.loading{

  position:fixed;

  inset:0;

  z-index:600;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  gap:10px;

  background:#07111f;

  color:#94a3b8;
}

.loading.hidden{

  display:none;
}

.loader{

  width:34px;
  height:34px;

  border:3px solid #1e3a52;

  border-top-color:#38bdf8;

  border-radius:50%;

  animation:spin .8s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .chat-header{

    height:78px;
  }

  .avatar{

    width:48px;
    height:48px;
  }

  .profile h2{

    font-size:15px;
  }

  .profile-text{

    max-width:160px;
  }

  .bubble{

    max-width:86%;
  }

  .welcome{

    border-radius:0 0 25px 25px;
  }

  .message-actions{

    bottom:-44px;
  }

  .scroll-down{

    right:14px;
    bottom:108px;
  }

  .voice-message{

    min-width:190px;
  }

  .input-area{

    gap:5px;
  }

  .attach,
  .camera-button,
  .voice-button,
  .send{

    width:46px;
    height:46px;

auth.onAuthStateChanged(
  async currentUser => {

    if(!currentUser){

      window.location.href =

      return;

    }

    user =

/* =====================================================
   CREATE CHAT
===================================================== */

async function createChat(){

  const chatRef =
    db.collection("chats")
      .doc(chatId);

  const customerName =
    user.displayName ||
    (
      user.email
        ? user.email.split("@")[0]
        : "Customer"
    );

  const data = {

    customerId:
      user.uid,

    customerName:
      customerName,

    customerEmail:
      user.email || "",

    customerPhoto:
      user.photoURL || "",

    status:
      "open",

    customerTyping:
      false,

    adminTyping:
      false,

    unreadForAdmin:
      0,

    lastMessage:
      "",

    lastMessageAt:
      firebase.firestore.FieldValue
        .serverTimestamp(),

    updatedAt:
      firebase.firestore.FieldValue
        .serverTimestamp()

  };

  const existing =
    await chatRef.get();

  if(!existing.exists){

    await chatRef.set({

      ...data,

      createdAt:
        firebase.firestore.FieldValue
          .serverTimestamp()

    });

  }

  else{

    await chatRef.set(
      data,
      {
        merge:true
      }
    );

  }

}


/* =====================================================
   CHAT LISTENER
===================================================== */

function listenToChat(){

  const chatRef =
    db.collection("chats")
      .doc(chatId);

  if(stopChat){

    stopChat();

  }

  stopChat =
    chatRef.onSnapshot(

      snapshot => {

        if(!snapshot.exists){

          return;

        }

        const data =
          snapshot.data();

        if(data.adminTyping === true){

          typing.classList.add(
            "active"
          );

        }

        else{

          typing.classList.remove(
            "active"
          );

        }

      },

      error => {

        console.error(
          "Chat listener:",
          error
        );

      }

    );

}


/* =====================================================
   MESSAGE LISTENER
===================================================== */

function listenToMessages(){

  if(stopMessages){

    stopMessages();

  }

  const query =
    db.collection("messages")
      .where(
        "chatId",
        "==",
        chatId
      );

  stopMessages =
    query.onSnapshot(

      snapshot => {

        const messages = [];

        snapshot.forEach(
          doc => {

            messages.push({

              id:
                doc.id,

              ...doc.data()

            });

          }
        );

        messages.sort(
          (a,b) => {

            return (
              getTimestampValue(
                a.createdAt
              )
              -
              getTimestampValue(
                b.createdAt
              )
            );

          }
        );

        detectNewAdminMessages(
          messages
        );

        lastRenderedMessages =
          messages;

        renderMessages(
          messages
        );

        markAdminMessagesRead(
          messages
        );

      },

      error => {

        console.error(
          error
        );

        showError(
          "Unable to load messages.",
          error.message
        );

      }

    );

}


/* =====================================================
   NEW ADMIN MESSAGE
===================================================== */

function detectNewAdminMessages(
  messages
){

  const adminMessages =
    messages.filter(
      message =>
        message.senderRole !==
        "customer"
    );

  const currentIds =
    new Set(
      adminMessages.map(
        message =>
          message.id
      )
    );

  if(firstMessageLoad){

    previousAdminMessageIds =
      currentIds;

    firstMessageLoad =
      false;

    return;

  }

  const newMessages =
    adminMessages.filter(
      message =>
        !previousAdminMessageIds
          .has(message.id)
    );

  if(newMessages.length > 0){

    unreadAdminCount +=
      newMessages.length;

    updateNotificationBadge();

    if(notificationsEnabled()){

      showNewMessageNotice(
        newMessages.length
      );

      browserNotification(
        newMessages[
          newMessages.length - 1
        ]
      );

    }

    if(!userNearBottom){

      newMessageBar.classList.add(
        "show"
      );

    }

  }

  previousAdminMessageIds =
    currentIds;

}


/* =====================================================
   NOTIFICATION BADGE
===================================================== */

function updateNotificationBadge(){

  if(!notificationsEnabled()){

    notificationBadge.classList.remove(
      "show"
    );

    return;

  }

  if(unreadAdminCount <= 0){

    notificationBadge.classList.remove(
      "show"
    );

    return;

  }

  notificationBadge.textContent =
    unreadAdminCount > 99
      ? "99+"
      : unreadAdminCount;

  notificationBadge.classList.add(
    "show"
  );

}


/* =====================================================
   NEW MESSAGE NOTICE
===================================================== */

function showNewMessageNotice(
  count
){

  newMessageBar.textContent =
    "💬 " +
    count +
    (
      count === 1
        ? " new message"
        : " new messages"
    );

  newMessageBar.classList.add(
    "show"
  );

  setTimeout(
    () => {

      newMessageBar.classList.remove(
        "show"
      );

    },
    3500
  );

}


/* =====================================================
   BROWSER NOTIFICATION
===================================================== */

function browserNotification(
  message
){

  if(!notificationsEnabled())
    return;

  if(!("Notification" in window))
    return;

  if(
    Notification.permission !==
    "granted"
  )
    return;

  const text =
    message.text ||
    (
      message.voiceUrl
        ? "Danny sent a voice note."
        : "Danny sent you a photo."
    );

  try{

    new Notification(
      "Danny Smart Power",
      {
        body:text,
        icon:"favicon.ico"
      }
    );

  }

  catch(error){

    console.log(
      "Browser notification unavailable"
    );

  }

}


/* =====================================================
   RENDER

function renderMessages(
  messages
){

  const wasNearBottom =
    isNearBottom();

  messagesEl.innerHTML =

  addWelcome();

  if(messages.length === 0){

    const empty =
      document.createElement(

  }

  let lastDate = "";

  messages.forEach(
    message => {

      const date =
        getMessageDate(
          message.createdAt
        );

      if(
        date &&
        date !== lastDate
      ){

        addDateDivider(
          date
        );

        lastDate =
          date;

      }

      renderMessage(
        message
      );

    }
  );

  if(
    firstMessageLoad ||
    wasNearBottom ||
    userNearBottom
  ){

    scrollToBottom(
      false
    );

  }

}

/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(
  data
){

  const row =
    document.createElement(
      "div"
    );

  const isCustomer =
    data.senderRole ===
    "customer";

  row.className =
    "message-row " +
    (
      isCustomer
        ? "customer"
        : "admin"
    );

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";


  /* =================================================
     DELETED
  ================================================= */

  if(
    isCustomer &&
    data.deletedForCustomer === true
  ){

    const deleted =
      document.createElement(
        "div"
      );

    deleted.className =
      "deleted-message";

    deleted.innerHTML =
      '<span class="deleted-message-icon">🗑️</span>' +
      'You deleted this message';

    bubble.appendChild(
      deleted
    );

  }

  else{


    /* ===============================================
       REPLY
    =============================================== */

    if(data.replyToText){

      const reply =
        document.createElement(
          "div"
        );

      reply.className =
        "reply-quote";

      reply.innerHTML = `

        <strong>
          ${escapeHtml(
            data.replyToName ||
            "Message"
          )}
        </strong>

        ${escapeHtml(
          data.replyToText
        )}

      `;

      bubble.appendChild(
        reply
      );

    }


    /* ===============================================
       IMAGE
    =============================================== */

    if(data.imageUrl){

      const img =
        document.createElement(
          "img"
        );

      img.src =
        data.imageUrl;

      img.className =
        "message-image";

      img.alt =
        "Chat photo";

      img.onclick =
        () => {

          openImageViewer(
            data.imageUrl
          );

        };

      bubble.appendChild(
        img
      );

    }


    /* ===============================================
       VOICE NOTE
    =============================================== */

    if(data.voiceUrl){

      const voice =
        createVoiceMessage(
          data.voiceUrl,
          data.voiceDuration
        );

      bubble.appendChild(
        voice
      );

    }


    /* ===============================================
       TEXT
    =============================================== */

    if(
      data.text !== undefined &&
      data.text !== null &&
      String(
        data.text
      ).trim() !== ""
    ){

      const text =
        document.createElement(
          "div"
        );

      text.textContent =
        data.text;

      bubble.appendChild(
        text
      );

    }

  }


  /* =================================================
     META
  ================================================= */

  const meta =
    document.createElement(
      "div"
    );

  meta.className =
    "meta";

  const time =
    document.createElement(
      "span"
    );

  time.textContent =
    formatTime(
      data.createdAt
    );

  meta.appendChild(
    time
  );

  if(isCustomer){

    const read =
      document.createElement(
        "span"
      );

    read.className =
      "read-status " +
      getReadClass(
        data
      );

    read.textContent =
      getReadSymbol(
        data
      );

    meta.appendChild(
      read
    );

  }

  bubble.appendChild(
    meta
  );

  row.appendChild(
    bubble
  );


  /* =================================================
     ACTIONS
  ================================================= */

  const actions =
    document.createElement(
      "div"
    );

  actions.className =
    "message-actions";


  /* COPY */

  if(data.text){

    const copy =
      document.createElement(
        "button"
      );

    copy.className =
      "message-action";

    copy.textContent =
      "Copy";

    copy.onclick =
      event => {

        event.stopPropagation();

        navigator.clipboard
          ?.writeText(
            data.text
          );

        showToast(
          "Message copied ✓"
        );

      };

    actions.appendChild(
      copy
    );

  }


  /* REPLY */

  if(data.text){

    const replyButton =
      document.createElement(
        "button"
      );

    replyButton.className =
      "message-action";

    replyButton.textContent =
      "Reply";

    replyButton.onclick =
      event => {

        event.stopPropagation();

        prepareReply(
          data
        );

        row.classList.remove(
          "show-actions"
        );

      };

    actions.appendChild(
      replyButton
    );

  }


  /* DELETE */

  if(
    isCustomer &&
    data.deletedForCustomer !== true
  ){

    const deleteButton =
      document.createElement(
        "button"
      );

    deleteButton.className =
      "message-action delete";

    deleteButton.textContent =
      "Delete";

    deleteButton.onclick =
      event => {

        event.stopPropagation();

        deleteForCustomer(
          data
        );

        row.classList.remove(
          "show-actions"
        );

      };

    actions.appendChild(
      deleteButton
    );

  }


  row.appendChild(
    actions
  );


  /* =================================================
     LONG PRESS
  ================================================= */

  let pressTimer = null;

  row.addEventListener(
    "contextmenu",
    event => {

      event.preventDefault();

      row.classList.toggle(
        "show-actions"
      );

    }
  );

  row.addEventListener(
    "touchstart",
    () => {

      pressTimer =
        setTimeout(
          () => {

            row.classList.add(
              "show-actions"
            );

          },
          550
        );

    },
    {
      passive:true
    }
  );

  row.addEventListener(
    "touchend",
    () => {

      clearTimeout(
        pressTimer
      );

    }
  );

  messagesEl.appendChild(
    row
  );

}


/* =====================================================
   CREATE VOICE MESSAGE
===================================================== */

function createVoiceMessage(
  url,
  duration
){

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "voice-message";


  const audio =
    document.createElement(
      "audio"
    );

  audio.className =
    "voice-audio";

  audio.src =
    url;

  audio.preload =
    "metadata";


  const play =
    document.createElement(
      "button"
    );

  play.className =
    "voice-play";

  play.type =
    "button";

  play.textContent =
    "▶";


  const content =
    document.createElement(
      "div"
    );

  content.className =
    "voice-content";


  const bars =
    document.createElement(
      "div"
    );

  bars.className =
    "voice-bars";


  const heights = [
    8,14,20,11,18,24,13,19,
    9,22,15,24,12,18,8,16,
    21,12,18,9,15,23,11,19
  ];


  heights.forEach(
    height => {

      const span =
        document.createElement(
          "span"
        );

      span.style.height =
        height + "px";

      bars.appendChild(
        span
      );

    }
  );


  const time =
    document.createElement(
      "div"
    );

  time.className =
    "voice-time";

  time.textContent =
    formatDuration(
      duration
    );


  content.appendChild(
    bars
  );

  content.appendChild(
    time
  );


  play.onclick =
    event => {

      event.stopPropagation();

      if(audio.paused){

        audio.play()
          .then(
            () => {

              play.textContent =
                "❚❚";

            }
          )
          .catch(
            error => {

              console.error(
                "Voice playback error:",
                error
              );

              showToast(
                "Voice note could not play."
              );

            }
          );

      }

      else{

        audio.pause();

        play.textContent =
          "▶";

      }

    };


  audio.onended =
    () => {

      play.textContent =
        "▶";

    };


  audio.ontimeupdate =
    () => {

      if(
        audio.duration &&
        isFinite(audio.duration)
      ){

        time.textContent =
          formatDuration(
            Math.floor(
              audio.currentTime
            )
          ) +
          " / " +
          formatDuration(
            Math.floor(
              audio.duration
            )
          );

      }

    };


  wrapper.appendChild(
    play
  );

  wrapper.appendChild(
    content
  );

  wrapper.appendChild(
    audio
  );

  return wrapper;

}

function getReadClass(

){

  if(data.read === true){

    return "read";

  }

  if(data.delivered === true){

    return "delivered";

  }

  return "sent";

}


function getReadSymbol(
  data
){

){

      message =>

        message.senderRole !==
        "customer" &&

        message.read !== true

    );

  if(unread.length === 0){

    return;

  }

      db.batch();

    unread.forEach(
      message => {

          db.collection(

          )
          .doc(
            message.id
          );

        batch.update(
          ref,
          {
            read:true

      );

      "Read update:",
      error
    );

  }

/* =====================================================
   SEND VOICE MESSAGE
===================================================== */

async function sendVoiceMessage(){

  if(!recordedVoiceBlob){

    return;

  }


  if(!user){

    return;

  }


  try{

    showToast(
      "Uploading voice note..."
    );


    const extension =
      getAudioExtension(
        recordedVoiceBlob.type
      );


    const filePath =
      "chatVoice/" +
      chatId +
      "/" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2) +
      "." +
      extension;


    const voiceRef =
      storage.ref(
        filePath
      );


    const metadata = {

      contentType:
        recordedVoiceBlob.type ||
        "audio/webm",

      customMetadata:{

        chatId:
          chatId,

        senderId:
          user.uid,

        senderRole:
          "customer"

      }

    };


    const uploadTask =
      voiceRef.put(
        recordedVoiceBlob,
        metadata
      );


    await new Promise(
      (
        resolve,
        reject
      ) => {

        uploadTask.on(

          firebase.storage.TaskEvent.STATE_CHANGED,

          snapshot => {

            const percent =
              Math.round(
                (
                  snapshot.bytesTransferred /
                  snapshot.totalBytes
                ) * 100
              );

            showToast(
              "Uploading voice " +
              percent +
              "%..."
            );

          },

          error => {

            reject(
              error
            );

          },

          () => {

            resolve();

          }

        );

      }
    );


    const voiceUrl =
      await voiceRef.getDownloadURL();


    const duration =
      await getAudioDurationFromBlob(
        recordedVoiceBlob
      );


    const messageRef =
      db.collection(
        "messages"
      )
      .doc();


    await messageRef.set({

      chatId:
        chatId,

      createdAt:
        firebase.firestore.FieldValue
          .serverTimestamp(),

      imageUrl:
        "",

      voiceUrl:
        voiceUrl,

      voiceDuration:
        duration,

      voiceMimeType:
        recordedVoiceBlob.type ||
        "audio/webm",

      read:
        false,

      delivered:
        false,

      senderId:
        user.uid,

      senderName:
        user.displayName ||

        (
          user.email
            ? user.email.split("@")[0]
            : "Customer"
        ),

      senderRole:
        "customer",

      text:
        "",

      deletedForCustomer:
        false

    });


    await updateChatAfterMessage(
      "🎙️ Voice note"
    );


    clearVoiceRecording();

    stopTyping();

    showToast(
      "Voice note sent ✓"
    );

    scrollToBottom(
      true
    );

  }

  catch(error){

    console.error(
      "VOICE SEND ERROR:",
      error
    );


    let message =
      error.message ||
      "Unknown error";


    if(
      error.code ===
      "storage/unauthorized"
    ){

      message =
        "Firebase Storage permission denied.\n\n" +
        "Check your Firebase Storage Rules.";

    }


    else if(
      error.code ===
      "storage/unauthenticated"
    ){

      message =
        "Your login session expired. Please login again.";

    }


    else if(
      error.code ===
      "storage/quota-exceeded"
    ){

      message =
        "Firebase Storage quota has been exceeded.";

    }


    alert(
      "Voice note could not be sent.\n\n" +
      message
    );

  }

}

/* =====================================================
   VOICE RECORDING
===================================================== */

voiceButton.onclick =
  startVoiceRecording;


async function startVoiceRecording(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    alert(
      "Voice recording is not supported by this browser."
    );

    return;

  }


  if(
    !window.MediaRecorder
  ){

    alert(
      "This browser does not support voice recording."
    );

    return;

  }


  if(mediaRecorder){

    return;

  }


  try{

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          }

        });


    audioChunks = [];

    recordingCancelled =
      false;


    let mimeType =
      "";


    const possibleTypes = [

      "audio/webm;codecs=opus",

      "audio/webm",

      "audio/mp4",

      "audio/ogg;codecs=opus"

    ];


    for(
      const type of possibleTypes
    ){

      if(
        MediaRecorder.isTypeSupported(
          type
        )
      ){

        mimeType =
          type;

        break;

      }

    }


    voiceMimeType =
      mimeType ||
      "audio/webm";


    mediaRecorder =
      new MediaRecorder(
        stream,
        mimeType
          ? {
              mimeType
            }
          : undefined
      );


    mediaRecorder.ondataavailable =
      event => {

        if(
          event.data &&
          event.data.size > 0
        ){

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onerror =
      event => {

        console.error(
          "Recorder error:",
          event
        );

        stopVoiceTracks();

        resetRecorderUI();

        alert(
          "Voice recording failed."
        );

      };


    mediaRecorder.onstop =
      async () => {

        stopVoiceTracks();


        if(recordingCancelled){

          resetRecorderUI();

          return;

        }


        if(
          audioChunks.length === 0
        ){

          resetRecorderUI();

          alert(
            "No voice was recorded."
          );

          return;

        }


        const actualType =
          mediaRecorder.mimeType ||
          voiceMimeType ||
          "audio/webm";


        recordedVoiceBlob =
          new Blob(
            audioChunks,
            {
              type:actualType
            }
          );


        recordedVoiceUrl =
          URL.createObjectURL(
            recordedVoiceBlob
          );


        voicePreviewAudio.src =
          recordedVoiceUrl;


        voicePreview.classList.add(
          "active"
        );


        resetRecorderUI();

        updateSendButton();

        showToast(
          "Voice note ready ✓ Tap send."
        );

      };


    mediaRecorder.start(
      250
    );


    recordingStartedAt =
      Date.now();


    recordingPanel.classList.add(
      "active"
    );


    voiceButton.classList.add(
      "recording"
    );


    voiceButton.textContent =
      "⏺";


    updateRecordingTimer();


    recordingTimer =
      setInterval(
        updateRecordingTimer,
        500
      );

  }

  catch(error){

    console.error(
      "MICROPHONE ERROR:",
      error
    );


    if(
      error.name ===
      "NotAllowedError"
    ){

      alert(
        "Microphone permission was denied.\n\n" +
        "Allow microphone access for this website and try again."
      );

    }

    else{

      alert(
        "Could not access microphone.\n\n" +
        error.message
      );

    }

  }

}

/* =====================================================
   AUDIO DURATION
===================================================== */

function getAudioDurationFromBlob(
  blob
){

  return new Promise(
    resolve => {

      const url =
        URL.createObjectURL(
          blob
        );

      const audio =
        document.createElement(
          "audio"
        );

      audio.preload =
        "metadata";

      audio.onloadedmetadata =
        () => {

          const duration =
            isFinite(
              audio.duration
            )
              ? Math.round(
                  audio.duration
                )
              : 0;

          URL.revokeObjectURL(
            url
          );

          resolve(
            duration
          );

        };

      audio.onerror =
        () => {

          URL.revokeObjectURL(
            url
          );

          resolve(
            0
          );

        };

      audio.src =
        url;

    }
  );

}


/* =====================================================
   AUDIO EXTENSION
===================================================== */

function getAudioExtension(
  mime
){

  mime =
    String(
      mime || ""
    ).toLowerCase();


  if(
    mime.includes("mp4") ||
    mime.includes("m4a")
  ){

    return "m4a";

  }


  if(
    mime.includes("ogg")
  ){

    return "ogg";

  }


  if(
    mime.includes("wav")
  ){

    return "wav";

  }


  if(
    mime.includes("mpeg")
  ){

    return "mp3";

  }


  return "webm";

}


/* =====================================================
   FORMAT DURATION
===================================================== */

function formatDuration(
  seconds
){

  seconds =
    Number(
      seconds || 0
    );


  if(!isFinite(seconds)){

    seconds =
      0;

  }


  seconds =
    Math.max(
      0,
      Math.floor(seconds)
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const remaining =
    seconds % 60;


  return (
    String(minutes)
      .padStart(2,"0")
    +
    ":" +
    String(remaining)
      .padStart(2,"0")
  );

}

    )

function compressImage(
  file
){

  const reader =
    new FileReader();

  reader.onload =
    event => {

      const img =
        new Image();

      img.onload =
        () => {

          const maxSize =
            900;

          let width =
            img.width;

          let height =
            img.height;

          if(
            width >
            maxSize ||
            height >
            maxSize
          ){

            if(width > height){

              height =
                height *
                maxSize /
                width;

              width =
                maxSize;

            }

            else{

              width =
                width *
                maxSize /
                height;

              height =
                maxSize;

            }

          }


          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width =
            width;

          canvas.height =
            height;

          const ctx =
            canvas.getContext(
              "2d"
            );

          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );

          selectedImageData =
            canvas.toDataURL(
              "image/jpeg",
              .68
            );

          previewImage.src =
            selectedImageData;

          preview.classList.add(
            "active"
          );

          updateSendButton();

        };

      img.src =
        event.target.result;

    };

  reader.readAsDataURL(
    file
  );

}

/* =====================================================
   TIMESTAMP
===================================================== */

function getTimestampValue(
  timestamp
){

  if(!timestamp){

    return 0;

  }

  if(
    typeof timestamp.toMillis ===
    "function"
  ){

    return timestamp.toMillis();

  }

  if(
    timestamp.seconds !==
    undefined
  ){

    return (
      timestamp.seconds *
      1000
    );

  }

  if(
    timestamp instanceof Date
  ){

    return timestamp.getTime();

  }

  return 0;

}


/* =====================================================
   MESSAGE DATE
===================================================== */

function getMessageDate(
  timestamp
){

  if(!timestamp){

    return "";

  }

  const value =
    getTimestampValue(
      timestamp
    );

  if(!value){

    return "";

  }

  const date =
    new Date(value);

  const today =
    new Date();

  const yesterday =
    new Date();

  yesterday.setDate(
    today.getDate() - 1
  );

  if(
    date.toDateString() ===
    today.toDateString()
  ){

    return "Today";

  }

  if(
    date.toDateString() ===
    yesterday.toDateString()
  ){

    return "Yesterday";

  }

  return date.toLocaleDateString(
    [],
    {
      day:"numeric",
      month:"short",
      year:
        date.getFullYear() !==
        today.getFullYear()
          ? "numeric"
          : undefined
    }
  );

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(
  timestamp
){

  if(!timestamp){

    return "";

  }

  const value =
    getTimestampValue(
      timestamp
    );

  if(!value){

    return "";

  }

  const date =
    new Date(value);

  if(
    isNaN(
      date.getTime()
    )
  ){

    return "";

  }

  return date.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  text
){

  return String(
    text || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

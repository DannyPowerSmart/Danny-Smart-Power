<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat with Danny | Danny Smart Power</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0b1220;
  --header:#020617;
  --chat-bg:#0f172a;
  --card:#111e30;
  --card2:#17253a;

  --customer:#0284c7;
  --customer-dark:#0369a1;

  --admin:#1e293b;

  --blue:#38bdf8;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#facc15;

  --text:#f8fafc;
  --muted:#94a3b8;
  --border:rgba(148,163,184,.14);
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Poppins,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
textarea{
  font-family:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.chat-app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--chat-bg);
}


/* =====================================================
   HEADER
===================================================== */

.chat-header{
  height:76px;
  flex-shrink:0;

  background:rgba(2,6,23,.97);

  border-bottom:1px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 12px;

  z-index:20;
}

.header-side{
  width:45px;
  display:flex;
  align-items:center;
}

.header-side:last-child{
  justify-content:flex-end;
}

.header-btn{
  width:43px;
  height:43px;

  border:0;
  border-radius:50%;

  background:transparent;

  color:white;

  font-size:25px;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.2s;
}

.header-btn:hover{
  background:var(--card2);
}

.header-btn:active{
  transform:scale(.92);
}


/* PROFILE */

.profile{
  display:flex;
  align-items:center;
  gap:10px;

  min-width:0;
}

.avatar{
  position:relative;

  width:48px;
  height:48px;

  min-width:48px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:linear-gradient(
    135deg,
    var(--blue),
    var(--customer-dark)
  );

  color:#00111c;

  font-size:24px;

  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.online-dot{
  position:absolute;

  right:1px;
  bottom:1px;

  width:13px;
  height:13px;

  border-radius:50%;

  background:var(--green);

  border:3px solid var(--header);
}

.profile-info{
  min-width:0;
}

.profile-info h2{
  font-size:15px;
  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.status{
  color:var(--green);

  font-size:10px;

  margin-top:1px;

  transition:.2s;
}

.status.connecting{
  color:var(--yellow);
}

.status.offline{
  color:var(--muted);
}


/* NOTIFICATION BADGE */

.notification-badge{
  position:absolute;

  top:5px;
  right:3px;

  min-width:17px;
  height:17px;

  padding:0 4px;

  display:none;
  align-items:center;
  justify-content:center;

  border-radius:20px;

  background:var(--red);
  color:white;

  font-size:9px;
  font-weight:700;

  border:2px solid var(--header);
}

.notification-badge.show{
  display:flex;
}


/* =====================================================
   MESSAGES
===================================================== */

.messages{
  flex:1;
  min-height:0;

  overflow-y:auto;

  padding:15px 10px 20px;

  scroll-behavior:smooth;

  background:
    radial-gradient(
      circle at top left,
      rgba(56,189,248,.045),
      transparent 35%
    ),
    var(--chat-bg);
}

.messages::-webkit-scrollbar{
  width:5px;
}

.messages::-webkit-scrollbar-thumb{
  background:#334155;
  border-radius:20px;
}


/* =====================================================
   WELCOME
===================================================== */

.welcome{
  max-width:620px;

  margin:8px auto 24px;

  padding:24px 18px;

  border:1px solid var(--border);

  border-radius:24px;

  background:linear-gradient(
    145deg,
    #111e30,
    #0f1a2b
  );

  text-align:center;

  box-shadow:
    0 12px 35px rgba(0,0,0,.12);
}

.welcome-icon{
  width:62px;
  height:62px;

  margin:0 auto 11px;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      rgba(56,189,248,.2),
      rgba(2,132,199,.1)
    );

  border:1px solid rgba(56,189,248,.2);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:28px;
}

.welcome h1{
  font-size:19px;
  margin-bottom:7px;
}

.welcome p{
  color:var(--muted);

  font-size:12px;

  line-height:1.7;
}


/* =====================================================
   DATE SEPARATOR
===================================================== */

.date-divider{
  display:flex;
  align-items:center;
  justify-content:center;

  margin:18px 0 12px;
}

.date-divider span{
  padding:5px 11px;

  border-radius:20px;

  background:#172337;

  color:#94a3b8;

  font-size:9px;
}


/* =====================================================
   MESSAGE ROW
===================================================== */

.message-row{
  display:flex;
  width:100%;

  margin:5px 0;
}

.message-row.customer{
  justify-content:flex-end;
}

.message-row.admin{
  justify-content:flex-start;
}


/* =====================================================
   BUBBLE
===================================================== */

.bubble{
  position:relative;

  max-width:min(78%,560px);

  padding:9px 11px 6px;

  border-radius:18px;

  font-size:13px;

  line-height:1.55;

  overflow-wrap:anywhere;

  box-shadow:
    0 2px 6px rgba(0,0,0,.14);

  animation:
    messageIn .18s ease;
}

@keyframes messageIn{

  from{
    opacity:0;
    transform:translateY(4px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.customer .bubble{
  background:
    linear-gradient(
      145deg,
      var(--customer),
      var(--customer-dark)
    );

  border-bottom-right-radius:5px;
}

.admin .bubble{
  background:var(--admin);

  border-bottom-left-radius:5px;
}


/* =====================================================
   IMAGE
===================================================== */

.message-image{
  display:block;

  width:min(300px,100%);

  max-height:360px;

  object-fit:cover;

  border-radius:13px;

  cursor:pointer;

  margin-bottom:5px;

  transition:.2s;
}

.message-image:hover{
  opacity:.92;
}


/* =====================================================
   META
===================================================== */

.meta{
  display:flex;

  justify-content:flex-end;
  align-items:center;

  gap:5px;

  margin-top:3px;

  font-size:8px;

  opacity:.7;
}

.read-status{
  color:#bae6fd;

  font-size:10px;

  letter-spacing:-2px;
}


/* =====================================================
   TYPING
===================================================== */

.typing{
  display:none;

  flex-shrink:0;

  padding:4px 15px 6px;

  color:var(--muted);

  font-size:10px;

  background:var(--chat-bg);
}

.typing.active{
  display:flex;
  align-items:center;
  gap:6px;
}

.typing-dots{
  display:flex;
  gap:3px;
}

.typing-dots span{
  width:5px;
  height:5px;

  border-radius:50%;

  background:var(--blue);

  animation:typing 1s infinite;
}

.typing-dots span:nth-child(2){
  animation-delay:.15s;
}

.typing-dots span:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{

  0%,60%,100%{
    opacity:.3;
    transform:translateY(0);
  }

  30%{
    opacity:1;
    transform:translateY(-3px);
  }

}


/* =====================================================
   INPUT AREA
===================================================== */

.input-wrapper{
  flex-shrink:0;

  background:rgba(2,6,23,.98);

  border-top:1px solid var(--border);

  padding:
    8px
    10px
    calc(8px + env(safe-area-inset-bottom));

  z-index:20;
}

.input-area{
  max-width:950px;

  margin:auto;

  display:flex;

  align-items:flex-end;

  gap:7px;
}


/* ATTACH */

.attach{
  width:45px;
  height:45px;

  min-width:45px;

  border:0;

  border-radius:50%;

  background:#17253a;

  color:white;

  font-size:22px;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.2s;
}

.attach:hover{
  background:#22334c;
}

.attach:active{
  transform:scale(.92);
}


/* TEXTAREA */

.textarea-box{
  flex:1;

  min-width:0;

  position:relative;
}

textarea{
  width:100%;

  min-height:45px;
  max-height:130px;

  resize:none;

  border:1px solid transparent;

  outline:0;

  border-radius:23px;

  background:#182337;

  color:white;

  padding:12px 15px;

  font-size:13px;

  line-height:20px;

  transition:.2s;
}

textarea:focus{
  border-color:rgba(56,189,248,.3);
}

textarea::placeholder{
  color:#64748b;
}


/* SEND */

.send{
  width:45px;
  height:45px;

  min-width:45px;

  border:0;

  border-radius:50%;

  background:var(--blue);

  color:#00111c;

  cursor:pointer;

  font-size:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.2s;
}

.send:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.send:not(:disabled):active{
  transform:scale(.91);
}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

.preview{
  display:none;

  max-width:950px;

  margin:auto;

  padding:0 0 8px;
}

.preview.active{
  display:block;
}

.preview-box{
  position:relative;

  display:inline-block;

  padding:3px;

  border-radius:13px;

  background:#17253a;
}

.preview img{
  display:block;

  width:80px;
  height:80px;

  object-fit:cover;

  border-radius:10px;
}

.remove-preview{
  position:absolute;

  top:-7px;
  right:-7px;

  width:23px;
  height:23px;

  border:0;

  border-radius:50%;

  background:var(--red);

  color:white;

  font-size:16px;

  cursor:pointer;
}


/* =====================================================
   UPLOAD PROGRESS
===================================================== */

.upload-progress{
  display:none;

  max-width:950px;

  margin:auto;

  padding:0 0 7px;
}

.upload-progress.active{
  display:block;
}

.progress-top{
  display:flex;

  justify-content:space-between;

  color:var(--muted);

  font-size:9px;

  margin-bottom:4px;
}

.progress-track{
  width:100%;
  height:4px;

  border-radius:20px;

  background:#1e293b;

  overflow:hidden;
}

.progress-bar{
  width:0;
  height:100%;

  background:var(--blue);

  transition:.15s;
}


/* =====================================================
   SIDE MENU
===================================================== */

.side-menu{
  position:fixed;

  z-index:100;

  top:0;
  right:-340px;

  width:315px;
  max-width:88%;

  height:100dvh;

  background:#020617;

  padding:22px 17px;

  transition:.3s;

  box-shadow:
    -15px 0 40px rgba(0,0,0,.35);

  overflow-y:auto;
}

.side-menu.active{
  right:0;
}

.menu-header{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:18px;
}

.menu-header h3{
  font-size:17px;
}

.close-menu{
  width:38px;
  height:38px;

  border:0;
  border-radius:50%;

  background:#17253a;
  color:white;

  font-size:20px;

  cursor:pointer;
}

.menu-profile{
  padding:15px;

  border-radius:17px;

  background:#111e30;

  border:1px solid var(--border);

  margin-bottom:15px;
}

.menu-profile strong{
  display:block;

  font-size:14px;
}

.menu-email{
  display:block;

  margin-top:3px;

  color:#64748b;

  font-size:10px;

  word-break:break-word;
}

.menu-link{
  display:flex;

  align-items:center;

  gap:11px;

  width:100%;

  padding:13px 14px;

  margin-top:5px;

  border:0;

  border-radius:13px;

  background:transparent;

  color:white;

  text-decoration:none;

  text-align:left;

  font-size:13px;

  font-family:inherit;

  cursor:pointer;

  transition:.2s;
}

.menu-link:hover{
  background:#17253a;
}

.menu-icon{
  width:30px;

  font-size:18px;

  text-align:center;
}

.menu-notification-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:13px 14px;

  margin-top:5px;

  border-radius:13px;

  background:#111e30;

  font-size:12px;
}

.small-switch{
  width:40px;
  height:22px;

  position:relative;
}

.small-switch input{
  opacity:0;
  width:0;
  height:0;
}

.small-slider{
  position:absolute;
  inset:0;

  background:#475569;

  border-radius:20px;

  cursor:pointer;
}

.small-slider:before{
  content:"";

  position:absolute;

  width:16px;
  height:16px;

  left:3px;
  top:3px;

  background:white;

  border-radius:50%;

  transition:.2s;
}

.small-switch input:checked + .small-slider{
  background:var(--blue2);
}

.small-switch input:checked + .small-slider:before{
  transform:translateX(18px);
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,.55);

  backdrop-filter:blur(2px);

  z-index:90;

  display:none;
}

.overlay.active{
  display:block;
}


/* =====================================================
   IMAGE VIEWER
===================================================== */

.image-viewer{
  position:fixed;

  inset:0;

  z-index:300;

  background:rgba(0,0,0,.94);

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;
}

.image-viewer.active{
  display:flex;
}

.image-viewer img{
  max-width:100%;
  max-height:90vh;

  object-fit:contain;

  border-radius:10px;
}

.close-viewer{
  position:absolute;

  top:18px;
  right:18px;

  width:43px;
  height:43px;

  border:0;
  border-radius:50%;

  background:#17253a;

  color:white;

  font-size:23px;

  cursor:pointer;
}


/* =====================================================
   COPY TOAST
===================================================== */

.toast{
  position:fixed;

  left:50%;
  bottom:90px;

  transform:
    translate(-50%,20px);

  opacity:0;

  pointer-events:none;

  padding:10px 16px;

  border-radius:12px;

  background:#020617;

  color:white;

  font-size:11px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.35);

  transition:.25s;

  z-index:400;
}

.toast.show{
  transform:
    translate(-50%,0);

  opacity:1;
}


/* =====================================================
   CENTER
===================================================== */

.center-message{
  min-height:300px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  color:var(--muted);

  padding:30px;
}

.center-message .icon{
  font-size:42px;

  margin-bottom:10px;
}

.center-message h3{
  color:white;

  font-size:16px;

  margin-bottom:7px;
}

.center-message p{
  font-size:12px;

  line-height:1.7;

  max-width:400px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .chat-header{
    height:70px;
  }

  .avatar{
    width:43px;
    height:43px;
    min-width:43px;
    font-size:21px;
  }

  .profile-info h2{
    font-size:13px;
  }

  .status{
    font-size:9px;
  }

  .bubble{
    max-width:86%;
    font-size:13px;
  }

  .welcome{
    padding:20px 15px;
  }

  .welcome h1{
    font-size:17px;
  }

  .messages{
    padding-left:8px;
    padding-right:8px;
  }

}

</style>
</head>


<body>

<div class="chat-app">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="chat-header">

  <div class="header-side">

    <button
      class="header-btn"
      id="backButton"
      aria-label="Go back"
    >
      ←
    </button>

  </div>


  <div class="profile">

    <div class="avatar">

      ⚡

      <span
        class="online-dot"
        id="onlineDot"
      ></span>

    </div>


    <div class="profile-info">

      <h2>
        Danny Smart Power
      </h2>

      <div
        class="status connecting"
        id="status"
      >
        Connecting...
      </div>

    </div>

  </div>


  <div class="header-side">

    <button
      class="header-btn"
      id="notificationButton"
      aria-label="Notifications"
      style="position:relative;"
    >

      🔔

      <span
        class="notification-badge"
        id="notificationBadge"
      >
        0
      </span>

    </button>


    <button
      class="header-btn"
      id="menuButton"
      aria-label="Menu"
    >
      ⋮
    </button>

  </div>

</header>


<!-- =====================================================
     MESSAGES
===================================================== -->

<main
  class="messages"
  id="messages"
>

  <div class="center-message">

    <div class="icon">
      ⚡
    </div>

    <h3>
      Connecting to Danny...
    </h3>

    <p>
      Please wait while your chat is loading.
    </p>

  </div>

</main>


<!-- =====================================================
     TYPING
===================================================== -->

<div
  class="typing"
  id="typing"
>

  <div class="typing-dots">

    <span></span>
    <span></span>
    <span></span>

  </div>

  Danny is typing...

</div>


<!-- =====================================================
     INPUT
===================================================== -->

<div class="input-wrapper">


  <!-- PREVIEW -->

  <div
    class="preview"
    id="preview"
  >

    <div class="preview-box">

      <img
        id="previewImage"
        alt="Selected image"
      >

      <button
        class="remove-preview"
        id="removePreview"
        type="button"
      >
        ×
      </button>

    </div>

  </div>


  <!-- PROGRESS -->

  <div
    class="upload-progress"
    id="uploadProgress"
  >

    <div class="progress-top">

      <span>
        Uploading image...
      </span>

      <span id="progressText">
        0%
      </span>

    </div>


    <div class="progress-track">

      <div
        class="progress-bar"
        id="progressBar"
      ></div>

    </div>

  </div>


  <div class="input-area">


    <button
      class="attach"
      id="attachButton"
      type="button"
      aria-label="Attach image"
    >
      +
    </button>


    <input
      type="file"
      id="fileInput"
      accept="image/*"
      hidden
    >


    <div class="textarea-box">

      <textarea
        id="messageInput"
        rows="1"
        placeholder="Type a message..."
      ></textarea>

    </div>


    <button
      class="send"
      id="sendButton"
      type="button"
      disabled
      aria-label="Send"
    >
      ➤
    </button>

  </div>

</div>


</div>


<!-- =====================================================
     OVERLAY
===================================================== -->

<div
  class="overlay"
  id="overlay"
></div>


<!-- =====================================================
     SIDE MENU
===================================================== -->

<aside
  class="side-menu"
  id="sideMenu"
>


  <div class="menu-header">

    <h3>
      Danny Chat
    </h3>

    <button
      class="close-menu"
      id="closeMenu"
      type="button"
    >
      ×
    </button>

  </div>


  <div class="menu-profile">

    <strong
      id="customerName"
    >
      Loading...
    </strong>

    <small
      class="menu-email"
      id="customerEmail"
    ></small>

  </div>


  <a
    class="menu-link"
    href="profile.html"
  >

    <span class="menu-icon">
      👤
    </span>

    Profile

  </a>


  <a
    class="menu-link"
    href="shop.html"
  >

    <span class="menu-icon">
      🛍️
    </span>

    Continue Shopping

  </a>


  <a
    class="menu-link"
    href="cart.html"
  >

    <span class="menu-icon">
      🛒
    </span>

    My Cart

  </a>


  <a
    class="menu-link"
    href="orders.html"
  >

    <span class="menu-icon">
      📦
    </span>

    My Orders

  </a>


  <a
    class="menu-link"
    href="settings.html"
  >

    <span class="menu-icon">
      ⚙️
    </span>

    Settings

  </a>


  <a
    class="menu-link"
    href="contact.html"
  >

    <span class="menu-icon">
      📞

/* =====================================================
   CREATE CHAT
===================================================== */

async function createChat(){

  const chatRef =
    db.collection("chats")
      .doc(chatId);


  const customerName =
    user.displayName ||
    (
      user.email
        ? user.email.split("@")[0]
        : "Customer"
    );


  const data = {

    customerId:
      user.uid,

    customerName:
      customerName,

    customerEmail:
      user.email || "",

    customerPhoto:
      user.photoURL || "",

    status:
      "open",

    customerTyping:
      false,

    adminTyping:
      false,

    unreadForAdmin:
      0,

    unreadForCustomer:
      0,

    lastMessage:
      "",

    lastMessageAt:
      firebase.firestore.FieldValue
        .serverTimestamp(),

    updatedAt:
      firebase.firestore.FieldValue
        .serverTimestamp()

  };


  const existing =
    await chatRef.get();


  if(!existing.exists){

    await chatRef.set({

      ...data,

      createdAt:
        firebase.firestore.FieldValue
          .serverTimestamp()

    });

  }

  else{

    await chatRef.set(
      data,
      {
        merge:true
      }
    );

  }

}


/* =====================================================
   CHAT LISTENER
===================================================== */

function listenToChat(){

  const chatRef =
    db.collection("chats")
      .doc(chatId);


  if(stopChat)
    stopChat();


  stopChat =
    chatRef.onSnapshot(

      snapshot => {

        if(!snapshot.exists)
          return;


        const data =
          snapshot.data();


        /* ADMIN TYPING */

        if(
          data.adminTyping === true
        ){

          typing.classList.add(
            "active"
          );

        }

        else{

          typing.classList.remove(
            "active"
          );

        }


        /* UNREAD */

        const unread =
          Number(
            data.unreadForCustomer || 0
          );


        notificationCount =
          unread;


        updateNotificationBadge(
          unread
        );

      },

      error => {

        console.error(
          "Chat listener error:",
          error
        );

      }

    );

}


/* =====================================================
   MESSAGE LISTENER
===================================================== */

function listenToMessages(){

  if(stopMessages)
    stopMessages();


  const query =
    db.collection("messages")
      .where(
        "chatId",
        "==",
        chatId
      );


  stopMessages =
    query.onSnapshot(

      snapshot => {

        const messages = [];


        snapshot.forEach(
          doc => {

            messages.push({

              id:
                doc.id,

              ...doc.data()

            });

          }
        );


        messages.sort(
          (a,b) => {

            return (
              getTimestampValue(
                a.createdAt
              ) -
              getTimestampValue(
                b.createdAt
              )
            );

          }
        );


        renderMessages(
          messages
        );


        markAdminMessagesRead(
          messages
        );

      },

      error => {

        console.error(
          "Message listener error:",
          error
        );


        showError(
          "Unable to load messages.",
          error.message
        );

      }

    );

}

/* =====================================================
   MARK ADMIN MESSAGES READ
===================================================== */

async function markAdminMessagesRead(
  messages
){

  const unread =
    messages.filter(
      message =>

        message.senderRole ===
          "admin" &&

        message.read !== true
    );


  if(unread.length === 0)
    return;


  try{

    const batch =
      db.batch();


    unread.forEach(
      message => {

        const ref =
          db.collection("messages")
            .doc(message.id);


        batch.update(
          ref,
          {
            read:true
          }
        );

      }
    );


    await batch.commit();


    await db.collection("chats")
      .doc(chatId)
      .set({

        unreadForCustomer:
          0

      },{
        merge:true
      });


  }

  catch(error){

    console.error(
      "Read update error:",
      error
    );

  }

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  if(!user ||
     sending)
    return;


  const text =
    input.value.trim();


  if(
    !text &&
    !selectedFile
  )
    return;


  sending =
    true;


  sendButton.disabled =
    true;


  try{

    let imageUrl =
      "";


    /* IMAGE UPLOAD */

    if(selectedFile){

      uploadProgress.classList.add(
        "active"
      );


      progressBar.style.width =
        "0%";


      progressText.textContent =
        "0%";


      const safeName =
        selectedFile.name
          .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


      const path =
        "chat-images/" +
        user.uid +
        "/" +
        Date.now() +
        "_" +
        safeName;


      const uploadTask =
        storage
          .ref(path)
          .put(selectedFile);


      imageUrl =
        await new Promise(
          (resolve,reject) => {

            uploadTask.on(

              "state_changed",

              snapshot => {

                const percent =
                  Math.round(
                    (
                      snapshot.bytesTransferred /
                      snapshot.totalBytes
                    ) * 100
                  );


                progressBar.style.width =
                  percent + "%";


                progressText.textContent =
                  percent + "%";

              },

              error => {

                reject(error);

              },

              async () => {

                try{

                  const url =
                    await uploadTask
                      .snapshot.ref
                      .getDownloadURL();


                  resolve(url);

                }

                catch(error){

                  reject(error);

                }

              }

            );

          }
        );

    }


    /* MESSAGE */

    await db.collection("messages")
      .add({

        chatId:
          chatId,

        createdAt:
          firebase.firestore.FieldValue
            .serverTimestamp(),

        imageUrl:
          imageUrl,

        read:
          false,

        senderId:
          user.uid,

        senderName:
          user.displayName ||
          (
            user.email
              ? user.email.split("@")[0]
              : "Customer"
          ),

        senderRole:
          "customer",

        text:
          text

      });


    /* UPDATE CHAT */

    await db.collection("chats")
      .doc(chatId)
      .set({

        lastMessage:
          text ||
          "📷 Image",

        lastMessageAt:
          firebase.firestore.FieldValue
            .serverTimestamp(),

        updatedAt:
          firebase.firestore.FieldValue
            .serverTimestamp(),

        unreadForAdmin:
          firebase.firestore.FieldValue
            .increment(1),

        unreadForCustomer:
          0,

        customerTyping:
          false,

        status:
          "open"

      },{
        merge:true
      });


    /* RESET */

    input.value =
      "";

    input.style.height =
      "45px";


    selectedFile =
      null;


    fileInput.value =
      "";


    preview.classList.remove(
      "active"
    );


    previewImage.src =
      "";


    uploadProgress.classList.remove(
      "active"
    );


    progressBar.style.width =
      "0%";


    progressText.textContent =
      "0%";


    stopTyping();


  }

  catch(error){

    console.error(
      "SEND MESSAGE ERROR:",
      error
    );


    uploadProgress.classList.remove(
      "active"
    );


    alert(
      "Message could not be sent.\n\n" +
      error.message
    );

  }


  sending =
    false;


  updateSendButton();

}

/* =====================================================
   TIMESTAMP
===================================================== */

function getTimestampValue(
  timestamp
){

  if(!timestamp)
    return 0;


  if(
    typeof timestamp.toMillis ===
    "function"
  ){

    return timestamp.toMillis();

  }


  if(
    timestamp.seconds !== undefined
  ){

    return timestamp.seconds * 1000;

  }


  if(
    timestamp instanceof Date
  ){

    return timestamp.getTime();

  }


  return 0;

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(
  timestamp

/* =====================================================
   DATE LABEL
===================================================== */

function formatDateLabel(
  timestamp
){

  if(!timestamp)
    return "";


  let date;


  if(
    typeof timestamp.toDate ===
    "function"
  ){

    date =
      timestamp.toDate();

  }

  else if(
    timestamp.seconds !== undefined
  ){

    date =
      new Date(
        timestamp.seconds * 1000
      );

  }

  else{

    date =
      new Date(timestamp);

  }


  if(
    isNaN(date.getTime())
  ){

    return "";

  }


  const now =
    new Date();


  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  const messageDay =
    new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    );


  const difference =
    Math.round(
      (
        today -
        messageDay
      ) /
      86400000
    );


  if(difference === 0)
    return "Today";


  if(difference === 1)
    return "Yesterday";


  return date.toLocaleDateString(
    [],
    {
      day:"numeric",
      month:"short",
      year:
        date.getFullYear() !==
        now.getFullYear()
          ? "numeric"
          : undefined
    }
  );

}


/* =====================================================
   ERROR
===================================================== */

function showError(
  title,
  details
){

  messagesEl.innerHTML = `

    <div class="center-message">

      <div class="icon">
        ⚠️
      </div>

      <h3>
        ${escapeHtml(title)}
      </h3>

      <p>
        ${escapeHtml(details || "")}
      </p>

    </div>

  `;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  text
){

  return String(text || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

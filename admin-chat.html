<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Admin Chat | Danny Smart Power</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Poppins,sans-serif;
  background:#0f172a;
  color:#f8fafc;
  height:100vh;
  overflow:hidden;
}

.app{
  height:100vh;
  display:flex;
}


/* =========================
   CHAT LIST
========================= */

.chat-list{
  width:330px;
  flex-shrink:0;
  background:#020617;
  border-right:1px solid #1e293b;
  display:flex;
  flex-direction:column;
}

.list-header{
  padding:20px;
  border-bottom:1px solid #1e293b;
}

.list-header h2{
  font-size:20px;
}

.list-header p{
  color:#94a3b8;
  font-size:12px;
  margin-top:4px;
}

.conversations{
  flex:1;
  overflow-y:auto;
}

.conversation{
  padding:15px;
  border-bottom:1px solid #172033;
  cursor:pointer;
  display:flex;
  gap:12px;
}

.conversation:hover,
.conversation.active{
  background:#17253a;
}

.user-avatar{
  width:45px;
  height:45px;
  flex-shrink:0;
  border-radius:50%;
  background:#0284c7;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.user-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.conversation-info{
  min-width:0;
  flex:1;
}

.conversation-top{
  display:flex;
  justify-content:space-between;
  gap:5px;
}

.conversation-name{
  font-size:14px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.conversation-time{
  color:#64748b;
  font-size:9px;
}

.last-message{
  color:#94a3b8;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:4px;
}

.unread{
  display:inline-flex;
  min-width:19px;
  height:19px;
  padding:0 5px;
  border-radius:20px;
  align-items:center;
  justify-content:center;
  background:#38bdf8;
  color:#00111c;
  font-size:10px;
  font-weight:bold;
}


/* =========================
   CHAT
========================= */

.chat{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.chat-header{
  height:75px;
  flex-shrink:0;
  background:#020617;
  border-bottom:1px solid #1e293b;
  display:flex;
  align-items:center;
  padding:0 18px;
  gap:12px;
}

.selected-avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#0284c7;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.selected-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.selected-name{
  font-size:16px;
}

.selected-email{
  color:#94a3b8;
  font-size:10px;
}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:20px;
}

.empty{
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#64748b;
  text-align:center;
}

.message-row{
  display:flex;
  margin:7px 0;
}

.message-row.admin{
  justify-content:flex-end;
}

.message-row.customer{
  justify-content:flex-start;
}

.bubble{
  max-width:min(70%,550px);
  padding:10px 13px 7px;
  border-radius:16px;
  font-size:14px;
  overflow-wrap:anywhere;
}

.admin .bubble{
  background:#0284c7;
  border-bottom-right-radius:5px;
}

.customer .bubble{
  background:#1b293d;
  border-bottom-left-radius:5px;
}

.message-image{
  display:block;
  width:min(280px,100%);
  max-height:350px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
}

.meta{
  display:flex;
  justify-content:flex-end;
  gap:5px;
  font-size:9px;
  opacity:.7;
  margin-top:4px;
}

.typing{
  display:none;
  padding:5px 20px;
  color:#94a3b8;
  font-size:11px;
}

.typing.active{
  display:block;
}


/* =========================
   INPUT
========================= */

.input{
  padding:10px;
  background:#020617;
  border-top:1px solid #1e293b;
  display:flex;
  gap:8px;
}

textarea{
  flex:1;
  min-height:46px;
  max-height:120px;
  resize:none;
  border:0;
  outline:0;
  border-radius:23px;
  background:#182337;
  color:white;
  padding:13px 16px;
  font-family:inherit;
}

.send{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:#38bdf8;
  cursor:pointer;
  font-size:20px;
}

.send:disabled{
  opacity:.4;
}

.hidden{
  display:none;
}


/* MOBILE */

@media(max-width:700px){

  .chat-list{
    width:100%;
  }

  .chat{
    display:none;
  }

  .chat-list.mobile-hidden{
    display:none;
  }

  .chat.mobile-active{
    display:flex;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- =========================
     CUSTOMER LIST
========================= -->

<aside class="chat-list" id="chatList">

  <div class="list-header">

    <h2>💬 Customer Chats</h2>

    <p>
      Danny Smart Power
    </p>

  </div>

  <div
    class="conversations"
    id="conversations"
  >

    <div class="empty">
      Loading conversations...
    </div>

  </div>

</aside>


<!-- =========================
     CHAT
========================= -->

<section class="chat" id="chatPanel">

  <header class="chat-header">

    <div
      class="selected-avatar"
      id="selectedAvatar"
    >
      👤
    </div>

    <div>

      <div
        class="selected-name"
        id="selectedName"
      >
        Select a customer
      </div>

      <div
        class="selected-email"
        id="selectedEmail"
      >
      </div>

    </div>

  </header>


  <main
    class="messages"
    id="messages"
  >

    <div class="empty">

      Select a customer
      to start chatting.

    </div>

  </main>


  <div
    class="typing"
    id="typing"
  >
    Customer is typing...
  </div>


  <div class="input">

    <textarea
      id="messageInput"
      placeholder="Reply to customer..."
      disabled
    ></textarea>

    <button
      class="send"
      id="sendButton"
      disabled
    >
      ➤
    </button>

  </div>

</section>

</div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>


<script>

const firebaseConfig = {
  apiKey: "AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGb44",
  authDomain: "danny-smart-power.firebaseapp.com",
  databaseURL: "https://danny-smart-power-default-rtdb.firebaseio.com",
  projectId: "danny-smart-power",
  storageBucket: "danny-smart-power.firebasestorage.app",
  messagingSenderId: "649735645158",
  appId: "1:649735645158:web:cff518b89721a163679827",
  measurementId: "G-258YKLP5ZS"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();


const conversations =
  document.getElementById("conversations");

const messages =
  document.getElementById("messages");

const input =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const selectedName =
  document.getElementById("selectedName");

const selectedEmail =
  document.getElementById("selectedEmail");

const selectedAvatar =
  document.getElementById("selectedAvatar");

const typing =
  document.getElementById("typing");


let admin = null;

let selectedChat = null;

let messagesRef = null;

let stopMessages = null;

let stopSelectedChat = null;

let stopChats = null;

let typingTimer = null;

let sending = false;


/* ================================
   ADMIN AUTH
================================ */

auth.onAuthStateChanged(async user => {

  if(!user){

    location.href =
      "login.html";

    return;

  }


  /*
    SECURITY NOTE:

    Firestore rules will verify
    that this user exists inside
    admins/{uid}.
  */

  admin = user;

  loadConversations();

});


/* ================================
   LOAD CUSTOMER CONVERSATIONS
================================ */

function loadConversations(){

  if(stopChats)
    stopChats();


  stopChats =
    db.collection("chats")
      .orderBy(
        "lastMessageAt",
        "desc"
      )
      .onSnapshot(snapshot => {

        conversations.innerHTML = "";


        if(snapshot.empty){

          conversations.innerHTML = `
            <div class="empty">
              No customer chats yet.
            </div>
          `;

          return;

        }


        snapshot.forEach(doc => {

          renderConversation(
            doc.id,
            doc.data()
          );

        });

      },error => {

        console.error(error);

        conversations.innerHTML = `
          <div class="empty">
            Unable to load chats.
          </div>
        `;

      });

}


/* ================================
   CONVERSATION ITEM
================================ */

function renderConversation(id,data){

  const div =
    document.createElement("div");

  div.className =
    "conversation";


  if(
    selectedChat &&
    selectedChat.id === id
  ){

    div.classList.add("active");

  }


  const avatar =
    document.createElement("div");

  avatar.className =
    "user-avatar";


  if(data.customerPhoto){

    const img =
      document.createElement("img");

    img.src =
      data.customerPhoto;

    avatar.appendChild(img);

  }else{

    avatar.textContent = "👤";

  }


  const info =
    document.createElement("div");

  info.className =
    "conversation-info";


  const top =
    document.createElement("div");

  top.className =
    "conversation-top";


  const name =
    document.createElement("div");

  name.className =
    "conversation-name";

  name.textContent =
    data.customerName ||
    "Customer";


  const time =
    document.createElement("div");

  time.className =
    "conversation-time";

  time.textContent =
    formatTime(data.lastMessageAt);


  top.appendChild(name);

  top.appendChild(time);


  const last =
    document.createElement("div");

  last.className =
    "last-message";

  last.textContent =
    data.lastMessage ||
    "No messages yet";


  info.appendChild(top);

  info.appendChild(last);


  if(data.unreadForAdmin > 0){

    const badge =
      document.createElement("span");

    badge.className =
      "unread";

    badge.textContent =
      data.unreadForAdmin > 99
      ? "99+"
      : data.unreadForAdmin;

    info.appendChild(badge);

  }


  div.appendChild(avatar);

  div.appendChild(info);


  div.onclick = () => {

    openChat(id,data);

  };


  conversations.appendChild(div);

}


/* ================================
   OPEN CHAT
================================ */

function openChat(id,data){

  selectedChat = {
    id:id,
    data:data
  };


  selectedName.textContent =
    data.customerName ||
    "Customer";


  selectedEmail.textContent =
    data.customerEmail ||
    "";


  selectedAvatar.innerHTML =
    data.customerPhoto
    ? `<img src="${escapeAttribute(data.customerPhoto)}">`
    : "👤";


  input.disabled = false;

  sendButton.disabled = false;


  messagesRef =
    db.collection("chats")
      .doc(id)
      .collection("messages");


  if(stopMessages)
    stopMessages();


  if(stopSelectedChat)
    stopSelectedChat();


  /*
    Real-time messages
  */

  stopMessages =
    messagesRef
      .orderBy("createdAt","asc")
      .onSnapshot(snapshot => {

        messages.innerHTML = "";


        snapshot.forEach(doc => {

          renderMessage(
            doc.id,
            doc.data()
          );

        });


        markCustomerMessagesSeen(snapshot);

        scrollBottom();

      });


  /*
    Real-time typing
  */

  stopSelectedChat =
    db.collection("chats")
      .doc(id)
      .onSnapshot(snapshot => {

        const data =
          snapshot.data();


        if(
          data &&
          data.customerTyping === true
        ){

          typing.classList.add("active");

        }else{

          typing.classList.remove("active");

        }

      });


  /*
    Reset admin unread count
  */

  db.collection("chats")
    .doc(id)
    .update({

      unreadForAdmin:0

    });

}


/* ================================
   RENDER MESSAGE
================================ */

function renderMessage(id,data){

  const row =
    document.createElement("div");


  const mine =
    data.senderRole === "admin";


  row.className =
    "message-row " +
    (mine ? "admin" : "customer");


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  if(data.image){

    const image =
      document.createElement("img");

    image.src =
      data.image;

    image.className =
      "message-image";

    image.onclick =
      () => window.open(
        data.image,
        "_blank"
      );

    bubble.appendChild(image);

  }


  if(data.text){

    const text =
      document.createElement("div");

    text.textContent =
      data.text;

    bubble.appendChild(text);

  }


  const meta =
    document.createElement("div");

  meta.className =
    "meta";

  meta.textContent =
    formatTime(data.createdAt);


  if(mine){

    meta.innerHTML +=
      data.seen
      ? " ✓✓"
      : " ✓";

  }


  bubble.appendChild(meta);

  row.appendChild(bubble);

  messages.appendChild(row);

}


/* ================================
   ADMIN SEND
================================ */

async function sendMessage(){

  if(
    !admin ||
    !selectedChat ||
    sending
  )
    return;


  const text =
    input.value.trim();


  if(!text)
    return;


  sending = true;

  sendButton.disabled = true;


  try{

    const chatRef =
      db.collection("chats")
        .doc(selectedChat.id);


    const messageRef =
      chatRef
        .collection("messages")
        .doc();


    const batch =
      db.batch();


    batch.set(messageRef,{

      text:text,

      image:"",

      senderId:
        admin.uid,

      senderRole:"admin",

      senderName:
        admin.displayName ||
        "Danny",

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp(),

      seen:false,

      seenAt:null

    });


    batch.set(chatRef,{

      lastMessage:text,

      lastMessageAt:
        firebase.firestore.FieldValue.serverTimestamp(),

      updatedAt:
        firebase.firestore.FieldValue.serverTimestamp(),

      unreadForCustomer:
        firebase.firestore.FieldValue.increment(1),

      unreadForAdmin:0,

      adminTyping:false,

      status:"open"

    },{merge:true});


    await batch.commit();


    input.value = "";

    stopTyping();

    scrollBottom();

  }

  catch(error){

    console.error(error);

    alert(
      "Reply could not be sent."
    );

  }


  sending = false;

  sendButton.disabled = false;

}


/* ================================
   SEEN
================================ */

async function markCustomerMessagesSeen(snapshot){

  if(!selectedChat)
    return;


  const batch =
    db.batch();

  let count = 0;


  snapshot.forEach(doc => {

    const data =
      doc.data();


    if(
      data.senderRole === "customer" &&
      data.seen === false
    ){

      batch.update(doc.ref,{

        seen:true,

        seenAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });

      count++;

    }

  });


  if(count > 0){

    await batch.commit();

  }

}


/* ================================
   ADMIN TYPING
================================ */

input.addEventListener(
  "input",
  () => {

    if(!selectedChat)
      return;


    db.collection("chats")
      .doc(selectedChat.id)
      .set({

        adminTyping:true

      },{merge:true});


    clearTimeout(typingTimer);


    typingTimer =
      setTimeout(
        stopTyping,
        1200
      );

  }
);


function stopTyping(){

  clearTimeout(typingTimer);


  if(selectedChat){

    db.collection("chats")
      .doc(selectedChat.id)
      .set({

        adminTyping:false

      },{merge:true});

  }

}


/* ================================
   ENTER
================================ */

sendButton.onclick =
  sendMessage;


input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* ================================
   HELPERS
================================ */

function scrollBottom(){

  setTimeout(()=>{

    messages.scrollTop =
      messages.scrollHeight;

  },80);

}


function formatTime(timestamp){

  if(
    !timestamp ||
    !timestamp.toDate
  )
    return "";


  return timestamp
    .toDate()
    .toLocaleTimeString([],{

      hour:"2-digit",
      minute:"2-digit"

    });

}


function escapeAttribute(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wishlist | Danny Smart Power</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
rel="stylesheet"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{

  --bg:#0f172a;
  --header:#020617;

  --card:#111e30;
  --card2:#17253a;

  --border:rgba(148,163,184,.15);

  --blue:#38bdf8;

  --green:#22c55e;

  --red:#ef4444;

  --text:#f8fafc;

  --muted:#94a3b8;

}


html{
  scroll-behavior:smooth;
}


body{

  min-height:100vh;

  background:

    radial-gradient(
      circle at top left,
      rgba(56,189,248,.08),
      transparent 35%
    ),

    var(--bg);

  color:var(--text);

  font-family:'Poppins',sans-serif;

}


/* =====================================================
   HEADER
===================================================== */

header{

  height:76px;

  background:rgba(2,6,23,.97);

  backdrop-filter:blur(14px);

  border-bottom:1px solid var(--border);

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 7%;

  position:sticky;

  top:0;

  z-index:50;

}


.back-button{

  color:white;

  text-decoration:none;

  font-size:15px;

  display:flex;

  align-items:center;

  gap:7px;

}


.back-button:hover{

  color:var(--blue);

}


.logo{

  font-size:24px;

  font-weight:700;

  letter-spacing:1px;

  color:var(--blue);

}


.logo span{

  color:white;

}


.header-right{

  display:flex;

  align-items:center;

  gap:18px;

}


.shop-link{

  color:white;

  text-decoration:none;

  font-size:14px;

}


.shop-link:hover{

  color:var(--blue);

}


.cart-button{

  position:relative;

  color:white;

  text-decoration:none;

  font-size:22px;

}


.cart-count{

  position:absolute;

  top:-10px;

  right:-12px;

  min-width:20px;

  height:20px;

  padding:0 5px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:var(--blue);

  color:#00111c;

  border-radius:20px;

  font-size:11px;

  font-weight:700;

}


/* =====================================================
   PAGE
===================================================== */

.page{

  max-width:1200px;

  margin:auto;

  padding:35px 7% 80px;

}


/* =====================================================
   PAGE TOP
===================================================== */

.page-top{

  display:flex;

  align-items:flex-end;

  justify-content:space-between;

  gap:20px;

  margin-bottom:30px;

}


.page-title{

  font-size:32px;

  line-height:1.2;

  margin-bottom:7px;

}


.page-subtitle{

  color:var(--muted);

  font-size:13px;

}


.wishlist-count{

  color:var(--blue);

  font-size:13px;

  font-weight:600;

}


/* =====================================================
   WISHLIST GRID
===================================================== */

.wishlist-grid{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:18px;

}


/* =====================================================
   WISHLIST CARD
===================================================== */

.wishlist-card{

  background:var(--card);

  border:1px solid var(--border);

  border-radius:18px;

  overflow:hidden;

  position:relative;

  transition:.25s;

}


.wishlist-card:hover{

  transform:translateY(-4px);

  border-color:
    rgba(56,189,248,.35);

  box-shadow:
    0 15px 35px
    rgba(0,0,0,.18);

}


/* =====================================================
   IMAGE
===================================================== */

.product-image-box{

  width:100%;

  height:210px;

  background:#0b1220;

  position:relative;

  overflow:hidden;

}


.product-image{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

  transition:.3s;

}


.wishlist-card:hover
.product-image{

  transform:scale(1.04);

}


/* =====================================================
   REMOVE BUTTON
===================================================== */

.remove-button{

  position:absolute;

  top:12px;

  right:12px;

  width:38px;

  height:38px;

  border-radius:50%;

  border:1px solid
    rgba(255,255,255,.14);

  background:
    rgba(2,6,23,.78);

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:18px;

  cursor:pointer;

  backdrop-filter:blur(8px);

  z-index:5;

  transition:.2s;

}


.remove-button:hover{

  background:rgba(2,6,23,.95);

  transform:scale(1.05);

}


/* =====================================================
   AVAILABILITY
===================================================== */

.availability-badge{

  position:absolute;

  left:12px;

  top:12px;

  padding:6px 10px;

  border-radius:9px;

  background:
    rgba(2,6,23,.82);

  color:#86efac;

  font-size:10px;

  font-weight:600;

  border:1px solid
    rgba(34,197,94,.18);

}


.availability-badge.unavailable{

  color:#fca5a5;

  border-color:
    rgba(239,68,68,.18);

}


/* =====================================================
   CARD CONTENT
===================================================== */

.card-content{

  padding:16px;

}


.product-category{

  color:var(--blue);

  font-size:10px;

  font-weight:600;

  text-transform:uppercase;

  margin-bottom:6px;

}


.product-name{

  font-size:16px;

  font-weight:600;

  line-height:1.35;

  margin-bottom:8px;

  display:-webkit-box;

  -webkit-line-clamp:2;

  -webkit-box-orient:vertical;

  overflow:hidden;

}


.product-description{

  color:var(--muted);

  font-size:11px;

  line-height:1.6;

  min-height:35px;

  margin-bottom:12px;

  display:-webkit-box;

  -webkit-line-clamp:2;

  -webkit-box-orient:vertical;

  overflow:hidden;

}


.product-price{

  color:var(--blue);

  font-size:19px;

  font-weight:700;

  margin-bottom:13px;

}


/* =====================================================
   CARD ACTIONS
===================================================== */

.card-actions{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

}


.view-button,
.cart-button-small{

  min-height:42px;

  border-radius:10px;

  font-family:inherit;

  font-size:11px;

  font-weight:600;

  cursor:pointer;

  transition:.2s;

}


.view-button{

  background:#1e293b;

  border:1px solid var(--border);

  color:white;

}


.view-button:hover{

  background:var(--card2);

  border-color:
    rgba(56,189,248,.3);

}


.cart-button-small{

  border:none;

  background:var(--blue);

  color:#00111c;

}


.cart-button-small:hover{

  transform:translateY(-1px);

  box-shadow:
    0 7px 20px
    rgba(56,189,248,.14);

}


.cart-button-small:disabled{

  background:#334155;

  color:#94a3b8;

  cursor:not-allowed;

  transform:none;

}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty-state{

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:100px 20px;

  border:1px solid var(--border);

  border-radius:22px;

  background:
    rgba(17,30,48,.55);

}


.empty-icon{

  width:75px;

  height:75px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#17253a;

  border:1px solid
    rgba(56,189,248,.16);

  font-size:32px;

  margin-bottom:18px;

}


.empty-state h2{

  font-size:22px;

  margin-bottom:8px;

}


.empty-state p{

  max-width:430px;

  color:var(--muted);

  font-size:13px;

  line-height:1.7;

}


.shop-now{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  margin-top:22px;

  min-height:46px;

  padding:0 22px;

  background:var(--blue);

  color:#00111c;

  border-radius:11px;

  text-decoration:none;

  font-size:12px;

  font-weight:700;

}


/* =====================================================
   LOGIN STATE
===================================================== */

.login-state{

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:100px 20px;

  border:1px solid var(--border);

  border-radius:22px;

  background:
    rgba(17,30,48,.55);

}


.login-icon{

  font-size:40px;

  margin-bottom:15px;

}


.login-state h2{

  margin-bottom:8px;

}


.login-state p{

  color:var(--muted);

  font-size:13px;

}


.login-button{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  margin-top:22px;

  min-height:46px;

  padding:0 22px;

  background:var(--blue);

  color:#00111c;

  border-radius:11px;

  text-decoration:none;

  font-size:12px;

  font-weight:700;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

  min-height:400px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  color:var(--muted);

  font-size:13px;

}


.spinner{

  width:38px;

  height:38px;

  margin-bottom:15px;

  border:3px solid #1e293b;

  border-top-color:var(--blue);

  border-radius:50%;

  animation:spin 1s linear infinite;

}


@keyframes spin{

  to{

    transform:rotate(360deg);

  }

}


/* =====================================================
   TOAST
===================================================== */

.toast{

  position:fixed;

  left:50%;

  bottom:25px;

  transform:
    translate(-50%,120px);

  background:#020617;

  border:1px solid
    rgba(56,189,248,.35);

  color:white;

  padding:13px 18px;

  border-radius:12px;

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.4);

  font-size:12px;

  z-index:100;

  opacity:0;

  transition:.3s;

  max-width:90%;

  text-align:center;

}


.toast.show{

  opacity:1;

  transform:
    translate(-50%,0);

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1000px){

  .wishlist-grid{

    grid-template-columns:
      repeat(3,1fr);

  }

}


@media(max-width:700px){

  header{

    padding:0 15px;

  }


  .page{

    padding-left:14px;

    padding-right:14px;

  }


  .shop-link{

    display:none;

  }


  .page-title{

    font-size:27px;

  }


  .wishlist-grid{

    grid-template-columns:
      repeat(2,1fr);

    gap:12px;

  }


  .product-image-box{

    height:170px;

  }


  .card-content{

    padding:12px;

  }


  .product-name{

    font-size:14px;

  }


  .product-price{

    font-size:16px;

  }


  .card-actions{

    grid-template-columns:1fr;

  }


  .view-button,
  .cart-button-small{

    min-height:39px;

  }

}


@media(max-width:400px){

  .wishlist-grid{

    grid-template-columns:1fr;

  }


  .product-image-box{

    height:230px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <a
    href="shop.html"

  </a>

  </div>

    <a
      href="shop.html"
      class="shop-link"
    >

    </a>


    <a
      href="cart.html"

      <span

        0

<!-- =====================================================
     MAIN
===================================================== -->

<main class="page">


  <div
    class="page-top"
    id="pageTop"
  >

    <div>

      <h1 class="page-title">
        My Wishlist
      </h1>

      <p class="page-subtitle">
        Products you saved for later.
      </p>

    </div>


    <div
      class="wishlist-count"
      id="wishlistCount"
    >
      0 items
    </div>

  </div>



  <section
    id="wishlistArea"
  >

    <div class="loading">

      <div class="spinner"></div>

      Loading your wishlist...

    </div>

  </section>


</main>



<!-- =====================================================
     TOAST
===================================================== -->

<div
  class="toast"
  id="toast"
></div>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>



<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGb44",

  authDomain:
    "danny-smart-power.firebaseapp.com",

  databaseURL:
    "https://danny-smart-power-default-rtdb.firebaseio.com",

  projectId:
    "danny-smart-power",

  storageBucket:
    "danny-smart-power.firebasestorage.app",

  messagingSenderId:
    "649735645158",

  appId:
    "1:649735645158:web:cff518b89721a163679827",

  measurementId:
    "G-258YKLP5ZS"

};


firebase.initializeApp(
  firebaseConfig
);


const auth =
  firebase.auth();


const db =
  firebase.firestore();



/* =====================================================
   ELEMENTS
===================================================== */

const wishlistArea =
  document.getElementById(
    "wishlistArea"
  );


const wishlistCount =
  document.getElementById(
    "wishlistCount"
  );


const cartCount =
  document.getElementById(
    "cartCount"
  );


const toast =
  document.getElementById(
    "toast"
  );


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let wishlistItems = [];

let productMap = {};

let cartItems = [];

let wishlistUnsubscribe = null;

let cartUnsubscribe = null;


/* =====================================================
   AUTH
===================================================== */

auth.onAuthStateChanged(

  async (user) => {

    currentUser = user;


    if(!user){

      showLoginState();

      return;

    }


    /*
      User is signed in.
    */

    listenToWishlist(
      user.uid
    );


    listenToCart(
      user.uid
    );

  }

);


/* =====================================================
   LOGIN STATE
===================================================== */

function showLoginState(){

  wishlistCount.textContent =
    "0 items";


  wishlistArea.innerHTML = `

    <div class="login-state">

      <div class="login-icon">
        🔐
      </div>

      <h2>
        Sign in to view your wishlist
      </h2>

      <p>
        Your saved products will appear here
        after you sign in.
      </p>

      <a
        href="login.html"
        class="login-button"
      >
        Sign In
      </a>

    </div>

  `;

}


/* =====================================================
   LISTEN TO WISHLIST
===================================================== */

function listenToWishlist(
  uid
){

  if(wishlistUnsubscribe){

    wishlistUnsubscribe();

  }


  /*
    IMPORTANT:

    This uses your exact collection:

    wishlists
  */

  wishlistUnsubscribe =

    db
    .collection("wishlists")
    .where(
      "customerId",
      "==",
      uid
    )
    .onSnapshot(

      async (snapshot) => {

        wishlistItems = [];


        snapshot.forEach(

          (doc) => {

            const data =
              doc.data();


            wishlistItems.push({

              id:
                doc.id,

              customerId:
                data.customerId || "",

              productId:
                data.productId || "",

              name:
                data.name || "",

              addedAt:
                data.addedAt || null,

              createdAt:
                data.createdAt || null,

              updatedAt:
                data.updatedAt || null

            });

          }

        );


        /*
          Newest wishlist items first.
        */

        wishlistItems.sort(

          (a,b) => {

            const aTime =
              getTimestampMillis(
                a.addedAt ||
                a.createdAt
              );


            const bTime =
              getTimestampMillis(
                b.addedAt ||
                b.createdAt
              );


            return bTime - aTime;

          }

        );


        wishlistCount.textContent =

          `${wishlistItems.length} ${
            wishlistItems.length === 1
              ? "item"
              : "items"
          }`;


        if(!wishlistItems.length){

          showEmptyWishlist();

          return;

        }


        await loadWishlistProducts();

      },

      (error) => {

        console.error(
          "WISHLIST LISTENER ERROR:",
          error
        );


        wishlistArea.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              ⚠️
            </div>

            <h2>
              Could not load wishlist
            </h2>

            <p>
              ${escapeHtml(
                error.message ||
                "Please try again."
              )}
            </p>

          </div>

        `;

      }

    );

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadWishlistProducts(){

  try{

    /*
      Read products once.

      This lets us find each
      wishlist product using
      productId.
    */

    const snapshot =
      await db
      .collection("products")
      .get();


    productMap = {};


    snapshot.forEach(

      (doc) => {

        const data =
          doc.data();


        productMap[doc.id] = {

          id:
            doc.id,

          name:
            data.name || "",

          description:
            data.description || "",

          price:
            Number(data.price) || 0,

          category:
            data.category || "",

          image:
            data.image || "",

          stock:
            Number(data.stock) || 0,

          available:
            data.available === true,

          featured:
            data.featured === true

        };

      }

    );


    renderWishlist();

  }

  catch(error){

    console.error(
      "PRODUCT LOAD ERROR:",
      error
    );


    wishlistArea.innerHTML = `

      <div class="empty-state">

        <div class="empty-icon">
          ⚠️
        </div>

        <h2>
          Products could not load
        </h2>

        <p>
          ${escapeHtml(
            error.message ||
            "Please try again later."
          )}
        </p>

      </div>

    `;

  }

}


/* =====================================================
   RENDER WISHLIST
===================================================== */

function renderWishlist(){

  if(!wishlistItems.length){

    showEmptyWishlist();

    return;

  }


  const grid =
    document.createElement(
      "div"
    );


  grid.className =
    "wishlist-grid";


  wishlistItems.forEach(

    (wishlistItem) => {

      const product =
        productMap[
          wishlistItem.productId
        ];


      createWishlistCard(
        wishlistItem,
        product,
        grid
      );

    }

  );


  wishlistArea.innerHTML = "";

  wishlistArea.appendChild(
    grid
  );

}


/* =====================================================
   CREATE WISHLIST CARD
===================================================== */

function createWishlistCard(
  wishlistItem,
  product,
  container
){

  const card =
    document.createElement(
      "article"
    );


  card.className =
    "wishlist-card";


  /*
    If the product was deleted
    from Firestore, we still show
    the wishlist record instead
    of breaking the whole page.
  */

  if(!product){

    card.innerHTML = `

      <div
        class="product-image-box"
      >

        <div
          style="
            width:100%;
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:38px;
            color:#64748b;
          "
        >
          ⚡
        </div>

        <span
          class="availability-badge unavailable"
        >
          Product removed
        </span>

        <button
          class="remove-button"
          title="Remove from wishlist"
          aria-label="Remove from wishlist"
        >
          ×
        </button>

      </div>


      <div class="card-content">

        <div class="product-category">
          Electrical
        </div>

        <h3 class="product-name">
          ${escapeHtml(
            wishlistItem.name ||
            "Removed Product"
          )}
        </h3>

        <p class="product-description">
          This product is no longer
          available in the shop.
        </p>

        <div class="card-actions">

          <button
            class="view-button"
            disabled
          >
            No longer available
          </button>

        </div>

      </div>

    `;


    const removeButton =
      card.querySelector(
        ".remove-button"
      );


    removeButton.addEventListener(
      "click",
      () => {

        removeFromWishlist(
          wishlistItem.id
        );

      }
    );


    container.appendChild(
      card
    );


    return;

  }


  const image =
    product.image ||
    "https://via.placeholder.com/700x700?text=DSP";


  const isAvailable =
    product.available === true &&
    product.stock > 0;


  card.innerHTML = `

    <div
      class="product-image-box"
    >

      <img
        class="product-image"
        src="${escapeAttribute(
          image
        )}"
        alt="${escapeAttribute(
          product.name
        )}"
        loading="lazy"
      >


      <span
        class="
          availability-badge
          ${isAvailable
            ? ""
            : "unavailable"}
        "
      >

        ${isAvailable
          ? "✓ Available"
          : "✕ Unavailable"}

      </span>


      <button
        class="remove-button"
        title="Remove from wishlist"
        aria-label="Remove from wishlist"
      >
        ×
      </button>

    </div>


    <div class="card-content">


      <div class="product-category">

        ${escapeHtml(
          product.category ||
          "Electrical"
        )}

      </div>


      <h3 class="product-name">

        ${escapeHtml(
          product.name ||
          "Unnamed Product"
        )}

      </h3>


      <p class="product-description">

        ${escapeHtml(
          product.description ||
          "Quality product from Danny Smart Power."
        )}

      </p>


      <div class="product-price">

        ₦${formatPrice(
          product.price
        )}

      </div>


      <div class="card-actions">


        <button
          class="view-button"
          type="button"
        >
          View Product
        </button>


        <button
          class="cart-button-small"
          type="button"
          ${isAvailable
            ? ""
            : "disabled"}
        >

          ${isAvailable
            ? "🛒 Add to Cart"
            : "Unavailable"}

        </button>


      </div>


    </div>

  `;


  /*
    Clicking image/card opens
    product.html.
  */

  const imageBox =
    card.querySelector(
      ".product-image-box"
    );


  imageBox.addEventListener(
    "click",
    (event) => {

      /*
        Don't open product page
        when remove button was clicked.
      */

      if(
        event.target.closest(
          ".remove-button"
        )
      ){

        return;

      }


      openProduct(
        product.id
      );

    }
  );


  const productName =
    card.querySelector(
      ".product-name"
    );


  productName.addEventListener(
    "click",
    () => {

      openProduct(
        product.id
      );

    }
  );


  const viewButton =
    card.querySelector(
      ".view-button"
    );


  viewButton.addEventListener(
    "click",
    () => {

      openProduct(
        product.id
      );

    }
  );


  const removeButton =
    card.querySelector(
      ".remove-button"
    );


  removeButton.addEventListener(
    "click",
    () => {

      removeFromWishlist(
        wishlistItem.id
      );

    }
  );


  const cartButton =
    card.querySelector(
      ".cart-button-small"
    );


  if(cartButton){

    cartButton.addEventListener(
      "click",
      async () => {

        await addToCart(
          product,
          1
        );

      }
    );

  }


  container.appendChild(
    card
  );

}


/* =====================================================
   OPEN PRODUCT
===================================================== */

function openProduct(
  productId
){

  if(!productId){

    return;

  }


  window.location.href =
    "product.html?id=" +
    encodeURIComponent(
      productId
    );

}


/* =====================================================
   REMOVE FROM WISHLIST
===================================================== */

async function removeFromWishlist(
  wishlistDocumentId
){

  if(!currentUser){

    showToast(
      "Please sign in first."
    );

    return;

  }


  if(!wishlistDocumentId){

    return;

  }


  try{

    await db
    .collection("wishlists")
    .doc(wishlistDocumentId)
    .delete();


    showToast(
      "Removed from wishlist ✓"
    );

  }

  catch(error){

    console.error(
      "REMOVE WISHLIST ERROR:",
      error
    );


    showToast(
      "Could not remove from wishlist."
    );

  }

}


/* =====================================================
   CART LISTENER
===================================================== */

function listenToCart(
  uid
){

  if(cartUnsubscribe){

    cartUnsubscribe();

  }


  cartUnsubscribe =
    db
    .collection("carts")
    .doc(uid)
    .onSnapshot(

      (doc) => {

        if(!doc.exists){

          cartItems = [];

          updateCartCount(
            0
          );

          return;

        }


        const data =
          doc.data();


        cartItems =
          Array.isArray(
            data.items
          )
          ? data.items
          : [];


        let total = 0;


        cartItems.forEach(
          (item) => {

            total +=
              Number(item.qty) || 0;

          }
        );


        updateCartCount(
          total
        );

      },

      (error) => {

        console.error(
          "CART LISTENER ERROR:",
          error
        );


        updateCartCount(
          0
        );

      }

    );

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount(
  count
){

  cartCount.textContent =
    count;

}


/* =====================================================
   ADD TO CART
===================================================== */

async function addToCart(
  product,
  quantity = 1
){

  if(!currentUser){

    showToast(
      "Please sign in first."
    );

    return;

  }


  if(!product){

    return;

  }


  if(
    product.available !== true ||
    product.stock <= 0
  ){

    showToast(
      "This product is unavailable."
    );

    return;

  }


  try{

    const cartRef =
      db
      .collection("carts")
      .doc(
        currentUser.uid
      );


    const cartDoc =
      await cartRef.get();


    let items = [];


    if(cartDoc.exists){

      const data =
        cartDoc.data();


      if(
        Array.isArray(
          data.items
        )
      ){

        items =
          data.items.map(
            item => ({
              ...item
            })
          );

      }

    }


    const index =
      items.findIndex(
        item =>
          item.productId ===
          product.id
      );


    if(index >= 0){

      const oldQty =
        Number(
          items[index].qty
        ) || 0;


      let newQty =
        oldQty +
        quantity;


      if(
        newQty >
        product.stock
      ){

        newQty =
          product.stock;

      }


      items[index].qty =
        newQty;


      items[index].name =
        product.name;


      items[index].price =
        product.price;


      items[index].image =
        product.image;


      items[index].category =
        product.category;

    }

    else{

      items.push({

        productId:
          product.id,

        name:
          product.name,

        price:
          product.price,

        image:
          product.image,

        category:
          product.category,

        qty:
          Math.min(
            quantity,
            product.stock
          )

      });

    }


    await cartRef.set({

      userId:
        currentUser.uid,

      items:
        items,

      updatedAt:
        firebase.firestore
        .FieldValue
        .serverTimestamp()

    },{

      merge:true

    });


    showToast(
      `${product.name} added to cart ✓`
    );

  }

  catch(error){

    console.error(
      "ADD TO CART ERROR:",
      error
    );


    showToast(
      "Could not add product to cart."
    );

  }

}

/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(
  message
){

  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2500
    );

}


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(
  value
){

  const number =
    Number(value);


  if(
    !Number.isFinite(number)
  ){

    return "0";

  }


  return number.toLocaleString(
    "en-NG"
  );

}


/* =====================================================
   TIMESTAMP
===================================================== */

function getTimestampMillis(
  timestamp
){

  if(!timestamp){

    return 0;

  }


  if(
    typeof timestamp.toMillis ===
    "function"
  ){

    return timestamp.toMillis();

  }


  if(
    timestamp.seconds !==
    undefined
  ){

    return (
      Number(timestamp.seconds) *
      1000
    );

  }


  return 0;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(
      value ?? ""
    );


  return div.innerHTML;

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  );

}

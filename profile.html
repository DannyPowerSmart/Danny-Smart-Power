<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | Danny Smart Power</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#07111f;
  color:#fff;
  min-height:100vh;
}

header{
  height:65px;
  background:#020617;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:20px;
  font-weight:bold;
  color:#38bdf8;
}

.logo span{
  color:#fff;
}

.back{
  color:#94a3b8;
  text-decoration:none;
  font-size:14px;
}

.back:hover{
  color:#38bdf8;
}

.container{
  width:100%;
  max-width:700px;
  margin:30px auto;
  padding:0 16px;
}

.profile-card{
  background:#0d1b2a;
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:25px;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.profile-top{
  text-align:center;
  padding-bottom:25px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.photo-wrapper{
  position:relative;
  width:105px;
  height:105px;
  margin:auto;
}

.profile-photo{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  background:#102234;
  border:3px solid #38bdf8;
}

.photo-btn{
  position:absolute;
  right:-2px;
  bottom:2px;
  width:34px;
  height:34px;
  border-radius:50%;
  border:3px solid #0d1b2a;
  background:#38bdf8;
  color:#00111c;
  cursor:pointer;
  font-size:16px;
}

#photoInput{
  display:none;
}

.profile-top h1{
  margin-top:15px;
  font-size:23px;
}

.email{
  margin-top:6px;
  color:#94a3b8;
  font-size:14px;
}

.badge{
  display:inline-block;
  margin-top:10px;
  padding:6px 12px;
  border-radius:20px;
  background:rgba(56,189,248,.12);
  color:#38bdf8;
  font-size:12px;
}

.form{
  margin-top:25px;
}

.section-title{
  font-size:16px;
  margin-bottom:15px;
  color:#e2e8f0;
}

.field{
  margin-bottom:17px;
}

label{
  display:block;
  margin-bottom:7px;
  color:#94a3b8;
  font-size:13px;
}

input{
  width:100%;
  padding:14px;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.09);
  background:#102234;
  color:#fff;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:#38bdf8;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.actions{
  display:flex;
  gap:12px;
  margin-top:25px;
}

button{
  border:none;
  cursor:pointer;
  font-weight:bold;
}

.save{
  flex:1;
  padding:14px;
  border-radius:11px;
  background:#38bdf8;
  color:#00111c;
}

.save:hover{
  background:#7dd3fc;
}

.logout{
  padding:14px 20px;
  border-radius:11px;
  background:#18283a;
  color:#f87171;
}

.message{
  text-align:center;
  min-height:20px;
  margin-top:16px;
  font-size:13px;
}

.loading{
  text-align:center;
  color:#94a3b8;
  padding:20px;
}

@media(max-width:550px){

  .grid{
    grid-template-columns:1fr;
    gap:0;
  }

  .profile-card{
    padding:20px;
  }

  .actions{
    flex-direction:column;
  }

  .logout{
    width:100%;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    ⚡ <span>Danny Smart Power</span>
  </div>

  <a href="index.html" class="back">
    ← Back
  </a>

</header>


<div class="container">

  <div class="profile-card">

    <div class="profile-top">

      <div class="photo-wrapper">

        <img
          id="profilePhoto"
          class="profile-photo"
          src="https://via.placeholder.com/105"
          alt="Profile Photo"
        >

        <button
          class="photo-btn"
          onclick="document.getElementById('photoInput').click()"
        >
          ✎
        </button>

        <input
          type="file"
          id="photoInput"
          accept="image/*"
        >

      </div>

      <h1 id="displayName">Loading...</h1>

      <p class="email" id="displayEmail">
        Loading...
      </p>

      <div class="badge">
        Customer Account
      </div>

    </div>


    <div class="form">

      <h2 class="section-title">
        Personal Information
      </h2>


      <div class="field">

        <label>Full Name</label>

        <input
          id="fullName"
          type="text"
          placeholder="Enter your full name"
        >

      </div>


      <div class="field">

        <label>Email Address</label>

        <input
          id="email"
          type="email"
          readonly
        >

      </div>


      <div class="field">

        <label>Phone Number</label>

        <input
          id="phone"
          type="tel"
          placeholder="Enter your phone number"
        >

      </div>


      <div class="field">

        <label>Address</label>

        <input
          id="address"
          type="text"
          placeholder="Enter your address"
        >

      </div>


      <div class="grid">

        <div class="field">

          <label>City</label>

          <input
            id="city"
            type="text"
            placeholder="City"
          >

        </div>


        <div class="field">

          <label>State</label>

          <input
            id="state"
            type="text"
            placeholder="State"
          >

        </div>

      </div>


      <div class="field">

        <label>Country</label>

        <input
          id="country"
          type="text"
          placeholder="Country"
        >

      </div>


      <div class="actions">

        <button
          class="save"
          id="saveBtn"
          onclick="saveProfile()"
        >
          Save Changes
        </button>

        <button
          class="logout"
          onclick="logout()"
        >
          Logout
        </button>

      </div>

      <div
        class="message"
        id="message"
      ></div>

    </div>

  </div>

</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {

  apiKey:
  "AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvALgb44",

  authDomain:
  "danny-smart-power.firebaseapp.com",

  databaseURL:
  "https://danny-smart-power-default-rtdb.firebaseio.com",

  projectId:
  "danny-smart-power",

  storageBucket:
  "danny-smart-power.firebasestorage.app",

  messagingSenderId:
  "6497356458",

  appId:
  "1:6497356458:web:cff518b89721a163679827",

  measurementId:
  "G-258YKLP5ZS"

};


firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();


let currentUser = null;


/* =========================
   AUTH STATE
========================= */

auth.onAuthStateChanged(async (user) => {

  if (!user) {

    window.location.href = "login.html";

    return;

  }

  currentUser = user;

  document.getElementById("displayEmail")
    .textContent = user.email || "";

  document.getElementById("email")
    .value = user.email || "";

  await loadProfile();

});


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

  if (!currentUser) return;

  try {

    const ref = db
      .collection("profiles")
      .doc(currentUser.uid);

    const snapshot = await ref.get();


    if (snapshot.exists) {

      const data = snapshot.data();

      document.getElementById("fullName").value =
        data.fullName || "";

      document.getElementById("phone").value =
        data.phone || "";

      document.getElementById("address").value =
        data.address || "";

      document.getElementById("city").value =
        data.city || "";

      document.getElementById("state").value =
        data.state || "";

      document.getElementById("country").value =
        data.country || "";

      document.getElementById("displayName")
        .textContent =
        data.fullName ||
        currentUser.displayName ||
        "Welcome";

      if (data.photoURL) {

        document.getElementById("profilePhoto")
          .src = data.photoURL;

      }

    } else {

      document.getElementById("displayName")
        .textContent =
        currentUser.displayName ||
        "Welcome";

    }

  } catch(error) {

    console.error(error);

    showMessage(
      "Unable to load your profile.",
      "error"
    );

  }

}


/* =========================
   SAVE PROFILE
========================= */

async function saveProfile(){

  if (!currentUser) {

    showMessage(
      "Please login first.",
      "error"
    );

    return;

  }


  const saveBtn =
    document.getElementById("saveBtn");


  const fullName =
    document.getElementById("fullName")
      .value.trim();

  const phone =
    document.getElementById("phone")
      .value.trim();

  const address =
    document.getElementById("address")
      .value.trim();

  const city =
    document.getElementById("city")
      .value.trim();

  const state =
    document.getElementById("state")
      .value.trim();

  const country =
    document.getElementById("country")
      .value.trim();


  if (!fullName) {

    showMessage(
      "Please enter your full name.",
      "error"
    );

    return;

  }


  saveBtn.disabled = true;

  saveBtn.textContent = "Saving...";


  try {

    await db
      .collection("profiles")
      .doc(currentUser.uid)
      .set({

        uid: currentUser.uid,

        fullName: fullName,

        phone: phone,

        address: address,

        city: city,

        state: state,

        country: country,

        photoURL:
          document.getElementById("profilePhoto").src,

        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp()

      }, {

        merge:true

      });


    document.getElementById("displayName")
      .textContent = fullName;


    showMessage(
      "Profile updated successfully ✓",
      "success"
    );


  } catch(error) {

    console.error(error);

    showMessage(
      "Could not save profile: " +
      error.message,
      "error"
    );

  }


  saveBtn.disabled = false;

  saveBtn.textContent = "Save Changes";

}


/* =========================
   PHOTO PREVIEW
========================= */

document
  .getElementById("photoInput")
  .addEventListener("change", function(){

    const file = this.files[0];

    if (!file) return;


    const reader =
      new FileReader();


    reader.onload = function(e){

      document.getElementById("profilePhoto")
        .src = e.target.result;

    };


    reader.readAsDataURL(file);

    showMessage(
      "Photo selected. Press Save Changes to save it.",
      "success"
    );

  });


/* =========================
   LOGOUT
========================= */

async function logout(){

  try {

    await auth.signOut();

    window.location.href = "login.html";

  } catch(error){

    showMessage(
      "Logout failed.",
      "error"
    );

  }

}


/* =========================
   MESSAGE
========================= */

function showMessage(text, type){

  const message =
    document.getElementById("message");

  message.textContent = text;

  if(type === "success"){

    message.style.color = "#4ade80";

  } else {

    message.style.color = "#f87171";

  }

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | Danny Smart Power</title>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#07111f;
  --header:#020617;
  --card:#0d1b2a;
  --card2:#102234;
  --border:rgba(255,255,255,.09);

  --blue:#38bdf8;
  --blueDark:#0284c7;

  --green:#22c55e;
  --red:#ef4444;

  --text:#f8fafc;
  --muted:#94a3b8;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at top left,
      rgba(56,189,248,.10),
      transparent 35%
    ),
    var(--bg);

  color:var(--text);
  font-family:'Poppins',sans-serif;
}


/* ================================
   HEADER
================================ */

header{
  height:70px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:rgba(2,6,23,.96);

  border-bottom:1px solid var(--border);

  position:sticky;
  top:0;
  z-index:20;

  backdrop-filter:blur(12px);
}

.header-left{
  display:flex;
  align-items:center;
  gap:11px;
}

.back-button{
  width:40px;
  height:40px;

  border:0;
  border-radius:50%;

  background:transparent;
  color:white;

  font-size:25px;

  cursor:pointer;
}

.back-button:hover{
  background:var(--card2);
}

.logo{
  width:40px;
  height:40px;

  border-radius:12px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--blueDark)
    );

  color:#00111c;

  font-size:21px;
}

.header-title{
  font-size:17px;
  font-weight:600;
}


/* ================================
   MAIN
================================ */

main{
  width:100%;
  max-width:820px;

  margin:auto;

  padding:25px 15px 50px;
}


/* ================================
   HERO
================================ */

.profile-hero{
  position:relative;

  overflow:hidden;

  text-align:center;

  padding:30px 20px;

  border:1px solid var(--border);

  border-radius:25px;

  background:
    linear-gradient(
      145deg,
      #102234,
      #091523
    );

  box-shadow:
    0 20px 60px rgba(0,0,0,.25);
}

.profile-hero::before{
  content:"";

  position:absolute;

  width:180px;
  height:180px;

  border-radius:50%;

  background:rgba(56,189,248,.08);

  top:-90px;
  right:-70px;
}

.avatar-wrapper{
  position:relative;

  width:135px;
  height:135px;

  margin:0 auto 18px;
}

.profile-avatar{
  width:135px;
  height:135px;

  border-radius:50%;

  object-fit:cover;

  background:#12324b;

  border:4px solid var(--blue);

  box-shadow:
    0 0 0 6px rgba(56,189,248,.08);
}

.camera-button{
  position:absolute;

  right:-2px;
  bottom:3px;

  width:43px;
  height:43px;

  border:3px solid #0d1b2a;

  border-radius:50%;

  background:var(--blue);

  color:#00111c;

  font-size:19px;

  cursor:pointer;

  transition:.2s;
}

.camera-button:hover{
  transform:scale(1.06);
}

.profile-hero h1{
  font-size:24px;

  font-weight:600;

  margin-bottom:4px;
}

.profile-email{
  color:var(--muted);

  font-size:13px;

  word-break:break-word;
}

.account-badge{
  display:inline-flex;

  align-items:center;

  gap:6px;

  margin-top:12px;

  padding:7px 13px;

  border-radius:30px;

  background:rgba(56,189,248,.10);

  color:var(--blue);

  font-size:12px;
}

.hidden{
  display:none;
}


/* ================================
   CARDS
================================ */

.card{
  margin-top:18px;

  padding:22px;

  border:1px solid var(--border);

  border-radius:20px;

  background:var(--card);
}

.card-heading{
  display:flex;

  align-items:center;

  gap:11px;

  margin-bottom:20px;
}

.card-icon{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:rgba(56,189,248,.10);

  font-size:19px;
}

.card-heading h2{
  font-size:17px;
  font-weight:600;
}

.card-heading p{
  color:var(--muted);
  font-size:11px;
}


/* ================================
   FORM
================================ */

.form-group{
  margin-bottom:17px;
}

.form-group label{
  display:block;

  margin-bottom:7px;

  color:var(--muted);

  font-size:12px;

  font-weight:500;
}

.form-group input,
.form-group textarea{
  width:100%;

  padding:14px;

  border:1px solid var(--border);

  border-radius:12px;

  outline:none;

  background:var(--card2);

  color:white;

  font-family:inherit;

  font-size:14px;

  transition:.2s;
}

.form-group textarea{
  min-height:95px;

  resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus{
  border-color:var(--blue);

  box-shadow:
    0 0 0 3px rgba(56,189,248,.07);
}

.form-group input[readonly]{
  opacity:.65;
}


/* ================================
   LOCATION GRID
================================ */

.location-grid{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:14px;
}


/* ================================
   SAVE
================================ */

.save-button{
  width:100%;

  margin-top:5px;

  padding:14px;

  border:0;

  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--blueDark)
    );

  color:#00111c;

  font-family:inherit;

  font-size:14px;

  font-weight:700;

  cursor:pointer;

  transition:.2s;
}

.save-button:hover{
  transform:translateY(-1px);
}

.save-button:disabled{
  opacity:.55;

  cursor:not-allowed;

  transform:none;
}


/* ================================
   PHOTO PROGRESS
================================ */

.upload-box{
  display:none;

  margin-top:15px;
}

.upload-track{
  width:100%;

  height:7px;

  overflow:hidden;

  border-radius:20px;

  background:#18283a;
}

.upload-progress{
  width:0%;

  height:100%;

  border-radius:20px;

  background:var(--blue);

  transition:.15s;
}

.upload-text{
  display:block;

  margin-top:7px;

  color:var(--muted);

  font-size:11px;

  text-align:center;
}


/* ================================
   MESSAGE
================================ */

.message{
  display:none;

  margin-top:15px;

  padding:12px;

  border-radius:11px;

  text-align:center;

  font-size:12px;
}

.message.success{
  display:block;

  background:rgba(34,197,94,.10);

  color:#86efac;
}

.message.error{
  display:block;

  background:rgba(239,68,68,.10);

  color:#fca5a5;
}


/* ================================
   SETTINGS
================================ */

.setting-button{
  width:100%;

  padding:14px;

  margin-top:11px;

  border:1px solid var(--border);

  border-radius:12px;

  background:var(--card2);

  color:white;

  font-family:inherit;

  font-size:13px;

  font-weight:600;

  text-align:left;

  cursor:pointer;
}

.setting-button:first-of-type{
  margin-top:0;
}

.setting-button:hover{
  border-color:rgba(56,189,248,.35);
}

.password-button{
  color:var(--blue);
}

.logout-button{
  color:#fbbf24;
}


/* ================================
   LOADING
================================ */

.loading-screen{
  position:fixed;

  inset:0;

  z-index:100;

  display:flex;

  align-items:center;

  justify-content:center;

  background:var(--bg);
}

.loading-content{
  text-align:center;
}

.loading-icon{
  width:55px;
  height:55px;

  margin:0 auto 14px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:16px;

  background:var(--blue);

  color:#00111c;

  font-size:25px;

  animation:pulse 1.3s infinite;
}

.loading-content p{
  color:var(--muted);

  font-size:13px;
}

@keyframes pulse{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.07);
  }

}


/* ================================
   MOBILE
================================ */

@media(max-width:600px){

  main{
    padding:17px 12px 40px;
  }

  .card{
    padding:18px;
  }

  .location-grid{
    grid-template-columns:1fr;
    gap:0;
  }

  .profile-hero{
    padding:27px 15px;
  }

  .profile-hero h1{
    font-size:21px;
  }

  .header-title{
    font-size:15px;
  }

}

</style>

</head>

<div

>

  <div class="loading-content">

  </div>

</div>


<!-- =================================

<header>

  <div class="header-left">

    <button

    >
      ←
    </button>

    <div class="logo">

    </div>

    </div>

</header>


<main>


<!-- =================================
     PROFILE HERO
================================= -->

<section class="profile-hero">

  <div class="avatar-wrapper">

    <img

      class="profile-avatar"
      alt="Profile picture"
    >

    <button
      id="cameraButton"

  <p

  </div>


  <!-- Gallery -->

  <input
    type="file"
    id="galleryInput"
    class="hidden"
    accept="image/jpeg,image/png,image/webp"
  >


  <!-- Camera -->

  <input
    type="file"
    id="cameraInput"
    class="hidden"
    accept="image/*"

  >

</section>


<!-- =================================
     PERSONAL INFORMATION
================================= -->

<section class="card">

  <div class="card-heading">

    <div class="card-icon">
      👤
    </div>

    <div>

      <h2>
        Personal Information
      </h2>

      <p>
        Keep your customer details up to date
      </p>

    </div>

  </div>


  <div class="form-group">

    <label>
      Full Name

    <input

  <div class="form-group">

    <label>

    <textarea
      id="address"

  </div>


  <div class="location-grid">


    <div class="form-group">

      <label>
        City
      </label>

      <input
        id="city"
        type="text"
        autocomplete="address-level2"

      >

    <div class="form-group">

        State
      </label>

      <input

    </div>


  </div>


  <div class="form-group">

    <label>
      Country
    </label>

    <input

      type="text"

      placeholder="Country"

  </div>


  <!-- Upload progress -->

  <div
    class="upload-box"

  >

    <div class="upload-track">

      <div

        id="uploadProgress"
      ></div>

    </div>

    <span
      class="upload-text"
      id="uploadText"
    >
      Uploading photo...
    </span>

  </div>


  <button
    id="saveButton"
    class="save-button"
    type="button"
  >
    Save Profile
  </button>


  <div
    id="message"
    class="message"
  ></div>

</section>


<!-- =================================
     ACCOUNT SETTINGS
================================= -->

<section class="card">

  <div class="card-heading">

    <div class="card-icon">
      ⚙️
    </div>

    <div>

      <h2>
        Account Settings
      </h2>

      <p>
        Manage your account
      </p>

    </div>

  </div>


  <button
    id="passwordButton"
    class="setting-button password-button"
    type="button"
  >
    🔐 Change Password
  </button>


  <button
    id="logoutButton"
    class="setting-button logout-button"
    type="button"
  >
    🚪 Sign Out
  </button>

</section>


</main>


<!-- =================================
     FIREBASE
================================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>


<script>


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvALgb44",

  authDomain:
    "danny-smart-power.firebaseapp.com",

  databaseURL:
    "https://danny-smart-power-default-rtdb.firebaseio.com",

  projectId:
    "danny-smart-power",

  storageBucket:
    "danny-smart-power.firebasestorage.app",

  messagingSenderId:
    "6497356458",

  appId:
    "1:6497356458:web:cff518b89721a163679827",

  measurementId:
    "G-258YKLP5ZS"

};


/* =========================================
   INITIALIZE
========================================= */

firebase.initializeApp(
  firebaseConfig
);


const auth =
  firebase.auth();


const db =
  firebase.firestore();


const storage =
  firebase.storage();


let currentUser =
  null;


let selectedPhoto =
  null;


/* =========================================
   ELEMENTS
========================================= */

const loadingScreen =
  document.getElementById(
    "loadingScreen"
  );

const profileAvatar =
  document.getElementById(
    "profileAvatar"
  );

const heroName =
  document.getElementById(
    "heroName"
  );

const heroEmail =
  document.getElementById(
    "heroEmail"
  );

const fullName =
  document.getElementById(
    "fullName"
  );

const email =
  document.getElementById(
    "email"
  );

const phone =
  document.getElementById(
    "phone"
  );

const address =
  document.getElementById(
    "address"
  );

const city =
  document.getElementById(
    "city"
  );

const state =
  document.getElementById(
    "state"
  );

const country =
  document.getElementById(
    "country"
  );

const saveButton =
  document.getElementById(
    "saveButton"
  );

const message =
  document.getElementById(
    "message"
  );

const cameraButton =
  document.getElementById(
    "cameraButton"
  );

const galleryInput =
  document.getElementById(
    "galleryInput"
  );

const cameraInput =
  document.getElementById(
    "cameraInput"
  );


/* =========================================
   AUTH SESSION

   NO SECOND LOGIN
========================================= */




    currentUser =
      user;


    email.value =
      user.email || "";


    heroEmail.textContent =
      user.email || "";


    try{

      await loadProfile();

    }

    catch(error){

      console.error(error);

      showMessage(
        "Could not load your profile.",
        "error"
      );

    }


    loadingScreen.style.display =
      "none";

  }
);


/* =========================================
   LOAD PROFILE

   profiles/{uid}
========================================= */

async function loadProfile(){

  const profileRef =
    db
      .collection("profiles")
      .doc(currentUser.uid);


  const snapshot =
    await profileRef.get();


  if(snapshot.exists){

    const data =
      snapshot.data();


    fullName.value =
      data.fullName || "";


    phone.value =
      data.phone || "";


    address.value =
      data.address || "";


    city.value =
      data.city || "";


    state.value =
      data.state || "";


    country.value =
      data.country || "";


    if(data.photoURL){

      profileAvatar.src =
        data.photoURL;

    }

    else{

      createAvatar(
        data.fullName ||
        getDefaultName()
      );

    }

  }

  else{

    fullName.value =
      getDefaultName();


    createAvatar(
      getDefaultName()
    );

  }


  updateHero();

}


/* =========================================
   DEFAULT NAME
========================================= */

function getDefaultName(){

  if(currentUser.displayName){

    return currentUser.displayName;

  }


  if(currentUser.email){

    return currentUser
      .email
      .split("@")[0];

  }


  return "Customer";

}


/* =========================================
   DEFAULT AVATAR
========================================= */

function createAvatar(name){

  const letter =
    name
      .charAt(0)
      .toUpperCase();


  profileAvatar.src =
    "data:image/svg+xml;charset=UTF-8," +

    encodeURIComponent(`

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="300"
        height="300"
      >

        <rect
          width="100%"
          height="100%"
          rx="150"
          fill="#12324b"
        />

        <text
          x="50%"
          y="54%"
          text-anchor="middle"
          font-family="Arial"
          font-size="125"
          fill="#38bdf8"
        >
          ${letter}
        </text>

      </svg>

    `);

}


/* =========================================
   HERO
========================================= */

function updateHero(){

  const name =
    fullName.value.trim() ||
    getDefaultName();


  heroName.textContent =
    name;


  heroEmail.textContent =
    currentUser.email || "";

}


/* =========================================
   PHOTO BUTTON
========================================= */

cameraButton.addEventListener(
  "click",
  function(){

    const choice =
      confirm(
        "Press OK to choose a photo from your gallery.\n\n" +
        "Press Cancel to take a new photo."
      );


    if(choice){

      galleryInput.click();

    }

    else{

      cameraInput.click();

    }

  }
);


/* =========================================
   PHOTO HANDLING
========================================= */

galleryInput.addEventListener(
  "change",
  handlePhoto
);


cameraInput.addEventListener(
  "change",
  handlePhoto
);


function handlePhoto(event){

  const file =
    event.target.files[0];


  if(!file){

    return;

  }


  if(!file.type.startsWith("image/")){

    showMessage(
      "Please select an image.",
      "error"
    );

    return;

  }


  /* 5MB maximum */

  if(
    file.size >
    5 * 1024 * 1024
  ){

    showMessage(
      "Please choose an image smaller than 5MB.",
      "error"
    );

    event.target.value =
      "";

    return;

  }


  selectedPhoto =
    file;


  const reader =
    new FileReader();


  reader.onload =
    function(e){

      profileAvatar.src =
        e.target.result;

    };


  reader.readAsDataURL(file);


  showMessage(
    "Photo selected. Tap Save Profile to upload it.",
    "success"
  );

}


/* =========================================
   SAVE PROFILE
========================================= */

saveButton.addEventListener(
  "click",
  saveProfile
);


async function saveProfile(){

  if(!currentUser){

    return;

  }


  const name =
    fullName.value.trim();


  if(!name){

    showMessage(
      "Please enter your full name.",
      "error"
    );

    return;

  }


  saveButton.disabled =
    true;


  saveButton.textContent =
    "Saving...";


  try{

    let photoURL =
      "";


    /* ======================================
       KEEP EXISTING PHOTO
    ====================================== */

    const existing =
      await db
        .collection("profiles")
        .doc(currentUser.uid)
        .get();


    if(existing.exists){

      photoURL =
        existing.data().photoURL ||
        "";

    }


    /* ======================================
       UPLOAD NEW PHOTO
    ====================================== */

    if(selectedPhoto){

      const storagePath =
        "profile-images/" +
        currentUser.uid +
        "/profile.jpg";


      const photoRef =
        storage.ref(
          storagePath
        );


      const uploadTask =
        photoRef.put(
          selectedPhoto,
          {
            contentType:
              selectedPhoto.type
          }
        );


      document.getElementById(
        "uploadBox"
      ).style.display =
        "block";


      await new Promise(
        function(resolve,reject){

          uploadTask.on(

            "state_changed",

            function(snapshot){

              const percent =
                Math.round(
                  (
                    snapshot.bytesTransferred /
                    snapshot.totalBytes
                  ) * 100
                );


              document.getElementById(
                "uploadProgress"
              ).style.width =
                percent + "%";


              document.getElementById(
                "uploadText"
              ).textContent =
                "Uploading photo... " +
                percent +
                "%";

            },

            function(error){

              reject(error);

            },

            async function(){

              photoURL =
                await uploadTask
                  .snapshot
                  .ref
                  .getDownloadURL();


              resolve();

            }

          );

        }
      );


      document.getElementById(
        "uploadText"
      ).textContent =
        "Photo uploaded ✓";


      selectedPhoto =
        null;

    }


    /* ======================================
       FIRESTORE PROFILE
    ====================================== */

    const profileData = {

      uid:
        currentUser.uid,

      fullName:
        name,

      email:
        currentUser.email || "",

      phone:
        phone.value.trim(),

      address:
        address.value.trim(),

      city:
        city.value.trim(),

      state:
        state.value.trim(),

      country:
        country.value.trim(),

      photoURL:
        photoURL,

      updatedAt:
        firebase.firestore
          .FieldValue
          .serverTimestamp()

    };


    await db
      .collection("profiles")
      .doc(currentUser.uid)
      .set(
        profileData,
        {
          merge:true
        }
      );


    /* ======================================
       UPDATE FIREBASE AUTH PROFILE
    ====================================== */

    await currentUser
      .updateProfile({

        displayName:
          name,

        photoURL:
          photoURL || null

      });


    profileAvatar.src =
      photoURL ||
      profileAvatar.src;


    updateHero();


    showMessage(
      "Profile updated successfully ✓",
      "success"
    );


    setTimeout(
      function(){

        document.getElementById(
          "uploadBox"
        ).style.display =
          "none";

      },
      1500
    );


  }

  catch(error){

    console.error(
      "PROFILE ERROR:",
      error
    );


    showMessage(
      "Could not save profile: " +
      error.message,
      "error"
    );

  }


  saveButton.disabled =
    false;


  saveButton.textContent =
    "Save Profile";

}


/* =========================================
   CHANGE PASSWORD

   Sends reset email.
========================================= */

document
  .getElementById(
    "passwordButton"
  )
  .addEventListener(
    "click",
    async function(){

      if(!currentUser ||
         !currentUser.email){

        return;

      }


      const okay =
        confirm(
          "Send a password reset link to:\n\n" +
          currentUser.email + "?"
        );


      if(!okay){

        return;

      }


      try{

        await auth
          .sendPasswordResetEmail(
            currentUser.email
          );


        alert(
          "Password reset email sent successfully."
        );

      }

      catch(error){

        alert(
          error.message
        );

      }

    }
  );


/* =========================================
   LOGOUT
========================================= */

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    async function(){

      const okay =
        confirm(
          "Sign out of your account?"
        );


      if(!okay){

        return;

      }


      try{

        await auth.signOut();


        window.location.href =
          "login.html";

      }

      catch(error){

        showMessage(
          "Could not sign out.",
          "error"
        );

      }

    }
  );


/* =========================================
   BACK
========================================= */

document
  .getElementById(
    "backButton"
  )
  .addEventListener(
    "click",
    function(){

      window.history.back();

    }
  );


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type
){

  message.textContent =
    text;


  message.className =
    "message " +
    type;


  setTimeout(
    function(){

      message.className =
        "message";

    },
    5000
  );

}

</script>

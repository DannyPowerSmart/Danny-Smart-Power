<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | Danny Smart Power</title>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#07111f;
  --header:#020617;
  --card:#0d1b2a;
  --card2:#102234;
  --border:rgba(255,255,255,.09);

  --blue:#38bdf8;
  --blue-dark:#0284c7;

  --green:#22c55e;
  --red:#ef4444;
  --yellow:#fbbf24;

  --text:#f8fafc;
  --muted:#94a3b8;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at top left,
      rgba(56,189,248,.10),
      transparent 35%
    ),
    var(--bg);

  color:var(--text);
  font-family:'Poppins',sans-serif;
}


/* =========================
   HEADER
========================= */

header{
  height:72px;

  display:flex;
  align-items:center;

  padding:0 16px;

  background:rgba(2,6,23,.97);

  border-bottom:1px solid var(--border);

  position:sticky;
  top:0;

  z-index:50;

  backdrop-filter:blur(12px);
}

.header-left{
  display:flex;
  align-items:center;
  gap:11px;
}

.back-button{
  width:42px;
  height:42px;

  border:0;
  border-radius:50%;

  background:transparent;

  color:white;

  font-size:27px;

  cursor:pointer;
}

.back-button:active{
  background:var(--card2);
}

.logo{
  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--blue-dark)
    );

  color:#00111c;

  font-size:22px;
}

.header-title{
  font-size:18px;
  font-weight:600;
}


/* =========================
   MAIN
========================= */

main{
  width:100%;
  max-width:820px;

  margin:auto;

  padding:22px 14px 50px;
}


/* =========================
   PROFILE HERO
========================= */

.profile-hero{
  position:relative;

  overflow:hidden;

  text-align:center;

  padding:30px 18px;

  border:1px solid var(--border);

  border-radius:25px;

  background:
    linear-gradient(
      145deg,
      #102234,
      #091523
    );

  box-shadow:
    0 20px 60px rgba(0,0,0,.25);
}

.avatar-wrapper{
  position:relative;

  width:135px;
  height:135px;

  margin:0 auto 18px;
}

.profile-avatar{
  width:135px;
  height:135px;

  display:block;

  border-radius:50%;

  object-fit:cover;

  background:#12324b;

  border:4px solid var(--blue);

  box-shadow:
    0 0 0 6px rgba(56,189,248,.08);
}

.camera-button{
  position:absolute;

  right:-2px;
  bottom:3px;

  width:44px;
  height:44px;

  border:3px solid #0d1b2a;

  border-radius:50%;

  background:var(--blue);

  color:#00111c;

  font-size:19px;

  cursor:pointer;
}

.profile-hero h1{
  font-size:24px;
  font-weight:600;

  margin-bottom:5px;
}

.profile-email{
  color:var(--muted);

  font-size:13px;

  word-break:break-word;
}

.account-badge{
  display:inline-flex;

  align-items:center;

  gap:6px;

  margin-top:12px;

  padding:7px 14px;

  border-radius:30px;

  background:rgba(56,189,248,.10);

  color:var(--blue);

  font-size:12px;
}


/* =========================
   CARD
========================= */

.card{
  margin-top:18px;

  padding:22px;

  border:1px solid var(--border);

  border-radius:21px;

  background:var(--card);
}

.card-heading{
  display:flex;

  align-items:center;

  gap:11px;

  margin-bottom:21px;
}

.card-icon{
  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:rgba(56,189,248,.10);

  font-size:20px;
}

.card-heading h2{
  font-size:17px;
  font-weight:600;
}

.card-heading p{
  color:var(--muted);

  font-size:11px;

  margin-top:2px;
}


/* =========================
   FORM
========================= */

.form-group{
  margin-bottom:17px;
}

.form-group label{
  display:block;

  margin-bottom:7px;

  color:var(--muted);

  font-size:12px;

  font-weight:500;
}

.form-group input,
.form-group textarea{
  width:100%;

  padding:14px;

  border:1px solid var(--border);

  border-radius:12px;

  outline:none;

  background:var(--card2);

  color:white;

  font-family:inherit;

  font-size:14px;

  transition:.2s;
}

.form-group input:focus,
.form-group textarea:focus{
  border-color:var(--blue);

  box-shadow:
    0 0 0 3px rgba(56,189,248,.07);
}

.form-group input[readonly]{
  opacity:.65;
}

.form-group textarea{
  min-height:95px;

  resize:vertical;
}


/* =========================
   LOCATION
========================= */

.location-grid{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:14px;
}


/* =========================
   SAVE BUTTON
========================= */

.save-button{
  width:100%;

  margin-top:5px;

  padding:14px;

  border:0;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--blue-dark)
    );

  color:#00111c;

  font-family:inherit;

  font-size:14px;

  font-weight:700;

  cursor:pointer;
}

.save-button:disabled{
  opacity:.55;

  cursor:not-allowed;
}


/* =========================
   PHOTO STATUS
========================= */

.photo-status{
  display:none;

  margin-bottom:15px;

  padding:11px;

  border-radius:11px;

  background:rgba(56,189,248,.08);

  color:var(--blue);

  text-align:center;

  font-size:12px;
}

.photo-status.show{
  display:block;
}


/* =========================
   MESSAGE
========================= */

.message{
  display:none;

  margin-top:15px;

  padding:12px;

  border-radius:11px;

  text-align:center;

  font-size:12px;
}

.message.success{
  display:block;

  background:rgba(34,197,94,.10);

  color:#86efac;
}

.message.error{
  display:block;

  background:rgba(239,68,68,.10);

  color:#fca5a5;
}


/* =========================
   SETTINGS
========================= */

.setting-button{
  width:100%;

  padding:14px;

  margin-top:11px;

  border:1px solid var(--border);

  border-radius:13px;

  background:var(--card2);

  color:white;

  font-family:inherit;

  font-size:13px;

  font-weight:600;

  text-align:left;

  cursor:pointer;
}

.setting-button:first-of-type{
  margin-top:0;
}

.password-button{
  color:var(--blue);
}

.logout-button{
  color:var(--yellow);
}


/* =========================
   LOADING
========================= */

.loading-screen{
  position:fixed;

  inset:0;

  z-index:100;

  display:flex;

  align-items:center;
  justify-content:center;

  background:var(--bg);
}

.loading-content{
  width:90%;

  max-width:350px;

  text-align:center;
}

.loading-icon{
  width:58px;
  height:58px;

  margin:0 auto 15px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--blue-dark)
    );

  color:#00111c;

  font-size:26px;

  animation:pulse 1.2s infinite;
}

.loading-content p{
  color:var(--muted);

  font-size:13px;
}

@keyframes pulse{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.08);
  }

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  main{
    padding:16px 12px 40px;
  }

  .card{
    padding:18px;
  }

  .location-grid{
    grid-template-columns:1fr;

    gap:0;
  }

  .profile-hero{
    padding:27px 15px;
  }

  .profile-hero h1{
    font-size:21px;
  }

  .header-title{
    font-size:16px;
  }

}

</style>

</head>


<body>


<!-- =========================
     LOADING
========================= -->

<div
  class="loading-screen"
  id="loadingScreen"
>

  <div class="loading-content">

    <div class="loading-icon">
      ⚡
    </div>

    <p id="loadingText">
      Checking your account...
    </p>

  </div>

</div>


<!-- =========================
     HEADER
========================= -->

<header>

  <div class="header-left">

    <button
      class="back-button"
      id="backButton"
      type="button"
    >
      ←
    </button>

    <div class="logo">
      ⚡
    </div>

    <div class="header-title">
      My Profile
    </div>

  </div>

</header>


<main>


<!-- =========================
     HERO
========================= -->

<section class="profile-hero">

  <div class="avatar-wrapper">

    <img
      id="profileAvatar"
      class="profile-avatar"
      alt="Profile picture"
    >

    <button
      id="cameraButton"
      class="camera-button"
      type="button"
    >
      📷
    </button>

  </div>


  <h1 id="heroName">
    Loading...
  </h1>


  <p
    id="heroEmail"
    class="profile-email"
  >
    Loading...
  </p>


  <div class="account-badge">
    ✓ Customer Account
  </div>


  <input
    type="file"
    id="galleryInput"
    hidden
    accept="image/jpeg,image/png,image/webp"
  >

  <input
    type="file"
    id="cameraInput"
    hidden
    accept="image/*"
    capture="environment"
  >

</section>


<!-- =========================
     PERSONAL INFORMATION
========================= -->

<section class="card">

  <div class="card-heading">

    <div class="card-icon">
      👤
    </div>

    <div>

      <h2>
        Personal Information
      </h2>

      <p>
        Keep your customer information up to date
      </p>

    </div>

  </div>


  <div class="form-group">

    <label>
      Full Name
    </label>

    <input
      id="fullName"
      type="text"
      autocomplete="name"
      placeholder="Enter your full name"
    >

  </div>


  <div class="form-group">

    <label>
      Email Address
    </label>

    <input
      id="email"
      type="email"
      readonly
      autocomplete="email"
    >

  </div>


  <div class="form-group">

    <label>
      Phone Number
    </label>

    <input
      id="phone"
      type="tel"
      autocomplete="tel"
      placeholder="Enter your phone number"
    >

  </div>


  <div class="form-group">

    <label>
      Address
    </label>

    <textarea
      id="address"
      autocomplete="street-address"
      placeholder="Enter your delivery address"
    ></textarea>

  </div>


  <div class="location-grid">

    <div class="form-group">

      <label>
        City
      </label>

      <input
        id="city"
        type="text"
        autocomplete="address-level2"
        placeholder="City"
      >

    </div>


    <div class="form-group">

      <label>
        State
      </label>

      <input
        id="state"
        type="text"
        autocomplete="address-level1"
        placeholder="State"
      >

    </div>

  </div>


  <div class="form-group">

    <label>
      Country
    </label>

    <input
      id="country"
      type="text"
      autocomplete="country-name"
      placeholder="Country"
    >

  </div>


  <div
    id="photoStatus"
    class="photo-status"
  >
    Photo selected ✓
  </div>


  <button
    id="saveButton"
    class="save-button"
    type="button"
  >
    Save Profile
  </button>


  <div
    id="message"
    class="message"
  ></div>

</section>


<!-- =========================
     ACCOUNT SETTINGS
========================= -->

<section class="card">

  <div class="card-heading">

    <div class="card-icon">
      ⚙️
    </div>

    <div>

      <h2>
        Account Settings
      </h2>

      <p>
        Manage your Danny Smart Power account
      </p>

    </div>

  </div>


  <button
    id="passwordButton"
    class="setting-button password-button"
    type="button"
  >
    🔐 Change Password
  </button>


  <button
    id="logoutButton"
    class="setting-button logout-button"
    type="button"
  >
    🚪 Sign Out
  </button>

</section>


</main>

     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGb44",

  authDomain:
    "danny-smart-power.firebaseapp.com",

  databaseURL:
    "https://danny-smart-power-default-rtdb.firebaseio.com",

  projectId:
    "danny-smart-power",

  storageBucket:
    "danny-smart-power.firebasestorage.app",

  messagingSenderId:
    "649735645158",

  appId:
    "1:649735645158:web:cff518b89721a163679827",

  measurementId:
    "G-258YKLP5ZS"

};


/* =====================================================
   INITIALIZE FIREBASE

   IMPORTANT:
   NO FIREBASE STORAGE
===================================================== */

firebase.initializeApp(
  firebaseConfig
);

const auth =
  firebase.auth();

const db =
  firebase.firestore();


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let selectedPhoto = null;


/* =====================================================
   ELEMENTS
===================================================== */

const loadingScreen =
  document.getElementById(
    "loadingScreen"
  );

const loadingText =
  document.getElementById(
    "loadingText"
  );

const profileAvatar =
  document.getElementById(
    "profileAvatar"
  );

const heroName =
  document.getElementById(
    "heroName"
  );

const heroEmail =
  document.getElementById(
    "heroEmail"
  );

const fullName =
  document.getElementById(
    "fullName"
  );

const email =
  document.getElementById(
    "email"
  );

const phone =
  document.getElementById(
    "phone"
  );

const address =
  document.getElementById(
    "address"
  );

const city =
  document.getElementById(
    "city"
  );

const state =
  document.getElementById(
    "state"
  );

const country =
  document.getElementById(
    "country"
  );

const cameraButton =
  document.getElementById(
    "cameraButton"
  );

const galleryInput =
  document.getElementById(
    "galleryInput"
  );

const cameraInput =
  document.getElementById(
    "cameraInput"
  );

const saveButton =
  document.getElementById(
    "saveButton"
  );

const photoStatus =
  document.getElementById(
    "photoStatus"
  );

const message =
  document.getElementById(
    "message"
  );


/* =====================================================
   DEFAULT AVATAR
===================================================== */

function createAvatar(name){

  const letter =
    (name || "C")
      .trim()
      .charAt(0)
      .toUpperCase() || "C";


  profileAvatar.src =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="300"
        height="300"
        viewBox="0 0 300 300"
      >

        <rect
          width="300"
          height="300"
          rx="150"
          fill="#12324b"
        />

        <text
          x="150"
          y="175"
          text-anchor="middle"
          font-family="Arial"
          font-size="130"
          font-weight="bold"
          fill="#38bdf8"
        >
          ${letter}
        </text>

      </svg>

    `);

}


/* =====================================================
   DEFAULT NAME
===================================================== */

function getDefaultName(){

  if(
    currentUser &&
    currentUser.displayName
  ){

    return currentUser.displayName;

  }


  if(
    currentUser &&
    currentUser.email
  ){

    return currentUser
      .email
      .split("@")[0];

  }


  return "Customer";

}


/* =====================================================
   UPDATE HERO
===================================================== */

function updateHero(){

  const name =
    fullName.value.trim() ||
    getDefaultName();


  heroName.textContent =
    name;


  heroEmail.textContent =
    currentUser &&
    currentUser.email
      ? currentUser.email
      : "";

}


/* =====================================================
   AUTH SESSION

   THIS DOES NOT ASK THE USER TO LOGIN AGAIN.

   It reads the Firebase session created by
   the main website login.
===================================================== */

auth.onAuthStateChanged(
  async function(user){

    console.log(
      "Firebase auth state:",
      user
        ? user.uid
        : "NO USER"
    );


    if(!user){

      loadingText.textContent =
        "No active login session. Redirecting...";


      setTimeout(
        function(){

          window.location.href =
            "login.html";

        },
        800
      );


      return;

    }


    /* ==============================
       EXISTING LOGIN FOUND
    ============================== */

    currentUser =
      user;


    email.value =
      user.email || "";


    heroEmail.textContent =
      user.email || "";


    createAvatar(
      getDefaultName()
    );


    try{

      loadingText.textContent =
        "Loading your profile...";


      await loadProfile();


      loadingScreen.style.display =
        "none";

    }

    catch(error){

      console.error(
        "PROFILE LOAD ERROR:",
        error
      );


      loadingScreen.style.display =
        "none";


      showMessage(
        "Could not load your profile: " +
        error.message,
        "error"
      );

    }

  }
);


/* =====================================================
   LOAD PROFILE

   profiles/{uid}
===================================================== */

async function loadProfile(){

  if(!currentUser){

    throw new Error(
      "No authenticated user."
    );

  }


  const profileRef =
    db
      .collection("profiles")
      .doc(currentUser.uid);


  const snapshot =
    await profileRef.get();


  if(snapshot.exists){

    const data =
      snapshot.data();


    fullName.value =
      data.fullName || "";


    phone.value =
      data.phone || "";


    address.value =
      data.address || "";


    city.value =
      data.city || "";


    state.value =
      data.state || "";


    country.value =
      data.country || "";


    if(
      data.photoURL &&
      typeof data.photoURL === "string"
    ){

      profileAvatar.src =
        data.photoURL;

    }

    else{

      createAvatar(
        data.fullName ||
        getDefaultName()
      );

    }

  }

  else{

    fullName.value =
      getDefaultName();


    createAvatar(
      getDefaultName()
    );

  }


  updateHero();

}


/* =====================================================
   PHOTO BUTTON
===================================================== */

cameraButton.addEventListener(
  "click",
  function(){

    const choice =
      confirm(
        "Press OK to choose a photo from your gallery.\n\n" +
        "Press Cancel to take a new photo."
      );


    if(choice){

      galleryInput.click();

    }

    else{

      cameraInput.click();

    }

  }
);


/* =====================================================
   PHOTO INPUTS
===================================================== */

galleryInput.addEventListener(
  "change",
  handlePhoto
);

cameraInput.addEventListener(
  "change",
  handlePhoto
);


/* =====================================================
   HANDLE PHOTO
===================================================== */

function handlePhoto(event){

  const file =
    event.target.files &&
    event.target.files[0];


  if(!file){

    return;

  }


  if(
    !file.type ||
    !file.type.startsWith("image/")
  ){

    showMessage(
      "Please select a valid image.",
      "error"
    );

    event.target.value = "";

    return;

  }


  /*
     We allow larger phone photos here because
     the browser will compress them before Firestore.
  */

  if(
    file.size >
    15 * 1024 * 1024
  ){

    showMessage(
      "That photo is too large. Please choose a photo below 15MB.",
      "error"
    );

    event.target.value = "";

    return;

  }


  selectedPhoto =
    file;


  /* ==============================
     SHOW PREVIEW IMMEDIATELY
  ============================== */

  const reader =
    new FileReader();


  reader.onload =
    function(e){

      profileAvatar.src =
        e.target.result;

    };


  reader.readAsDataURL(file);


  photoStatus.classList.add(
    "show"
  );


  photoStatus.textContent =
    "Photo selected ✓ — tap Save Profile to save it.";

}


/* =====================================================
   COMPRESS PHOTO

   This replaces Firebase Storage.

   The image is resized and converted to JPEG
   before being saved to Firestore.
===================================================== */

function compressPhoto(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onerror =
        function(){

          reject(
            new Error(
              "Could not read the selected photo."
            )
          );

        };


      reader.onload =
        function(event){

          const image =
            new Image();


          image.onerror =
            function(){

              reject(
                new Error(
                  "Could not process the selected photo."
                )
              );

            };


          image.onload =
            function(){

              /*
                 Maximum image dimension.
                 This keeps the Firestore document small.
              */

              const MAX_SIZE = 700;


              let width =
                image.width;

              let height =
                image.height;


              if(width > MAX_SIZE ||
                 height > MAX_SIZE){

                if(width > height){

                  height =
                    Math.round(
                      height *
                      MAX_SIZE /
                      width
                    );

                  width =
                    MAX_SIZE;

                }

                else{

                  width =
                    Math.round(
                      width *
                      MAX_SIZE /
                      height
                    );

                  height =
                    MAX_SIZE;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              /*
                 White background prevents transparent
                 PNG images from looking strange after
                 JPEG conversion.
              */

              ctx.fillStyle =
                "#ffffff";

              ctx.fillRect(
                0,
                0,
                width,
                height
              );


              ctx.drawImage(
                image,
                0,
                0,
                width,
                height
              );


              /*
                 JPEG quality.
                 0.65 keeps the image looking good
                 while greatly reducing the size.
              */

              const compressed =
                canvas.toDataURL(
                  "image/jpeg",
                  0.65
                );


              /*
                 Safety check.
                 Firestore documents cannot hold huge
                 amounts of data.
              */

              if(
                compressed.length >
                700000
              ){

                /*
                   Try a smaller version.
                */

                const smaller =
                  canvas.toDataURL(
                    "image/jpeg",
                    0.45
                  );


                resolve(
                  smaller
                );

                return;

              }


              resolve(
                compressed
              );

            };


          image.src =
            event.target.result;

        };


      reader.readAsDataURL(file);

    }
  );

}


/* =====================================================
   SAVE PROFILE
===================================================== */

saveButton.addEventListener(
  "click",
  saveProfile
);


async function saveProfile(){

  if(!currentUser){

    showMessage(
      "Your login session has expired. Please return to the website and log in.",
      "error"
    );

    return;

  }


  const name =
    fullName.value.trim();


  if(!name){

    showMessage(
      "Please enter your full name.",
      "error"
    );

    return;

  }


  saveButton.disabled =
    true;

  saveButton.textContent =
    "Saving...";


  try{

    /*
       Get existing profile first.
    */

    const profileRef =
      db
        .collection("profiles")
        .doc(currentUser.uid);


    const existingSnapshot =
      await profileRef.get();


    let photoURL = "";


    if(existingSnapshot.exists){

      photoURL =
        existingSnapshot.data().photoURL ||
        "";

    }


    /* ======================================
       COMPRESS NEW PHOTO
    ====================================== */

    if(selectedPhoto){

      photoStatus.classList.add(
        "show"
      );


      photoStatus.textContent =
        "Preparing photo...";


      photoURL =
        await compressPhoto(
          selectedPhoto
        );


      photoStatus.textContent =
        "Photo prepared ✓";

    }


    /* ======================================
       PROFILE DATA

       This matches your Firestore structure.
    ====================================== */

    const profileData = {

      uid:
        currentUser.uid,

      fullName:
        name,

      phone:
        phone.value.trim(),

      address:
        address.value.trim(),

      city:
        city.value.trim(),

      state:
        state.value.trim(),

      country:
        country.value.trim(),

      photoURL:
        photoURL,

      updatedAt:
        firebase.firestore
          .FieldValue
          .serverTimestamp()

    };


    /* ======================================
       SAVE TO PROFILES
    ====================================== */

    await profileRef.set(
      profileData,
      {
        merge:true
      }
    );


    /* ======================================
       UPDATE AUTH PROFILE

       This is only the Firebase Auth
       display name/photo information.
    ====================================== */

    try{

      await currentUser.updateProfile({

        displayName:
          name,

        photoURL:
          photoURL || null

      });

    }

    catch(authError){

      console.warn(
        "Auth profile update warning:",
        authError
      );

      /*
         Do not fail the entire profile save
         just because the optional Auth profile
         update failed.
      */

    }


    /* ======================================
       FINISH
    ====================================== */

    selectedPhoto =
      null;


    photoStatus.classList.remove(
      "show"
    );


    updateHero();


    showMessage(
      "Profile updated successfully ✓",
      "success"
    );


  }

  catch(error){

    console.error(
      "PROFILE SAVE ERROR:",
      error
    );


    /*
       Make sure the page never remains
       permanently stuck on Saving...
    */

    showMessage(
      "Could not save profile: " +
      error.message,
      "error"
    );

  }


  saveButton.disabled =
    false;

  saveButton.textContent =
    "Save Profile";

}


/* =====================================================
   CHANGE PASSWORD
===================================================== */

document
  .getElementById(
    "passwordButton"
  )
  .addEventListener(
    "click",
    async function(){

      if(
        !currentUser ||
        !currentUser.email
      ){

        showMessage(
          "No active account found.",
          "error"
        );

        return;

      }


      const okay =
        confirm(
          "Send a password reset link to:\n\n" +
          currentUser.email +
          "?"
        );


      if(!okay){

        return;

      }


      try{

        await auth
          .sendPasswordResetEmail(
            currentUser.email
          );


        alert(
          "Password reset email sent successfully."
        );

      }

      catch(error){

        alert(
          "Could not send password reset email:\n\n" +
          error.message
        );

      }

    }
  );


/* =====================================================
   SIGN OUT
===================================================== */

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    async function(){

      const okay =
        confirm(
          "Are you sure you want to sign out?"
        );


      if(!okay){

        return;

      }


      try{

        await auth.signOut();


        window.location.href =
          "login.html";

      }

      catch(error){

        showMessage(
          "Could not sign out: " +
          error.message,
          "error"
        );

      }

    }
  );


/* =====================================================
   BACK BUTTON
===================================================== */

document
  .getElementById(
    "backButton"
  )
  .addEventListener(
    "click",
    function(){

      if(
        document.referrer &&
        document.referrer.includes(
          window.location.hostname
        )
      ){

        window.history.back();

      }

      else{

        window.location.href =
          "index.html";

      }

    }
  );


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  message.textContent =
    text;


  message.className =
    "message " +
    type;


  setTimeout(
    function(){

      message.className =
        "message";

    },
    6000
  );

}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | Danny Smart Power</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
  min-height:100vh;
}

header{
  height:65px;
  background:#020617;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
  color:#38bdf8;
  font-size:19px;
  font-weight:bold;
}

.back{
  color:#94a3b8;
  text-decoration:none;
  font-size:14px;
}

.back:hover{
  color:#38bdf8;
}

.container{
  max-width:700px;
  margin:30px auto;
  padding:0 16px;
}

.card{
  background:#0d1b2a;
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:25px;
  box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.profile-top{
  text-align:center;
  padding-bottom:25px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.photo-wrap{
  width:110px;
  height:110px;
  margin:auto;
  position:relative;
}

.photo{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  background:#102234;
  border:3px solid #38bdf8;
}

.photo-button{
  position:absolute;
  right:0;
  bottom:0;
  width:36px;
  height:36px;
  border-radius:50%;
  border:3px solid #0d1b2a;
  background:#38bdf8;
  color:#00111c;
  cursor:pointer;
  font-size:17px;
}

#photoInput{
  display:none;
}

h1{
  margin-top:15px;
  font-size:23px;
}

.email{
  margin-top:6px;
  color:#94a3b8;
  font-size:14px;
}

.badge{
  display:inline-block;
  margin-top:10px;
  padding:6px 12px;
  border-radius:20px;
  background:rgba(56,189,248,.12);
  color:#38bdf8;
  font-size:12px;
}

.form{
  margin-top:25px;
}

.title{
  font-size:16px;
  margin-bottom:16px;
}

.field{
  margin-bottom:17px;
}

label{
  display:block;
  color:#94a3b8;
  font-size:13px;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:14px;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.1);
  background:#102234;
  color:white;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:#38bdf8;
}

input[readonly]{
  opacity:.7;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.actions{
  display:flex;
  gap:12px;
  margin-top:25px;
}

.save{
  flex:1;
  padding:14px;
  border:none;
  border-radius:11px;
  background:#38bdf8;
  color:#00111c;
  font-weight:bold;
  cursor:pointer;
}

.save:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.logout{
  padding:14px 20px;
  border:none;
  border-radius:11px;
  background:#18283a;
  color:#f87171;
  font-weight:bold;
  cursor:pointer;
}

.progress-box{
  display:none;
  margin-top:15px;
}

.progress-bar{
  width:100%;
  height:7px;
  background:#18283a;
  border-radius:20px;
  overflow:hidden;
}

.progress{
  width:0%;
  height:100%;
  background:#38bdf8;
  transition:.2s;
}

.progress-text{
  display:block;
  margin-top:7px;
  text-align:center;
  color:#94a3b8;
  font-size:12px;
}

.message{
  min-height:20px;
  margin-top:16px;
  text-align:center;
  font-size:13px;
}

.loading{
  text-align:center;
  padding:30px;
  color:#94a3b8;
}

@media(max-width:550px){

  .grid{
    grid-template-columns:1fr;
    gap:0;
  }

  .actions{
    flex-direction:column;
  }

  .logout{
    width:100%;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    ⚡ Danny Smart Power
  </div>

  <a href="index.html" class="back">
    ← Back
  </a>

</header>


<div class="container">

  <div class="card">

    <div class="profile-top">

      <div class="photo-wrap">

        <img
          id="profilePhoto"
          class="photo"
          src="https://via.placeholder.com/110"
          alt="Profile photo"
        >

        <button
          class="photo-button"
          id="photoButton"
          type="button"
        >
          ✎
        </button>

        <input
          type="file"
          id="photoInput"
          accept="image/jpeg,image/png,image/webp"
        >

      </div>

      <h1 id="displayName">
        Loading...
      </h1>

      <p class="email" id="displayEmail">
        Loading...
      </p>

      <div class="badge">
        Customer Account
      </div>

    </div>


    <div class="form">

      <h2 class="title">
        Personal Information
      </h2>


      <div class="field">

        <label>Full Name</label>

        <input
          id="fullName"
          type="text"
          placeholder="Your full name"
        >

      </div>


      <div class="field">

        <label>Email Address</label>

        <input
          id="email"
          type="email"
          readonly
        >

      </div>


      <div class="field">

        <label>Phone Number</label>

        <input
          id="phone"
          type="tel"
          placeholder="Your phone number"
        >

      </div>


      <div class="field">

        <label>Address</label>

        <input
          id="address"
          type="text"
          placeholder="Your address"
        >

      </div>


      <div class="grid">

        <div class="field">

          <label>City</label>

          <input
            id="city"
            type="text"
            placeholder="City"
          >

        </div>


        <div class="field">

          <label>State</label>

          <input
            id="state"
            type="text"
            placeholder="State"
          >

        </div>

      </div>


      <div class="field">

        <label>Country</label>

        <input
          id="country"
          type="text"
          placeholder="Country"
        >

      </div>


      <div class="progress-box" id="progressBox">

        <div class="progress-bar">

          <div
            class="progress"
            id="progress"
          ></div>

        </div>

        <span
          class="progress-text"
          id="progressText"
        >
          Uploading photo...
        </span>

      </div>


      <div class="actions">

        <button
          class="save"
          id="saveBtn"
          type="button"
        >
          Save Changes
        </button>

        <button
          class="logout"
          id="logoutBtn"
          type="button"
        >
          Logout
        </button>

      </div>


      <div
        class="message"
        id="message"
      ></div>

    </div>

  </div>

</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>


<script>

/* ==========================================
   PASTE YOUR EXACT FIREBASE CONFIG HERE
========================================== */

const firebaseConfig = {
  apiKey: "YOUR_EXACT_API_KEY",
  authDomain: "danny-smart-power.firebaseapp.com",
  databaseURL: "https://danny-smart-power-default-rtdb.firebaseio.com",
  projectId: "danny-smart-power",
  storageBucket: "danny-smart-power.firebasestorage.app",
  messagingSenderId: "6497356458",
  appId: "YOUR_EXACT_APP_ID",
  measurementId: "YOUR_EXACT_MEASUREMENT_ID"
};


/* ==========================================
   INITIALIZE FIREBASE
========================================== */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();

const storage = firebase.storage();


let currentUser = null;

let selectedPhoto = null;


/* ==========================================
   AUTH SESSION
========================================== */

auth.onAuthStateChanged(async (user) => {

  /*
    IMPORTANT:

    This is NOT another login.

    Firebase automatically remembers the
    customer's existing login session.
  */

  if (!user) {

    window.location.href = "login.html";

    return;

  }


  currentUser = user;


  document.getElementById("displayEmail")
    .textContent = user.email || "No email";


  document.getElementById("email")
    .value = user.email || "";


  await loadProfile();

});


/* ==========================================
   LOAD PROFILE
========================================== */

async function loadProfile(){

  try {

    const ref = db
      .collection("profiles")
      .doc(currentUser.uid);


    const snapshot = await ref.get();


    if (snapshot.exists) {

      const data = snapshot.data();


      document.getElementById("fullName")
        .value = data.fullName || "";


      document.getElementById("phone")
        .value = data.phone || "";


      document.getElementById("address")
        .value = data.address || "";


      document.getElementById("city")
        .value = data.city || "";


      document.getElementById("state")
        .value = data.state || "";


      document.getElementById("country")
        .value = data.country || "";


      if (data.photoURL) {

        document.getElementById("profilePhoto")
          .src = data.photoURL;

      }


      document.getElementById("displayName")
        .textContent =
        data.fullName ||
        currentUser.displayName ||
        "My Profile";

    }

    else {

      document.getElementById("displayName")
        .textContent =
        currentUser.displayName ||
        "My Profile";

    }


  } catch(error) {

    console.error(error);

    showMessage(
      "Unable to load profile: " + error.message,
      "error"
    );

  }

}


/* ==========================================
   CHOOSE PHOTO
========================================== */

document
  .getElementById("photoButton")
  .addEventListener("click", () => {

    document
      .getElementById("photoInput")
      .click();

  });


document
  .getElementById("photoInput")
  .addEventListener("change", function(){

    const file = this.files[0];

    if (!file) return;


    /*
      Limit to 5MB
    */

    if (file.size > 5 * 1024 * 1024) {

      showMessage(
        "Photo must be smaller than 5MB.",
        "error"
      );

      this.value = "";

      return;

    }


    selectedPhoto = file;


    /*
      Preview immediately
    */

    const reader =
      new FileReader();


    reader.onload = function(event){

      document
        .getElementById("profilePhoto")
        .src = event.target.result;

    };


    reader.readAsDataURL(file);


    showMessage(
      "Photo selected. Save your profile to upload it.",
      "success"
    );

});


/* ==========================================
   SAVE PROFILE
========================================== */

document
  .getElementById("saveBtn")
  .addEventListener("click", saveProfile);


async function saveProfile(){

  if (!currentUser) {

    return;

  }


  const saveBtn =
    document.getElementById("saveBtn");


  const fullName =
    document.getElementById("fullName")
      .value.trim();


  const phone =
    document.getElementById("phone")
      .value.trim();


  const address =
    document.getElementById("address")
      .value.trim();


  const city =
    document.getElementById("city")
      .value.trim();


  const state =
    document.getElementById("state")
      .value.trim();


  const country =
    document.getElementById("country")
      .value.trim();


  if (!fullName) {

    showMessage(
      "Please enter your full name.",
      "error"
    );

    return;

  }


  saveBtn.disabled = true;

  saveBtn.textContent = "Saving...";


  try {

    let photoURL =
      document.getElementById("profilePhoto").src;


    /* ======================================
       UPLOAD PHOTO TO FIREBASE STORAGE
    ====================================== */

    if (selectedPhoto) {

      const fileExtension =
        selectedPhoto.name
          .split(".")
          .pop();


      const filePath =
        "profilePhotos/" +
        currentUser.uid +
        "." +
        fileExtension;


      const storageRef =
        storage.ref(filePath);


      const uploadTask =
        storageRef.put(selectedPhoto);


      document.getElementById("progressBox")
        .style.display = "block";


      await new Promise((resolve, reject) => {

        uploadTask.on(

          "state_changed",

          (snapshot) => {

            const percent =
              Math.round(
                (snapshot.bytesTransferred /
                 snapshot.totalBytes) * 100
              );


            document.getElementById("progress")
              .style.width = percent + "%";


            document.getElementById("progressText")
              .textContent =
              "Uploading photo... " +
              percent +
              "%";

          },

          (error) => {

            reject(error);

          },

          async () => {

            photoURL =
              await uploadTask.snapshot
                .ref.getDownloadURL();

            resolve();

          }

        );

      });


      document.getElementById("progressText")
        .textContent =
        "Photo uploaded ✓";


      selectedPhoto = null;

    }


    /* ======================================
       SAVE PROFILE TO FIRESTORE
    ====================================== */

    await db
      .collection("profiles")
      .doc(currentUser.uid)
      .set({

        uid: currentUser.uid,

        fullName: fullName,

        phone: phone,

        address: address,

        city: city,

        state: state,

        country: country,

        photoURL: photoURL,

        updatedAt:
          firebase.firestore.FieldValue
            .serverTimestamp()

      }, {

        merge: true

      });


    document.getElementById("displayName")
      .textContent = fullName;


    document.getElementById("profilePhoto")
      .src = photoURL;


    showMessage(
      "Profile updated successfully ✓",
      "success"
    );


    setTimeout(() => {

      document.getElementById("progressBox")
        .style.display = "none";

    }, 1500);


  } catch(error) {

    console.error(error);

    showMessage(
      "Could not save profile: " +
      error.message,
      "error"
    );

  }


  saveBtn.disabled = false;

  saveBtn.textContent =
    "Save Changes";

}


/* ==========================================
   LOGOUT
========================================== */

document
  .getElementById("logoutBtn")
  .addEventListener("click", async () => {

    try {

      await auth.signOut();

      window.location.href =
        "login.html";

    } catch(error) {

      showMessage(
        "Logout failed.",
        "error"
      );

    }

  });


/* ==========================================
   MESSAGE
========================================== */

function showMessage(text,type){

  const message =
    document.getElementById("message");


  message.textContent = text;


  if(type === "success"){

    message.style.color =
      "#4ade80";

  } else {

    message.style.color =
      "#f87171";

  }

}

</script>

</body>
</html>

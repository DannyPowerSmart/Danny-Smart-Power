<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>My Profile | Danny Smart Power</title>


<style>

/* =========================
   RESET
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


:root{

  --bg:#07111f;
  --dark:#020617;

  --panel:#0d1b2a;
  --panel2:#102234;

  --border:#203247;

  --text:#f8fafc;
  --muted:#94a3b8;

  --blue:#38bdf8;
  --green:#4ade80;
  --red:#f87171;

}


/* =========================
   BODY
========================= */

body{

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:var(--bg);

  color:var(--text);

  min-height:100vh;

}


button,
input,
textarea,
select{

  font:inherit;

}


button{

  cursor:pointer;

}


.hidden{

  display:none!important;

}


/* =========================
   HEADER
========================= */

.header{

  height:70px;

  background:var(--dark);

  border-bottom:
    1px solid var(--border);

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 20px;

  position:sticky;

  top:0;

  z-index:100;

}


.brand{

  font-size:20px;

  font-weight:bold;

}


.brand span{

  color:var(--blue);

}


/* =========================
   HEADER RIGHT
========================= */

.header-right{

  display:flex;

  align-items:center;

  gap:10px;

}


/* =========================
   NOTIFICATION BUTTON
========================= */

.notification-wrapper{

  position:relative;

}


.notification-btn{

  width:42px;
  height:42px;

  border-radius:10px;

  border:
    1px solid var(--border);

  background:var(--panel);

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:20px;

  position:relative;

}


.notification-btn:hover{

  border-color:var(--blue);

  color:var(--blue);

}


.notification-badge{

  position:absolute;

  top:-5px;

  right:-5px;

  min-width:19px;

  height:19px;

  padding:0 5px;

  border-radius:20px;

  background:#ef4444;

  color:white;

  font-size:10px;

  font-weight:bold;

  display:flex;

  align-items:center;

  justify-content:center;

  border:2px solid var(--dark);

}


/* =========================
   NOTIFICATION PANEL
========================= */

.notification-panel{

  position:absolute;

  right:0;

  top:52px;

  width:350px;

  max-width:
    calc(100vw - 24px);

  background:var(--panel);

  border:
    1px solid var(--border);

  border-radius:16px;

  box-shadow:
    0 20px 50px
    rgba(0,0,0,.45);

  overflow:hidden;

  display:none;

}


.notification-panel.show{

  display:block;

}


.notification-header{

  padding:15px;

  border-bottom:
    1px solid var(--border);

  display:flex;

  align-items:center;

  justify-content:space-between;

}


.notification-title{

  font-size:16px;

  font-weight:bold;

}


.mark-all-btn{

  border:0;

  background:transparent;

  color:var(--blue);

  font-size:12px;

}


.mark-all-btn:hover{

  text-decoration:underline;

}


/* =========================
   NOTIFICATION LIST
========================= */

.notification-list{

  max-height:420px;

  overflow-y:auto;

}


.notification-item{

  padding:14px;

  border-bottom:
    1px solid
    rgba(32,50,71,.7);

  display:flex;

  gap:12px;

  cursor:pointer;

  transition:.2s;

}


.notification-item:hover{

  background:var(--panel2);

}


.notification-item.unread{

  background:
    rgba(56,189,248,.06);

}


.notification-icon{

  width:38px;

  height:38px;

  min-width:38px;

  border-radius:10px;

  background:
    rgba(56,189,248,.12);

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:18px;

}


.notification-content{

  flex:1;

  min-width:0;

}


.notification-item-title{

  font-size:14px;

  font-weight:bold;

  margin-bottom:4px;

}


.notification-message{

  color:var(--muted);

  font-size:12px;

  line-height:1.45;

}


.notification-time{

  color:#64748b;

  font-size:10px;

  margin-top:6px;

}


.unread-dot{

  width:8px;

  height:8px;

  min-width:8px;

  border-radius:50%;

  background:var(--blue);

  margin-top:6px;

}


.no-notifications{

  padding:35px 20px;

  text-align:center;

  color:var(--muted);

}


.no-notifications-icon{

  font-size:35px;

  margin-bottom:10px;

}


.no-notifications-title{

  color:white;

  font-size:15px;

  margin-bottom:5px;

}


/* =========================
   BACK BUTTON
========================= */

.back-btn{

  border:
    1px solid var(--border);

  background:var(--panel);

  color:white;

  padding:9px 13px;

  border-radius:9px;

}


.back-btn:hover{

  border-color:var(--blue);

  color:var(--blue);

}


/* =========================
   MAIN
========================= */

.main{

  width:100%;

  max-width:850px;

  margin:auto;

  padding:30px 16px 50px;

}


/* =========================
   PROFILE HERO
========================= */

.profile-hero{

  background:

    linear-gradient(
      135deg,
      rgba(56,189,248,.12),
      rgba(13,27,42,.95)
    );

  border:
    1px solid var(--border);

  border-radius:22px;

  padding:30px 20px;

  text-align:center;

  margin-bottom:20px;

}


.avatar-wrapper{

  width:120px;
  height:120px;

  margin:0 auto 15px;

  position:relative;

}


.avatar{

  width:120px;
  height:120px;

  border-radius:50%;

  object-fit:cover;

  background:var(--panel2);

  border:
    3px solid var(--blue);

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:45px;

  color:var(--blue);

}


.photo-button{

  position:absolute;

  right:0;

  bottom:2px;

  width:38px;
  height:38px;

  border-radius:50%;

  border:
    3px solid var(--panel);

  background:var(--blue);

  color:#00111c;

  font-size:18px;

  display:flex;

  align-items:center;

  justify-content:center;

}


.photo-button:hover{

  transform:scale(1.05);

}


.profile-hero h1{

  font-size:25px;

  margin-top:5px;

}


.profile-hero p{

  color:var(--muted);

  font-size:14px;

  margin-top:6px;

}


/* =========================
   PANELS
========================= */

.panel{

  background:var(--panel);

  border:
    1px solid var(--border);

  border-radius:18px;

  padding:20px;

  margin-bottom:18px;

}


.panel-title{

  font-size:18px;

  margin-bottom:5px;

}


.panel-subtitle{

  color:var(--muted);

  font-size:13px;

  margin-bottom:20px;

}


/* =========================
   FORM
========================= */

.form-grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:15px;

}


.full{

  grid-column:
    1/-1;

}


label{

  display:block;

  color:#cbd5e1;

  font-size:13px;

  margin-bottom:7px;

}


input,
textarea,
select{

  width:100%;

  background:var(--panel2);

  color:white;

  border:
    1px solid var(--border);

  border-radius:10px;

  padding:13px;

  outline:none;

}


input:focus,
textarea:focus,
select:focus{

  border-color:var(--blue);

}


input:disabled{

  opacity:.65;

  cursor:not-allowed;

}


textarea{

  min-height:100px;

  resize:vertical;

}


/* =========================
   BUTTONS
========================= */

.save-btn{

  width:100%;

  margin-top:20px;

  border:0;

  background:var(--blue);

  color:#00111c;

  font-weight:bold;

  padding:14px;

  border-radius:10px;

}


.save-btn:hover{

  filter:brightness(1.05);

}


.save-btn:disabled{

  opacity:.6;

  cursor:not-allowed;

}


.secondary-btn{

  width:100%;

  border:
    1px solid var(--border);

  background:var(--panel2);

  color:white;

  padding:13px;

  border-radius:10px;

  margin-top:10px;

}


.secondary-btn:hover{

  border-color:var(--blue);

}


.danger-btn{

  width:100%;

  border:
    1px solid
    rgba(248,113,113,.4);

  background:transparent;

  color:var(--red);

  padding:13px;

  border-radius:10px;

  margin-top:10px;

}


/* =========================
   MESSAGE
========================= */

.message{

  text-align:center;

  font-size:13px;

  margin-top:14px;

  line-height:1.5;

}


.success{

  color:var(--green);

}


.error{

  color:var(--red);

}


/* =========================
   LOADING
========================= */

.loading-screen{

  position:fixed;

  inset:0;

  background:var(--bg);

  display:flex;

  align-items:center;

  justify-content:center;

  z-index:200;

}


.loading-box{

  text-align:center;

}


.spinner{

  width:42px;
  height:42px;

  border:
    4px solid var(--border);

  border-top-color:var(--blue);

  border-radius:50%;

  animation:
    spin .8s linear infinite;

  margin:auto auto 15px;

}


@keyframes spin{

  to{

    transform:rotate(360deg);

  }

}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  .header{

    padding:0 12px;

  }


  .brand{

    font-size:17px;

  }


  .header-right{

    gap:6px;

  }


  .back-btn{

    padding:8px 9px;

  }


  .notification-btn{

    width:40px;
    height:40px;

  }


  .main{

    padding:
      20px 12px 40px;

  }


  .profile-hero{

    padding:25px 15px;

  }


  .form-grid{

    grid-template-columns:1fr;

  }


  .full{

    grid-column:auto;

  }


  .notification-panel{

    right:-5px;

    width:340px;

  }

}


@media(max-width:380px){

  .notification-panel{

    width:
      calc(100vw - 20px);

    right:-5px;

  }

}

</style>

</head>


<body>


<!-- =========================
     LOADING
========================= -->

<div
  id="loadingScreen"
  class="loading-screen"
>

  <div class="loading-box">

    <div class="spinner"></div>

    <div>
      Loading profile...
    </div>

  </div>

</div>



<!-- =========================
     HEADER
========================= -->

<header class="header">


  <div class="brand">

    ⚡ <span>DSP</span> Profile

  </div>


  <div class="header-right">


    <!-- NOTIFICATION -->

    <div class="notification-wrapper">


      <button
        id="notificationBtn"
        class="notification-btn"
        onclick="toggleNotifications()"
        aria-label="Notifications"
      >

        🔔

        <span
          id="notificationBadge"
          class="notification-badge hidden"
        >
          0
        </span>

      </button>


      <!-- NOTIFICATION PANEL -->

      <div
        id="notificationPanel"
        class="notification-panel"
      >


        <div class="notification-header">

          <div class="notification-title">
            Notifications
          </div>


          <button
            class="mark-all-btn"
            onclick="markAllNotificationsRead()"
          >
            Mark all as read
          </button>

        </div>


        <div
          id="notificationList"
          class="notification-list"
        >

          <div class="no-notifications">

            <div class="no-notifications-icon">
              🔔
            </div>

            <div class="no-notifications-title">
              No notifications
            </div>

            <div>
              You're all caught up.
            </div>

          </div>

        </div>


      </div>

    </div>


    <!-- BACK -->

    <button
      class="back-btn"
      onclick="goBack()"
    >
      ← Back
    </button>


  </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="main">


  <!-- =========================
       PROFILE HERO
  ========================= -->

  <section class="profile-hero">


    <div class="avatar-wrapper">


      <img
        id="profilePhoto"
        class="avatar"
        alt="Profile photo"
        style="display:none"
      >


      <div
        id="defaultAvatar"
        class="avatar"
      >
        👤
      </div>


      <button
        class="photo-button"
        onclick="choosePhoto()"
        title="Change photo"
      >
        📷
      </button>


      <input
        id="photoInput"
        type="file"
        accept="image/*"
        hidden
        onchange="handlePhoto(event)"
      >


    </div>


    <h1 id="heroName">
      Customer
    </h1>


    <p id="heroEmail">
      Loading...
    </p>


  </section>



  <!-- =========================
       PERSONAL INFORMATION
  ========================= -->

  <section class="panel">


    <h2 class="panel-title">
      Personal Information
    </h2>


    <p class="panel-subtitle">
      Keep your customer information up to date.
    </p>


    <div class="form-grid">


      <!-- FULL NAME -->

      <div>

        <label for="fullName">
          Full Name
        </label>


        <input
          id="fullName"
          type="text"
          placeholder="Your full name"
          autocomplete="name"
        >

      </div>



      <!-- EMAIL -->

      <div>

        <label for="email">
          Email Address
        </label>


        <input
          id="email"
          type="email"
          disabled
        >

      </div>



      <!-- PHONE -->

      <div>

        <label for="phone">
          Phone Number
        </label>


        <input
          id="phone"
          type="tel"
          placeholder="08012345678"
          autocomplete="tel"
        >

      </div>



      <!-- COUNTRY -->

      <div>

        <label for="country">
          Country
        </label>


        <input
          id="country"
          type="text"
          placeholder="Nigeria"
          autocomplete="country-name"
        >

      </div>



      <!-- STATE -->

      <div>

        <label for="state">
          State
        </label>


        <input
          id="state"
          type="text"
          placeholder="Lagos"
        >

      </div>



      <!-- CITY -->

      <div>

        <label for="city">
          City
        </label>


        <input
          id="city"
          type="text"
          placeholder="Ikeja"
        >

      </div>



      <!-- ADDRESS -->

      <div class="full">

        <label for="address">
          Address
        </label>


        <textarea
          id="address"
          placeholder="Enter your delivery address"
        ></textarea>

      </div>


    </div>



    <button
      id="saveBtn"
      class="save-btn"
      onclick="saveProfile()"
    >
      Save Profile
    </button>


    <p
      id="message"
      class="message"
    ></p>


  </section>



  <!-- =========================
       ACCOUNT
  ========================= -->

  <section class="panel">


    <h2 class="panel-title">
      Account
    </h2>


    <p class="panel-subtitle">
      Manage your account.
    </p>


    <button
      class="secondary-btn"
      onclick="changePassword()"
    >
      🔐 Change Password
    </button>


    <button
      class="danger-btn"
      onclick="signOut()"
    >
      Sign Out
    </button>


  </section>


</main>



<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>



<script>

/* ==========================================
   FIREBASE
========================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGb44",

  authDomain:
    "danny-smart-power.firebaseapp.com",

  databaseURL:
    "https://danny-smart-power-default-rtdb.firebaseio.com",

  projectId:
    "danny-smart-power",

  storageBucket:
    "danny-smart-power.firebasestorage.app",

  messagingSenderId:
    "649735645158",

  appId:
    "1:649735645158:web:cff518b89721a163679827",

  measurementId:
    "G-258YKLP5ZS"

};


firebase.initializeApp(
  firebaseConfig
);


const auth =
  firebase.auth();


const db =
  firebase.firestore();



/* ==========================================
   GLOBAL VARIABLES
========================================== */

let currentUser = null;

let currentPhotoURL = "";

let notificationUnsubscribe = null;



/* ==========================================
   AUTH STATE
========================================== */

auth.onAuthStateChanged(
  async user => {


    if(!user){

      window.location.href =
        "login.html";

      return;

    }


    currentUser =
      user;


    document
      .getElementById("email")
      .value =
      user.email || "";


    document
      .getElementById("heroEmail")
      .textContent =
      user.email || "";


    await loadProfile();


    /*
      Start real-time
      notification listener.
    */

    startNotificationListener();


    document
      .getElementById("loadingScreen")
      .classList
      .add("hidden");


  }
);



/* ==========================================
   LOAD PROFILE
========================================== */

async function loadProfile(){

  if(!currentUser)
    return;


  try{


    const profileRef =
      db
        .collection("profiles")
        .doc(currentUser.uid);


    const snapshot =
      await profileRef.get();


    if(!snapshot.exists){


      const authName =
        currentUser.displayName || "";


      document
        .getElementById("fullName")
        .value =
        authName;


      document
        .getElementById("heroName")
        .textContent =
        authName ||
        "Customer";


      return;

    }


    const data =
      snapshot.data();


    document
      .getElementById("fullName")
      .value =
      data.fullName || "";


    document
      .getElementById("phone")
      .value =
      data.phone || "";


    document
      .getElementById("address")
      .value =
      data.address || "";


    document
      .getElementById("city")
      .value =
      data.city || "";


    document
      .getElementById("state")
      .value =
      data.state || "";


    document
      .getElementById("country")
      .value =
      data.country || "";


    document
      .getElementById("heroName")
      .textContent =
      data.fullName ||
      currentUser.displayName ||
      "Customer";


    if(data.photoURL){

      showPhoto(
        data.photoURL
      );

    }


  }catch(error){


    console.error(
      "Profile loading error:",
      error
    );


    showMessage(
      friendlyError(error),
      "error"
    );


  }

}



/* ==========================================
   SAVE PROFILE
========================================== */

async function saveProfile(){

  if(!currentUser){

    showMessage(
      "You must be logged in.",
      "error"
    );

    return;

  }


  const fullName =
    document
      .getElementById("fullName")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const address =
    document
      .getElementById("address")
      .value
      .trim();


  const city =
    document
      .getElementById("city")
      .value
      .trim();


  const state =
    document
      .getElementById("state")
      .value
      .trim();


  const country =
    document
      .getElementById("country")
      .value
      .trim();


  const saveBtn =
    document
      .getElementById("saveBtn");


  if(!fullName){

    showMessage(
      "Please enter your full name.",
      "error"
    );

    return;

  }


  saveBtn.disabled =
    true;


  saveBtn.textContent =
    "Saving...";


  try{


    const profileData = {

      uid:
        currentUser.uid,

      fullName:
        fullName,

      email:
        currentUser.email || "",

      phone:
        phone,

      address:
        address,

      city:
        city,

      state:
        state,

      country:
        country,

      photoURL:
        currentPhotoURL || "",

      updatedAt:
        firebase.firestore
          .FieldValue
          .serverTimestamp()

    };


    await db
      .collection("profiles")
      .doc(currentUser.uid)
      .set(
        profileData,
        {
          merge:true
        }
      );


    await db
      .collection("users")
      .doc(currentUser.uid)
      .set({

        uid:
          currentUser.uid,

        name:
          fullName,

        email:
          currentUser.email || "",

        role:
          "customer",

        active:
          true,

        updatedAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      },{
        merge:true
      });


    document
      .getElementById("heroName")
      .textContent =
      fullName;


    showMessage(
      "Profile saved successfully. Your profile is now connected to the Admin.",
      "success"
    );


  }catch(error){


    console.error(
      "Save profile error:",
      error
    );


    showMessage(
      friendlyError(error),
      "error"
    );


  }finally{


    saveBtn.disabled =
      false;


    saveBtn.textContent =
      "Save Profile";


  }

}



/* ==========================================
   PHOTO
========================================== */

function choosePhoto(){

  document
    .getElementById("photoInput")
    .click();

}



function handlePhoto(event){

  const file =
    event.target.files[0];


  if(!file)
    return;


  if(
    file.size >
    2 * 1024 * 1024
  ){

    showMessage(
      "Please choose a photo smaller than 2MB.",
      "error"
    );


    event.target.value =
      "";


    return;

  }


  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    showMessage(
      "Please choose an image file.",
      "error"
    );


    event.target.value =
      "";


    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(e){


      currentPhotoURL =
        e.target.result;


      showPhoto(
        currentPhotoURL
      );


      showMessage(
        "Photo selected. Press Save Profile to save it.",
        "success"
      );


    };


  reader.onerror =
    function(){


      showMessage(
        "Could not read the photo.",
        "error"
      );


    };


  reader.readAsDataURL(
    file
  );

}



/* ==========================================
   SHOW PHOTO
========================================== */

function showPhoto(url){

  if(!url)
    return;


  const image =
    document
      .getElementById(
        "profilePhoto"
      );


  const defaultAvatar =
    document
      .getElementById(
        "defaultAvatar"
      );


  image.src =
    url;


  image.style.display =
    "flex";


  defaultAvatar.style.display =
    "none";


  currentPhotoURL =
    url;

}



/* ==========================================
   NOTIFICATION SYSTEM
========================================== */


/*
  Start real-time listener.

  Only notifications where:

  userId == currentUser.uid

  are shown to the customer.
*/

function startNotificationListener(){

  if(!currentUser)
    return;


  /*
    Remove previous listener
    if one exists.
  */

  if(notificationUnsubscribe){

    notificationUnsubscribe();

    notificationUnsubscribe =
      null;

  }


  notificationUnsubscribe =
    db
      .collection("notifications")
      .where(
        "userId",
        "==",
        currentUser.uid
      )
      .orderBy(
        "createdAt",
        "desc"
      )
      .limit(50)
      .onSnapshot(
        snapshot => {


          const notifications =
            [];


          snapshot.forEach(
            doc => {

              notifications.push({

                id:
                  doc.id,

                ...doc.data()

              });

            }
          );


          renderNotifications(
            notifications
          );


        },

        error => {


          console.error(
            "Notification listener error:",
            error
          );


          /*
            If the composite index
            is not created yet, Firestore
            may show an error.

            Notifications can still
            be implemented after creating
            the required index.
          */

        }
      );

}



/* ==========================================
   RENDER NOTIFICATIONS
========================================== */

function renderNotifications(
  notifications
){

  const list =
    document
      .getElementById(
        "notificationList"
      );


  const badge =
    document
      .getElementById(
        "notificationBadge"
      );


  /*
    Count unread notifications.
  */

  const unread =
    notifications.filter(
      notification =>
        notification.read !== true
    ).length;


  /*
    Update badge.
  */

  if(unread > 0){

    badge.textContent =
      unread > 99
        ? "99+"
        : unread;


    badge.classList.remove(
      "hidden"
    );

  }else{

    badge.classList.add(
      "hidden"
    );

  }


  /*
    Empty state.
  */

  if(notifications.length === 0){

    list.innerHTML = `

      <div class="no-notifications">

        <div class="no-notifications-icon">
          🔔
        </div>

        <div class="no-notifications-title">
          No notifications
        </div>

        <div>
          You're all caught up.
        </div>

      </div>

    `;

    return;

  }


  /*
    Build notification list.
  */

  list.innerHTML =
    notifications
      .map(
        notification => {

          const isUnread =
            notification.read !== true;


          return `

            <div
              class="
                notification-item
                ${isUnread ? "unread" : ""}
              "
              onclick="
                markNotificationRead(
                  '${notification.id}'
                )
              "
            >

              <div class="notification-icon">

                ${getNotificationIcon(
                  notification.type
                )}

              </div>


              <div class="notification-content">

                <div
                  class="notification-item-title"
                >
                  ${escapeHTML(
                    notification.title ||
                    "Notification"
                  )}
                </div>


                <div
                  class="notification-message"
                >
                  ${escapeHTML(
                    notification.message ||
                    ""
                  )}
                </div>


                <div
                  class="notification-time"
                >
                  ${formatNotificationTime(
                    notification.createdAt
                  )}
                </div>

              </div>


              ${
                isUnread
                ?
                `
                  <div
                    class="unread-dot"
                  ></div>
                `
                :
                ""
              }

            </div>

          `;

        }
      )
      .join("");

}



/* ==========================================
   NOTIFICATION ICON
========================================== */

function getNotificationIcon(type){

  switch(type){

    case "order":
      return "📦";

    case "payment":
      return "💳";

    case "delivery":
      return "🚚";

    case "success":
      return "✅";

    case "warning":
      return "⚠️";

    case "message":
      return "💬";

    case "promotion":
      return "🎁";

    default:
      return "🔔";

  }

}



/* ==========================================
   FORMAT TIME
========================================== */

function formatNotificationTime(
  timestamp
){

  if(!timestamp)
    return "Just now";


  let date;


  if(
    timestamp.toDate
  ){

    date =
      timestamp.toDate();

  }else{

    date =
      new Date(timestamp);

  }


  if(
    isNaN(
      date.getTime()
    )
  ){

    return "Just now";

  }


  const now =
    new Date();


  const difference =
    now.getTime()
    -
    date.getTime();


  const seconds =
    Math.floor(
      difference / 1000
    );


  if(seconds < 60){

    return "Just now";

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes < 60){

    return (
      minutes +
      (minutes === 1
        ? " minute ago"
        : " minutes ago")
    );

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){

    return (
      hours +
      (hours === 1
        ? " hour ago"
        : " hours ago")
    );

  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){

    return (
      days +
      (days === 1
        ? " day ago"
        : " days ago")
    );

  }


  return date.toLocaleDateString();

}



/* ==========================================
   MARK ONE NOTIFICATION READ
========================================== */

async function markNotificationRead(
  notificationId
){

  if(!currentUser)
    return;


  try{


    await db
      .collection("notifications")
      .doc(notificationId)
      .update({

        read:true,

        readAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      });


  }catch(error){

    console.error(
      "Could not mark notification read:",
      error
    );

  }

}



/* ==========================================
   MARK ALL NOTIFICATIONS READ
========================================== */

async function markAllNotificationsRead(){

  if(!currentUser)
    return;


  try{


    const snapshot =
      await db
        .collection("notifications")
        .where(
          "userId",
          "==",
          currentUser.uid
        )
        .where(
          "read",
          "==",
          false
        )
        .get();


    if(snapshot.empty){

      return;

    }


    const batch =
      db.batch();


    snapshot.forEach(
      doc => {

        batch.update(
          doc.ref,
          {

            read:true,

            readAt:
              firebase.firestore
                .FieldValue
                .serverTimestamp()

          }
        );

      }
    );


    await batch.commit();


  }catch(error){

    console.error(
      "Could not mark all notifications read:",
      error
    );


    showMessage(
      friendlyError(error),
      "error"
    );

  }

}



/* ==========================================
   TOGGLE NOTIFICATIONS
========================================== */

function toggleNotifications(){

  const panel =
    document
      .getElementById(
        "notificationPanel"
      );


  panel.classList.toggle(
    "show"
  );

}



/* ==========================================
   CLOSE NOTIFICATIONS
   WHEN CLICKING OUTSIDE
========================================== */

document.addEventListener(
  "click",
  function(event){

    const wrapper =
      document.querySelector(
        ".notification-wrapper"
      );


    const panel =
      document
        .getElementById(
          "notificationPanel"
        );


    if(
      wrapper &&
      !wrapper.contains(
        event.target
      )
    ){

      panel.classList.remove(
        "show"
      );

    }

  }
);



/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value){

  if(value === null ||
     value === undefined){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* ==========================================
   CHANGE PASSWORD
========================================== */

async function changePassword(){

  if(!currentUser)
    return;


  const email =
    currentUser.email;


  if(!email){

    showMessage(
      "Your account does not have an email address.",
      "error"
    );

    return;

  }


  try{


    await auth
      .sendPasswordResetEmail(
        email
      );


    showMessage(
      "Password reset email sent to " +
      email,
      "success"
    );


  }catch(error){


    console.error(error);


    showMessage(
      friendlyError(error),
      "error"
    );


  }

}



/* ==========================================
   SIGN OUT
========================================== */

async function signOut(){

  try{


    if(notificationUnsubscribe){

      notificationUnsubscribe();

      notificationUnsubscribe =
        null;

    }


    await auth.signOut();


    window.location.href =
      "login.html";


  }catch(error){


    console.error(error);


    showMessage(
      friendlyError(error),
      "error"
    );


  }

}



/* ==========================================
   BACK
========================================== */

function goBack(){

  if(
    document.referrer &&
    document.referrer.includes(
      window.location.hostname
    )
  ){

    history.back();

  }else{

    window.location.href =
      "index.html";

  }

}



/* ==========================================
   MESSAGE
========================================== */

function showMessage(
  text,
  type
){

  const message =
    document
      .getElementById(
        "message"
      );


  message.textContent =
    text;


  message.className =
    "message " +
    type;


  clearTimeout(
    showMessage.timer
  );


  showMessage.timer =
    setTimeout(
      () => {

        message.textContent =
          "";

        message.className =
          "message";

      },
      5000
    );

}



/* ==========================================
   ERROR HANDLER
========================================== */

function friendlyError(
  error
){

  if(!error){

    return "Something went wrong.";

  }


  if(
    error.code ===
    "permission-denied"
  ){

    return "Permission denied. Check your Firestore Rules.";

  }


  if(
    error.code ===
    "auth/requires-recent-login"
  ){

    return "Please sign in again and try again.";

  }


  if(
    error.code ===
    "auth/too-many-requests"
  ){

    return "Too many attempts. Try again later.";

  }


  return error.message ||
    "Something went wrong.";

}

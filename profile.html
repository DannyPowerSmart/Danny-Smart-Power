<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | Danny Smart Power</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#07111f;
  --dark:#020617;
  --panel:#0d1b2a;
  --panel2:#102234;
  --border:#203247;
  --text:#f8fafc;
  --muted:#94a3b8;
  --blue:#38bdf8;
  --green:#4ade80;
  --red:#f87171;
  --yellow:#facc15;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}


/* =========================
   HEADER
========================= */

.header{
  height:70px;
  background:var(--dark);
  border-bottom:1px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  position:sticky;
  top:0;
  z-index:50;
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand{
  font-size:20px;
  font-weight:bold;
}

.brand span{
  color:var(--blue);
}


/* =========================
   HEADER RIGHT
========================= */

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}


/* =========================
   NOTIFICATION BUTTON
========================= */

.notification-wrapper{
  position:relative;
}

.notification-btn{
  width:42px;
  height:42px;

  border:1px solid var(--border);
  background:var(--panel);

  color:white;

  border-radius:10px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
}

.notification-btn:hover{
  border-color:var(--blue);
  color:var(--blue);
}

.notification-badge{
  position:absolute;

  top:-5px;
  right:-5px;

  min-width:19px;
  height:19px;

  padding:0 5px;

  border-radius:20px;

  background:#ef4444;
  color:white;

  border:2px solid var(--dark);

  font-size:10px;
  font-weight:bold;

  display:flex;
  align-items:center;
  justify-content:center;
}


/* =========================
   NOTIFICATION PANEL
========================= */

.notification-panel{
  position:absolute;

  top:52px;
  right:0;

  width:340px;
  max-width:calc(100vw - 24px);

  background:var(--panel);

  border:1px solid var(--border);

  border-radius:16px;

  box-shadow:0 20px 50px rgba(0,0,0,.45);

  overflow:hidden;

  z-index:100;
}

.notification-header{
  padding:15px;

  border-bottom:1px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.notification-header strong{
  font-size:16px;
}

.mark-read-btn{
  border:0;
  background:none;
  color:var(--blue);
  font-size:12px;
}

.mark-read-btn:hover{
  text-decoration:underline;
}

.notification-list{
  max-height:400px;
  overflow-y:auto;
}

.notification-empty{
  padding:35px 20px;

  text-align:center;

  color:var(--muted);

  font-size:13px;
}

.notification-item{
  padding:14px 15px;

  border-bottom:1px solid var(--border);

  cursor:pointer;

  transition:.2s;
}

.notification-item:hover{
  background:var(--panel2);
}

.notification-item.unread{
  background:rgba(56,189,248,.07);
}

.notification-item:last-child{
  border-bottom:0;
}

.notification-top{
  display:flex;
  gap:10px;
}

.notification-icon{
  width:36px;
  height:36px;

  flex-shrink:0;

  border-radius:10px;

  background:var(--panel2);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:17px;
}

.notification-content{
  flex:1;
}

.notification-title{
  font-size:13px;
  font-weight:bold;

  margin-bottom:4px;
}

.notification-message{
  color:var(--muted);

  font-size:12px;

  line-height:1.5;
}

.notification-time{
  color:#64748b;

  font-size:10px;

  margin-top:6px;
}

.unread-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--blue);

  margin-top:6px;
}


/* =========================
   BACK BUTTON
========================= */

.back-btn{
  border:1px solid var(--border);
  background:var(--panel);
  color:white;

  padding:9px 13px;

  border-radius:9px;
}

.back-btn:hover{
  border-color:var(--blue);
  color:var(--blue);
}


/* =========================
   MAIN
========================= */

.main{
  width:100%;
  max-width:850px;

  margin:auto;

  padding:30px 16px 50px;
}


/* =========================
   PROFILE HERO
========================= */

.profile-hero{
  background:
    linear-gradient(
      135deg,
      rgba(56,189,248,.12),
      rgba(13,27,42,.95)

  padding:30px 20px;

  text-align:center;

  margin-bottom:20px;
}

.avatar-wrapper{

  margin:0 auto 15px;

  position:relative;
}

.avatar{
  width:120px;
  height:120px;

  border-radius:50%;

  background:var(--panel2);

  border:3px solid var(--blue);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:45px;
  color:var(--blue);
}

.photo-button{
  position:absolute;

  right:0;
  bottom:2px;

  width:38px;
  height:38px;

  border-radius:50%;

  border:3px solid var(--panel);

  background:var(--blue);

  font-size:18px;

  display:flex;
  align-items:center;

}

.photo-button:hover{
  transform:scale(1.05);
}

.profile-hero h1{
  font-size:25px;
  margin-top:5px;
}

.profile-hero p{
  color:var(--muted);
  font-size:14px;
  margin-top:6px;
}


/* =========================
   PANELS
========================= */

.panel{
  background:var(--panel);

  border:1px solid var(--border);

  border-radius:18px;

  padding:20px;

  margin-bottom:18px;
}

.panel-title{
  font-size:18px;

  margin-bottom:5px;
}

.panel-subtitle{
  color:var(--muted);

  font-size:13px;

  margin-bottom:20px;
}


/* =========================
   FORM
========================= */

.form-grid{
  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:15px;
}

.full{
  grid-column:1/-1;
}

label{

  color:#cbd5e1;

  font-size:13px;

  margin-bottom:7px;
}

input,
textarea,
select{
  width:100%;

  background:var(--panel2);

  color:white;

  border:1px solid var(--border);

  border-radius:10px;

  padding:13px;

  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--blue);
}

input:disabled{
  opacity:.65;
  cursor:not-allowed;
}

textarea{
  min-height:100px;
  resize:vertical;
}


/* =========================
   BUTTONS
========================= */

.save-btn{
  width:100%;

  margin-top:20px;

  border:0;

  background:var(--blue);

  color:#00111c;

  font-weight:bold;

  padding:14px;

  border-radius:10px;
}

.save-btn:hover{
  filter:brightness(1.05);
}

.save-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.secondary-btn{
  width:100%;

  border:1px solid var(--border);

  background:var(--panel2);

  color:white;

  padding:13px;

  border-radius:10px;

  margin-top:10px;
}

.secondary-btn:hover{
  border-color:var(--blue);
}

.danger-btn{
  width:100%;

  border:1px solid rgba(248,113,113,.4);

  background:transparent;

  color:var(--red);

  padding:13px;

  border-radius:10px;

  margin-top:10px;
}


/* =========================
   MESSAGE
========================= */

.message{
  text-align:center;

  font-size:13px;

  margin-top:14px;

  line-height:1.5;
}

.success{
  color:var(--green);
}

.error{
  color:var(--red);
}


/* =========================
   LOADING
========================= */

.loading-screen{
  position:fixed;

  inset:0;

  background:var(--bg);

  display:flex;

  align-items:center;
  justify-content:center;

  z-index:1000;
}

.loading-box{
  text-align:center;
}

.spinner{
  width:42px;
  height:42px;

  border:4px solid var(--border);

  border-top-color:var(--blue);

  border-radius:50%;

  animation:spin .8s linear infinite;

  margin:auto auto 15px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  .header{

  }

  }

  }

  }

  .main{
    padding:20px 12px 40px;
  }

  .profile-hero{
    padding:25px 15px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

}
</style>
</head>

<script>

/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyB48Z_i8k3gV3uHmNUFQjAH9bOvUlAGb44",

  authDomain:
    "danny-smart-power.firebaseapp.com",

  databaseURL:
    "https://danny-smart-power-default-rtdb.firebaseio.com",

  projectId:
    "danny-smart-power",

  storageBucket:
    "danny-smart-power.firebasestorage.app",

  messagingSenderId:
    "649735645158",

  appId:
    "1:649735645158:web:cff518b89721a163679827",

  measurementId:
    "G-258YKLP5ZS"

};


firebase.initializeApp(firebaseConfig);


const auth =
  firebase.auth();


const db =
  firebase.firestore();


/* ==========================================
   GLOBAL VARIABLES
========================================== */

let currentUser = null;

let currentPhotoURL = "";

let notificationUnsubscribe = null;


/* ==========================================
   AUTH STATE
========================================== */

auth.onAuthStateChanged(async user => {

  if(!user){

    window.location.href =
      "login.html";

    return;
  }


  currentUser = user;


  document.getElementById("email").value =
    user.email || "";


  document.getElementById("heroEmail").textContent =
    user.email || "";


  /*
    Load profile.
  */

  await loadProfile();


  /*
    Start real-time notifications.

    This means when Admin creates
    a notification for this customer,
    it can appear automatically.
  */

  startNotifications();


  document
    .getElementById("loadingScreen")
    .classList
    .add("hidden");

});


/* ==========================================
   LOAD PROFILE
========================================== */

async function loadProfile(){

  if(!currentUser)
    return;


  try{

    const profileRef =
      db
        .collection("profiles")
        .doc(currentUser.uid);


    const snapshot =
      await profileRef.get();


    if(!snapshot.exists){

      const authName =
        currentUser.displayName || "";


      document.getElementById("fullName").value =
        authName;


      document.getElementById("heroName").textContent =
        authName || "Customer";


      return;
    }


    const data =
      snapshot.data();


    document.getElementById("fullName").value =
      data.fullName || "";


    document.getElementById("phone").value =
      data.phone || "";


    document.getElementById("address").value =
      data.address || "";


    document.getElementById("city").value =
      data.city || "";


    document.getElementById("state").value =
      data.state || "";


    document.getElementById("country").value =
      data.country || "";


    document.getElementById("heroName").textContent =
      data.fullName ||
      currentUser.displayName ||
      "Customer";


    if(data.photoURL){

      showPhoto(
        data.photoURL
      );

    }


  }catch(error){

    console.error(
      "Profile loading error:",
      error
    );


    showMessage(
      friendlyError(error),
      "error"
    );

  }

}


/* ==========================================
   SAVE PROFILE
========================================== */

async function saveProfile(){

  if(!currentUser){

    showMessage(
      "You must be logged in.",
      "error"
    );

    return;
  }


  const fullName =
    document
      .getElementById("fullName")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const address =
    document
      .getElementById("address")
      .value
      .trim();


  const city =
    document
      .getElementById("city")
      .value
      .trim();


  const state =
    document
      .getElementById("state")
      .value
      .trim();


  const country =
    document
      .getElementById("country")
      .value
      .trim();


  const saveBtn =
    document.getElementById("saveBtn");


  if(!fullName){

    showMessage(
      "Please enter your full name.",
      "error"
    );

    return;
  }


  saveBtn.disabled = true;

  saveBtn.textContent =
    "Saving...";


  try{

    const profileData = {

      uid:
        currentUser.uid,

      fullName:
        fullName,

      email:
        currentUser.email || "",

      phone:
        phone,

      address:
        address,

      city:
        city,

      state:
        state,

      country:
        country,

      photoURL:
        currentPhotoURL || "",

      updatedAt:
        firebase.firestore.FieldValue
          .serverTimestamp()

    };


    /*
      Save profile.
    */

    await db
      .collection("profiles")
      .doc(currentUser.uid)
      .set(
        profileData,
        {
          merge:true
        }
      );


    /*
      Update customer document.
    */

    await db
      .collection("users")
      .doc(currentUser.uid)
      .set({

        uid:
          currentUser.uid,

        name:
          fullName,

        email:
          currentUser.email || "",

        role:
          "customer",

        active:
          true,

        updatedAt:
          firebase.firestore.FieldValue
            .serverTimestamp()

      },{
        merge:true
      });


    document.getElementById("heroName").textContent =
      fullName;


    showMessage(
      "Profile saved successfully. Your profile is connected to Admin.",
      "success"
    );


  }catch(error){

    console.error(
      "Save profile error:",
      error
    );


    showMessage(
      friendlyError(error),
      "error"
    );


  }finally{

    saveBtn.disabled = false;

    saveBtn.textContent =
      "Save Profile";

  }

}


/* ==========================================
   PHOTO SYSTEM
========================================== */

function choosePhoto(){

  document
    .getElementById("photoInput")
    .click();

}


function handlePhoto(event){

  const file =
    event.target.files[0];


  if(!file)
    return;


  if(file.size > 2 * 1024 * 1024){

    showMessage(
      "Please choose a photo smaller than 2MB.",
      "error"
    );

    event.target.value = "";

    return;
  }


  if(!file.type.startsWith("image/")){

    showMessage(
      "Please choose an image file.",
      "error"
    );

    event.target.value = "";

    return;
  }


  const reader =
    new FileReader();


  reader.onload = function(e){

    currentPhotoURL =
      e.target.result;


    showPhoto(
      currentPhotoURL
    );


    showMessage(
      "Photo selected. Press Save Profile to save it.",
      "success"
    );

  };


  reader.onerror = function(){

    showMessage(
      "Could not read the photo.",
      "error"
    );

  };


  reader.readAsDataURL(file);

}


/* ==========================================
   SHOW PHOTO
========================================== */

function showPhoto(url){

  if(!url)
    return;


  const image =
    document.getElementById(
      "profilePhoto"
    );


  const defaultAvatar =
    document.getElementById(
      "defaultAvatar"
    );


  image.src = url;

  image.style.display =
    "flex";


  defaultAvatar.style.display =
    "none";


  currentPhotoURL =
    url;

}


/* ==========================================
   NOTIFICATION SYSTEM
========================================== */

/*
  IMPORTANT FIRESTORE STRUCTURE

  notifications
    └── notification document

        customerId
        title
        message
        type
        orderId
        read
        createdAt


  Example:

  notifications
      abc123

        customerId: "USER_FIREBASE_UID"

        title: "Order Confirmed"

        message: "Your order has been confirmed."

        type: "order"

        orderId: "ORDER_ID"

        read: false

        createdAt: Timestamp
*/


function startNotifications(){

  if(!currentUser)
    return;


  /*
    Remove previous listener if one exists.
  */

  if(notificationUnsubscribe){

    notificationUnsubscribe();

    notificationUnsubscribe = null;

  }


  /*
    Listen only to notifications
    belonging to the current customer.

    We order them newest first.
  */

  notificationUnsubscribe =
    db
      .collection("notifications")
      .where(
        "customerId",
        "==",
        currentUser.uid
      )
      .orderBy(
        "createdAt",
        "desc"
      )
      .limit(50)
      .onSnapshot(
        snapshot => {

          const notifications = [];


          snapshot.forEach(doc => {

            notifications.push({

              id:
                doc.id,

              ...doc.data()

            });

          });


          renderNotifications(
            notifications
          );


        },
        error => {

          console.error(
            "Notification listener error:",
            error
          );


          /*
            If the index is not created yet,
            Firebase may show an error.

            Notifications can still be
            added later after creating
            the required Firestore index.
          */

          document.getElementById(
            "notificationList"
          ).innerHTML = `

            <div class="notification-empty">

              Unable to load notifications.

            </div>

          `;

        }
      );

}


/* ==========================================
   RENDER NOTIFICATIONS
========================================== */

function renderNotifications(
  notifications
){

  const list =
    document.getElementById(
      "notificationList"
    );


  const badge =
    document.getElementById(
      "notificationBadge"
    );


  if(!notifications.length){

    list.innerHTML = `

      <div class="notification-empty">

        🔔<br><br>

        No notifications yet.

      </div>

    `;


    badge.classList.add(
      "hidden"
    );

    return;

  }


  /*
    Count unread notifications.
  */

  const unreadCount =
    notifications.filter(
      notification =>
        notification.read !== true
    ).length;


  /*
    Badge.
  */

  if(unreadCount > 0){

    badge.textContent =
      unreadCount > 99
        ? "99+"
        : unreadCount;

    badge.classList.remove(
      "hidden"
    );

  }else{

    badge.classList.add(
      "hidden"
    );

  }


  /*
    Render list.
  */

  list.innerHTML =
    notifications
      .map(
        notification =>
          createNotificationHTML(
            notification
          )
      )
      .join("");

}


/* ==========================================
   NOTIFICATION HTML
========================================== */

function createNotificationHTML(
  notification
){

  const unread =
    notification.read !== true;


  const icon =
    getNotificationIcon(
      notification.type
    );


  const title =
    escapeHTML(
      notification.title ||
      "Notification"
    );


  const message =
    escapeHTML(
      notification.message ||
      ""
    );


  const time =
    formatNotificationTime(
      notification.createdAt
    );


  return `

    <div
      class="notification-item ${unread ? "unread" : ""}"
      onclick="openNotification('${notification.id}')"
    >

      <div class="notification-top">

        <div class="notification-icon">
          ${icon}
        </div>

        <div class="notification-content">

          <div class="notification-title">
            ${title}
          </div>

          <div class="notification-message">
            ${message}
          </div>

          <div class="notification-time">
            ${time}
          </div>

        </div>

        ${
          unread
            ? `<div class="unread-dot"></div>`
            : ""
        }

      </div>

    </div>

  `;

}


/* ==========================================
   NOTIFICATION ICON
========================================== */

function getNotificationIcon(type){

  switch(type){

    case "order":
      return "📦";

    case "payment":
      return "💳";

    case "delivery":
      return "🚚";

    case "message":
      return "💬";

    case "promotion":
      return "🎉";

    case "account":
      return "👤";

    case "success":
      return "✅";

    case "warning":
      return "⚠️";

    default:
      return "🔔";

  }

}


/* ==========================================
   OPEN NOTIFICATION
========================================== */

async function openNotification(
  notificationId
){

  if(!currentUser)
    return;


  try{

    const notificationRef =
      db
        .collection("notifications")
        .doc(notificationId);


    const snapshot =
      await notificationRef.get();


    if(!snapshot.exists)
      return;


    const data =
      snapshot.data();


    /*
      Security check:

      Make sure the notification
      belongs to the logged-in user.
    */

    if(
      data.customerId !==
      currentUser.uid
    ){

      console.error(
        "Unauthorized notification access."
      );

      return;

    }


    /*
      Mark as read.
    */

    if(data.read !== true){

      await notificationRef.update({

        read:true,

        readAt:
          firebase.firestore.FieldValue
            .serverTimestamp()

      });

    }


    /*
      If notification belongs
      to an order, open order page.

      Change this URL later if your
      actual order-details page has
      another name.
    */

    if(data.orderId){

      window.location.href =
        "order-details.html?id=" +
        encodeURIComponent(
          data.orderId
        );

      return;

    }


  }catch(error){

    console.error(
      "Notification error:",
      error
    );

  }

}


/* ==========================================
   MARK ALL NOTIFICATIONS READ
========================================== */

async function markAllNotificationsRead(){

  if(!currentUser)
    return;


  try{

    const snapshot =
      await db
        .collection("notifications")
        .where(
          "customerId",
          "==",
          currentUser.uid
        )
        .where(
          "read",
          "==",
          false
        )
        .get();


    if(snapshot.empty)
      return;


    const batch =
      db.batch();


    snapshot.forEach(doc => {

      batch.update(
        doc.ref,
        {

          read:true,

          readAt:
            firebase.firestore.FieldValue
              .serverTimestamp()

        }
      );

    });


    await batch.commit();


  }catch(error){

    console.error(
      "Mark notifications read error:",
      error
    );

    showMessage(
      friendlyError(error),
      "error"
    );

  }

}


/* ==========================================
   TOGGLE NOTIFICATIONS
========================================== */

function toggleNotifications(){

  const panel =
    document.getElementById(
      "notificationPanel"
    );


  panel.classList.toggle(
    "hidden"
  );

}


/* ==========================================
   CLOSE NOTIFICATIONS WHEN
   CLICKING OUTSIDE
========================================== */

document.addEventListener(
  "click",
  function(event){

    const wrapper =
      document.querySelector(
        ".notification-wrapper"
      );


    const panel =
      document.getElementById(
        "notificationPanel"
      );


    if(
      wrapper &&
      !wrapper.contains(event.target)
    ){

      panel.classList.add(
        "hidden"
      );

    }

  }
);


/* ==========================================
   FORMAT NOTIFICATION TIME
========================================== */

function formatNotificationTime(
  timestamp
){

  if(!timestamp)
    return "Just now";


  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);


    const now =
      new Date();


    const difference =
      now - date;


    const seconds =
      Math.floor(
        difference / 1000
      );


    if(seconds < 60)
      return "Just now";


    const minutes =
      Math.floor(
        seconds / 60
      );


    if(minutes < 60)
      return minutes +
        " minute" +
        (minutes === 1 ? "" : "s") +
        " ago";


    const hours =
      Math.floor(
        minutes / 60
      );


    if(hours < 24)
      return hours +
        " hour" +
        (hours === 1 ? "" : "s") +
        " ago";


    const days =
      Math.floor(
        hours / 24
      );


    if(days < 7)
      return days +
        " day" +
        (days === 1 ? "" : "s") +
        " ago";


    return date.toLocaleDateString();

  }catch(error){

    return "Recently";

  }

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==========================================
   CHANGE PASSWORD
========================================== */

async function changePassword(){

  if(!currentUser)
    return;


  const email =
    currentUser.email;


  if(!email){

    showMessage(
      "Your account does not have an email address.",
      "error"
    );

    return;
  }


  try{

    await auth
      .sendPasswordResetEmail(
        email
      );


    showMessage(
      "Password reset email sent to " +
      email,
      "success"
    );


  }catch(error){

    console.error(error);


    showMessage(
      friendlyError(error),
      "error"
    );

  }

}


/* ==========================================
   SIGN OUT
========================================== */

async function signOut(){

  try{

    /*
      Stop notification listener
      before signing out.
    */

    if(notificationUnsubscribe){

      notificationUnsubscribe();

      notificationUnsubscribe =
        null;

    }


    await auth.signOut();


    window.location.href =
      "login.html";


  }catch(error){

    console.error(error);


    showMessage(
      friendlyError(error),
      "error"
    );

  }

}


/* ==========================================
   BACK
========================================== */

function goBack(){

  if(
    document.referrer &&
    document.referrer.includes(
      window.location.hostname
    )
  ){

    history.back();

  }else{

    window.location.href =
      "index.html";

  }

}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
  text,
  type
){

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message " + type;


  clearTimeout(
    showMessage.timer
  );


  showMessage.timer =
    setTimeout(() => {

      message.textContent =
        "";

      message.className =
        "message";

    },5000);

}


/* ==========================================
   ERROR HANDLER
========================================== */

function friendlyError(error){

  if(!error)
    return "Something went wrong.";


  if(
    error.code ===
    "permission-denied"
  ){

    return "Permission denied. Check your Firestore Rules.";

  }


  if(
    error.code ===
    "failed-precondition"
  ){

    return "A Firestore index is required for notifications. Check the Firebase console.";

  }


  if(
    error.code ===
    "auth/requires-recent-login"
  ){

    return "Please sign in again and try again.";

  }


  if(
    error.code ===
    "auth/too-many-requests"
  ){

    return "Too many attempts. Try again later.";

  }


  return error.message ||
    "Something went wrong.";

}
